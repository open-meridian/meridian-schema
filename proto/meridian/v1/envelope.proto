// What every bus message carries about itself.
//
// Justified by decisions/003-every-bus-message-carries-an-envelope.md rather
// than by a workflow step: it is not an operation, it travels with every
// operation. It is recorded in matrix/proto-carve-outs.tsv with that
// reference.
//
// Only the metadata is here. The envelope itself -- this, a type name and the
// payload's bytes -- is the bus's own framing and lives in meridian-core
// (design/envelope-moves-into-core): a plugin reaches the bus through typed
// operations and never sees bytes, so nothing plugin-facing carries one. What
// a plugin may need from the metadata, to thread a chain of events, stays.

syntax = "proto3";

package meridian.v1;

// MessageMeta travels with every bus message.
//
// Kept deliberately small. Each field earns its place by being needed to
// route, correlate or audit a message; anything a handler could look up
// instead does not belong here, because the envelope is paid for on every
// single message.
message MessageMeta {
  // Unique per message. The idempotency key: a handler that has seen this id
  // may drop the message.
  string message_id = 1;

  // Constant across every message caused by one originating action, so an
  // operator can follow a broker sync all the way to a position update.
  string correlation_id = 2;

  // The message_id of the message that caused this one. correlation_id gives
  // the set; causation_id gives the shape of the tree inside it.
  string causation_id = 3;

  // The instance that published this. Provenance, and the reply address for a
  // request.
  string publisher_instance_id = 4;

  // The topic this was published on. Present so a message stays interpretable
  // once it has been captured away from its subscription.
  string topic = 5;

  // Publisher wall clock at publish, epoch nanoseconds UTC. Observation time,
  // not event time: when something happened in the world belongs on the
  // payload, because only the payload knows what "happened" means.
  string schema_version = 6;
  int64 published_at_ns = 7;

  // Stamped by the sidecar, never supplied by a plugin (decisions/014).

  // Set on a command sent for a person: whose it is, so the store can record
  // who made the change. Deployment-local subject.
  string acting_for_subject = 8;

  // Set beside acting_for_subject when the person acted through a client:
  // the delegation the assertion named (W4.9, decisions/029), so a store
  // records the person through that client. Absent for a person at the
  // dashboard, and for a plugin acting as itself.
  string acting_through_delegation = 11;

  // Set beside acting_through_delegation: the client's registered name, as
  // the assertion named it (W4.9, contract v10), so a store records "the
  // person, through that client" without a second read
  // (sdk-contract/the-book-records-the-delegation).
  string acting_through_client = 12;

  // Set on a read: the accounts the publishing plugin may read. A core store
  // answers only for these.
  repeated string account_scope = 9;

  // Set by the sidecar on every query it sends for a plugin, beside
  // account_scope, and never by a core component (W4.11): the scope
  // applies, so an empty one is nothing. A store answers a query carrying
  // it whose scope is empty with nothing, and refuses one naming an account
  // outside the scope.
  bool account_scope_applies = 10;
}
