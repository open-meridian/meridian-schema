// The surface a plugin binds to. Its entire contract with the platform.
//
// Derived from workflow W4 (plugin lifecycle and bus access). Every message
// here traces to a matrix row; see matrix/matrix.tsv.
//
// A plugin reaches this on its own loopback address and reaches nothing else.
// It never learns the bus address, never holds a broker credential, and never
// discovers another plugin. See decisions/007.
//
// This service is a plugin's lifecycle and what it learns from the deployment:
// registering, liveness, leaving, its settings, who may use it, its account
// scope, the tickets it files for a person (contract v13), at the edge
// the moves of its raw records (contract v16), a data plugin's catalogue of
// datasets in its declaration (contract v18), and from contract v22 the
// algorithm identifiers a version declares, a connectivity plugin's `ems` and
// an `ems`'s venue account map beside its scope, and the order path's
// refusal codes. Its access to
// the bus is not here. Since contract v2 that is the typed
// operations of meridian.plugin.v1, one per matrix row a role may take and
// generated from the matrix; the generic publish, subscribe and call are gone,
// so every message on the bus is one the sidecar constructed (decisions/013).
//
// These are the operations W4 declares. A workflow demanding another is how
// another arrives, and it has to give the sidecar something to enforce or
// stamp: one the sidecar merely passes through asks the boundary to widen for
// nothing.

syntax = "proto3";

package meridian.v1;

// For SubjectKind, the kind of user the claims' subject is (contract v21).
import "meridian/v1/envelope.proto";

service SidecarService {
  // Nothing else may be called until this succeeds.
  rpc Register(RegisterRequest) returns (RegisterReply);

  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);

  // Optional by nature: a crash skips it.
  rpc Leave(LeaveRequest) returns (LeaveReply);

  // W4.7. The plugin's settings now, then each change, without a restart.
  rpc WatchSettings(WatchSettingsRequest) returns (stream SettingsDelivery);

  // W4.10. Who may use this plugin, for shaping its interface. Decides nothing.
  rpc PluginAccess(PluginAccessRequest) returns (PluginAccessReply);

  // W4.11. The accounts anybody may read or write through this plugin, and
  // the plugin's own links beside them.
  rpc WatchAccountScope(WatchAccountScopeRequest) returns (stream AccountScopeDelivery);

  // W4.12, contract v13. File a ticket for the person whose request the
  // plugin is serving, or from contract v21 its role's service account,
  // never as itself: the call carries the caller's assertion as its
  // `meridian-caller` metadata, and the sidecar asks the dashboard on the
  // bus, as itself, for the instance it serves.
  rpc FileTicket(FileTicketRequest) returns (FileTicketReply);

  // W4.12, contract v13. What became of the tickets this plugin filed: their
  // state, resolution and how often each was seen, never people's notes.
  // Acting for a person, as filing is.
  rpc FiledTickets(ReadFiledTicketsRequest) returns (ReadFiledTicketsReply);

  // W4.13, contract v16. Report one unit of a kind of raw record archived,
  // restored, returned or deleted, before anything is removed. As the
  // plugin itself for a window's move, or acting for a person, the call
  // carrying their assertion as its `meridian-caller` metadata; the sidecar
  // asks the conductor on the bus as itself, for the instance it serves.
  rpc RecordMove(RecordMoveRequest) returns (RecordMoveReply);

  // W4.14, contract v20. The prepared change a page was opened from, for the
  // person whose page it is, if they may make it: the call carries their
  // assertion as its `meridian-caller` metadata, and the sidecar asks the
  // dashboard on the bus, as itself, for the instance it serves.
  rpc ReadPreparedCall(ReadPreparedCallRequest) returns (ReadPreparedCallReply);

  // W6.31, contract v20. Save the person's own values of the settings the
  // plugin declares `per_person`, acting for them at write, never as the
  // plugin itself; the sidecar sends them to the dashboard on the bus, which
  // keeps them under the person the assertion names.
  rpc SetOwnSettings(SetOwnSettingsRequest) returns (SetOwnSettingsReply);

  // W4.15, contract v21. Call one of the plugin's own acts as the service
  // account its role runs as, from its autonomous work, with no person
  // behind it: the call carries no `meridian-caller` metadata, and the
  // sidecar asks the dashboard on the bus, as itself, for the instance it
  // serves. The dashboard makes the act, prepares it, or refuses naming the
  // field.
  rpc CallAsServiceAccount(CallAsServiceAccountRequest) returns (CallAsServiceAccountReply);
}

// ─────────────────────────────────────────────────────────────────────────────
// W4.1 — admission
// ─────────────────────────────────────────────────────────────────────────────

// The plugin announces that it has started. It does not say who it is.
//
// Instance and roles were fixed when the sidecar was launched, and they are
// what decide the plugin's topic access. A plugin that named the role it
// serves would be choosing its own privileges, and one that named its own
// instance could publish as a sibling, because grants are written with instance
// wildcards so that an instance-scoped topic needs no grant minted per
// instance.
message RegisterRequest {
  reserved 1, 2, 3;
  reserved "instance_id", "role", "tags";

  // The contract version the plugin was built against, as `v<N>`. This
  // schema is contract v23, and a plugin built from it declares "v23".
  //
  // Required. A sidecar admits it when it lies between the sidecar's floor
  // and its own version, and otherwise refuses it naming both (W4.1): a
  // plugin built for a newer contract may depend on what an older sidecar
  // does not send. So every revision adding something a plugin can depend on
  // -- an operation, a field on a stream or a response, a refusal code --
  // raises the version, and an SDK built from it declares the new one.
  //
  // The only thing a plugin tells the sidecar about itself that bears on
  // admission, and it decides nothing about access.
  string schema_version = 4;

  // What the plugin offers, as distinct from what it may do. None of these
  // widens a grant: the roles that decide it stay the launch configuration's,
  // and a plugin declares no tags (decisions/026). Each is optional.

  // Set when the plugin serves an interface to people (W6.9).
  InterfaceDeclaration interface = 5;

  // The settings an admin of the plugin must or may give it (W4.7, W6.11).
  repeated SettingDeclaration settings = 6;

  // True when the plugin reads accounts at an external source and names them
  // by that source's identifiers, which an admin of the plugin links to
  // accounts (W6.4). The sidecar then translates on the way in (W2).
  bool reads_external_accounts = 7;

  // The version's declaration, as the plugin's SDK builds it from its code
  // (W4.1, W8.1, contract v11): the same one its upload carried. The sidecar
  // reports it (W4.8). Unset from a plugin before v11.
  PluginDeclaration declaration = 8;

  // The plugin's tools on the deployment's MCP surface (W4.1, W6.20,
  // contract v12): each derived by its SDK from a route the plugin declares
  // with one typed record of inputs, or declared to replace one. The
  // sidecar admits each it can check, reports them (W4.8), and refuses the
  // others by name without refusing the plugin. At most 200: those past it
  // are refused, the plugin admitted. Empty from a plugin before v12, and
  // from one declaring no typed route.
  repeated ToolDeclaration tools = 9;
}

// One tool a plugin offers on the deployment's MCP surface (W6.20; contract
// v12; spec/a-deployment-serves-its-mcp, requirements 6 to 10). A tool is a
// route: a call reaches the plugin as the request its route would receive
// from a page, at one of its levels, and is never wider than that page. A
// plugin names no parts of itself for access by it (decisions/026): consent
// and access are per plugin, role and level, the roles the deployment's
// fixed list (contract v15; decisions/033).
message ToolDeclaration {
  // Unique among the plugin's tools: 1 to 61 characters, lower-case
  // letters, digits, `_` and `-`, beginning with a letter or digit. The
  // surface names it `{instance}__{name}`, which may be no longer than the
  // clients people use accept (64), so the sidecar refuses a name too long
  // for its instance.
  string name = 1;

  // For a person to read on the consent page, such as "Confirm an opening
  // balance": 1 to 120 characters.
  string title = 2;

  // For an agent to read: what the tool does and what it answers. The
  // vendor's text, which the dashboard prefixes with the plugin's title and
  // instance: 1 to 1,024 characters.
  string description = 3;

  // The route's method: GET, POST, PUT, PATCH or DELETE. A request whose
  // claims name this tool is admitted only at this method and path (W4.9).
  string method = 4;

  // The route's path on the plugin's own host, 1 to 512 characters,
  // beginning with "/" and not under /.meridian.
  string path = 5;

  // The levels the route serves, one or several of admin, write and read,
  // as a page's are (W4.8). A call opens at the highest the person holds and
  // the delegation covers, write before read before admin.
  repeated AccessLevel levels = 6;

  // True for a read: a page, a GET route, or a route declaring that it
  // changes nothing, answering typed data. False for an act, which changes
  // something.
  bool reads = 7;

  // The route's one typed record of inputs, as JSON Schema text: an object
  // schema, decimals as strings, dates and times as ISO 8601; 2 to 65,536
  // characters.
  string input_schema = 8;

  // For a read, the typed answer it returns, as JSON Schema text, 0 to
  // 65,536 characters; empty for an act.
  string output_schema = 9;

  // The roles the tool serves, from those the plugin was launched with; a
  // derived tool takes its route's (W4.1, contract v15). Listed on the
  // surface to a person holding one of its levels on one of these roles,
  // and a call opens at the highest such level the delegation covers
  // (W6.20). Empty on a plugin holding one role, where it serves that
  // role, and on a plugin holding none; refused empty from a plugin built
  // at v15 or later holding several. A tool naming a role the plugin was
  // not launched with is refused by name, the plugin admitted. It grants
  // nothing: the sidecar admits what a call sends by the role whose
  // generated grants include it (W4.9). At most 13.
  repeated string roles = 10;

  // For an act (contract v20, W4.1, W6.26): the name of the plugin's own
  // read tool that checks it without changing anything, taking the same
  // typed record of inputs, so the dashboard can check a prepared change as
  // the plugin would. Empty: the act cannot be prepared, and the admins may
  // set agents only to may make or may not reach it (W6.29). Refused by
  // name, the plugin admitted, when it names no read tool of the plugin or
  // is set on a read.
  string checked_by = 11;

  // For an act (contract v20): the paths in the input schema whose values
  // name the deployment's accounts the act touches, by the dictionary's
  // grammar (`account_id`, `positions[].account_id`), so the dashboard can
  // show a prepared change to everyone who may make it on those accounts.
  // Empty: the act touches no account, or none its input names. A path the
  // input schema does not have is refused by name. At most 8.
  repeated string accounts = 12;

  // For an act (contract v20, W6.27): the path of the plugin's page where a
  // person makes its change, one of the pages the plugin declares, opened
  // with the prepared change in the claims. Empty: the change is made in the
  // dashboard's Inbox. A path that is not one of its pages is refused by
  // name.
  string made_on = 13;
}

// What a version declares beside its roles (W8.1, contract v11;
// spec/vendor-differences-have-a-place-in-the-contract, requirements 16, 19
// and 30, Q6 and Q15). Nothing about what it supports: its roles say that,
// and a plugin that falls short of one is not verified, never declared
// short. No value, account or identifier is ever in it.
message PluginDeclaration {
  // The names of the secret settings it will ask for (W4.7, Q6), each one a
  // setting it declares secret at registration, so an admin knows before
  // launch what credentials it needs. Never a value.
  repeated string secret_settings = 1;

  // What it receives from its vendor and does not carry (Q15), by name
  // only: the evidence that the common model may need to grow.
  repeated NotCarried not_carried = 2;

  // The storage it asks for, for its raw records (decisions/028): only on a
  // version holding an edge role, refused otherwise. Unset asks for none.
  StorageDeclaration storage = 3;

  // The datasets it serves the lake (W8.1, W10.4; contract v18): only on a
  // version holding `data`, refused otherwise. Unset serves none.
  Catalogue catalogue = 4;

  // The algorithm identifiers its autonomous work may name (W4.1, W4.9;
  // v21's Q16, the order-path plan's refresh, Q24; contract v22): each
  // stable across versions, with a description. A call as a service account
  // naming one this version does not declare is refused INVALID_ARGUMENT,
  // naming `algorithm_id` (CallAsServiceAccountRequest, W4.15); the book
  // puts the one named on each entry's ServiceAccountActor. Empty declares
  // none.
  repeated AlgorithmDeclaration algorithms = 5;
}

// One algorithm identifier a version declares (contract v22).
message AlgorithmDeclaration {
  // Stable across versions and reinstalls: what `reporting` maps to a
  // regime's decision-maker and executor.
  string algorithm_id = 1;

  // What it is, for a person reading the plugin's page. Plain text.
  string description = 2;
}

// A data plugin's catalogue: the datasets it serves the lake (spec/the-lake, "The
// catalogue"; step 6, requirement 26). The lake's, not a declaration of
// support: what each dataset holds, how it arrives and on what terms. No
// value, account or credential is ever in it. At most 32 datasets, each key
// once.
message Catalogue {
  repeated DatasetDeclaration datasets = 1;
}

// One dataset a data plugin serves. Its identity in a deployment is the instance
// and its key (spec/the-lake, Q19).
message DatasetDeclaration {
  // The dataset's name within the plugin: 1 to 40 characters, lowercase
  // letters, digits and underscores, beginning with a letter. The dataset's
  // ID in a deployment is the instance, a colon, and this.
  string key = 1;

  // Who originated the data, and who carries it when an aggregator does:
  // data, not vocabulary. The vendor 1 to 64 characters; the aggregator 0 to
  // 64, empty when reached directly.
  string vendor = 2;
  string aggregator = 3;

  // The lake's data types it serves and the optional fields it fills, each
  // by its dictionary entry: a type by its message (meridian.v1.Price), a
  // field by its entry (meridian.v1.Bar.vwap). 1 to 32.
  repeated string data_types = 4;

  // How its rows can arrive, among which the deployment chooses: 1 to 3,
  // each once.
  repeated ObservationMode modes = 5;

  // How often it updates, in seconds: what says it is silent. 0 for a
  // dataset that updates only when asked.
  uint32 cadence = 6;

  // How far back it reaches, in days; 0 when it states none.
  uint32 history = 7;

  // The terms its vendor's standard terms impose, which the deployment's
  // licence confirms or replaces (spec/the-lake, Q8). Its dataset and who
  // set it are empty here.
  DatasetLicence licence_default = 8;

  // The day a daily value's business date is in (plans/the-lake-prices-the-
  // book, Q5 and Q28): an IANA time zone, and the minute after local midnight
  // the day ends, 0 for midnight. What says which candle or session counts
  // as a business date, and when it is final; never a holiday calendar.
  string day_time_zone = 9;
  uint32 day_end_minute = 10;

  // The venue the dataset is, the venue master's ID; empty for a dataset
  // that is not one venue's, which is the consolidated view. A row naming
  // no venue is the dataset's view.
  string venue_id = 11;

  // The settlement calendar its business dates follow, its `CAL-` ID
  // (W10.1; spec/settlement-calendars-are-core-reference-data, requirement
  // 15; the lake's Q28; contract v22), beside day_time_zone and
  // day_end_minute. In v22 the lake keeps it and applies nothing by it; a
  // daily value dated on a day it says is closed is flagged from v23 (W10.4,
  // ruled 2026-10-12), recorded as reported and never refused. Empty names
  // none, as before.
  string calendar_id = 12;
}

// How a dataset's rows arrive (the lake intent's Q9 and Q10).
enum ObservationMode {
  // Refused.
  OBSERVATION_MODE_UNSPECIFIED = 0;
  // Fetched when a reader's read is wanted (W10.7).
  OBSERVATION_MODE_PULL = 1;
  // Recorded on the source's own timetable, unasked.
  OBSERVATION_MODE_PUSH = 2;
  // Kept current from the source's stream while a standing want stands.
  OBSERVATION_MODE_STREAM = 3;
}

// A dataset's licence: its catalogue's default terms (unset dataset and
// author), or the deployment's licence a deployment admin set, which is what
// is enforced (W10.1, spec/the-lake, Q8). Records what the admin entered;
// it says nothing about whether a deployment meets a vendor's terms.
message DatasetLicence {
  // The dataset; empty in a catalogue's default.
  string dataset = 1;

  // Whether the lake may keep its rows; false serves them, not kept.
  bool kept = 2;

  // How long the lake keeps a row, in days from when it was recorded; 0
  // keeps it as long as the licence allows, with no limit set. At most
  // 36,500.
  uint32 retention_days = 3;

  // Whether data derived from it may be made, and shown.
  bool derived_use = 4;
  bool display = 5;

  // The fields readable by default, by their dictionary entries; empty for
  // every field. At most 64.
  repeated string default_fields = 6;

  // Whether its terms are one person's (Q16): the Data sources page warns
  // when more than one person holds read on a plugin entitled to it.
  bool personal_use = 7;

  // Who set it and when, the delegation and client a person acted through,
  // and why, as the dashboard stamped and kept them: empty in a catalogue's
  // default.
  string updated_by = 8;
  int64 updated_at_ns = 9;
  string acting_through_delegation = 10;
  string client_name = 11;
  string note = 12;

  // The prepared change it was set from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 13;
}

// One vendor field, or one code of a vendor's code set, a plugin receives
// and does not carry (Q15).
message NotCarried {
  // The role it receives it in, from matrix/roles.tsv.
  string role = 1;

  // The plugin's scheme for the vendor's vocabulary, as on its as-reported
  // values: its registry name and, where the vendor has several, the code
  // set ("<plugin>:position").
  string scheme = 2;

  // The vendor's own name for the field, or the code.
  string name = 3;

  NotCarriedReason reason = 4;
}

// Why a name is not carried.
enum NotCarriedReason {
  // Not said; refused.
  NOT_CARRIED_REASON_UNSPECIFIED = 0;
  // The contract has no meaning for it: a place it may grow.
  NOT_CARRIED_REASON_NO_CONTRACT_MEANING = 1;
  // The contract has a meaning the plugin does not yet convert it to.
  NOT_CARRIED_REASON_NOT_CONVERTED = 2;
}

// The storage a plugin at the edge asks for (decisions/028; the plan's Q2).
message StorageDeclaration {
  // How long it keeps a raw record, in days, from when it received it: the
  // reach of a backfill, and what the deployment keeps the storage for. At
  // least one. From contract v16 the default of a version declaring no
  // kinds; with kinds, each kind's window says it.
  uint32 retention_days = 1;

  // The kinds of raw record it keeps (W4.1, contract v16): each with its
  // default window and whether it can be archived. Empty keeps the
  // behaviour before v16, under `retention_days`. At most 16, each name
  // once.
  repeated RawRecordKind record_kinds = 2;
}

// One kind of raw record a plugin at the edge keeps (contract v16;
// spec/an-edge-plugins-older-records-move-to-the-archive, requirement 1).
// Its window and what is done past it are its admin's settings, which the
// SDK declares from it (W6.11).
message RawRecordKind {
  // The kind's name in the plugin's code and settings, such as "activity":
  // 1 to 40 characters, lowercase letters, digits and underscores, beginning
  // with a letter. Its settings are `<name>_window_days` and
  // `<name>_past_window`, which no other setting may take.
  string name = 1;

  // What a person reads, such as "Reported activity". 1 to 40 characters.
  string label = 2;

  // Its default window, in days from when a record was received: how long
  // it stays in the plugin's storage until its admin sets another. 1 to
  // 36,500.
  uint32 window_days = 3;

  // Whether a unit of it can be moved to an archive. False for state read
  // and updated in place, such as a FIX session's.
  bool archivable = 4;
}

// A plugin's interface, served on loopback and reached only through the
// sidecar's front, which verifies the caller first (decisions/014).
message InterfaceDeclaration {
  // The loopback port the plugin listens on. The sidecar forwards verified
  // requests here; nothing else can reach it.
  uint32 loopback_port = 1;

  // What the dashboard calls the interface in its navigation.
  string title = 2;

  // The plugin's admin pages, retired for `pages` (W4.8). While a sidecar
  // accepts the contract version a plugin was built against, it reads that
  // plugin's admin pages as pages at ACCESS_LEVEL_ADMIN, in the order
  // declared; the SDK's migration rewrites them into `pages`.
  reserved 3;
  reserved "admin_pages";

  // The plugin's pages, one list, in the order shown (W4.1, W4.8). The
  // plugin's area, reached from the dashboard's home, shows under each
  // button the pages whose levels include that button's level -- Manage
  // `admin`, Open `write`, View `read` -- as one tab row, framing the page
  // at `path` on the plugin's own host (W6.9). A page is declared where it
  // is served: each SDK builds this list from its own idiom and checks the
  // session's level in the claims against a page's levels, so the tab row
  // shows a page and the plugin refuses it by the same declaration.
  //
  // None at `write` or `read`: the area frames the plugin's `/` under Open
  // and View.
  repeated PageDeclaration pages = 4;
}

// One page of a plugin's interface.
message PageDeclaration {
  // On the plugin's own host, beginning with "/", such as "/statements".
  string path = 1;

  // The tab's name, such as "Statements".
  string title = 2;

  // The levels the page serves, one or several: its tab shows under the
  // buttons of these levels, and one path serving `write` and `read` adapts
  // by the session's level, showing actions under `write` alone (W6.9). A
  // page naming no level, or one outside the three, is refused at
  // registration, naming the page (W4.1, W4.8).
  repeated AccessLevel levels = 3;

  // The roles the page serves, from those the plugin was launched with
  // (W4.1, contract v15). Its tab shows under a button when, for one of
  // these roles, the person's level within that button is one of the
  // page's levels, and a page serving several adapts per role (W6.9).
  // Empty on a plugin holding one role, where it serves that role, and on
  // a plugin holding none; refused empty from a plugin built at v15 or
  // later holding several, and read as every role from one built earlier.
  // A page naming a role the plugin was not launched with refuses the
  // plugin's registration, naming it and the plugin's roles. It decides
  // what is shown, never what is admitted (W4.9). At most 13.
  repeated string roles = 4;
}

// A person's level on a plugin, the same three for every plugin: a plugin
// names no parts of itself for access (W6.7; decisions/026, 027). An access
// group's entry names a plugin, one role it holds, and one of them (contract
// v15; decisions/033); a session is opened at one (W6.9); a page serves one
// or several (W4.8).
//
// A person may hold `admin` on a role of a plugin and, independently, one
// data level, the higher one granted. The levels are agnostic of accounts: which
// accounts `read` and `write` reach is decided by the account groups their
// grants name, and `admin` reaches none.
enum AccessLevel {
  // Holds nothing. A claim naming no level admits no page and no act.
  ACCESS_LEVEL_UNSPECIFIED = 0;

  // What the plugin reads, which it may show the person, cut to the accounts
  // they may read: queries and receiving events. The home's View.
  ACCESS_LEVEL_READ = 1;

  // What the plugin publishes, which it may do for the person, acting for
  // them, on the accounts they may write: commands, and everything read
  // allows. The home's Open.
  ACCESS_LEVEL_WRITE = 2;

  // Configures the plugin: its settings, its pages at `admin`, its account
  // links, and the admin portal's tabs for it. Includes neither `read` nor
  // `write`, and reaches no account's data: acting for a person at this
  // level, a plugin may read the deployment's accounts, identities only, and
  // link an external account to one, and nothing else (W4.9, W6.4). The
  // home's Manage.
  ACCESS_LEVEL_ADMIN = 3;
}

// One setting the plugin needs.
message SettingDeclaration {
  string name = 1;
  SettingType type = 2;

  // A plugin missing a required setting stays registered and reports itself
  // not healthy with that reason until it arrives (W4.7).
  bool required = 3;

  // Write-only: set or replaced through the dashboard, never read back,
  // displayed, logged, reported or bundled.
  bool secret = 4;

  // Shown beside the field in the dashboard.
  string description = 5;

  // What the dashboard's form calls the setting, such as "Client ID"; the
  // name when empty.
  string label = 6;

  // The value the plugin uses while none is set, written as the form would
  // take it. Shown greyed in the empty field; never stored as a setting's
  // value. Never declared for a secret.
  string default_value = 7;

  // The unit a number is in, such as "seconds" or "hours", shown beside the
  // field.
  string unit = 8;

  // For SETTING_TYPE_CHOICE: the options, in the order shown, of which one is
  // chosen. A value not among them is refused.
  repeated SettingChoice choices = 9;

  // Unset: the setting always applies. Set: it applies only while another
  // setting holds one of the values named, and is shown, and required when
  // `required`, only then.
  SettingCondition applies_when = 10;

  // For whoever develops the plugin, such as serving built-in data instead of
  // calling the venue: the form shows it only on a development deployment
  // (`meridian up --development`), and never on one installed otherwise.
  bool developer = 11;

  // For SETTING_TYPE_TABLE (contract v14): the columns, in the order shown.
  // The value is JSON text, a list of rows, each an object of its cells keyed
  // by column name, every cell text, with `changed_by` and `changed_at` (RFC
  // 3339, UTC), which the conductor stamps on a row added or changed; an
  // unchanged row keeps its own. An admin of the plugin enters the rows in
  // the dashboard's Settings form, which shows them as an editable table;
  // the plugin only reads them.
  repeated SettingColumn columns = 12;

  // For SETTING_TYPE_TABLE: the most rows it holds; 0 for 500, the most any
  // table holds.
  int32 most_rows = 13;

  // The roles the setting serves, from those the plugin was launched with
  // (W4.1, W6.11, contract v15): shown to an admin of any of them, and set
  // only by a person holding admin on every one. Empty on a plugin holding
  // one role, where it serves that role, and on a plugin holding none;
  // refused empty from a plugin built at v15 or later holding several. A
  // setting naming a role the plugin was not launched with refuses the
  // plugin's registration. Not who may read the value: a secret is shown
  // back to nobody, and the plugin reads every setting it declared.
  // At most 13.
  repeated string roles = 14;

  // Contract v20 (W6.31): a setting each person with write on a role it
  // serves sets for themselves, on the plugin's pages, rather than one an
  // admin sets for everyone. Not on the Settings form, never delivered by
  // WatchSettings and never required: the dashboard keeps each person's
  // value under them and hands it to the plugin in their claims
  // (`own_settings`). Refused with `secret`, refusing the registration.
  bool per_person = 15;
}

// One column of a table setting (contract v14).
message SettingColumn {
  // The key each row's cell is held under. Never `changed_by` or
  // `changed_at`, which the conductor stamps.
  string name = 1;

  // The column's heading in the form; the name when empty.
  string label = 2;

  SettingColumnType type = 3;

  // A row leaving this cell empty is refused, naming the cell.
  bool required = 4;

  // Shown beside the heading.
  string description = 5;

  // For SETTING_COLUMN_TYPE_CHOICE: the options, in the order shown.
  repeated SettingChoice choices = 6;
}

// What a table setting's column holds (contract v14). Every cell travels as
// text in the row's JSON.
enum SettingColumnType {
  SETTING_COLUMN_TYPE_UNSPECIFIED = 0;
  SETTING_COLUMN_TYPE_TEXT = 1;
  SETTING_COLUMN_TYPE_INTEGER = 2;
  // An exact decimal, written as text, at most 18 places.
  SETTING_COLUMN_TYPE_DECIMAL = 3;
  // YYYY-MM-DD.
  SETTING_COLUMN_TYPE_DATE = 4;
  // One of the column's choices, held as its value.
  SETTING_COLUMN_TYPE_CHOICE = 5;
  // An external account this plugin reported, by its identifier.
  SETTING_COLUMN_TYPE_EXTERNAL_ACCOUNT = 6;
  // A deployment instrument record's ID, picked by search and checked to
  // exist; never a symbol.
  SETTING_COLUMN_TYPE_INSTRUMENT = 7;
}

message SettingChoice {
  // What the setting holds when this is chosen.
  string value = 1;

  // What the form shows, such as "Personal key".
  string label = 2;

  // Shown beside the option.
  string description = 3;
}

message SettingCondition {
  // Another setting the same plugin declares, which comes before this one.
  string setting = 1;

  // The values of that setting under which this one applies.
  repeated string one_of = 2;
}

enum SettingType {
  SETTING_TYPE_UNSPECIFIED = 0;
  SETTING_TYPE_STRING = 1;
  SETTING_TYPE_INTEGER = 2;
  SETTING_TYPE_BOOLEAN = 3;

  // One of the declared choices, held as its value.
  SETTING_TYPE_CHOICE = 4;

  // Rows of the declared columns, held as JSON text (contract v14).
  SETTING_TYPE_TABLE = 5;
}

message RegisterReply {
  bool admitted = 1;

  // Populated when admitted. Scopes everything the plugin subsequently does.
  string deployment_id = 2;

  // Populated when not. Names what is missing, in terms the operator can act
  // on: a grant, a version, or access control not yet loaded.
  string refusal_reason = 3;

  // The topic patterns this plugin may publish on and subscribe to. Returned so
  // a plugin can fail at startup rather than at the first refused operation.
  repeated string publish_grants = 4;
  repeated string subscribe_grants = 5;

  // Who the sidecar was launched to serve. The plugin learns its identity here
  // rather than declaring it, so it can log what it is and stop at startup when
  // that is not what it expected to be.
  string instance_id = 6;
  // What it was launched as: one or more roles from the fixed list, its
  // grants the union of theirs, each generated from the contract's rows
  // naming it (decisions/020). Empty is a plugin admitted with no topics.
  // A set since contract version 2; a single `role` before it.
  repeated string roles = 9;

  reserved 7;
  reserved "role";

  // Its tags, retired: a plugin declares none, and a person's access to it
  // is read or write, the same for every plugin (decisions/026).
  reserved 8;
  reserved "tags";
}

// ─────────────────────────────────────────────────────────────────────────────
// W4.5, W4.6 — liveness and departure
// ─────────────────────────────────────────────────────────────────────────────

// Self-reported, and therefore only half the picture. A plugin that has stopped
// sending these at all is the more informative signal, and the sidecar is what
// notices.
message HeartbeatRequest {
  bool healthy = 1;

  // Why not, when not. Diagnostic; nothing branches on it.
  string detail = 2;

  // W4.5. The plugin's figures as they stand, in the order to draw them.
  // Each heartbeat replaces the last; none clears them. At most 8, and a
  // heartbeat breaking a bound is refused whole, INVALID_ARGUMENT, never cut.
  repeated PluginFigure figures = 3;

  // W4.5, contract v11. How often the plugin has seen each name its
  // declaration lists as not carried, since it started; each heartbeat
  // replaces the last. A name and a count, never a value.
  repeated NotCarriedSeen not_carried_seen = 4;

  // W4.5, contract v16. For each kind of raw record the declaration names,
  // what the plugin's storage holds of it now, and the bytes it uses of the
  // instance's archive; each heartbeat replaces the last. At most 16, one
  // per kind; a kind the declaration does not name is refused.
  repeated StoredSpan stored = 5;
}

// What a plugin keeps of one kind of raw record (W4.5, contract v16): what
// its storage holds, a count and a span, and the bytes the kind uses of the
// instance's archive; never a record, an account or a key.
message StoredSpan {
  // A kind the version's declaration names.
  string record_kind = 1;

  // How many records of it. 0 when none, and then no span.
  uint64 record_count = 2;

  // The span they cover, from when the first was received to when the last
  // was, in nanoseconds since the epoch; 0 for none.
  int64 first_received_ns = 3;
  int64 last_received_ns = 4;

  // The bytes the kind's records use of the instance's archive, which the
  // archive's bound (MERIDIAN_ARCHIVE_MOST_BYTES, W8.3) is counted against:
  // what the plugin's index of its moves holds archived, a restored unit
  // still counted. 0 where none is archived, or the instance has no
  // archive.
  uint64 bytes = 5;
}

// How often a name a plugin does not carry was seen (W4.5, Q15).
message NotCarriedSeen {
  // As the declaration names it.
  string scheme = 1;
  string name = 2;
  uint64 count = 3;
}

// One figure a plugin reports about its own work, which core draws as a tile
// on the plugin's Summary under Manage (W4.5, W4.8, W6.9). About the
// software: it names no account and carries none of an account's data.
message PluginFigure {
  // As a person reads it, "Connections". 1 to 40 characters, once per list.
  string label = 1;

  // Exactly one. A figure with none is refused.
  oneof value {
    int64 count = 2;
    // decisions/023: refused outside its range, never rounded.
    Decimal decimal = 3;
    // At most 40 characters.
    string text = 4;
    // A moment, in nanoseconds since the epoch: "Last read".
    int64 at_ns = 5;
  }

  // When the value was true, where that is not the heartbeat's moment.
  // 0 when none is given.
  int64 as_of_ns = 6;

  // Unspecified is no state, drawn plain. A number the enum does not define
  // is refused.
  FigureState state = 7;

  // Why, the note beside the tile. At most 200 characters.
  string why = 8;
}

// What a figure's tile is marked with (W6.9).
enum FigureState {
  FIGURE_STATE_UNSPECIFIED = 0;
  FIGURE_STATE_OK = 1;
  FIGURE_STATE_WARN = 2;
  FIGURE_STATE_ERROR = 3;
}

// Every quantity and every amount of currency is a Decimal (decisions/023,
// spec/quantities-carry-their-own-scale), and a plugin's figure may be one,
// so it is declared here, where a plugin-facing message can reach it; the
// domain messages meridian-core carries import it from here, and its Money
// is a Decimal and a currency. One form everywhere, binary on the wire and
// never text or a float. Nothing is rounded anywhere: a value outside the
// range below is refused, by the SDK before it is sent and by the sidecar
// and every store after.

// A number: a 128-bit two's-complement integer and its scale. The value is the
// integer times 10^-scale, so 1.50 is 150 at scale 2 and stays 1.50.
//
// The scale travels with the value rather than being fixed for the contract,
// because the venues disagree: Alpaca takes nine decimal places, a crypto
// asset eighteen, and a cheap token's holding runs past what 64 bits hold at
// any fixed scale that serves them both. The scale is the one the value was
// stated with; nothing normalises it.
//
// The integer's magnitude is below 10^38, which is at most 38 significant
// digits, and the scale is 0 to 18. The widest value the broker survey found,
// 100 billion units at 18 decimals, is well inside it.
message Decimal {
  // The integer's upper 64 bits, signed: negative for a negative value.
  sfixed64 high = 1;

  // Its lower 64 bits, unsigned. The integer is high * 2^64 + low.
  fixed64 low = 2;

  // How many decimal places the integer carries, 0 to 18.
  uint32 scale = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// The edge keeps its own (contract v11)
// ─────────────────────────────────────────────────────────────────────────────
//
// spec/vendor-differences-have-a-place-in-the-contract, slice A: a vendor's
// knowledge stops at the plugin that speaks to it. Shared by every store a
// plugin at the edge writes, and declared here beside the Decimal so the
// domain messages past the sidecar take them as they are.

// A vendor's value the plugin could not convert, beside the field's
// not-known value (requirements 4, 5 and 28): the one place a vendor's own
// code crosses the sidecar. Narrow, flagged and transitional: only the value
// that failed, never alone, and gone once a mapping exists. The sidecar
// checks that each part is present and within its length, and never reads
// its meaning; nothing past the plugin interprets it.
message AsReported {
  // Whose vocabulary: the plugin's registry name and, where the vendor has
  // several, its code set ("<plugin>:account-type").
  string scheme = 1;

  // The vendor's code, as sent.
  string code = 2;

  // The vendor's own words for it, as sent; the code again where it gives
  // none.
  string text = 3;
}

// A reference to the raw record a row was converted from, in the writing
// plugin's own storage (requirement 7, Q9; decisions/028). Opaque: core and
// every other plugin carry it and never follow it; a person follows it on
// the owning plugin's page. A record in a unit the plugin archived
// resolves to "archived, restorable" (contract v16); one past its window and
// deleted, following it says so, and the row stands.
message RawRecordRef {
  // The writing plugin's own instance, which its SDK sets from its
  // registration; the sidecar refuses a reference naming another.
  string instance_id = 1;

  // The plugin's own key for the record.
  string key = 2;
}

// Where a value a plugin sent came from, where the plugin closed it rather
// than read it from its vendor (requirements 31 to 34; plans/an-order-reaches-
// a-venue-through-the-book, Q13). A value with none on its message is the
// vendor's, from the message's raw record.
message Provenance {
  // The value it is for, by its path in the message: `quantity`,
  // `settle_date_quantity`, `pending`, `market_value.currency_code`.
  string field = 1;

  ProvenanceKind kind = 2;

  // The raw record it was read from: on a value reported by the vendor
  // (from a record other than the message's own) or from a second source.
  // Never on a value supplied or derived.
  RawRecordRef raw_record = 3;

  // The second source, by name.
  string source = 4;

  // The person who supplied it, as the plugin's page knew them.
  string person = 5;

  // The rule that derived it, by name, as the plugin documents it.
  string rule = 6;

  // On a value core computed (PROVENANCE_KIND_COMPUTED, contract v22): the
  // rule and each calendar, with their versions, the date read worked it
  // out on (W3.20; the calendars spec's Q10). Never on another kind.
  DateBasis date_basis = 7;
}

// The kinds of provenance (requirement 32), the same meanings as an
// instrument value's source (v10's InstrumentValueSource), and from v22 a
// value core computed.
enum ProvenanceKind {
  // Not said; refused.
  PROVENANCE_KIND_UNSPECIFIED = 0;
  // Reported by the vendor.
  PROVENANCE_KIND_REPORTED = 1;
  // From a second source of the plugin's own.
  PROVENANCE_KIND_SECOND_SOURCE = 2;
  // Supplied by a named person, on the plugin's page.
  PROVENANCE_KIND_SUPPLIED = 3;
  // Derived by a named rule in the plugin's code.
  PROVENANCE_KIND_DERIVED = 4;
  // Computed by core, with its basis (contract v22): a date the date read
  // worked out from the settlement calendars, since it is not the plugin's
  // own rule (W3.20; the calendars spec's Q10).
  PROVENANCE_KIND_COMPUTED = 5;
}

// What a date was computed on (W3.20; spec/settlement-calendars-are-core-
// reference-data, requirement 8; contract v22): the rule and its version,
// and each calendar and its version, so anything recording the date can
// record its basis with it, and the same inputs and versions always give
// the same date. Plugin-facing, since a plugin's Provenance and its
// execution's settlement date carry one; the records are core's
// (meridian-core's reference.proto).
message DateBasis {
  // Empty for a date worked out on calendars alone: a roll, a
  // business-day check.
  DateRuleRef rule = 1;
  repeated CalendarRef calendars = 2;
}

// Which date rule (contract v22).
enum DateRuleKind {
  DATE_RULE_KIND_UNSPECIFIED = 0;
  // A market's settlement-date rule, for a country and an asset class.
  DATE_RULE_KIND_SETTLEMENT = 1;
  // A currency pair's spot-date rule, its tenor-date rule on it.
  DATE_RULE_KIND_SPOT = 2;
}

// A date rule by its kind, subject and version: a rule has no ID of its own
// (the calendars spec's Q11).
message DateRuleRef {
  DateRuleKind kind = 1;
  // As the platform names it: `US/equity`, a country and an asset class;
  // `EUR/USD`, a pair.
  string subject = 2;
  int64 version = 3;
}

// A calendar at one version.
message CalendarRef {
  // "CAL-...", the platform's ID, never reused.
  string calendar_id = 1;
  int64 version = 2;
}

// A write marked as a backfill (requirement 27): a field a contract revision
// added, re-converted from the plugin's raw records and sent for a row
// already recorded. The store journals it as an amendment beside the row as
// first recorded, never an overwrite, this its cause.
message Backfill {
  // The contract version that added the field, as `v<N>`.
  string contract_version = 1;

  // The field, by its path in the message.
  string field = 2;
}

message HeartbeatReply {}

message LeaveRequest {
  // Why the plugin is stopping. Distinguishes a planned stop from a failure,
  // which the timeout path cannot do.
  string reason = 1;
}

message LeaveReply {}

// ─────────────────────────────────────────────────────────────────────────────
// W4.7 — settings
// ─────────────────────────────────────────────────────────────────────────────

// Opens the stream. The sidecar knows which plugin is asking.
message WatchSettingsRequest {}

// The plugin's settings as they stand, sent at once and again on every change.
message SettingsDelivery {
  repeated SettingValue values = 1;

  // Required settings with no value yet. Empty when the plugin may proceed.
  repeated string missing_required = 2;
}

message SettingValue {
  string name = 1;

  // As text, whatever the declared type, parsed by the SDK against the
  // declaration. A secret's value is delivered here and nowhere else.
  string value = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// W4.9, W6.9 — a person, vouched for
// ─────────────────────────────────────────────────────────────────────────────

// What the dashboard signs for one person and one plugin, and what the
// sidecar verifies before a request reaches the plugin or a command made for
// the person reaches the bus.
//
// The claims travel serialised, so the signature covers exactly the bytes the
// sidecar checks, and a plugin handing the assertion back cannot alter it.
//
// Over HTTP it travels in one header, `Meridian-Caller`: this message's
// encoding, base64url without padding (plans/a-person-reaches-a-plugin,
// ruling 2). The dashboard sets it; the sidecar verifies it, removes every
// identity the request arrived claiming, and forwards the plugin exactly one
// `Meridian-Caller`, the one it verified. The plugin decodes the claims from it
// and never verifies anything, and hands the same bytes back to act for the
// person.
message CallerAssertion {
  // A serialised CallerClaims.
  bytes claims = 1;

  // Ed25519 over `claims`, by the dashboard's own key -- never the
  // deployment's, which only the conductor holds.
  bytes signature = 2;

  // Which dashboard key signed, so the key can be rotated.
  string key_id = 3;
}

message CallerClaims {
  // Deployment-local: the directory's issuer and subject, never an address;
  // from contract v21, for a service account, its `SA-` ID, subject_kind
  // saying so.
  string subject = 1;
  string display_name = 2;

  // The plugin instance this is for. A sidecar refuses an assertion addressed
  // to another instance.
  string audience_instance_id = 3;

  // The level this session was opened at, one the person holds on this
  // plugin: ACCESS_LEVEL_ADMIN by Manage, ACCESS_LEVEL_WRITE by Open,
  // ACCESS_LEVEL_READ by View (W6.9). The dashboard mints nothing for a level
  // the person does not hold. The plugin serves a page only at a level the
  // page declares (W4.8). What the plugin sends acting for the person, the
  // sidecar admits by it: under ACCESS_LEVEL_WRITE a command on an account
  // in the write set; under ACCESS_LEVEL_ADMIN the deployment's accounts
  // read, answered with identities only, and the link, and nothing else;
  // under ACCESS_LEVEL_READ nothing (W4.9). Absent means none: an assertion
  // naming no level holds nothing. It is the session's button, not a role:
  // from contract v15 the person's level on each of the plugin's roles
  // within it is in `roles`, and the sidecar admits a command by the role
  // holding it.
  AccessLevel level = 11;

  // The accounts the session reaches through this plugin, cut to `level`,
  // the union over the session's roles. Under ACCESS_LEVEL_WRITE, the read
  // set, every account the person may read through their `read` and
  // `write` grants, and the write set, the accounts their `write` grants
  // name; under ACCESS_LEVEL_READ, the read set alone; under
  // ACCESS_LEVEL_ADMIN, neither. Every write account is also listed as
  // read.
  repeated string read_account_ids = 9;
  repeated string write_account_ids = 10;

  // Access tag by tag, retired with tags (decisions/026).
  reserved 4;
  reserved "access";

  int64 issued_at_ns = 5;

  // At most 60 seconds after issue.
  int64 expires_at_ns = 6;

  // Unique to this assertion. The dashboard mints one per request, and a
  // sidecar refuses an id it has seen within the last 60 seconds, so an
  // assertion captured in flight cannot be replayed while it is still in date
  // (plans/a-person-reaches-a-plugin, ruling 3).
  string assertion_id = 7;

  // Whether the person is a deployment admin; absent means not. It opens no
  // page and reaches no account: a deployment admin holds on a plugin what
  // their grants give, as anybody (W6.9). It says only that, linking an
  // external account in a session at ACCESS_LEVEL_ADMIN, the person may name
  // a new account rather than an existing one (W6.4).
  bool deployment_admin = 8;

  // The delegation the person acted through, when they acted through a
  // client -- the CLI, their own agent, an MCP client -- rather than at the
  // dashboard in a browser; absent means a browser (W6.18, decisions/029).
  // Deployment-local and opaque: the dashboard resolves it to its client.
  // The person stays the actor; this says through what. The sidecar stamps
  // it on what it sends for the person (W4.9).
  string delegation_id = 12;

  // The client's registered name, its own choice ("meridian on ada-laptop"),
  // for a plugin to show and record as it chooses; absent with
  // delegation_id.
  string client_name = 13;

  // The tool a call through the deployment's MCP surface names, by the
  // plugin's own name for it (W6.20, contract v12). Set only by the
  // dashboard's `/mcp`, never for a page a browser asks for. The sidecar
  // admits the request only at that tool's declared method and path (W4.9);
  // the plugin's SDK serves it without the form token that guards a
  // browser's cookie, since the dashboard signed it and no cookie came with
  // it. Absent for every other request.
  string tool_name = 14;

  // The person's level and accounts on each of the plugin's roles within
  // the session's button (W6.9, contract v15; decisions/033): one entry per
  // role they hold something on, under Manage each role they administer at
  // ACCESS_LEVEL_ADMIN with no account, under Open each role they hold a
  // data level on at that level, under View each at ACCESS_LEVEL_READ.
  // Nothing for a role they hold nothing on. The sidecar admits a command
  // sent for them by their `write` on a role whose generated grants include
  // it, the account among that role's write accounts (W4.9). Empty for a
  // plugin holding no role, and from a dashboard before v15: a sidecar then
  // reads `level` and the account sets as the one role's on a plugin
  // holding one, and refuses a command sent for the person on a plugin
  // holding several. At most 13.
  repeated RoleAccess roles = 15;

  // The prepared change this request was made from, or the page was opened
  // from (W6.27, contract v20): `PC-` and a ULID. Set only by the dashboard,
  // for a person's request to an act's route or page reached from a
  // prepared change; the plugin reads the change with ReadPreparedCall
  // (W4.14), and the sidecar stamps the ID on what the request sends for the
  // person (W4.9). Absent for every other request.
  string prepared_call_id = 16;

  // The person's own values of the settings this plugin declares
  // `per_person` (W6.31, contract v20), as the dashboard keeps them: under
  // Open and View, never under Manage; empty where they set none or the
  // plugin declares none. Values as a setting's are delivered, a table's as
  // JSON rows, 32 KiB in all. At most 64.
  repeated SettingValue own_settings = 17;

  // The plugin's acts, by their tool names, whose second pair of eyes is on
  // for this person now (W6.29, contract v20): their change is prepared and
  // made by someone else, so a page hides Save for them, offering Prepare,
  // and says a second person makes a change this person prepared or their
  // agent did. For showing only: the dashboard refuses a direct make
  // whatever the page draws. Empty where no act's gate is on. At most 200.
  repeated string second_pair_of_eyes = 18;

  // Whether the subject is a person or a service account (W4.9, W4.15;
  // contract v21). Set only by the dashboard, SUBJECT_KIND_SERVICE_ACCOUNT
  // only for a call it admitted through the act's door, never for a page, a
  // delegation or a client. The sidecar admits what is sent with the claims
  // as a person's command under Open, refuses it every `platform.config.`
  // command and query but a ticket's, and stamps the kind on the envelope
  // (`acting_for_kind`), so every store records which kind of user acted.
  // Unspecified: a person, as every assertion before v21. An agent acting
  // for a person names a delegation, and the person stays the actor.
  SubjectKind subject_kind = 19;

  // For a service account (contract v21, W6.32): the deployment-local
  // subject of the person answerable for it when the call was admitted,
  // stamped on the envelope beside it and kept on the actor. Not who acted,
  // which is the service account. Empty for a person.
  string owner_subject = 20;

  // For a service account (contract v22; the order-path plan's refresh,
  // Q24, and its protos' point 3, ruled 2026-10-12): the algorithm
  // identifier the call named (CallAsServiceAccountRequest.algorithm_id),
  // kept in the assertion the dashboard made for it, so every command the
  // call makes carries it and none can name another. The sidecar checks it
  // against the algorithms the plugin's version declares
  // (PluginDeclaration.algorithms), refusing INVALID_ARGUMENT naming
  // `algorithm_id`, and stamps it on the envelope (MessageMeta.algorithm_id).
  // Empty for a person, and where the call named none.
  string algorithm_id = 21;

  // The connectivity plugin instances this user may route through for the
  // calling ems (W4.9, W11.8, W11.21; contract v22; approved 2026-10-12):
  // computed by the dashboard at admission from the conductor's links
  // (AccessRecords.connectivity_links) and the person's user groups, logins
  // or the service account's identity. The ems's sidecar checks a
  // CreatePlacement's connectivity instance against it and stamps
  // MessageMeta.connectivity_allowed. It tells the plugin which
  // connectivity plugins the user may use, never their groups. Empty in an
  // assertion for any other plugin, and for a user who may route through
  // none.
  repeated string connectivity_instance_ids = 22;
}

// A level on one role of a plugin, and the accounts it reaches there
// (contract v15; decisions/033): in the claims, the person's within the
// session's button (W6.9); in the access table, a user group's or a
// person's data level (W4.10). Its accounts are positions in the carrying
// message's `read_account_ids`, never repeated, so a session's header
// carries as many accounts as before roles.
message RoleAccess {
  // A role from the deployment's fixed list that the plugin was launched
  // with, never a part the plugin names for itself.
  string role = 1;

  // In the claims, the level within the session's button; in the access
  // table, the data level held, read or write, never ACCESS_LEVEL_ADMIN.
  // Never unspecified.
  AccessLevel level = 2;

  // The accounts this role reaches to read, as positions counted from 0 in
  // the carrying message's `read_account_ids`; every write account of the
  // role is among them. Empty under ACCESS_LEVEL_ADMIN, and where the role
  // reaches no account to read. At most 10,000.
  repeated uint32 read_positions = 3;

  // The accounts this role reaches to write, as positions in the same
  // `read_account_ids`, since every write account is a read account. A
  // command for the person in this role is admitted only on one of these.
  // Empty at read and admin, and where the role reaches no account to
  // write. At most 10,000.
  repeated uint32 write_positions = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// W4.10 — who may use this plugin
// ─────────────────────────────────────────────────────────────────────────────

// The sidecar knows which plugin is asking.
message PluginAccessRequest {}

// For shaping an interface -- which actions to show, whom a task can go to.
// Nothing here is an access decision; the sidecar checks each command itself.
message PluginAccessReply {
  repeated UserGroupAccess user_groups = 1;

  // People who have signed in to the deployment, with the user groups they
  // were in at their last sign-in. Nobody who has not signed in is here: the
  // deployment holds no directory.
  repeated PersonAccess people = 2;
}

// For one user group, or one person: the accounts they may read and may
// write through this plugin. Write implies read, and every write account is
// also listed as read. The two sets are the union over the plugin's roles,
// what a plugin built before contract v15 reads; `roles` breaks them down.
message UserGroupAccess {
  string user_group_id = 1;
  string name = 2;
  repeated string read_account_ids = 4;
  repeated string write_account_ids = 5;

  // Access tag by tag, retired with tags (decisions/026).
  reserved 3;
  reserved "access";

  // One entry per role of this plugin the group holds a data level on, at
  // that level, its accounts as positions in the group's read accounts;
  // only this plugin's roles, and none for admin, which the table does not
  // list (W4.10, contract v15). Empty for a plugin holding no role, and
  // before v15. At most 13.
  repeated RoleAccess roles = 6;
}

message PersonAccess {
  string subject = 1;
  string display_name = 2;
  repeated string user_group_ids = 3;
  int64 last_signed_in_at_ns = 4;
  repeated string read_account_ids = 6;
  repeated string write_account_ids = 7;

  // Access tag by tag, retired with tags (decisions/026).
  reserved 5;
  reserved "access";

  // One entry per role of this plugin the person holds a data level on
  // through their groups' grants, at that level, its accounts as positions
  // in the person's read accounts; only this plugin's roles, and none for
  // admin (W4.10, contract v15). Empty for a plugin holding no role, and
  // before v15. At most 13.
  repeated RoleAccess roles = 8;
}

// ─────────────────────────────────────────────────────────────────────────────
// W4.11 — the plugin's account scope
// ─────────────────────────────────────────────────────────────────────────────

// The sidecar knows which plugin is asking.
message WatchAccountScopeRequest {}

// Everything anybody may reach through this plugin, derived from permissions
// and links and never declared, and the plugin's links beside it. The plugin
// reads its whole read scope as itself and serves each person from it.
//
// Sent at once when the stream opens, so a plugin has its links again on
// every start, and again on every change: a permission, a link made or
// removed, a linked account renamed or closed.
message AccountScopeDelivery {
  repeated string read_account_ids = 1;
  repeated string write_account_ids = 2;

  // This plugin's links (W6.4), and nobody else's: each external account it
  // links, and the account it is linked to, which the link puts in both
  // scopes while it stands (a closed one in the read scope alone). An
  // external account the plugin reported and none of these names is
  // unlinked, and its rows are refused (Refusal).
  repeated LinkedExternalAccount links = 3;

  // Contract v22 (W4.11, W11.21, W11.22; the order-path plan's refresh,
  // Q26). For a connectivity plugin: its link to its one `ems`, and the
  // mappings that `ems` made on it (venue_account_map), from which its
  // sidecar stamps a fill's or a locate's account. It holds no
  // permission-derived scope and no links of its own: its read and write
  // scope above is the accounts that `ems` mapped venue account codes to on
  // it, and empty while it is linked to none. For an `ems`: the
  // connectivity plugins linked to it, who may route through each, and its
  // venue account map. Sent again on every change to any of them.
  ConnectivityLink connectivity_link = 4;
  repeated ConnectivityLink connectivity_links = 5;
  VenueAccountMap venue_account_map = 6;
}

// A connectivity plugin instance's availability, the `ems` it is linked to
// and its users (W11.21; ruled 2026-10-10; contract v22). Kept by the
// conductor, each change its own record, a ConnectivityLinkChange the
// conductor keeps and no proto carries (decisions/031).
message ConnectivityLink {
  string connectivity_instance_id = 1;

  // Made available by a deployment admin; nothing is by default.
  bool available = 2;

  // The one `ems` instance it is linked to, by its admin; empty while
  // unlinked.
  string ems_instance_id = 3;

  // Who may route through it, made available by the `ems`'s admin: a
  // placement for any other user is refused
  // REFUSAL_REASON_CONNECTIVITY_NOT_ALLOWED.
  repeated ConnectivityUser users = 4;
}

// A user a connectivity plugin is made available to: a person, a service
// account or a user group (W11.21).
message ConnectivityUser {
  oneof user {
    // A person, by the deployment-local subject.
    string subject = 1;
    string service_account_id = 2;
    string user_group_id = 3;
  }
}

// An `ems`'s map of book accounts to the venue account codes they trade
// under at its connectivity plugins (W11.22; contract v22): what the `ems`
// sets in the venue's account field, and what the sidecar stamps a venue
// fact's account by (`venue-account-map`).
message VenueAccountMap {
  string ems_instance_id = 1;
  repeated VenueAccountMapping mappings = 2;
}

// One account's code at one connectivity plugin: a code once per plugin.
message VenueAccountMapping {
  string connectivity_instance_id = 1;
  string venue_account_code = 2;
  // An account the deployment admin granted the `ems`'s instance (W6.30).
  string account_id = 3;
}

// One of the plugin's external accounts, as linked.
message LinkedExternalAccount {
  // As the plugin reported it (W2.8).
  string external_account_id = 1;

  // The deployment's account it is linked to.
  string account_id = 2;

  // That account's name as the deployment holds it now (W6.3), so the plugin
  // can say which account a link points at without acting for anybody.
  string account_name = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// W4.13 — a move of raw records, contract v16
// ─────────────────────────────────────────────────────────────────────────────

// One unit of a kind of raw record moved, reported before anything is
// removed (spec/an-edge-plugins-older-records-move-to-the-archive,
// requirements 4 and 10). Never a record's content. The instance is the
// envelope's, and the person, for a move acting for one, the assertion's:
// neither is a field.
message RecordMoveRequest {
  // A kind the version's declaration names. 1 to 40 characters.
  string record_kind = 1;

  // The plugin's own key for the unit: a day's session, a statement's files,
  // an account's month of responses. 1 to 512 characters.
  string unit = 2;

  // How many records the unit holds. 1 to 1,000,000,000.
  uint64 record_count = 3;

  // The span they cover, from when the first was received to when the last
  // was, in nanoseconds since the epoch. Never 0; the last never before the
  // first.
  int64 first_received_ns = 4;
  int64 last_received_ns = 5;

  MoveOutcome outcome = 6;

  // The window that moved it, as its setting and value, "activity_window_days
  // 2555". Empty acting for a person, who is the assertion's. At most 200
  // characters.
  string rule = 7;
}

// What became of a unit.
enum MoveOutcome {
  // Not said; refused.
  MOVE_OUTCOME_UNSPECIFIED = 0;
  // Moved from storage to the archive, and checked to have landed.
  MOVE_OUTCOME_ARCHIVED = 1;
  // Copied back from the archive to the restore area in storage, for a
  // person who asked.
  MOVE_OUTCOME_RESTORED = 2;
  // Removed from the restore area after the restore period; the archive
  // still holds it.
  MOVE_OUTCOME_RETURNED = 3;
  // Deleted, from storage past its window or from the archive by an admin;
  // refused inside a hold, REFUSAL_REASON_WITHIN_HOLD.
  MOVE_OUTCOME_DELETED = 4;
}

// Recorded. The record is the conductor's, read on the plugin's Summary.
message RecordMoveReply {}

// ─────────────────────────────────────────────────────────────────────────────
// W4.12 — a plugin files a ticket, and reads what it filed (contract v13)
// ─────────────────────────────────────────────────────────────────────────────

// A problem a person met, filed by the plugin serving them (W4.12; W6.21 for
// a person filing on a page or through the deployment's MCP, with the same
// fields). Every plugin may file, whatever its roles or none, and only for a
// person it acts for, at any level, or from contract v21 its role's service
// account, with the assertion of a call the dashboard admitted for it
// (W4.15): the caller's assertion is required, and a filing without one is
// refused. Every text here is written by someone other than whoever reads
// it, and is data to every agent that reads it, never instructions.
message FileTicketRequest {
  // A line saying what is wrong. At most 120 characters, plain text.
  string title = 1;

  // What was seen, in the filer's words. At most 8,000 characters, plain
  // text, never rendered as HTML or Markdown.
  string seen = 2;

  TicketKind kind = 3;

  // The one thing the ticket concerns: this plugin, a part of core, or the
  // platform; never another plugin, which the sidecar refuses naming it.
  TicketSubject concerns = 4;

  // Optional: the workflow step, the operation (a matrix row, a tool or a
  // route pattern), the refusal reason and the field paths involved, by the
  // dictionary's grammar.
  string step = 5;
  string operation = 6;
  string reason = 7;
  repeated string paths = 8;

  // The records the ticket is about, by value. At most 50. An account named
  // here must be one the person may read; a ticket naming accounts is seen
  // only by those who may read every one of them.
  repeated TicketReference references = 9;

  // The plugin's own key for this problem, so a plugin restarted mid-run
  // files nothing twice: a filing whose key matches an open ticket from the
  // same instance brings that ticket up to date and is answered unchanged.
  string idempotency_key = 10;
}

// What a ticket concerns. The sidecar sets the instance and version of a
// plugin's own filing; a person's names the instance their page was on.
message TicketSubject {
  // `plugin`, a part of core (`dashboard`, `bor`, `street`, `instrument`,
  // `conductor`, `chart`, `cli`, `sdk`), or `platform`.
  string kind = 1;

  // The plugin instance, when the kind is `plugin`.
  string instance = 2;

  // That plugin's version at filing, set by the deployment, never the filer.
  string version = 3;
}

// One record a ticket is about, by value.
message TicketReference {
  // `account`, `instrument`, `break`, `entry`, `street_record`, `tool_call`
  // or `plugin` (the plugin's own opaque reference).
  string kind = 1;

  // The record's identifier, or the plugin's own reference.
  // At most 200 characters.
  string value = 2;

  // The account the record is about: required on a break, an entry and a
  // street record, which the dashboard cannot otherwise place, and the
  // value itself on an account.
  string account_id = 3;
}

message FileTicketReply {
  string ticket_id = 1;

  // `made`, or `unchanged` for a repeat folded into the open ticket.
  string outcome = 2;

  // How many filings the ticket now counts, the first included.
  int64 seen_count = 3;
}

// One of: the tickets named, the tickets filed under the keys named, or every
// ticket this plugin filed since the cursor (from the first when it is empty).
// Answered for the instance the envelope names and no other.
message ReadFiledTicketsRequest {
  repeated string ticket_ids = 1;
  repeated string idempotency_keys = 2;
  string cursor = 3;
}

message ReadFiledTicketsReply {
  repeated FiledTicket tickets = 1;

  // Where the next read starts; empty when there is nothing further.
  string next_cursor = 2;
}

// What became of a ticket the plugin filed. Never people's notes, and never
// who holds or works it (requirement 11).
message FiledTicket {
  string ticket_id = 1;
  string idempotency_key = 2;
  TicketState state = 3;

  // Set once it is resolved or closed.
  TicketResolution resolution = 4;

  int64 seen_count = 5;
  int64 first_seen_ns = 6;
  int64 last_seen_ns = 7;

  // Answers relayed from outside the deployment. Empty until contract
  // revisions after v13 bring answers in.
  repeated string answers = 8;
}

// What kind of problem a ticket is. Routed by what it concerns, not by kind.
enum TicketKind {
  TICKET_KIND_UNSPECIFIED = 0;
  TICKET_KIND_DEFECT = 1;
  TICKET_KIND_DISCREPANCY = 2;
  TICKET_KIND_REQUEST = 3;
  TICKET_KIND_QUESTION = 4;
}

enum TicketState {
  TICKET_STATE_UNSPECIFIED = 0;
  TICKET_STATE_OPEN = 1;
  TICKET_STATE_RESOLVED = 2;
  TICKET_STATE_CLOSED = 3;
}

// What resolved a ticket (a note, an answer, a version), or why it was closed
// with nothing fixed.
enum TicketResolution {
  TICKET_RESOLUTION_UNSPECIFIED = 0;
  TICKET_RESOLUTION_NOTE = 1;
  TICKET_RESOLUTION_ANSWER = 2;
  TICKET_RESOLUTION_VERSION = 3;
  TICKET_RESOLUTION_WITHDRAWN = 4;
  TICKET_RESOLUTION_DUPLICATE = 5;
  TICKET_RESOLUTION_NOT_A_PROBLEM = 6;
}

// The kinds of a ticket's notes. `answer` is carried from v13, though nothing
// writes one until answers arrive from outside the deployment.
enum TicketNoteKind {
  TICKET_NOTE_KIND_UNSPECIFIED = 0;
  TICKET_NOTE_KIND_NOTE = 1;
  TICKET_NOTE_KIND_ADVICE = 2;
  TICKET_NOTE_KIND_ANSWER = 3;
  TICKET_NOTE_KIND_CHANGE = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// W4.4 — why a typed operation was refused
// ─────────────────────────────────────────────────────────────────────────────

// A typed operation's refusal is its call's status, chosen by what the caller
// should do about it, with words for a person reading a log. Where one
// status covers refusals a plugin must tell apart, the sidecar also sends
// this, in the status's trailing metadata `meridian-refusal-bin`, encoded,
// and a plugin acts on its reason, never on the words, which may change.
message Refusal {
  RefusalReason reason = 1;

  // Each field the command left out, by its path in the params as the
  // sidecar names a field it refuses (positions[0].lots[1].terms.cost,
  // adjustment.lines[0].opens_lot.acquired_date), so a plugin shows a person
  // what to complete without reading the words (contract v9); from v10 an
  // instrument whose record lacks its asset class or currency
  // (positions[0].instrument.asset_class). REFUSAL_REASON_INCOMPLETE carries
  // them, and a per-record refusal of the deployment's instrument store
  // names the fields it refused.
  repeated string fields = 2;
}

// The typed-operations refusal catalogue (spec/typed-sidecar-operations):
// each reason, and the status it is sent beside.
enum RefusalReason {
  REFUSAL_REASON_UNSPECIFIED = 0;

  // FAILED_PRECONDITION. The operation named an external account nobody has
  // linked to an account (W2, W6.4), so there is nothing to record it
  // against. Nothing was recorded; once a link is made, the next statement
  // records it. Told apart by this alone from not being registered, which
  // is the same status.
  REFUSAL_REASON_EXTERNAL_ACCOUNT_NOT_LINKED = 1;

  // The book of record's refusals (W9, contract v8), each sent with ABORTED:
  // the book answered with a refusal of its own, and the sidecar carries its
  // code beside the status. The first two are step 5's proposed names,
  // landing here first.

  // A command other than a finding sent with no user (W9.1, W9.6, W9.7,
  // W9.13): an opening balance, handling, a resolution or an attribute is a
  // user's act, a person's or from contract v21 a service account's.
  REFUSAL_REASON_ACTOR_REQUIRED = 2;

  // A justified act sent without its reason or explanation.
  REFUSAL_REASON_REASON_REQUIRED = 3;

  // A second opening balance while one stands (W9.1).
  REFUSAL_REASON_OPENING_BALANCE_RECORDED = 4;

  // A break, figures or an entry for an account with no opening balance.
  REFUSAL_REASON_NO_OPENING_BALANCE = 5;

  // An entry moving a position effective on or before the opening
  // balance's date (Q27).
  REFUSAL_REASON_BEFORE_OPENING_BALANCE = 6;

  // An opening position whose lots do not sum to its quantity, or an entry
  // leaving a position's open lots so.
  REFUSAL_REASON_LOTS_UNBALANCED = 7;

  // A command the break's state does not allow: updating, handling,
  // resolving or closing one that is not open.
  REFUSAL_REASON_BREAK_STATE = 8;

  // A reversal of an opening balance while a later entry moving the
  // account's positions stands.
  REFUSAL_REASON_LATER_ENTRIES_STAND = 9;

  // A command carrying an idempotency key the account's book holds for a
  // different command (Q12 of the sample operations plugin): the same key
  // and the same command is answered with the first's reply; a different
  // command under it is refused, nothing applied.
  REFUSAL_REASON_IDEMPOTENCY_CONFLICT = 10;

  // An entry missing a field the book requires for tax tracking, valuation,
  // confirmation or settlement (W9.1, W9.7, contract v9): nothing applied,
  // and each missing field named in Refusal.fields. Of every opening
  // position, its settled quantity, each pending quantity's value date, and
  // its lots but on cash, each with its quantity, cost and acquisition
  // date; a named source; and of every lot an adjustment opens, its cost and
  // acquisition date. From v10, of every instrument an entry names, its
  // record's asset class and currency (positions[n].instrument.asset_class,
  // adjustment.lines[n].instrument.currency), which the deployment admin
  // completes at the dashboard (W3.10).
  REFUSAL_REASON_INCOMPLETE = 11;

  // The deployment's instrument store refusing one record of a completion
  // at the dashboard: an identifier another record carries, listed as a
  // conflict for a person to merge (W3.10, contract v10). Per record, in
  // the completion's reply; never a plugin's.
  REFUSAL_REASON_IDENTIFIER_HELD = 12;

  // A record changed since the version a completion or a merge named
  // (W3.10, W3.13, contract v10): read it again. Per record, in the reply;
  // never a plugin's.
  REFUSAL_REASON_RECORD_CHANGED = 13;

  // UNAVAILABLE, to be tried again: the book could not check a command
  // because the instrument store did not answer in time (W9.1, W9.7,
  // contract v10). Nothing recorded, and the same command again is checked
  // again.
  REFUSAL_REASON_REFERENCE_UNAVAILABLE = 14;

  // FAILED_PRECONDITION (W4.13, contract v16). A deletion of a unit whose
  // last record was received inside the hold over the instance (W6.25):
  // nothing recorded, and the unit is kept.
  REFUSAL_REASON_WITHIN_HOLD = 15;

  // FAILED_PRECONDITION (W6.4, W6.30, contract v20). A link naming an
  // existing account the deployment admin has not granted the plugin's
  // instance: nothing linked. The admin asks a deployment admin to grant it.
  // From contract v22 also an `ems`'s venue account mapping naming such an
  // account (W11.22), with the same status (the order-path plan's protos,
  // point 6, ruled 2026-10-12).
  REFUSAL_REASON_ACCOUNT_NOT_LINKABLE = 16;

  // The order path's refusals (W11, contract v22; step 5's "Refusals"),
  // each sent with ABORTED: the book, or the conductor for the link, answered
  // with a refusal of its own. A command refused changes nothing, but for
  // REFUSAL_REASON_CONNECTIVITY_NOT_ALLOWED on a placement, which is
  // recorded. A venue's fact is never refused for its state.

  // A release whose allocation instruction does not sum to the ordered
  // quantity (W11.6; principle 1, ordered equals allocated).
  REFUSAL_REASON_ALLOCATION_UNBALANCED = 17;

  // A release of an order whose approval required stands unapproved
  // (W11.6).
  REFUSAL_REASON_APPROVAL_REQUIRED = 18;

  // A release while a check's block stands without an override (W11.6).
  REFUSAL_REASON_CHECK_BLOCKS = 19;

  // A placement, a claim or a change by other than the claimant of a
  // claimed order (W11.3, W11.7, W11.8, W11.9), and from v23 an accept onto
  // it (W11.23); a cancel by anyone who may
  // write the account is admitted past a claim (Q4), and so is a
  // connectivity plugin's report of a cancel it sent under a stop.
  REFUSAL_REASON_CLAIMED = 20;

  // A command the order's or the placement's state does not allow, by the
  // transition table (decisions/035): a placement or a child order under an
  // order not released, a quantity change that is not the proposer's or an
  // alignment, an acknowledgement of does not tie out, a use of an expired
  // locate.
  REFUSAL_REASON_ORDER_STATE = 21;

  // A new record reusing an identifier already in use (W11.1; step 5,
  // "Refusals").
  REFUSAL_REASON_IDENTIFIER_IN_USE = 22;

  // A placement naming a connectivity plugin not linked to the placing
  // `ems`, or not made available to the user the command acts for, a
  // person or a service account (W11.8; ruled 2026-10-10, the order-path
  // plan's refresh, Q30); refused and recorded, an entry naming the placing
  // `ems`, the instance asked for, the actor and the reason, heard by the
  // `ems` and `compliance`. Also an `ems`'s venue account mapping at a
  // connectivity plugin not linked to it (W11.22).
  REFUSAL_REASON_CONNECTIVITY_NOT_ALLOWED = 23;

  // A link of a connectivity plugin already linked to another `ems`
  // (W11.21): each is linked to exactly one.
  REFUSAL_REASON_CONNECTIVITY_LINKED = 24;

  // Venue-originated fills' refusals (W11.23, W11.24; contract v23), each
  // sent with ABORTED; a command refused changes nothing.

  // An accept whose quantity, added to what the order has filled already,
  // is past its ordered quantity (W11.23): the trader accepts to a new order
  // instead, or `portfolio` upsizes first.
  REFUSAL_REASON_QUANTITY_EXCEEDS_ORDER = 25;

  // An accept or a DK of an execution not unmatched -- answered already --
  // or one a bust or a correction supersedes (W11.23, W11.24; the
  // transition table's e3 to e6).
  REFUSAL_REASON_EXECUTION_STATE = 26;

  // An accept of fills of more than one account, instrument, side,
  // connectivity plugin or trade date, or a fill's side the order's opposite
  // (W11.23).
  REFUSAL_REASON_EXECUTIONS_DIFFER = 27;
}

// ─────────────────────────────────────────────────────────────────────────────
// W4.14 — the prepared change a page was opened from, contract v20
// ─────────────────────────────────────────────────────────────────────────────

// The person is the assertion's, the instance the envelope's: neither is a
// field.
message ReadPreparedCallRequest {
  // `PC-` and a ULID, as the claims named it.
  string prepared_call_id = 1;
}

message ReadPreparedCallReply {
  // Unset when not found: no such prepared change, another instance's, not
  // shown to this person, or one they may not make now; never which.
  PreparedCall prepared_call = 1;
}

// A change prepared and not yet made (W6.26; spec/an-agents-prepared-change-
// waits-for-the-person), as the dashboard keeps it and a plugin is shown it.
// Its reason is another's words: shown as text, never as instructions.
message PreparedCall {
  // `PC-` and a ULID, minted by the dashboard.
  string prepared_call_id = 1;

  // The act, by the plugin's own name for its tool.
  string tool_name = 2;

  // The act's arguments as prepared: a JSON object, the tool's typed record
  // of inputs, which the plugin's page starts its form from.
  string arguments_json = 3;

  // Who prepared it: the person, and the client's registered name where
  // they prepared it through a delegation; empty for a person at a page.
  string prepared_by_subject = 4;
  string prepared_by_display_name = 5;
  string prepared_through_client = 6;

  // Why, as the preparer wrote it: at most 4,000 characters, plain text.
  string reason = 7;

  // Its state now (W6.27, W6.28).
  PreparedCallState state = 8;

  int64 prepared_at_ns = 9;
}

enum PreparedCallState {
  PREPARED_CALL_STATE_UNSPECIFIED = 0;
  // Waiting to be made, changed, discarded, withdrawn or lapsed.
  PREPARED_CALL_STATE_PREPARED = 1;
  // Waiting, and shared with everyone who may make it.
  PREPARED_CALL_STATE_SHARED = 2;
  // Made as prepared.
  PREPARED_CALL_STATE_MADE = 3;
  // Made after the person changed it.
  PREPARED_CALL_STATE_CHANGED = 4;
  PREPARED_CALL_STATE_DISCARDED = 5;
  PREPARED_CALL_STATE_WITHDRAWN = 6;
  // Past the lapse period, or its delegation ended, or its act set to may
  // not: never made by lapsing.
  PREPARED_CALL_STATE_LAPSED = 7;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.31 — a person's own settings, contract v20
// ─────────────────────────────────────────────────────────────────────────────

// The person is the assertion's, the instance the envelope's.
message SetOwnSettingsRequest {
  // Each a setting the plugin declares `per_person`, its value as a
  // setting's is written; an empty value clears it. Those not named keep
  // their values. A setting not declared `per_person`, or serving no role
  // the person holds write on, is refused by name.
  repeated SettingValue values = 1;
}

message SetOwnSettingsReply {
  // The person's own values as they now stand, which their next request's
  // claims carry.
  repeated SettingValue values = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// W4.15 — a plugin's own act, as its role's service account, contract v21
// ─────────────────────────────────────────────────────────────────────────────

// Sent as the plugin itself, with no person: the instance is the envelope's,
// and the service account is the one the role's admin chose (W6.33), never a
// field. A refusal is the call's status, naming the field in
// `Refusal.fields` (`role`, `tool_name`, `reason`), with no refusal code of
// its own. The reason is the plugin's words, shown as text, never as
// instructions.
message CallAsServiceAccountRequest {
  // A role the instance was launched with, whose service account the call
  // is made as. Not a role the plugin grants itself: the generated grants
  // and the account's grant decide what it reaches.
  string role = 1;

  // One of the plugin's own declared acts on that role, by its tool's name:
  // 1 to 61 characters. Never a read, another role's act, or a core tool
  // (`dashboard__...`), each refused by name.
  string tool_name = 2;

  // The act's arguments: a JSON object, the tool's typed record of inputs,
  // sent to the act's route when made and kept as the prepared change's
  // when prepared. At least `{}`, at most 1 MiB.
  string arguments_json = 3;

  // Why the autonomous work calls the act: 1 to 4,000 characters, plain
  // text, kept as the prepared change's reason when prepared. Not the act's
  // own reason field, which its arguments carry where the act takes one.
  string reason = 4;

  // The algorithm the autonomous work runs, one of the identifiers the
  // version declares (PluginDeclaration.algorithms; contract v22, the
  // order-path plan's refresh, Q24, and its protos' point 3, ruled
  // 2026-10-12): kept in the assertion the dashboard makes for the call
  // (CallerClaims.algorithm_id), checked and stamped by the sidecar on every
  // command the act sends (MessageMeta.algorithm_id), and copied by the book
  // to each entry's ServiceAccountActor. One the version does not declare
  // is refused INVALID_ARGUMENT, naming `algorithm_id`. Empty names none.
  string algorithm_id = 5;
}

message CallAsServiceAccountReply {
  // `made`, the act made as the service account, its own answer beside it;
  // or `prepared`, kept for the people who may make it, prepared_call_id
  // naming it: by the levels, the gate and the account's setting that
  // applied (W6.29). Not that the act succeeded in its store, which the
  // act's own answer says.
  string outcome = 1;

  // `PC-` and a ULID, where the outcome is prepared: its preparer is the
  // service account, and a person makes it. Empty otherwise.
  string prepared_call_id = 2;

  // The act's own answer, where the outcome is made: the route's typed JSON
  // answer, as a tool's call is answered (W6.20), at most 1 MiB. Empty
  // otherwise.
  string answer_json = 3;
}
