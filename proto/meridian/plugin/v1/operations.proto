  // The row, as ReceiveRequest names it; empty on a Lost.
  string row = 5;

  // Copied from the record's journal and cause; unset on a Lost, and on a
  // conflated row, whose sequence is in its own message.
  JournalRef journal = 6;
  ChangeCause cause = 7;

  // The cause's instance is this plugin's (Q6).
  bool own = 8;

  // Contract v28, amended 2026-10-30: each open subscription the delivery
  // matched, by its subscription_id, the sidecar the one matcher. None: heard
  // by the stream's own rows and subjects alone, or a Lost.
  repeated string subscription_ids = 9;
}

// The sidecar dropped deliveries it knows of, at this point in the stream:
// its queue for the plugin full (1024), or the bus's drop count for the
// plugin's subscription risen.
message Lost {
  // How many, where the sidecar knows; 0 when it knows only that some were.
  uint64 dropped = 1;

  // The rows they were of; empty when it cannot say, which is every row.
  repeated string rows = 2;
}

// A targeted read kept open (W4.3; contract v28, amended 2026-10-30):
// from the reply on, every delivery matching the selector is queued on the
// plugin's one stream, its fields masked by the plugin's entitlements, decided
// when it opens and again on EntitlementsChanged. Refused PERMISSION_DENIED
// for a row no role the plugin holds hears, FAILED_PRECONDITION with no
// stream open, ALREADY_EXISTS for a subscription_id open with another
// selector, RESOURCE_EXHAUSTED past 256 open, INVALID_ARGUMENT naming the
// field otherwise. The same subscription_id and selector again is answered
// as the first.
message SubscribeRequest {
  // The plugin's own name for it, as FIX's MDReqID (262) is the
  // requester's: 1 to 64 characters, unique among its open subscriptions.
  string subscription_id = 1;

  // The one row it hears, by its matrix name ("QuotesRecorded").
  string row = 2;

  // A lake row's subjects by their entity IDs, as ReceiveRequest names
  // them; a book row's accounts. 0 to 500. None: a lake row is about none,
  // so nothing is heard of it; a book row's every account in the read
  // scope.
  repeated string subjects = 3;

  // A lake row's series, by key, as the reads name them (contract v28). None:
  // rows keyed by a series are heard only with all_series.
  repeated Identifier series_keys = 4;

  // True: rows keyed by any series of the subjects, narrowed by the window.
  bool all_series = 5;

  // Plain dates, inclusive, narrowing all_series to the series expiring in
  // the window as the lake's listing holds them; set only with all_series,
  // or refused naming expiration_from. Empty: from the earliest; to the
  // latest.
  string expiration_from = 6;
  string expiration_to = 7;

  // The dictionary entries of the row's message to hear, 0 to 32, as the
  // reads name them; intersected with the plugin's entitled fields. None:
  // every field it may read.
  repeated string fields = 8;
}

// Subscribe's answer, once the sidecar is delivering what the selector
// matches: the plugin then reads its snapshot.
message SubscribeReply {}

// A subscription dropped. An id not open is answered as dropped.
message UnsubscribeRequest {
  string subscription_id = 1;
}

// Unsubscribe's answer: nothing more is queued for it.
message UnsubscribeReply {}

// One account a connection reaches, as the custodian presents it.
// A mirror of meridian.v1.ExternalAccount.
message ExternalAccount {
  // Stable: the connector makes it so where the venue does not, and it is the
  // `external_account_id` the account's rows name. SnapTrade's changes on
  // reconnect unless its `institution_account_id` is used; Kalshi's is a
  // subaccount and a matching engine joined. A handle the venue wants on each
  // call (E*TRADE's accountIdKey, Schwab's hash) stays inside the plugin.
  string external_account_id = 1;

  // The custodian's own name for it, as a person there would recognise it.
  string name = 2;

  // Deprecated from contract v11, for `account_kind` (Q13, reversed on the
  // revision, 2026-10-01): the venue's own word, verbatim and for display
  // only. A plugin built for v11 leaves it empty; the sidecar accepts it
  // from an earlier one for the notice the stability list gives, and the
  // dashboard shows it only where no kind is sent; then it is reserved.
  string venue_account_type = 3;

  // The account's kind, converted by the plugin from the venue's own type
  // (contract v11). For display and for grouping accounts across plugins;
  // nothing gates on it, and what an account may do is the platform's
  // restriction set when that is ruled.
  AccountKind account_kind = 4;

  // The venue's type as reported, set only when the kind is not known
  // because the type did not convert (spec/vendor-differences-have-a-place-
  // in-the-contract, requirement 4). For a person to map; never read.
  AsReported account_kind_as_reported = 5;
}

// An account's kind (contract v11): one coarse kind, the platform's own
// words, never a venue's.
// A mirror of meridian.v1.AccountKind.
enum AccountKind {
  // Not known: the venue's type says neither cash nor margin nor
  // retirement, and travels beside it as reported.
  ACCOUNT_KIND_UNSPECIFIED = 0;
  // Trades settle in full from the account's own cash; no borrowing.
  ACCOUNT_KIND_CASH = 1;
  // The account may borrow against its holdings under a margin agreement.
  ACCOUNT_KIND_MARGIN = 2;
  // A tax-advantaged retirement account, whether or not it allows limited
  // margin.
  ACCOUNT_KIND_RETIREMENT = 3;
}

// A vendor's value the plugin could not convert, beside the field's
// not-known value (requirements 4, 5 and 28): the one place a vendor's own
// code crosses the sidecar. Narrow, flagged and transitional: only the value
// that failed, never alone, and gone once a mapping exists. The sidecar
// checks that each part is present and within its length, and never reads
// its meaning; nothing past the plugin interprets it.
// A mirror of meridian.v1.AsReported.
message AsReported {
  // Whose vocabulary: the plugin's registry name and, where the vendor has
  // several, its code set ("<plugin>:account-type").
  string scheme = 1;

  // The vendor's code, as sent.
  string code = 2;

  // The vendor's own words for it, as sent; the code again where it gives
  // none.
  string text = 3;
}

// Why a connection's data is, or is not, current.
//
// The venues surveyed fail in exactly these ways (reference/broker-apis.md),
// and each asks something different of a person, which is the point of
// naming them rather than leaving them to a flag and free text.
// A mirror of meridian.v1.SyncState.
enum SyncState {
  // Not said: a connector written before this was. Shown as what
  // connection_healthy says.
  SYNC_STATE_UNSPECIFIED = 0;
  // Current. Nothing to do.
  SYNC_STATE_CURRENT = 1;
  // Still serving, but older than it should be: holdings_as_of_ns says since
  // when. Usually the rail's to recover; nothing to do but wait.
  SYNC_STATE_STALE = 2;
  // A person must sign in again at the venue before it serves anything new:
  // E*TRADE and Interactive Brokers daily, Schwab weekly, Interactive Brokers
  // also when connected but signed out.
  SYNC_STATE_NEEDS_SIGN_IN = 3;
  // The connection is disabled and serves only what it last read, as
  // SnapTrade does. Somebody re-enables it.
  SYNC_STATE_DISABLED = 4;
  // Late on purpose, as Interactive Brokers through SnapTrade is by a business
  // day. Expected; nothing to do.
  SYNC_STATE_DELAYED_BY_DESIGN = 5;
  // The venue does not provide holdings through this connection, as some
  // brokerages hide them from SnapTrade (its `holdings_unavailable`). Waiting
  // changes nothing: holdings will not arrive this way, so the account is
  // connected another way or through another venue.
  SYNC_STATE_HOLDINGS_UNAVAILABLE = 6;
}

// An amount of currency: a Decimal and the asset it is in.
//
// One message rather than an amount with its currency beside it, so a message
// holding amounts in several currencies -- a USD price, a EUR commission --
// cannot pair the wrong ones. An amount is never separated from its currency.
//
// In the currency's major unit, whatever the venue counted in: a plugin that
// read cents converts before anything reaches the bus (decisions/023).
//
// From contract v18 a Money always names an instrument (decisions/023 as
// amended; the ruling of 2026-09-30): the cash instrument of the asset it is
// in, fiat and tokens alike, in the deployment's instrument store. A plugin
// may name a fiat currency by its ISO 4217 code alone, which core resolves,
// dated, to its cash instrument; an asset with no ISO 4217 code (USDC, USDT, a
// network's gas token) is named by its instrument alone, which the plugin
// resolves as it resolves any instrument (W3.1). What is kept and read back
// names the instrument.
// A mirror of meridian.v1.Money.
message Money {
  Decimal amount = 1;

  // ISO 4217, e.g. "USD": the currency's code, where the asset has one.
  // Empty for an asset with no ISO 4217 code, which `instrument_id` alone
  // names; a token's code here is refused. From v18 a plugin may send this
  // alone and core fills `instrument_id`.
  string currency_code = 2;

  // The cash instrument of the asset the amount is in, the deployment's own
  // ID (contract v18). Empty from a plugin that named a fiat currency by
  // `currency_code` alone, which core resolves; set by core on what it keeps
  // and answers. Both set must name the same asset, or the amount is
  // refused; neither set is refused.
  string instrument_id = 3;
}

// A number: a 128-bit two's-complement integer and its scale. The value is the
// integer times 10^-scale, so 1.50 is 150 at scale 2 and stays 1.50.
//
// The scale travels with the value rather than being fixed for the contract,
// because the venues disagree: Alpaca takes nine decimal places, a crypto
// asset eighteen, and a cheap token's holding runs past what 64 bits hold at
// any fixed scale that serves them both. The scale is the one the value was
// stated with; nothing normalises it.
//
// The integer's magnitude is below 10^38, which is at most 38 significant
// digits, and the scale is 0 to 18. The widest value the broker survey found,
// 100 billion units at 18 decimals, is well inside it.
// A mirror of meridian.v1.Decimal.
message Decimal {
  // The integer's upper 64 bits, signed: negative for a negative value.
  sfixed64 high = 1;

  // Its lower 64 bits, unsigned. The integer is high * 2^64 + low.
  fixed64 low = 2;

  // How many decimal places the integer carries, 0 to 18.
  uint32 scale = 3;
}

// A statement's figures for one margin segment, each as the venue reported
// it and unset where it reported none; never derived.
// A mirror of meridian.v1.StatementFigures.
message StatementFigures {
  // The segment as the venue names it, verbatim ("securities",
  // "commodities", an FCM's class); empty for the account as a whole.
  string segment = 1;

  optional Money buying_power = 2;

  optional Money margin_requirement = 3;

  // Negative is a deficit.
  optional Money maintenance_excess = 4;

  optional Money initial_margin = 5;

  optional Money variation_margin = 6;

  // A brokerage's own total account value, as it reports it (Q-B); never a
  // sum of the holdings.
  optional Money net_liquidation = 7;

  // The collateral held under this segment, as reported (W2.2; Q12, Q13).
  // A balance moves nothing: posted collateral the custodian also lists as a
  // holding is a holding row too, and collateral received under a security
  // interest is never one.
  repeated ReportedCollateral collateral = 8;
}

// One collateral balance under a margin segment, each field as the venue
// reports it and unset where it does not; never derived.
// A mirror of meridian.v1.ReportedCollateral.
message ReportedCollateral {
  // Posted by the account, or received by it. Unspecified is refused.
  CollateralDirection direction = 1;

  // Resolved as a holding's instrument is (W3.1): the deployment's record,
  // minted for it or held, the currency's cash instrument for cash; or,
  // when the resolve was ambiguous, the identifiers the connector held.
  // Exactly one of the two, as on RecordHoldingRequest.
  string instrument_id = 2;

  repeated Identifier unresolved_identifiers = 3;

  Decimal quantity = 4;

  optional Money value = 5;

  // A fraction of the value: 0.15 is 15%, a venue's percentage written as
  // its fraction.
  optional Decimal haircut = 6;

  optional Money value_after_haircut = 7;

  // Where it is held, as the venue names it: the FCM, the dealer, a
  // third-party custodian. Empty where it does not say.
  string held_at = 8;

  // Whether the receiver may reuse it, as the agreement states and the venue
  // reports it; unset where it does not say (contract v8). Received
  // collateral is never a position (Q13), reusable or not.
  optional bool reusable = 9;
}

// Whether a collateral balance was posted by the account or received by it.
// A mirror of meridian.v1.CollateralDirection.
enum CollateralDirection {
  // Not said. Refused: collateral is posted or received.
  COLLATERAL_DIRECTION_UNSPECIFIED = 0;
  COLLATERAL_DIRECTION_POSTED = 1;
  COLLATERAL_DIRECTION_RECEIVED = 2;
}

// One typed identifier for an instrument.
//
// `scheme` says what kind of identifier this is: a global scheme ("figi",
// "isin", "cusip", "sedol") or a source-scoped one ("symbol"). A source-scoped
// identifier is only meaningful alongside its source, which is why `source` is
// present and why a bare symbol can never drive a global resolve.
// A mirror of meridian.v1.Identifier.
message Identifier {
  // Contract v29 (677): agency_pool, an open scheme, names an agency pool by
  // the agency's pool number, the agency in source (FNMA, FHLMC, GNMA); a
  // debt record matches on figi and agency_pool, and its cusip and isin stay
  // deployment-side, mapped to FIGI at the edge. Contract v29 (715): mpid,
  // clearing_number, branch_sequence and finra_symbol name market
  // participants and a security for trade reports, finra_symbol
  // deployment-side (745).
  string scheme = 1;

  string value = 2;

  // The namespace a source-scoped identifier belongs to, e.g. "snaptrade".
  // Empty for a global scheme.
  string source = 3;

  // When the identifier named the record it is on (contract v19;
  // decisions/034): from, inclusive, and until, exclusive, 0 until it left.
  // An identifier that leaves a record has its window closed at that date,
  // never deleted, so a resolve as of a date before answers the record that
  // held it. Filled by the instrument store on what it answers and by the
  // platform on a pull; a plugin never sets either, and the sidecar sends
  // both empty.
  int64 valid_from_ns = 4;

  int64 valid_until_ns = 5;

  // For a listing identifier -- an exchange-level or composite FIGI on a
  // security's record -- the ISO 4217 currency that listing trades in
  // (W3.1, contract v25), as the platform's master holds it per listing;
  // empty on every other identifier, and where the master holds none. The
  // record's own currency stays the security's.
  string trading_currency = 6;
}

// A reference to the raw record a row was converted from, in the writing
// plugin's own storage (requirement 7, Q9; decisions/028). Opaque: core and
// every other plugin carry it and never follow it; a person follows it on
// the owning plugin's page. A record in a unit the plugin archived
// resolves to "archived, restorable" (contract v16); one past its window and
// deleted, following it says so, and the row stands.
// A mirror of meridian.v1.RawRecordRef.
message RawRecordRef {
  // The writing plugin's own instance, which its SDK sets from its
  // registration; the sidecar refuses a reference naming another.
  string instance_id = 1;

  // The plugin's own key for the record.
  string key = 2;
}

// Where a value a plugin sent came from, where the plugin closed it rather
// than read it from its vendor (requirements 31 to 34; plans/an-order-reaches-
// a-venue-through-the-book, Q13). A value with none on its message is the
// vendor's, from the message's raw record.
// A mirror of meridian.v1.Provenance.
message Provenance {
  // The value it is for, by its path in the message: `quantity`,
  // `settle_date_quantity`, `pending`, `market_value.currency_code`.
  string field = 1;

  ProvenanceKind kind = 2;

  // The raw record it was read from: on a value reported by the vendor
  // (from a record other than the message's own) or from a second source.
  // Never on a value supplied or derived.
  RawRecordRef raw_record = 3;

  // The second source, by name.
  string source = 4;

  // The person who supplied it, as the plugin's page knew them.
  string person = 5;

  // The rule that derived it, by name, as the plugin documents it.
  string rule = 6;

  // On a value core computed (PROVENANCE_KIND_COMPUTED, contract v22): the
  // rule and each calendar, with their versions, the date read worked it
  // out on (W3.20; the calendars spec's Q10). Never on another kind.
  DateBasis date_basis = 7;
}

// The kinds of provenance (requirement 32), the same meanings as an
// instrument value's source (v10's InstrumentValueSource), and from v22 a
// value core computed.
// A mirror of meridian.v1.ProvenanceKind.
enum ProvenanceKind {
  // Not said; refused.
  PROVENANCE_KIND_UNSPECIFIED = 0;
  // Reported by the vendor.
  PROVENANCE_KIND_REPORTED = 1;
  // From a second source of the plugin's own.
  PROVENANCE_KIND_SECOND_SOURCE = 2;
  // Supplied by a named person, on the plugin's page.
  PROVENANCE_KIND_SUPPLIED = 3;
  // Derived by a named rule in the plugin's code.
  PROVENANCE_KIND_DERIVED = 4;
  // Computed by core, with its basis (contract v22): a date the date read
  // worked out from the settlement calendars, since it is not the plugin's
  // own rule (W3.20; the calendars spec's Q10).
  PROVENANCE_KIND_COMPUTED = 5;
}

// What a date was computed on (W3.20; spec/settlement-calendars-are-core-
// reference-data, requirement 8; contract v22): the rule and its version,
// and each calendar and its version, so anything recording the date can
// record its basis with it, and the same inputs and versions always give
// the same date. Plugin-facing, since a plugin's Provenance and its
// execution's settlement date carry one; the records are core's
// (meridian-core's reference.proto).
// A mirror of meridian.v1.DateBasis.
message DateBasis {
  // Empty for a date worked out on calendars alone: a roll, a
  // business-day check.
  DateRuleRef rule = 1;

  repeated CalendarRef calendars = 2;
}

// A date rule by its kind, subject and version: a rule has no ID of its own
// (the calendars spec's Q11).
// A mirror of meridian.v1.DateRuleRef.
message DateRuleRef {
  DateRuleKind kind = 1;

  // As the platform names it: `US/equity`, a country and an asset class;
  // `EUR/USD`, a pair.
  string subject = 2;

  int64 version = 3;
}

// Which date rule (contract v22).
// A mirror of meridian.v1.DateRuleKind.
enum DateRuleKind {
  DATE_RULE_KIND_UNSPECIFIED = 0;
  // A market's settlement-date rule, for a country and an asset class.
  DATE_RULE_KIND_SETTLEMENT = 1;
  // A currency pair's spot-date rule, its tenor-date rule on it.
  DATE_RULE_KIND_SPOT = 2;
}

// A calendar at one version.
// A mirror of meridian.v1.CalendarRef.
message CalendarRef {
  // "CAL-...", the platform's ID, never reused.
  string calendar_id = 1;

  int64 version = 2;
}

// Which side of an instrument a holding or a custodial position is on.
//
// A side of its own rather than the sign alone, because a venue can report
// both sides of one instrument at once, and two rows keyed by account and
// instrument alone would overwrite each other.
// A mirror of meridian.v1.HoldingSide.
enum HoldingSide {
  // Not said. Refused by the street store: a holding says which side it is on.
  HOLDING_SIDE_UNSPECIFIED = 0;
  HOLDING_SIDE_LONG = 1;
  HOLDING_SIDE_SHORT = 2;
}

// One lot of a holding, as the custodian lists it.
// A mirror of meridian.v1.ReportedLot.
message ReportedLot {
  // Signed as the holding's quantity: negative is short.
  Decimal quantity = 1;

  // The lot's total cost, unset where not reported; its sign as reported,
  // never flipped (Q-D, 2026-10-01).
  optional Money cost = 2;

  // ISO 8601; empty where not reported.
  string acquired_date = 3;
}

// What a source's available figure is net of.
// A mirror of meridian.v1.AvailableBasis.
enum AvailableBasis {
  // The source does not say.
  AVAILABLE_BASIS_UNSPECIFIED = 0;
  AVAILABLE_BASIS_SETTLED = 1;
  AVAILABLE_BASIS_TRADED = 2;
  AVAILABLE_BASIS_CONTRACTUAL = 3;
  // A venue's figure net of its open orders (Alpaca's qty_available,
  // Binance's free): the order reservation is the oms's, never an
  // encumbrance.
  AVAILABLE_BASIS_ORDER_NETTED = 4;
}

// One sub-balance of a holding, as the source reports it.
// A mirror of meridian.v1.ReportedEncumbrance.
message ReportedEncumbrance {
  EncumbranceKind kind = 1;

  // Signed as the holding's quantity. Larger than the holding is recorded
  // as reported: the custodian's data, which the reconciliation flags.
  Decimal quantity = 2;

  // Whether the source reports it available; unset where it does not say,
  // since the kind does not imply it.
  optional bool available = 3;

  // The source's own code or label, verbatim ("PLED"); required for OTHER.
  string source_code = 4;

  // To whom it is pledged, posted or lent, as reported (a name, a BIC or an
  // LEI); empty where not stated.
  string pledgee = 5;

  // The safekeeping place or third party holding it, as reported; empty
  // where not stated.
  string held_at = 6;

  // The margin segment it is under where the source names one, as the venue
  // names it; with the holding's external account, a margin agreement's key.
  // Empty otherwise: a custody statement never names one.
  string segment = 7;

  // The source's narrative; empty where none.
  string detail = 8;
}

// Why some of a holding cannot move (reference/encumbrance-survey, 3.1).
// Pending settlement stays in the settlement buckets: PENDING, like
// REHYPOTHECATED and BORROWED, is the street's, for the statement's own
// consistency, and the book holds none of the three.
// A mirror of meridian.v1.EncumbranceKind.
enum EncumbranceKind {
  // Not said. Refused: a sub-balance says which it is.
  ENCUMBRANCE_KIND_UNSPECIFIED = 0;
  // Pledged in place to a pledgee (PLED).
  ENCUMBRANCE_KIND_PLEDGED = 1;
  // Delivered to a third party as collateral (COLO).
  ENCUMBRANCE_KIND_POSTED = 2;
  // Lent (LOAN).
  ENCUMBRANCE_KIND_ON_LOAN = 3;
  // Blocked for a stated purpose (BLOK, BLCA, BLOT, BLOV).
  ENCUMBRANCE_KIND_BLOCKED = 4;
  // Movable only under conditions or with documents (RSTR, WDOC).
  ENCUMBRANCE_KIND_RESTRICTED = 5;
  // Between depositories, agents or registers (TRAN, REGO, BTRA).
  ENCUMBRANCE_KIND_IN_TRANSIT = 6;
  // A sub-balance the plugin cannot map: its source_code required.
  ENCUMBRANCE_KIND_OTHER = 7;
  // The street's only: as reported, for the consistency check.
  ENCUMBRANCE_KIND_PENDING = 8;
  // The street's only: used by the broker under a right of use; it does not
  // reduce the available quantity.
  ENCUMBRANCE_KIND_REHYPOTHECATED = 9;
  // The street's only: borrowed, title to us, with a return obligation.
  ENCUMBRANCE_KIND_BORROWED = 10;
}

// A quantity not yet settled, and the date it is due to (W2.3, contract
// v11). Signed as its holding's quantity is: a short's pending is negative.
// A mirror of meridian.v1.ReportedPending.
message ReportedPending {
  // ISO 8601.
  string value_date = 1;

  Decimal quantity = 2;
}

// A write marked as a backfill (requirement 27): a field a contract revision
// added, re-converted from the plugin's raw records and sent for a row
// already recorded. The store journals it as an amendment beside the row as
// first recorded, never an overwrite, this its cause.
// A mirror of meridian.v1.Backfill.
message Backfill {
  // The contract version that added the field, as `v<N>`.
  string contract_version = 1;

  // The field, by its path in the message.
  string field = 2;
}

// A point in a store's record: a sequence per partition. What a read
// answers it was read at, and what a read of changes since takes.
// A mirror of meridian.v1.Watermark.
message Watermark {
  repeated PartitionSequence partitions = 1;
}

// One partition's sequence within a watermark.
// A mirror of meridian.v1.PartitionSequence.
message PartitionSequence {
  string partition = 1;

  uint64 sequence = 2;
}

// What the custodian says an account holds of an instrument, on one side,
// right now. Keyed by all three: an account may hold an instrument long and
// short at once, as a venue reporting them apart says.
//
// Custodial, and named so deliberately. This is the custodian's belief, arrived
// at by reading their statements; it is not what the deployment calculates from
// its own activity. Those are different numbers whose disagreement is the
// entire subject of reconciliation, and a message called `Position` would make
// a consumer guess which one it had.
//
// Our own book does not exist yet. When it does it gets its own message and its
// own name, and no reader of this one silently changes meaning.
// A mirror of meridian.v1.CustodialPosition.
message CustodialPosition {
  string account_id = 1;

  // The deployment's record for the instrument, whatever its ID; a record a
  // person merged into another moves onto the one that stays (W3.9).
  string instrument_id = 2;

  // The trade-date quantity, signed to match `side`.
  Decimal quantity = 9;

  // Unset where the custodian reported no value, which is not zero.
  Money market_value = 10;

  // The statement this was last stated by, and when. One not restated recently
  // is not wrong, but it is worth showing differently.
  string last_statement_id = 6;

  string as_of_date = 7;

  int64 updated_at_ns = 8;

  HoldingSide side = 11;

  // The settle-date quantity, where the custodian reported one.
  Decimal settle_date_quantity = 12;

  // Deprecated from contract v11, as on RecordHoldingRequest: the street
  // counts each asset once. Set only from a plugin before v11.
  bool also_counted_in_cash = 13;

  // As the custodian reported them on the row that last stated this, unset
  // or empty where it reported none (W2.3).
  Money cost_basis = 14;

  repeated ReportedLot lots = 15;

  Money margin_requirement = 16;

  // Its last change: a delivery at or below it is already in it.
  JournalRef last_change = 17;

  // A tombstone (W2.6, W3.9): returned only to a read since a watermark,
  // and delivered once.
  bool removed = 18;

  // As on RecordHoldingRequest (Q-A).
  Money average_cost = 19;

  // As on RecordHoldingRequest, from the row that last stated this.
  Decimal available_quantity = 20;

  Decimal not_available_quantity = 21;

  AvailableBasis available_basis = 22;

  repeated ReportedEncumbrance encumbrances = 23;

  // As on RecordHoldingRequest, from the row that last stated this, with
  // what a backfill added to it (contract v11).
  RawRecordRef raw_record = 24;

  repeated Provenance provenance = 25;

  repeated ReportedPending pending = 26;

  // Retired in the domain message, and never reused.
  reserved 3, 4, 5;
  reserved "quantity_scaled_1e8", "market_value_scaled_1e8", "currency";
}

// Where a change sits in its store's record (spec/plugins-hear-and-read, Q1
// as clarified 2026-10-01).
// A mirror of meridian.v1.JournalRef.
message JournalRef {
  // The partition the change was made in: the street store's one, or a
  // book partition.
  string partition = 1;

  // Its number there: the partition's next, taken in the change's own
  // transaction, so the numbers have no holes.
  uint64 sequence = 2;

  // The number of the previous change the same row made for the same
  // account, 0 for its first: what a plugin hearing only some accounts
  // checks for a gap in its own.
  uint64 previous_sequence = 3;
}

// A holding the deployment received but could not name.
// A mirror of meridian.v1.UnresolvedHolding.
message UnresolvedHolding {
  string holding_id = 1;

  string account_id = 2;

  repeated Identifier identifiers = 3;

  // Signed, as the row stated it: negative is a short row.
  Decimal quantity = 10;

  // Unset where the custodian reported no value.
  Money market_value = 11;

  string source = 7;

  string as_of_date = 8;

  // Whether an escalation has already been raised for these identifiers, so the
  // view can separate "nobody has looked at this" from "this is with the
  // administrator".
  bool escalated = 9;

  // The raw record the row was converted from (contract v11).
  RawRecordRef raw_record = 12;

  // Retired in the domain message, and never reused.
  reserved 4, 5, 6;
  reserved "quantity_scaled_1e8", "market_value_scaled_1e8", "currency";
}

// A statement is complete.
//
// The unresolved count is the number an operator actually watches; a statement
// that is complete and fully resolved is the only quiet outcome.
// A mirror of meridian.v1.StatementRecordedEvent.
message StatementRecordedEvent {
  string statement_id = 1;

  string source = 2;

  string as_of_date = 3;

  int32 rows_received = 4;

  int32 rows_resolved = 5;

  int32 rows_unresolved = 6;

  int64 recorded_at_ns = 7;

  // The account the statement is of: its external account's, or, from a
  // plugin before v7, its rows' (W2.2).
  string account_id = 8;

  // The statement's figures as recorded, one set per segment (W2.2).
  repeated StatementFigures figures = 9;

  // Deprecated from contract v11, as on the statement: for `provenance`.
  bool currency_assumed = 10;

  // The completion's number in the street's partition, chained per account
  // with the statements before it, and who caused it: the row whose landing
  // completed it (W2.5, W4.3).
  JournalRef journal = 11;

  ChangeCause cause = 12;

  // The account as the rail knows it, and the institution holding it, as
  // the statement named them: with the source and a segment, what a margin
  // agreement is keyed by and an opening balance names as its source. Empty
  // from a plugin before v7.
  string external_account_id = 13;

  string institution = 14;

  // As the statement reported it (contract v8).
  optional bool security_interest = 15;

  // As the statement carried them (contract v11): its raw record, and the
  // provenance of each value its plugin closed.
  RawRecordRef raw_record = 16;

  repeated Provenance provenance = 17;
}

// Who caused a change, as the store recorded it when it committed (Q3).
// A mirror of meridian.v1.ChangeCause.
message ChangeCause {
  // The instance that sent the command, as its sidecar stamped it.
  string instance_id = 1;

  // The person it was sent for (W4.9); empty when the plugin acted as itself.
  string acting_for_subject = 2;

  string correlation_id = 3;

  // The command's message_id.
  string causation_id = 4;

  int64 committed_at_ns = 5;
}

// One activity on an account, as the custodian states it: a purchase, a
// sale, a reinvested dividend, a dividend or interest, a fee or a tax, a
// split or another corporate action, a transfer, a contribution, a
// withdrawal or a journal (spec/the-custodians-activity-explains-a-break).
//
// Evidence, never a source: the street keeps it as reported and derives no
// position, lot or cash figure from it, and nothing here moves the book. It
// explains a break and proposes an adjustment for a person to confirm
// (W9.4, W9.7). Never netted or deduplicated against holdings: a sweep
// fund's purchases appear as the custodian lists them.
//
// The account it is on is named beside it, by the request that records it
// and the record the street keeps, so the account the sidecar stamped is the
// only one.
// A mirror of meridian.v1.CustodialActivity.
message CustodialActivity {
  // The custodian's own identifier for the activity: what lets the street
  // recognise one sent twice. A custodian restating an activity under a new
  // identifier is a new activity, reported, never merged.
  string external_activity_id = 1;

  // What happened, in the platform's own words, converted by the plugin
  // from the custodian's type.
  ActivityKind kind = 2;

  // The custodian's type as reported, set only when `kind` is not known
  // because the type did not convert. For a person to map; never read.
  AsReported kind_as_reported = 3;

  // The instrument it concerns, resolved at the edge as a holding's is
  // (W3.1): the deployment's record, or the currency's cash instrument.
  // Empty where the activity concerns none, or where the custodian's code
  // did not resolve, and then `instrument_as_reported` carries it.
  string instrument_id = 4;

  // The custodian's code for the instrument as reported, set only when it
  // did not resolve: a plan's own fund code no person has linked yet.
  AsReported instrument_as_reported = 5;

  // ISO 8601: when it was traded or took effect, and when it settles or
  // settled. The settlement date is empty where the custodian does not
  // state it.
  string trade_date = 6;

  string settlement_date = 7;

  // The units of the instrument it moved, signed by what it did to the
  // account: positive added units (a purchase, a reinvestment, the shares a
  // split added, a transfer in), negative removed them (a sale, a fee taken
  // in units, a transfer out). Unset where it moved none, a cash dividend's
  // say, which is not zero.
  optional Decimal units = 8;

  // The price per unit, as stated. Unset where the custodian states none;
  // never worked out from the amount and the units.
  optional Money price = 9;

  // The amount of cash it moved, in its currency, signed by what it did to
  // the account's cash: positive in (a sale, a dividend, a contribution),
  // negative out (a purchase, a fee, a withdrawal). Unset where it moved
  // none, a split's say, which is not zero.
  optional Money amount = 10;

  // The custodian's own description, as reported. Diagnostic and for a
  // person; nothing branches on it.
  string description = 11;

  // The raw record it was converted from, in the plugin's own storage
  // (decisions/028), and the provenance of each value the plugin closed
  // rather than read: an instrument linked once by a named person, a
  // settlement date derived by a named rule.
  RawRecordRef raw_record = 12;

  repeated Provenance provenance = 13;
}

// What an activity was (contract v14): a closed list, the platform's own
// words, never a custodian's.
// A mirror of meridian.v1.ActivityKind.
enum ActivityKind {
  // Not known: the custodian's type converts to none of these, and travels
  // beside it as reported.
  ACTIVITY_KIND_UNSPECIFIED = 0;
  // Units bought.
  ACTIVITY_KIND_PURCHASE = 1;
  // Units sold.
  ACTIVITY_KIND_SALE = 2;
  // Income the custodian reinvested in units, as a money market fund's
  // monthly dividend is.
  ACTIVITY_KIND_REINVESTMENT = 3;
  // A dividend paid in cash.
  ACTIVITY_KIND_DIVIDEND = 4;
  // Interest paid in cash.
  ACTIVITY_KIND_INTEREST = 5;
  // A fee, in cash or in units.
  ACTIVITY_KIND_FEE = 6;
  // A tax withheld or paid.
  ACTIVITY_KIND_TAX = 7;
  // A split, the units it added or removed.
  ACTIVITY_KIND_SPLIT = 8;
  // Another corporate action, as the custodian states it.
  ACTIVITY_KIND_CORPORATE_ACTION = 9;
  // Units or cash moved in from another account.
  ACTIVITY_KIND_TRANSFER_IN = 10;
  // Units or cash moved out to another account.
  ACTIVITY_KIND_TRANSFER_OUT = 11;
  // Cash paid into the account.
  ACTIVITY_KIND_CONTRIBUTION = 12;
  // Cash taken out of the account.
  ACTIVITY_KIND_WITHDRAWAL = 13;
  // A movement between the account's own positions or sub-accounts, as the
  // custodian journals it.
  ACTIVITY_KIND_JOURNAL = 14;
}

// An activity was recorded (W2.12): the whole record, so a reconciliation
// waiting on a cause re-runs its candidates without a second read. Also each
// item of a read (W2.11), as it was announced.
// A mirror of meridian.v1.ActivityRecordedEvent.
message ActivityRecordedEvent {
  string activity_id = 1;

  // The account it is on, and as the rail knows it.
  string account_id = 2;

  string external_account_id = 3;

  string source = 4;

  CustodialActivity activity = 5;

  int64 recorded_at_ns = 6;

  // The record's number in the street's partition, chained per account with
  // the activities before it, and who caused it (W2.12, W4.3).
  JournalRef journal = 7;

  ChangeCause cause = 8;
}

// One re-resolution as the street keeps it, beside the activity it names
// (W2.16): its own record, chained per account with the re-resolutions
// before it and apart from the activities, so activity-recorded keeps what
// it said at v14.
// A mirror of meridian.v1.ActivityReResolution.
message ActivityReResolution {
  // The activity it sits beside, and the account it is recorded against.
  string activity_id = 1;

  string account_id = 7;

  // The instrument the activity now resolves to, empty where unresolved
  // again, and how.
  string instrument_id = 2;

  Provenance provenance = 3;

  // When what resolves it was made, as the plugin sent it; when the street
  // recorded it, never back-dated.
  int64 resolved_at_ns = 4;

  int64 recorded_at_ns = 5;

  // Its own number in the street's partition, chained per account with the
  // re-resolutions before it.
  JournalRef journal = 6;
}

// A sync status was recorded (W2.13): the street heard a custody plugin's
// sync status (W2.1) and kept it, so operations tells a connection that needs
// a person to sign in again apart from data that is merely old. The whole
// record; also each item of a read (W2.14), as it was announced.
// A mirror of meridian.v1.SyncStatusRecordedEvent.
message SyncStatusRecordedEvent {
  // As the custody plugin published it, its account as the sidecar stamped
  // it: empty when the external account is not linked, and then delivered to
  // no plugin.
  SyncStatusEvent status = 1;

  int64 recorded_at_ns = 2;

  // The record's number in the street's partition, chained per account with
  // the sync statuses before it, and who caused it (W2.13, W4.3).
  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// How fresh a connected account's data is, as reported by the rail.
//
// And why, when it is not current. Published so an operator can tell stale
// data from absent data, which look identical on a holdings screen and mean
// completely different things. And "unhealthy" alone cannot say whose fix it
// is: a connection that needs a person to sign in again, one somebody
// disabled, and one that is a day late by design look the same as a flag and
// ask for three different things.
// A mirror of meridian.v1.SyncStatusEvent.
message SyncStatusEvent {
  string source = 1;

  // The account the external account is linked to (W6.4), set by the sidecar.
  // Empty when it is not linked.
  string account_id = 2;

  // When the rail last successfully synced this account from the institution.
  // Not when the data is as of: a venue a day late by design syncs today what
  // was true yesterday, which the two fields below say.
  int64 last_synced_at_ns = 3;

  // Whether the rail currently considers the connection healthy. A false here
  // with a recent last_synced_at_ns means the data is good but the connection
  // has since broken. `state` says why.
  bool connection_healthy = 4;

  // Rail-supplied text, for whatever `state` does not say. Diagnostic only;
  // nothing branches on it.
  string status_detail = 5;

  int64 observed_at_ns = 6;

  // The account as the rail knows it, which the sidecar translates.
  string external_account_id = 7;

  // Whether the data is current, and if not, why: which is also whose fix it
  // is and what the dashboard tells a deployment admin to do.
  SyncState state = 8;

  // When the holdings the rail serves are as of, and when the history
  // (transactions) is. Separately, because venues keep them apart and a
  // connection can have one current and the other not: SnapTrade reports
  // holdings to the minute and transactions by the day. Zero where the rail
  // does not say.
  int64 holdings_as_of_ns = 9;

  int64 history_as_of_ns = 10;

  // The first date the source can read the account's activity from, ISO
  // 8601 (contract v14, W2.10): how far back a backfill reaches, beside how
  // fresh the history is. Empty where the source does not say.
  string history_from = 11;
}

// The kind of claim holding an instrument gives. A closed list, ruled by the
// product owner (sdk-contract/asset-class-is-an-enum, 2026-09-28 and
// 2026-09-30); a class joins it by a ruling, never because a feed sent one.
// Spelled in text as the value's name without its prefix, lower case:
// `equity`, `debt`, `fund`, `derivative`, `crypto_asset`, `event_contract`,
// `cash`.
//
// What kind of instrument within a class is its instrument type
// (InstrumentType, contract v11), which grows one type at a time as a
// workflow needs it.
// A mirror of meridian.v1.AssetClass.
enum AssetClass {
  // No class. Held only by a stub minted from a deployment's miss (W3.4),
  // which may not know one; activating an instrument requires a class (W1.8).
  ASSET_CLASS_UNSPECIFIED = 0;
  // A share of ownership.
  ASSET_CLASS_EQUITY = 1;
  // Somebody owes the holder.
  ASSET_CLASS_DEBT = 2;
  // A share of a pool: ETFs and mutual funds among them.
  ASSET_CLASS_FUND = 3;
  // A contract whose value comes from something else: options and futures
  // among them.
  ASSET_CLASS_DERIVATIVE = 4;
  ASSET_CLASS_CRYPTO_ASSET = 5;
  // Pays on whether an event happens.
  ASSET_CLASS_EVENT_CONTRACT = 6;
  // A holding of a currency's cash instrument (spec/the-account-side-fits-every-venue).
  ASSET_CLASS_CASH = 7;
  // Contract v27 (W1.1; spec/a-public-rates-and-filings-data-plugin, Q3):
  // what the lake observes and nobody holds -- an interest rate, a rate
  // curve, an index -- following ISO 10962's category T. Never held: W9
  // refuses a position in one.
  ASSET_CLASS_REFERENTIAL = 8;
}

// What kind of instrument within its asset class (contract v11; the product
// owner, 2026-10-02: "Yes to put instrument type into v11 scope"). In the
// contract's own words, ISO 10962 (CFI) a reference and not the vocabulary;
// a type joins when a workflow needs it, each with its dictionary entry, and
// each is under one asset class. Spelled in text as the value's name without
// its prefix, lower case: `money_market_fund`.
// A mirror of meridian.v1.InstrumentType.
enum InstrumentType {
  // No type stated: the asset class says all the record says.
  INSTRUMENT_TYPE_UNSPECIFIED = 0;
  // Under fund: a fund that invests in short-term debt under SEC rule 2a-7
  // and aims to keep its value, with the attributes of MoneyMarketFund.
  // Held as a fund, never as cash, even where a custodian sweeps cash into it.
  INSTRUMENT_TYPE_MONEY_MARKET_FUND = 1;
  // Under event_contract (contract v19): a contract paying a fixed amount if
  // an event happens and nothing if it does not, with the attributes of
  // BinaryEventContract. A venue's YES and NO tokens are two instruments,
  // each one.
  INSTRUMENT_TYPE_BINARY_EVENT_CONTRACT = 2;
  // Under referential (contract v27; the rates slice): a reference rate --
  // SOFR, EFFR, €STR, an average, a bound of the FOMC range.
  INSTRUMENT_TYPE_INTEREST_RATE = 3;
  // Under referential (contract v27): a rate curve, one record whose points
  // are the lake's rows by tenor -- Treasury's par curves, the Board's zero
  // curve.
  INSTRUMENT_TYPE_RATE_CURVE = 4;
  // Under referential (contract v27): an index -- the SOFR Index.
  INSTRUMENT_TYPE_INDEX = 5;
  // Contract v28: Under derivative: a listed equity, ETF or index option, one
  // series a record, with the attributes of ListedOption.
  INSTRUMENT_TYPE_LISTED_OPTION = 6;
  // Contract v28: Under derivative: a listed future, one contract month a
  // record, with the attributes of FutureContract.
  INSTRUMENT_TYPE_FUTURE = 7;
  // Contract v28: Under derivative: an option whose underlying is a future
  // record, with the attributes of ListedOption.
  INSTRUMENT_TYPE_FUTURE_OPTION = 8;
  // Contract v28: Under referential: a commodity a future is written on, never
  // held.
  INSTRUMENT_TYPE_COMMODITY = 9;
  // Contract v29: under debt: a bond -- a Treasury, a STRIPS component, an
  // agency debenture or discount note, a corporate, a municipal; FIX
  // SecurityType (167) a field of Bond.
  INSTRUMENT_TYPE_BOND = 10;
  // Contract v29: under debt: an agency pass-through pool, with the attributes
  // of MbsPool; its factor the lake's.
  INSTRUMENT_TYPE_MBS_POOL = 11;
  // Contract v29: under debt: an agency TBA by program, coupon, term and
  // settlement month, with the attributes of Tba.
  INSTRUMENT_TYPE_TBA = 12;
  // Contract v29: under debt: an agency REMIC class, with the attributes of
  // CmoTranche.
  INSTRUMENT_TYPE_CMO_TRANCHE = 13;
  // Contract v29: under debt: a brokered certificate of deposit, with the
  // attributes of CertificateOfDeposit.
  INSTRUMENT_TYPE_CERTIFICATE_OF_DEPOSIT = 14;
}

// Why a resolution did not produce exactly one instrument; on a conflict
// (contract v19), whether a resolve met it.
// A mirror of meridian.v1.MissReason.
enum MissReason {
  MISS_REASON_UNSPECIFIED = 0;
  // No instrument matched.
  MISS_REASON_NOT_FOUND = 1;
  // More than one matched. Reported as a miss rather than resolved by picking,
  // because picking would be wrong about half the time and would be silent.
  MISS_REASON_AMBIGUOUS = 2;
}

// The canonical instrument record.
//
// Three time axes, and conflating any two of them produces a resolution bug
// that only appears when an identifier is reused:
//
//   reference time  the as-of a resolution is FOR. A query parameter, never a
//                   field here.
//   effective time  valid_from_ns -- when this mapping became true in the world.
//   record time     record_time_ns -- when the authority knew it.
//
// Identifiers get reused: a ticker freed by a delisting is later reassigned to
// a different instrument. A consumer resolving a historical date must key on
// effective time, not on when it happened to learn the mapping.
// A mirror of meridian.v1.InstrumentRecord.
message InstrumentRecord {
  // The record's key for life. On the platform's master, "INS-...", minted
  // by it (W1). In a deployment, the deployment's own (decisions/030): "LCL-"
  // for a record its instrument store minted (W3.7), which says who minted it
  // and nothing about whether it is resolved; or the "INS-" ID of a record
  // applied from the platform before contract v10, which it keeps. A global
  // ID the platform answers later joins `identifiers` (scheme
  // `open_meridian`), never replacing this. Never reused (decisions/034): a
  // retired, decommissioned or replaced record keeps its ID, and no other
  // record is ever given it, so a position or an order storing it names one
  // instrument for as long as it survives.
  string instrument_id = 1;

  // The full identifier set. An amend replaces this authoritatively.
  repeated Identifier identifiers = 2;

  AssetClass asset_class = 11;

  // ISO 4217.
  string currency = 4;

  // ISO 10383 market identifier code. Empty where there is no listing venue.
  // Deprecated from contract v18 for `listing_venue_id`, the venue master's
  // ID, of which the MIC is one identifier; read until the platform's and
  // the deployments' records carry venue IDs.
  string exchange_mic = 5;

  string description = 6;

  InstrumentLifecycleState lifecycle_state = 7;

  // Monotonic, assigned by the store, starting at 1. An apply carrying a
  // version at or below the one held is a no-op, which is what makes replica
  // application idempotent and overlapping pulls harmless.
  int64 version = 8;

  // Effective time. When this version's mapping became true.
  int64 valid_from_ns = 9;

  // Record time. Stamped by the store, never accepted from a caller: knowledge
  // cannot be back-dated.
  int64 record_time_ns = 10;

  // In a deployment (contract v10): where each value in force came from --
  // the asset class, the currency, the description and each identifier --
  // with the person who set or accepted it, or the plugin that reported it
  // (W3, requirement 1). Empty on the platform's master, whose changelog
  // says it (W1.7).
  repeated InstrumentValueSource sources = 12;

  // In a deployment (contract v10): values offered by a plugin's source
  // (W3.1) or the platform (W3.3), in force only when a person accepts one
  // (W3.10). A later offer never overwrites a value in force.
  repeated OfferedValue offers = 13;

  // Its type within its asset class (contract v11), in force once a person
  // set or accepted it, as the asset class is. Unspecified where none is.
  InstrumentType instrument_type = 14;

  // A money market fund's attributes (contract v11); set only on a record
  // whose type is money market fund.
  MoneyMarketFund money_market_fund = 15;

  // The venue it is listed on, the venue master's ID (contract v18): a
  // segment's venue where the listing is on one. Empty where it is listed
  // on no venue, or its venue is not yet known.
  string listing_venue_id = 16;

  // A binary event contract's attributes (contract v19); set only on a
  // record whose type is binary event contract.
  BinaryEventContract binary_event_contract = 17;

  // Contract v24 (W3.7; decisions/037, point 2 as amended 2026-10-14; the
  // one-ID model): the deployment's own local record -- the platform
  // unreachable, the request waiting for its staff, or, at the current
  // stage, no open identifier to ask by. It names its template, may be
  // incomplete, is a local line in the book, never priced, and an order on
  // it the escape hatch (W9.1, W11). False on a record named by the
  // platform's INS- ID, or keyed before v10.
  bool provisional = 18;

  // Contract v24 (W3.7, W3.24): the platform's template the record is held
  // to, a class's base template where its type has none; empty on a record
  // kept before v24 and not yet migrated, and on one whose source stated no
  // class ("class needed").
  string template_id = 19;

  // A published version, immutable; empty where template_id is.
  string template_version = 20;

  // Contract v24 (W3.7): each required field of its template the record
  // does not hold, by its path in the template (TemplateField.path); empty
  // on a complete record and on every INS- record the platform minted.
  // Never a gate on asking the platform.
  repeated string missing_fields = 21;

  // Contract v28: the series' full terms, so the record read alone is complete
  // (ruling 575); an adjustment is a new version of them, the INS- ID kept.
  // Unset unless the record's type is listed_option or future_option.
  ListedOption listed_option = 22;

  // Contract v28: one contract month's full terms. Unset unless the record's
  // type is future.
  FutureContract future = 23;

  // Contract v29: a bond's terms: a Treasury, STRIPS component, agency,
  // corporate, municipal or (booked, not minted) SSA bond (676). Unset unless
  // the record's type is bond.
  Bond bond = 24;

  // Contract v29: an agency pool's terms (680). Unset unless the record's type
  // is mbs_pool.
  MbsPool mbs_pool = 25;

  // Contract v29: an agency TBA's terms (681). Unset unless the record's type
  // is tba.
  Tba tba = 26;

  // Contract v29: an agency REMIC class's terms (682, 588). Unset unless the
  // record's type is cmo_tranche.
  CmoTranche cmo_tranche = 27;

  // Contract v29: a brokered CD's terms (676). Unset unless the record's type
  // is certificate_of_deposit.
  CertificateOfDeposit certificate_of_deposit = 28;

  // Retired in the domain message, and never reused.
  reserved 3;
}

// Lifecycle. The transition verbs are the commands; nothing sets this directly.
// A mirror of meridian.v1.InstrumentLifecycleState.
enum InstrumentLifecycleState {
  INSTRUMENT_LIFECYCLE_STATE_UNSPECIFIED = 0;
  // Identity exists, attributes may be incomplete. A holding can reference it,
  // which is the point: a position may arrive before anyone has decided what
  // the instrument is.
  INSTRUMENT_LIFECYCLE_STATE_DEFINE = 1;
  // Fully defined.
  INSTRUMENT_LIFECYCLE_STATE_ACTIVE = 2;
  // Retired. Existing holdings stay resolvable, because history does not stop
  // being true when an instrument stops trading.
  INSTRUMENT_LIFECYCLE_STATE_DECOMMISSIONED = 3;
  // Contract v28: A listed series past its last lifecycle date, marked by the
  // platform: still resolvable for a date it traded, never reused; never set
  // on a venue.
  INSTRUMENT_LIFECYCLE_STATE_EXPIRED = 4;
}

// Where a value in force on a deployment's record came from (W3,
// requirements 1 and 3).
// A mirror of meridian.v1.InstrumentValueSource.
message InstrumentValueSource {
  InstrumentField field = 1;

  // For INSTRUMENT_FIELD_IDENTIFIER: which identifier.
  Identifier identifier = 2;

  // In words, as the value was set with.
  string source = 3;

  // The person who set or accepted it: the deployment-local subject core
  // stamped from the command's envelope (W4.9), never typed. Empty for an
  // identifier a plugin reported, the platform's global ID, and a value
  // applied from the platform before contract v10.
  string person = 4;

  // The plugin instance whose resolve joined the identifier (W3.1). Empty
  // otherwise.
  string instance_id = 5;

  // When the store recorded it.
  int64 recorded_at_ns = 6;

  // Why a value held was changed, where given.
  string note = 7;

  // The delegation the person acted through, when they set or accepted the
  // value through a client -- an agent on the deployment's MCP surface --
  // rather than at the dashboard in a browser (W3.10, W6.20, contract v12):
  // stamped from the command's envelope (W4.9), never typed. Empty beside a
  // person at the dashboard, and wherever person is.
  string acting_through_delegation = 8;

  // The client's registered name, beside acting_through_delegation, as the
  // envelope carried it; empty whenever it is.
  string client_name = 9;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 10;
}

// Which value of a deployment's instrument record (W3, contract v10).
// A mirror of meridian.v1.InstrumentField.
enum InstrumentField {
  INSTRUMENT_FIELD_UNSPECIFIED = 0;
  INSTRUMENT_FIELD_ASSET_CLASS = 1;
  INSTRUMENT_FIELD_CURRENCY = 2;
  INSTRUMENT_FIELD_DESCRIPTION = 3;
  // One of its identifiers, named beside the field.
  INSTRUMENT_FIELD_IDENTIFIER = 4;
  // Contract v11.
  INSTRUMENT_FIELD_INSTRUMENT_TYPE = 5;
  INSTRUMENT_FIELD_MONEY_MARKET_FUND = 6;
  // Contract v19.
  INSTRUMENT_FIELD_BINARY_EVENT_CONTRACT = 7;
}

// A value offered for a deployment's record (W3.1, W3.3), shown beside its
// field and in force only when a person accepts it (W3.10).
// A mirror of meridian.v1.OfferedValue.
message OfferedValue {
  InstrumentValue value = 1;

  // The plugin instance whose source stated it. Empty for the platform's
  // answer and for an offer the store derives itself (ISO 4217 for an
  // `iso4217` identifier).
  string instance_id = 2;

  int64 offered_at_ns = 3;
}

// One value for a deployment's record, set or offered, with where it came
// from (W3.10, W3.1, W3.3).
// A mirror of meridian.v1.InstrumentValue.
message InstrumentValue {
  oneof value {
    // One of the closed list; never unspecified.
    AssetClass asset_class = 1;
    // An ISO 4217 code, three capital letters; never a pseudo-currency such
    // as BASE.
    string currency = 2;
    string description = 3;
    Identifier identifier = 4;
    // Contract v11: one under the record's asset class; never unspecified.
    InstrumentType instrument_type = 6;
    // Contract v11: on a money market fund only, each attribute stated.
    MoneyMarketFund money_market_fund = 7;
    // Contract v19: on a binary event contract only, its payout stated.
    BinaryEventContract binary_event_contract = 8;
  }

  // Where the value came from, in words: a statement, a prospectus, "ISO
  // 4217", "the platform, record INS-... version 3". Required on a value a
  // person sets.
  string source = 5;
}

// A money market fund's attributes, from SEC rule 2a-7 as amended in 2023
// (the product owner, 2026-10-02, the custody audit's Q4). Its observations
// -- its NAV on a day, its seven-day yield, its liquid assets, a fee imposed
// -- are the lake's, not the record's.
// A mirror of meridian.v1.MoneyMarketFund.
message MoneyMarketFund {
  MoneyMarketFundCategory category = 1;

  MoneyMarketFundInvestors investors = 2;

  MoneyMarketFundNav nav = 3;

  LiquidityFeeRegime liquidity_fee = 4;
}

// What a money market fund invests in.
// A mirror of meridian.v1.MoneyMarketFundCategory.
enum MoneyMarketFundCategory {
  MONEY_MARKET_FUND_CATEGORY_UNSPECIFIED = 0;
  // Cash, government securities and repurchase agreements backed by them.
  MONEY_MARKET_FUND_CATEGORY_GOVERNMENT = 1;
  // Also corporate short-term debt.
  MONEY_MARKET_FUND_CATEGORY_PRIME = 2;
  // Short-term municipal debt.
  MONEY_MARKET_FUND_CATEGORY_TAX_EXEMPT = 3;
}

// Whom a money market fund is offered to.
// A mirror of meridian.v1.MoneyMarketFundInvestors.
enum MoneyMarketFundInvestors {
  MONEY_MARKET_FUND_INVESTORS_UNSPECIFIED = 0;
  // Natural persons only.
  MONEY_MARKET_FUND_INVESTORS_RETAIL = 1;
  MONEY_MARKET_FUND_INVESTORS_INSTITUTIONAL = 2;
}

// How a money market fund prices its shares.
// A mirror of meridian.v1.MoneyMarketFundNav.
enum MoneyMarketFundNav {
  MONEY_MARKET_FUND_NAV_UNSPECIFIED = 0;
  // A stable share price of 1.00: the book takes its position as one lot at
  // stable value (W9.1).
  MONEY_MARKET_FUND_NAV_STABLE = 1;
  // A share price that floats with its holdings: lots like any fund.
  MONEY_MARKET_FUND_NAV_FLOATING = 2;
}

// When a money market fund charges a fee on redemptions.
// A mirror of meridian.v1.LiquidityFeeRegime.
enum LiquidityFeeRegime {
  LIQUIDITY_FEE_REGIME_UNSPECIFIED = 0;
  // Charged when daily net redemptions pass 5% of net assets: an
  // institutional prime or tax-exempt fund.
  LIQUIDITY_FEE_REGIME_MANDATORY = 1;
  // At the board's discretion, where in the fund's interest.
  LIQUIDITY_FEE_REGIME_DISCRETIONARY = 2;
  // No liquidity fee: a government fund that has not chosen one, which
  // neither of the others describes (contract v12).
  LIQUIDITY_FEE_REGIME_NONE = 3;
}

// A binary event contract's attributes (contract v19; plans/the-lake-prices-
// the-book, Q38): what it pays and when trading in it closes. Which outcome
// it pays on stays in its description, the venue's words, until the outcome
// is an observation (vL1c); the outcome and its settlement are not the
// record's.
// A mirror of meridian.v1.BinaryEventContract.
message BinaryEventContract {
  // What one contract pays if the event happens, naming its cash instrument:
  // 1 USD at Kalshi, 1 in the venue's USDC instrument at Polymarket. A
  // contract's price divided by this is its implied probability, a reader's
  // computation, never stored.
  Money payout = 1;

  // When trading in it closes, as the venue states it; 0 when it states none.
  int64 closes_at_ns = 2;

  // Contract v26 (W1.24; spec/the-contract-gaps-v26-and-v27-close, A4,
  // approved 2026-10-14): a range market's bounds, fields of the binary
  // event contract template's v26 version, never the group's. An open tail
  // has one bound only; neither set where the contract is no range.
  EventContractBound floor = 3;

  EventContractBound cap = 4;

  // The unit both bounds are in: an instrument's ID where the bound is a
  // price, otherwise the venue's unit word (`degrees_f`, `index_points`,
  // `percent`); empty where neither bound is set.
  string bound_unit = 5;

  // Contract 28, amended 2026-10-31 (W1.1; ruling 954): the venue's primary
  // category for the market, in its own words -- a Kalshi series' category,
  // a Polymarket or Polymarket US event's primary tag label -- 0 to 64
  // characters; empty where the venue states none. No platform enum.
  string category = 6;
}

// One bound of a range market (A4): Kalshi's `greater` and
// `greater_or_equal` are inclusive false and true.
// A mirror of meridian.v1.EventContractBound.
message EventContractBound {
  Decimal value = 1;

  bool inclusive = 2;
}

// Contract v28 (InstrumentRecord.listed_option): carries a listed option's
// terms.
// A mirror of meridian.v1.ListedOption.
message ListedOption {
  // The underlying's INS- record: an equity, a fund, an index, or for a
  // future_option a future record (FIX UnderlyingSecurityID, 309). Never
  // empty.
  string underlying_instrument_id = 1;

  // The right the holder has. Unspecified is refused.
  PutOrCall put_or_call = 2;

  // The price per unit of the underlying at which the option is exercised, as
  // listed; an adjusted strike is a new version. Never unset.
  Money strike_price = 3;

  // A plain date, YYYY-MM-DD, the expiration the series is listed for. Never
  // empty.
  string expiration_date = 4;

  // A plain date, YYYY-MM-DD. Empty until the platform's source states it: the
  // record is then incomplete, listing it.
  string last_trade_date = 5;

  // The style the series is listed with; the calculation package binds its
  // model by it (ruling 576). Unspecified is refused.
  ExerciseStyle exercise_style = 6;

  // Physical or cash, as listed. Unspecified is refused.
  SettlementMethod settlement_method = 7;

  // When the settlement value is fixed, which is where time to expiry counts
  // to (minutes over 525,600). Unspecified: the record is incomplete on a
  // cash-settled option, listing it.
  SettlementTime settlement_time = 8;

  // What one contract's premium is multiplied by: 100 on a standard equity
  // option; an adjustment may change it apart from the deliverable. Never
  // unset.
  Decimal contract_multiplier = 9;

  // Each instrument and its quantity, cash among them as its cash instrument's
  // quantity: 100 shares on a standard option, 150 after a 3-for-2 split,
  // shares and cash after a merger. None until the platform's source states
  // it: the record is then incomplete, listing it; a cash-settled option's
  // states its cash.
  repeated DeliverableComponent deliverable = 10;

  // The OCC root (SPX, SPXW, AAPL, AAPL1 once adjusted); on a future option,
  // the exchange's option product code. Never empty.
  string option_root = 11;

  // YYYYMM. Empty on a listed_option, and on a future option whose exchange
  // lists no serial month.
  string contract_month = 12;
}

// A mirror of meridian.v1.PutOrCall.
enum PutOrCall {
  // Refused.
  PUT_OR_CALL_UNSPECIFIED = 0;
  // A put: the right to sell the deliverable at the strike.
  PUT_OR_CALL_PUT = 1;
  // A call: the right to buy the deliverable at the strike.
  PUT_OR_CALL_CALL = 2;
}

// A mirror of meridian.v1.ExerciseStyle.
enum ExerciseStyle {
  // Refused.
  EXERCISE_STYLE_UNSPECIFIED = 0;
  // Exercisable on any business day to expiration.
  EXERCISE_STYLE_AMERICAN = 1;
  // Exercisable at expiration only.
  EXERCISE_STYLE_EUROPEAN = 2;
}

// A mirror of meridian.v1.SettlementMethod.
enum SettlementMethod {
  // Refused.
  SETTLEMENT_METHOD_UNSPECIFIED = 0;
  // The deliverable changes hands on exercise; for a future option, the
  // future.
  SETTLEMENT_METHOD_PHYSICAL = 1;
  // Cash against the settlement value on exercise.
  SETTLEMENT_METHOD_CASH = 2;
}

// A mirror of meridian.v1.SettlementTime.
enum SettlementTime {
  // Not stated: on a physically settled option, where it does not apply.
  SETTLEMENT_TIME_UNSPECIFIED = 0;
  // Settled on the expiration day's opening prints (SPX's monthly series).
  SETTLEMENT_TIME_AM = 1;
  // Settled on the expiration day's close (SPXW).
  SETTLEMENT_TIME_PM = 2;
}

// Contract v28 (ListedOption.deliverable): states what one contract delivers
// on exercise (ruling 559).
// A mirror of meridian.v1.DeliverableComponent.
message DeliverableComponent {
  // An INS- record: the underlying, another company's shares after a merger,
  // or a currency's cash instrument for cash. Never empty: a component naming
  // no instrument is refused.
  string instrument_id = 1;

  // 100 shares; 150 after a 3-for-2 split; for cash, the amount in the cash
  // instrument's major unit. Never unset.
  Decimal quantity = 2;
}

// Contract v28 (InstrumentRecord.future): carries a listed future's terms.
// A mirror of meridian.v1.FutureContract.
message FutureContract {
  // An index, an equity, a rate or a commodity's referential INS- record.
  // Never empty.
  string underlying_instrument_id = 1;

  // The exchange's code for the product every month of it shares (ES, CL).
  // Never empty.
  string product_code = 2;

  // YYYYMM. Never empty.
  string contract_month = 3;

  // A plain date, YYYY-MM-DD. Empty until the source states it: the record is
  // then incomplete.
  string last_trade_date = 4;

  // A plain date, YYYY-MM-DD: after it the platform marks the record expired
  // (ruling 579). Empty until the source states it: the record is then
  // incomplete.
  string final_settlement_date = 5;

  // Physical or cash, as listed. Unspecified is refused.
  SettlementMethod settlement_method = 6;

  // What a one-point move in the price is worth per contract: 50 USD on ES.
  // Never unset.
  Decimal contract_multiplier = 7;

  // A plain date, YYYY-MM-DD; the oms warns before it (W11.4), since v28 books
  // no delivery. Empty on a cash-settled future; on a physically delivered one
  // the record is incomplete until it is stated.
  string first_notice_date = 8;
}

// Contract v29 (InstrumentRecord.bond; 676): a bond's terms -- a Treasury, a
// STRIPS component, an agency debenture or discount note, a corporate, a
// municipal, or (booked, not minted) an SSA bond -- with FIX SecurityType (167)
// a field.
// A mirror of meridian.v1.Bond.
message Bond {
  // One of FIX's debt values, so one template carries every bond as FIX carries
  // every debt type in one instrument block (676). Never unspecified on a
  // record.
  DebtSecurityType security_type = 1;

  // The issuer's ENT- company record (W1.32); a STRIPS component's is its whole
  // bond's issuer. Never empty on a record.
  string issuer_company_id = 2;

  // One of six values, mapped to CDM's CollateralEntityTypeEnum; municipal and
  // sub-sovereign held apart because MSRB's rules and tax status follow
  // municipal. Never unspecified on a record.
  IssuerType issuer_type = 3;

  // The guarantor's ENT- company record. Empty where none guarantees it.
  string guarantor_company_id = 4;

  // An ISO 3166-1 alpha-2 country code, or ISO 3166-2 for a state: US-NY. Empty
  // where the platform's source states none.
  string governing_law = 5;

  // States where the bond was issued (FIX CountryOfIssue, 470): an ISO 3166-1
  // alpha-2 code. Empty until the platform's source states it.
  string country_of_issue = 6;

  // An ISO 3166-2 subdivision code without its country: NY. Empty on a bond
  // issued under no state.
  string state_or_province_of_issue = 7;

  // A plain date; a trade before it is when-issued (the reporting intent's
  // derived row). Never empty on a record.
  string issue_date = 8;

  // States the date interest accrues from (FIX DatedDate, 873): a plain date.
  // Empty until the source states it; a zero coupon's is its issue date.
  string dated_date = 9;

  // A plain date; a short or long first period follows from it and the dated
  // date. Empty on a zero coupon.
  string first_coupon_date = 10;

  // States when principal is repaid (FIX MaturityDate, 541): a plain date,
  // unadjusted. Never empty on a record.
  string maturity_date = 11;

  // The annual rate; on a floater the current period's rate is the engine's,
  // never stored here. 0 on a zero coupon; on a when-issued Treasury empty
  // until the auction, the record incomplete listing it, filled as a dated term
  // version (decisions/034).
  Decimal coupon_rate = 12;

  // States how the coupon is set (FIX CouponType, 1946): fixed, floating, zero
  // or step. Never unspecified on a record.
  CouponType coupon_type = 13;

  // Payments a year: 2 semi-annual, 12 monthly. 0 on a zero coupon.
  uint32 coupon_frequency = 14;

  // One of FIX 1950's values, its variant exact: a corporate's 30/360 bond
  // basis, a Treasury's actual/actual ICMA. Never unspecified on a record;
  // DAY_COUNT_ACT_ACT and DAY_COUNT_THIRTY_360, which name no variant, are
  // refused here.
  DayCount day_count = 15;

  // Following unless the terms say otherwise; accrual stays unadjusted.
  // Unspecified until stated.
  BusinessDayConvention business_day_convention = 16;

  // A CAL- calendar: the SIFMA US government securities calendar for a Treasury
  // or an agency. Empty until stated.
  string payment_calendar_id = 17;

  // True where a coupon date on a month's last day stays on each month's last
  // day. False: dates keep their day of month.
  bool end_of_month = 18;

  // The rule, its days in record_date_days. Unspecified until stated.
  RecordDateRule record_date_rule = 19;

  // Days before the payment date, as the rule counts them. 0 where the rule
  // needs no days.
  uint32 record_date_days = 20;

  // Face, in the record's currency. Unset until stated.
  Decimal minimum_denomination = 21;

  // Face, in the record's currency. Unset until stated.
  Decimal denomination_increment = 22;

  // Face, in the record's currency, at issue. Unset where not stated.
  Decimal original_issue_amount = 23;

  // Secured, senior or subordinated. Unspecified where not stated.
  Seniority seniority = 24;

  // True where sold under SEC Rule 144A. False: not a Rule 144A issue, or not
  // stated.
  bool rule_144a = 25;

  // True where sold under SEC Regulation S. False: not a Regulation S issue, or
  // not stated.
  bool reg_s = 26;

  // Its index, spread, multiplier, cap, floor, reset and lookback. Unset unless
  // the coupon type is floating; refused set otherwise.
  FloatingRateTerms floating = 27;

  // A referential index record: CPI-U for TIPS (31 CFR 356, Appendix B). Empty
  // unless the security type is TIPS.
  string inflation_index_instrument_id = 28;

  // The reference CPI the index ratio is taken against. Unset unless the
  // security type is TIPS.
  Decimal base_index_level = 29;

  // States a step-up's rates by date: each row a rate from its date. None
  // unless the coupon type is step.
  repeated CouponStep coupon_steps = 30;

  // Each row a window: kind, dates, price or make-whole spread, notice and
  // style; yield to worst reads every row. None on a bond the issuer may not
  // call; a callable bond minted without them is incomplete, listing them (the
  // plan's risk 3).
  repeated RedemptionWindow calls = 31;

  // States the holder's put schedule (679): each row a window, as calls. None
  // on a bond with no put.
  repeated RedemptionWindow puts = 32;

  // Each row a date, the face redeemed and its price. None on a bond with no
  // mandatory sinking fund.
  repeated SinkingFundPayment sinking_funds = 33;

  // Its tax status, bank qualification, obligor, insurer and refunding. Unset
  // on a bond that is no municipal.
  MunicipalTerms municipal = 34;

  // The whole bond's INS- record, a term on the record and never inferred.
  // Empty unless the security type is TINT or TPRN.
  string stripped_from = 35;
}

// Contract v29 (676): which kind of debt security a bond is, after FIX
// SecurityType (167).
// A mirror of meridian.v1.DebtSecurityType.
enum DebtSecurityType {
  // Refused.
  DEBT_SECURITY_TYPE_UNSPECIFIED = 0;
  // A US Treasury bill (FIX 167 TBILL), a zero coupon.
  DEBT_SECURITY_TYPE_TBILL = 1;
  // A US Treasury note (TNOTE).
  DEBT_SECURITY_TYPE_TNOTE = 2;
  // A US Treasury bond (TBOND).
  DEBT_SECURITY_TYPE_TBOND = 3;
  // A Treasury inflation-protected security (TIPS).
  DEBT_SECURITY_TYPE_TIPS = 4;
  // A floating rate note (FRN): a Treasury FRN indexed to the 13-week bill, or
  // an agency or corporate floater.
  DEBT_SECURITY_TYPE_FRN = 5;
  // A STRIPS interest component (TINT), a zero coupon.
  DEBT_SECURITY_TYPE_TINT = 6;
  // A STRIPS principal component (TPRN), a zero coupon.
  DEBT_SECURITY_TYPE_TPRN = 7;
  // A US agency coupon debenture (FAC).
  DEBT_SECURITY_TYPE_FAC = 8;
  // A US agency discount note (FADN).
  DEBT_SECURITY_TYPE_FADN = 9;
  // A corporate bond (CORP).
  DEBT_SECURITY_TYPE_CORP = 10;
  // A Yankee bond: a USD bond of a foreign issuer registered in the US (YANK).
  DEBT_SECURITY_TYPE_YANK = 11;
  // A municipal general obligation bond (GO).
  DEBT_SECURITY_TYPE_GO = 12;
  // A municipal revenue bond (REV).
  DEBT_SECURITY_TYPE_REV = 13;
  // A supranational bond (SUPRA); booked, its minting and curation wait for USD
  // EM (675).
  DEBT_SECURITY_TYPE_SUPRA = 14;
}

// Contract v29 (587, 677): the issuer's class, mapped to CDM's
// CollateralEntityTypeEnum.
// A mirror of meridian.v1.IssuerType.
enum IssuerType {
  // Refused.
  ISSUER_TYPE_UNSPECIFIED = 0;
  // A national government or its treasury: CDM SovereignCentralBank.
  ISSUER_TYPE_SOVEREIGN = 1;
  // A government agency or sponsored enterprise (FHLB, Farm Credit, Fannie Mae,
  // Freddie Mac, TVA, Ginnie Mae): CDM QuasiGovernment.
  ISSUER_TYPE_AGENCY = 2;
  // A supranational entity: CDM SupraNational.
  ISSUER_TYPE_SUPRANATIONAL = 3;
  // A state, province or region issuing outside a municipal regime: CDM
  // RegionalGovernment.
  ISSUER_TYPE_SUB_SOVEREIGN = 4;
  // A company: CDM Corporate.
  ISSUER_TYPE_CORPORATE = 5;
  // A US state or local issuer under MSRB's rules: CDM RegionalGovernment, held
  // apart on purpose.
  ISSUER_TYPE_MUNICIPAL = 6;
}

// Contract v29: how a coupon is set (FIX CouponType, 1946).
// A mirror of meridian.v1.CouponType.
enum CouponType {
  // Refused.
  COUPON_TYPE_UNSPECIFIED = 0;
  // A fixed rate (FIX CouponType 1946 = 1, fixed rate).
  COUPON_TYPE_FIXED = 1;
  // An index plus a spread, reset by `floating` (1946 = 2, floating rate).
  COUPON_TYPE_FLOATING = 2;
  // No coupon: a bill, a STRIPS component, a zero (1946 = 0, zero).
  COUPON_TYPE_ZERO = 3;
  // Fixed rates stepping on dates in `coupon_steps` (1946 = 3, structured).
  COUPON_TYPE_STEP = 4;
}

// The accrual basis (contract v27; widened at v29 to FIX CouponDayCount
// (1950)'s values, ruling 678), each mapped to CDM's DayCountFractionEnum
// where it has the value.
// A mirror of meridian.v1.DayCount.
enum DayCount {
  // Not stated by the source; refused on an instrument's terms.
  DAY_COUNT_UNSPECIFIED = 0;
  // Actual days over 360 (FIX CouponDayCount 1950 = 6; CDM ACT/360).
  DAY_COUNT_ACT_360 = 1;
  // Actual days over 365 (1950 = 7; CDM ACT/365.FIXED).
  DAY_COUNT_ACT_365_FIXED = 2;
  // Actual/actual as a rate's source states it, no variant named (v27's meaning
  // kept for rates; 678); refused on an instrument's terms.
  DAY_COUNT_ACT_ACT = 3;
  // 30/360 as a rate's source states it, no variant named (v27's meaning kept
  // for rates; 678); refused on an instrument's terms.
  DAY_COUNT_THIRTY_360 = 4;
  // Business days over 252 (1950 = 12; CDM has CAL/252, not BUS/252).
  DAY_COUNT_BUS_252 = 5;
  // 1/1 (1950 = 0; CDM 1/1).
  DAY_COUNT_ONE_ONE = 6;
  // 30/360, 30U/360 or bond basis (1950 = 1; CDM 30/360): a US corporate's or
  // agency's.
  DAY_COUNT_THIRTY_360_BOND_BASIS = 7;
  // 30/360 (SIA), with SIFMA's end-of-February rule (1950 = 2; no CDM value:
  // held more).
  DAY_COUNT_THIRTY_360_SIA = 8;
  // 30/360M (1950 = 3; no CDM value).
  DAY_COUNT_THIRTY_360_M = 9;
  // 30E/360, the Eurobond basis (1950 = 4; CDM 30E/360).
  DAY_COUNT_THIRTY_E_360 = 10;
  // 30E/360 (ISDA) (1950 = 5; CDM 30E/360.ISDA).
  DAY_COUNT_THIRTY_E_360_ISDA = 11;
  // Actual/actual (AFB) (1950 = 8; CDM ACT/ACT.AFB).
  DAY_COUNT_ACT_ACT_AFB = 12;
  // Actual/actual (ICMA) on the coupon period (1950 = 9; CDM ACT/ACT.ICMA): a
  // Treasury note's or bond's (31 CFR 356, Appendix B).
  DAY_COUNT_ACT_ACT_ICMA = 13;
  // Actual/actual (ICMA ultimo) (1950 = 10; no CDM value).
  DAY_COUNT_ACT_ACT_ICMA_ULTIMO = 14;
  // Actual/actual (ISDA) (1950 = 11; CDM ACT/ACT.ISDA).
  DAY_COUNT_ACT_ACT_ISDA = 15;
  // 30E+/360 (1950 = 13; no CDM value).
  DAY_COUNT_THIRTY_E_PLUS_360 = 16;
  // Actual/365L (1950 = 14; CDM ACT/365L).
  DAY_COUNT_ACT_365_L = 17;
  // NL/365, leap days left out (1950 = 15; no CDM value).
  DAY_COUNT_NL_365 = 18;
  // NL/360 (1950 = 16; no CDM value).
  DAY_COUNT_NL_360 = 19;
  // Actual/364 (1950 = 17; CDM ACT/364).
  DAY_COUNT_ACT_364 = 20;
}

// How a date rolls on its calendars.
// A mirror of meridian.v1.BusinessDayConvention.
enum BusinessDayConvention {
  BUSINESS_DAY_CONVENTION_UNSPECIFIED = 0;
  BUSINESS_DAY_CONVENTION_FOLLOWING = 1;
  BUSINESS_DAY_CONVENTION_MODIFIED_FOLLOWING = 2;
  BUSINESS_DAY_CONVENTION_PRECEDING = 3;
  BUSINESS_DAY_CONVENTION_NONE = 4;
}

// Contract v29: how a payment's record date is set.
// A mirror of meridian.v1.RecordDateRule.
enum RecordDateRule {
  // Not stated: the record is incomplete, listing it.
  RECORD_DATE_RULE_UNSPECIFIED = 0;
  // Record_date_days calendar days before each payment date (a corporate's 15th
  // of the month before).
  RECORD_DATE_RULE_CALENDAR_DAYS_BEFORE_PAYMENT = 1;
  // Record_date_days business days before each payment date, on the payment
  // calendar.
  RECORD_DATE_RULE_BUSINESS_DAYS_BEFORE_PAYMENT = 2;
  // The last calendar day of the month before the payment month, as agency
  // pools record holders.
  RECORD_DATE_RULE_LAST_DAY_OF_PRIOR_MONTH = 3;
}

// Contract v29: a bond's claim rank (CDM DebtSeniorityEnum).
// A mirror of meridian.v1.Seniority.
enum Seniority {
  // Not stated by the platform's source.
  SENIORITY_UNSPECIFIED = 0;
  // Secured: CDM DebtSeniorityEnum Secured.
  SENIORITY_SECURED = 1;
  // Senior unsecured: CDM Senior.
  SENIORITY_SENIOR = 2;
  // Subordinated: CDM Subordinated.
  SENIORITY_SUBORDINATED = 3;
}

// Contract v29: a floater's terms -- its index, spread, multiplier, cap, floor,
// reset and lookback (ARRC's in-arrears convention) -- on a bond or a tranche.
// A mirror of meridian.v1.FloatingRateTerms.
message FloatingRateTerms {
  // A referential record: SOFR, the 13-week bill's high rate (a Treasury FRN),
  // EFFR. Never empty when the terms are set.
  string index_instrument_id = 1;

  // Signed, added to the index times the multiplier. 0 is a value.
  Decimal spread_bps = 2;

  // Signed: negative on an inverse floater. Unset: 1.
  Decimal multiplier = 3;

  // States the most the rate may be: the cap. Unset: no cap.
  optional Decimal cap_rate = 4;

  // States the least the rate may be: the floor. Unset: no floor; 0 is a value
  // (a Treasury FRN's floor).
  optional Decimal floor_rate = 5;

  // Resets a year: 52 for a Treasury FRN's weekly reset, 4 quarterly. 0 until
  // stated.
  uint32 reset_frequency = 6;

  // Business days before each accrual day. 0: no lookback.
  uint32 lookback_days = 7;

  // True for a SOFR in-arrears floater. False: set in advance.
  bool in_arrears = 8;
}

// Contract v29: one row of a step-up bond's schedule (574's repeated group).
// A mirror of meridian.v1.CouponStep.
message CouponStep {
  // States when a step's rate starts: a plain date. Never empty.
  string from_date = 1;

  // The annual rate from from_date. Never unset.
  Decimal coupon_rate = 2;
}

// Contract v29 (679, 747): one row of a call or put schedule, as US
// prospectuses state optional redemption: its kind, dates, price or the
// make-whole's spread and benchmark, notice and style. One message for calls
// and puts.
// A mirror of meridian.v1.RedemptionWindow.
message RedemptionWindow {
  // Make-whole, par, premium or sinking fund; a put's is par or premium. Never
  // unspecified.
  RedemptionKind kind = 1;

  // A plain date, inclusive: the par call date opens the par window. Never
  // empty.
  string from_date = 2;

  // States when the window closes: a plain date, inclusive. Empty: to maturity.
  string to_date = 3;

  // Per 100 of face, before accrued. Unset on a make-whole window.
  optional Decimal price = 4;

  // Added to the benchmark to discount remaining payments, semi-annually on
  // 30/360, to the par call date (R2). Unset unless the kind is make-whole.
  optional Decimal make_whole_spread_bps = 5;

  // A rate_curve record: the H.15 Treasury constant maturities, interpolated to
  // the par call date. Empty unless the kind is make-whole.
  string make_whole_benchmark_instrument_id = 6;

  // Calendar days before the redemption date. 0 where not stated.
  uint32 notice_days_min = 7;

  // Calendar days before the redemption date. 0 where not stated.
  uint32 notice_days_max = 8;

  // One date, each coupon date, or any business day. Never unspecified.
  RedemptionStyle style = 9;
}

// Contract v29 (679): a redemption window's kind.
// A mirror of meridian.v1.RedemptionKind.
enum RedemptionKind {
  // Refused.
  REDEMPTION_KIND_UNSPECIFIED = 0;
  // The greater of par and the present value of the remaining payments at the
  // benchmark plus a spread, to the par call date (a corporate's make-whole).
  REDEMPTION_KIND_MAKE_WHOLE = 1;
  // At par, 100.
  REDEMPTION_KIND_PAR = 2;
  // At a stated price above par, stepping down by row.
  REDEMPTION_KIND_PREMIUM = 3;
  // An optional redemption at the sinking-fund price, beside the mandatory
  // schedule in sinking_funds.
  REDEMPTION_KIND_SINKING_FUND = 4;
}

// Contract v29 (679): when in its window a redemption may be made.
// A mirror of meridian.v1.RedemptionStyle.
enum RedemptionStyle {
  // Refused.
  REDEMPTION_STYLE_UNSPECIFIED = 0;
  // On from_date only.
  REDEMPTION_STYLE_ONE_DATE = 1;
  // On each coupon date from from_date to to_date.
  REDEMPTION_STYLE_BERMUDAN = 2;
  // On any business day from from_date to to_date, after its notice.
  REDEMPTION_STYLE_CONTINUOUS = 3;
}

// Contract v29 (679): one mandatory sinking-fund redemption.
// A mirror of meridian.v1.SinkingFundPayment.
message SinkingFundPayment {
  // States a mandatory redemption's date: a plain date. Never empty.
  string date = 1;

  // Face, in the record's currency. Never unset.
  Decimal face_amount = 2;

  // States the sinking-fund price: per 100 of face. Unset: par.
  Decimal price = 3;
}

// Contract v29: a municipal bond's terms, an optional group on bond (676).
// A mirror of meridian.v1.MunicipalTerms.
message MunicipalTerms {
  // States the federal tax status: exempt or taxable. Unspecified until stated.
  FederalTaxStatus federal_tax_status = 1;

  // True where interest is a preference item for the AMT. False: not subject to
  // the alternative minimum tax, or not stated.
  bool subject_to_amt = 2;

  // True where exempt in state_or_province_of_issue. False: not stated.
  bool state_tax_exempt = 3;

  // True where designated under IRC 265(b)(3). False: not bank qualified, or
  // not stated.
  bool bank_qualified = 4;

  // Names the conduit obligor: the obligor's ENT- record. Empty unless a
  // conduit issue.
  string obligor_company_id = 5;

  // Names the bond insurer: the insurer's ENT- record. Empty unless insured.
  string insurer_company_id = 6;

  // Set by a dated term version on the event (decisions/034), refunded_to_date
  // with it. Unspecified: none.
  RefundingStatus refunding_status = 7;

  // States the date a pre-refunded bond is redeemed on: a plain date. Empty
  // unless pre-refunded.
  string refunded_to_date = 8;
}

// Contract v29: a municipal's federal tax status.
// A mirror of meridian.v1.FederalTaxStatus.
enum FederalTaxStatus {
  // Not stated: the record is incomplete, listing it.
  FEDERAL_TAX_STATUS_UNSPECIFIED = 0;
  // Interest exempt from federal income tax.
  FEDERAL_TAX_STATUS_EXEMPT = 1;
  // Interest taxable federally (a taxable municipal).
  FEDERAL_TAX_STATUS_TAXABLE = 2;
}

// Contract v29: a municipal's refunding, a dated term version on the event
// (decisions/034).
// A mirror of meridian.v1.RefundingStatus.
enum RefundingStatus {
  // None stated.
  REFUNDING_STATUS_UNSPECIFIED = 0;
  // Pre-refunded: escrowed to a call date, refunded_to_date.
  REFUNDING_STATUS_PRE_REFUNDED = 1;
  // Escrowed to maturity.
  REFUNDING_STATUS_ESCROWED_TO_MATURITY = 2;
}

// Contract v29 (InstrumentRecord.mbs_pool; 680): an agency pass-through pool's
// terms. Its factor is the lake's Factor row (W10.4), never a term; lots stay
// in original face.
// A mirror of meridian.v1.MbsPool.
message MbsPool {
  // Fannie Mae, Freddie Mac or Ginnie Mae. Never unspecified.
  MortgageAgency agency = 1;

  // As the agency's disclosure names its prefix or program: UMBS 30-year,
  // Ginnie Mae II. Never empty.
  string program = 2;

  // The agency's pool number, also the record's agency_pool identifier. Never
  // empty.
  string pool_number = 3;

  // States the coupon passed to holders: the annual pass-through rate. Never
  // unset.
  Decimal pass_through_rate = 4;

  // States the pool's issue date: a plain date. Never empty.
  string issue_date = 5;

  // States the pool's final payment date: a plain date. Never empty.
  string maturity_date = 6;

  // Face at issue; current face is original face times the latest Factor row
  // (680). Unset until stated.
  Decimal original_face = 7;

  // States the loans' original term: months: 360, 180. 0 until stated.
  uint32 original_term_months = 8;

  // 30/360 bond basis for agency pools. Unspecified until stated.
  DayCount day_count = 9;

  // Days from the accrual period's start to payment: 55 for UMBS, 45 for Ginnie
  // Mae I, 50 for Ginnie Mae II. 0 until stated.
  uint32 payment_delay_days = 10;

  // 25 for UMBS, 15 for Ginnie Mae I, 20 for Ginnie Mae II, rolled on the
  // payment calendar. 0 until stated.
  uint32 payment_day = 11;

  // The last day of the month before the payment month for agency pools.
  // Unspecified until stated.
  RecordDateRule record_date_rule = 12;

  // Names the payment calendar: a CAL- calendar. Empty until stated.
  string payment_calendar_id = 13;
}

// Contract v29: the agency of a pool, a TBA or a REMIC class.
// A mirror of meridian.v1.MortgageAgency.
enum MortgageAgency {
  // Refused.
  MORTGAGE_AGENCY_UNSPECIFIED = 0;
  // Fannie Mae.
  MORTGAGE_AGENCY_FNMA = 1;
  // Freddie Mac.
  MORTGAGE_AGENCY_FHLMC = 2;
  // Ginnie Mae.
  MORTGAGE_AGENCY_GNMA = 3;
}

// Contract v29 (InstrumentRecord.tba; 681): an agency TBA by agency or program,
// coupon, term and settlement month, held as a forward in original face until a
// tba allocation record names the pools delivered.
// A mirror of meridian.v1.Tba.
message Tba {
  // Fannie Mae or Freddie Mac for a UMBS TBA (either delivers), Ginnie Mae for
  // its own. Never unspecified.
  MortgageAgency agency = 1;

  // UMBS 30-year, UMBS 15-year, Ginnie Mae II 30-year. Never empty.
  string program = 2;

  // The pass-through rate the delivered pools carry. Never unset.
  Decimal pass_through_rate = 3;

  // States the term: 360 or 180. Never 0.
  uint32 original_term_months = 4;

  // YYYYMM; the settlement date is SIFMA's class date in it. Never empty.
  string settlement_month = 5;

  // Which of SIFMA's monthly class dates it settles on. Unspecified until
  // stated.
  SifmaSettlementClass sifma_class = 6;

  // A plain date from SIFMA's calendar; pools are notified 48 hours before.
  // Empty until SIFMA publishes the month's date.
  string settlement_date = 7;
}

// Contract v29 (681): which of SIFMA's monthly class dates a TBA settles on.
// A mirror of meridian.v1.SifmaSettlementClass.
enum SifmaSettlementClass {
  // Not stated: the record is incomplete, listing it.
  SIFMA_SETTLEMENT_CLASS_UNSPECIFIED = 0;
  // SIFMA class A: 30-year UMBS.
  SIFMA_SETTLEMENT_CLASS_A = 1;
  // SIFMA class B: 15-year UMBS and Ginnie Mae.
  SIFMA_SETTLEMENT_CLASS_B = 2;
  // SIFMA class C: 30-year Ginnie Mae.
  SIFMA_SETTLEMENT_CLASS_C = 3;
  // SIFMA class D: balloons and ARMs.
  SIFMA_SETTLEMENT_CLASS_D = 4;
}

// Contract v29 (InstrumentRecord.cmo_tranche; 682, 588): an agency REMIC
// class's terms, book-first: held, valued and paid down from the agency's
// published factors. No waterfall model is held.
// A mirror of meridian.v1.CmoTranche.
message CmoTranche {
  // Fannie Mae, Freddie Mac or Ginnie Mae (agency REMICs only, 588). Never
  // unspecified.
  MortgageAgency agency = 1;

  // The series as the agency's prospectus supplement names it: 2024-12. Never
  // empty.
  string deal = 2;

  // As the prospectus supplement names it: PA, Z, IO. Never empty.
  string class_name = 3;

  // Each as the supplement's principal-type column lists it. None until stated.
  repeated PrincipalType principal_types = 4;

  // Each as the supplement's interest-type column lists it; a Z's accretion and
  // an IO's notional fall are accretion records (W9.16). None until stated.
  repeated InterestType interest_types = 5;

  // Face at issue, or an IO's original notional. Unset until stated.
  Decimal original_face = 6;

  // States a fixed class's coupon: the annual rate. 0 on a PO; unset on a
  // floater, whose rate floating sets.
  Decimal coupon_rate = 7;

  // Carries a floater's index, multiplier, cap and floor: as on a bond. Unset
  // unless a floater or an inverse floater.
  FloatingRateTerms floating = 8;

  // States the deal's closing date: a plain date. Never empty.
  string issue_date = 9;

  // States the class's final distribution date: a plain date. Empty until
  // stated.
  string maturity_date = 10;

  // States the accrual basis: as the supplement states it. Unspecified until
  // stated.
  DayCount day_count = 11;

  // Days from the accrual period's start to payment. 0: no delay (a floater
  // often has none).
  uint32 payment_delay_days = 12;

  // Rolled on the payment calendar. 0 until stated.
  uint32 payment_day = 13;

  // States the class's record date rule: as the supplement states it.
  // Unspecified until stated.
  RecordDateRule record_date_rule = 14;

  // States the record date's offset: days before the payment date. 0 where the
  // rule needs none.
  uint32 record_date_days = 15;
}

// Contract v29 (682): a REMIC class's principal type, as the prospectus
// supplement's principal-type column lists it.
// A mirror of meridian.v1.PrincipalType.
enum PrincipalType {
  // Refused.
  PRINCIPAL_TYPE_UNSPECIFIED = 0;
  // Sequential pay.
  PRINCIPAL_TYPE_SEQUENTIAL = 1;
  // Planned amortization class.
  PRINCIPAL_TYPE_PAC = 2;
  // Targeted amortization class.
  PRINCIPAL_TYPE_TAC = 3;
  // Support (companion) class.
  PRINCIPAL_TYPE_SUPPORT = 4;
  // Notional: no principal, an IO's balance a notional amount.
  PRINCIPAL_TYPE_NOTIONAL = 5;
}

// Contract v29 (682): a REMIC class's interest type, as the prospectus
// supplement's interest-type column lists it.
// A mirror of meridian.v1.InterestType.
enum InterestType {
  // Refused.
  INTEREST_TYPE_UNSPECIFIED = 0;
  // Fixed rate.
  INTEREST_TYPE_FIXED = 1;
  // Floating rate, by `floating`.
  INTEREST_TYPE_FLOATER = 2;
  // Inverse floater: a negative multiplier in `floating`.
  INTEREST_TYPE_INVERSE_FLOATER = 3;
  // Interest only.
  INTEREST_TYPE_IO = 4;
  // Principal only.
  INTEREST_TYPE_PO = 5;
  // Accrual (Z): interest accretes to face until it pays.
  INTEREST_TYPE_Z = 6;
}

// Contract v29 (InstrumentRecord.certificate_of_deposit; 676): a brokered
// certificate of deposit's terms.
// A mirror of meridian.v1.CertificateOfDeposit.
message CertificateOfDeposit {
  // Its ENT- record, its FDIC certificate number an identifier there. Never
  // empty.
  string issuer_company_id = 1;

  // States the issue date: a plain date. Never empty.
  string issue_date = 2;

  // States the maturity: a plain date. Never empty.
  string maturity_date = 3;

  // States the rate: the annual rate. 0 on a zero-coupon CD.
  Decimal coupon_rate = 4;

  // Payments a year. 0 on a CD paying at maturity.
  uint32 coupon_frequency = 5;

  // As the disclosure states it, often actual/365 fixed. Unspecified until
  // stated.
  DayCount day_count = 6;

  // States how a payment date moves: following unless stated. Unspecified until
  // stated.
  BusinessDayConvention business_day_convention = 7;

  // Names the payment calendar: a CAL- calendar. Empty until stated.
  string payment_calendar_id = 8;

  // Face, in the record's currency. Unset until stated.
  Decimal minimum_denomination = 9;

  // True where the disclosure states FDIC insurance, to the FDIC's limit per
  // depositor and bank. False: not stated as insured.
  bool deposit_insured = 10;

  // States the bank's call schedule: each row a window. None on a non-callable
  // CD.
  repeated RedemptionWindow calls = 11;

  // True where an estate may redeem at par on the holder's death. False: none,
  // or not stated.
  bool survivor_option = 12;
}

// The only thing holdings are recorded against. A plugin creates one only by
// linking an external account to a new one, acting for a deployment admin in
// a session opened by Manage (W6.4).
// A mirror of meridian.v1.AccountRecord.
message AccountRecord {
  string account_id = 1;

  string name = 2;

  AccountState state = 3;

  int64 created_at_ns = 4;

  // Free text, optional, and searchable as the name is (W6.3). Where the
  // account is held, e.g. "Fidelity". At most 200 characters.
  string custodian = 5;

  // What the account is, e.g. "Roth IRA". At most 200 characters.
  string account_type = 6;

  // One ownership or grouping label, e.g. "Fund I". At most 200 characters.
  string owner = 7;

  // Anything else worth knowing about it. At most 2,000 characters.
  string note = 8;
}

// A mirror of meridian.v1.AccountState.
enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  ACCOUNT_STATE_OPEN = 1;
  // Closed, not deleted: an account is the subject of records that outlive it.
  ACCOUNT_STATE_CLOSED = 2;
}

// A mirror of meridian.v1.OpeningSource.
message OpeningSource {
  OpeningSourceKind kind = 1;

  // The custodian or system as it is known in the deployment (the external
  // account's institution, the prior system's name).
  string name = 2;

  // ISO 8601: the date the source's figures are as of.
  string as_of_date = 3;

  PositionBasis basis = 4;

  // The street records it was composed from, by value (decisions/012).
  repeated StreetRecordRef street_records = 5;
}

// A mirror of meridian.v1.OpeningSourceKind.
enum OpeningSourceKind {
  OPENING_SOURCE_KIND_UNSPECIFIED = 0;
  OPENING_SOURCE_KIND_CUSTODIAN = 1;
  OPENING_SOURCE_KIND_PRIOR_SYSTEM = 2;
}

// A mirror of meridian.v1.PositionBasis.
enum PositionBasis {
  POSITION_BASIS_UNSPECIFIED = 0;
  POSITION_BASIS_TRADE_DATE = 1;
  POSITION_BASIS_SETTLE_DATE = 2;
}

// A street record named by value: never a key the book follows.
// A mirror of meridian.v1.StreetRecordRef.
message StreetRecordRef {
  string statement_id = 1;

  // The custodial position's change, where one was compared or used.
  JournalRef change = 2;

  // ISO 8601: the custodian's as-of date.
  string as_of_date = 3;
}

// A mirror of meridian.v1.OpeningPosition.
message OpeningPosition {
  string instrument_id = 1;

  HoldingSide side = 2;

  Decimal trade_date_quantity = 3;

  // Required (v9): where the source states none, a person supplies it.
  // Unset, the opening balance is refused (REFUSAL_REASON_INCOMPLETE).
  optional Decimal settled_quantity = 4;

  // Each with its value date; with the settled quantity they account for
  // the whole trade-date quantity, or the balance is refused.
  repeated PendingSettlement pending = 5;

  // As reported and completed by a person, each with its quantity, cost and
  // acquisition date; required but on cash, which sends none (v9).
  repeated OpeningLot lots = 6;
}

// A mirror of meridian.v1.PendingSettlement.
message PendingSettlement {
  // ISO 8601. Required at an opening balance (v9); empty on a position only
  // for "date not stated", from a v8 opening balance or an adjustment the
  // street gave no date for.
  string value_date = 1;

  Decimal quantity = 2;

  PendingState state = 3;
}

// A mirror of meridian.v1.PendingState.
message PendingState {
  bool failing = 1;

  // As reported.
  string fail_reason = 2;

  // ISO 8601; the date it is now expected; the bucket keeps its intended
  // date ("Three more considerations", 2).
  string expected_date = 3;
}

// A mirror of meridian.v1.OpeningLot.
message OpeningLot {
  Decimal quantity = 1;

  LotTerms terms = 2;
}

// A mirror of meridian.v1.LotTerms.
message LotTerms {
  // Each unset where not known; never derived one from the other. A lot the
  // book opens carries its cost and acquisition date (v9): an opening
  // balance or an adjustment without either is refused
  // (REFUSAL_REASON_INCOMPLETE); a lot a v8 book opened may lack them.
  optional Money unit_cost = 1;

  optional Money cost = 2;

  string acquired_date = 3;

  // Apart from acquisition, for wash-sale tacking; empty is the acquired
  // date.
  string holding_period_start = 4;

  string settlement_date = 5;

  LotSource source = 6;
}

// A mirror of meridian.v1.LotSource.
enum LotSource {
  LOT_SOURCE_UNSPECIFIED = 0;
  // As the opening balance's source reported it (Q2).
  LOT_SOURCE_OPENING_BALANCE = 1;
  // Opened by an adjustment resolving a break (Q28). Step 5 adds the
  // book's own trade, slice D a transfer in.
  LOT_SOURCE_ADJUSTMENT = 2;
  // A lot a reported fill opens (W11.13; contract v22).
  LOT_SOURCE_EXECUTION = 3;
}

// What a journal entry records beside its JournalRef and ChangeCause.
// A mirror of meridian.v1.EntryMeta.
message EntryMeta {
  // Minted by the book.
  string entry_id = 1;

  // An open list a reader takes as data (Q19): in v8 opening-balance,
  // placeholder-moved (instrument-merged from v10), figures-recorded, break-recorded, break-handled,
  // break-resolved, break-closed, adjustment, reversal, attribute-set; from
  // v22 order-proposed, order-recorded, order-released, execution-recorded
  // among the order path's (W11.13).
  string kind = 2;

  Actor actor = 3;

  // The time on the message that caused it, and when the book received it;
  // when it committed is the cause's committed_at_ns.
  int64 event_time_ns = 4;

  int64 received_at_ns = 5;

  // ISO 8601: the business date it stands for.
  string effective_date = 6;

  // The control partition's sequence in force (decisions/024's note).
  uint64 control_sequence = 7;

  // Each instrument it names, with the reference record's version in force
  // when it was recorded; none where the store has no version (Q31).
  repeated ReferenceVersion reference_versions = 8;

  // Required on a justified act: an opening balance, an adjustment, a
  // reversal, a resolution, handling, an attribute.
  string reason = 9;

  // The breaks it records, handles, resolves or closes.
  repeated string break_ids = 10;

  // The key the plugin sent the command with, where it sent one (Q12 of the
  // sample operations plugin, ruled 2026-10-01).
  string idempotency_key = 11;
}

// Who made a change (step 5's requirement 28, landed with v8). Set by the
// book from the envelope the sidecar stamped (W4.9), never by a plugin.
// A mirror of meridian.v1.Actor.
message Actor {
  oneof kind {
    // A person the sidecar vouched for, by the deployment-local subject
    // W6.1 records.
    PersonActor person = 1;
    // A finding reported with no user: the plugin instance that sent it;
    // the book's own act (a merged record followed) leaves it empty.
    SystemActor system = 2;
    // A service account a plugin's autonomous work acted as, whose call the
    // dashboard admitted (W4.15, W9.8; contract v21), from the envelope the
    // sidecar stamped. Never a person, nor the plugin's own finding.
    ServiceAccountActor service_account = 3;
    // The venue, through the connectivity plugin reporting what it did
    // (W11.2, W11.9 to W11.12; step 5's Q24; contract v22): a fact, never a
    // person's act, and never refused for the state it arrives in.
    VenueActor venue = 4;
  }
}

// A mirror of meridian.v1.PersonActor.
message PersonActor {
  string subject = 1;

  // The delegation the person acted through, and the client's registered
  // name, as the sidecar stamped them beside the person (W4.9, decisions/029;
  // contract v10). Empty for a person at the dashboard in a browser, and on
  // every act recorded before v10. The person stays the actor.
  string delegation_id = 2;

  string client_name = 3;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 4;
}

// A mirror of meridian.v1.SystemActor.
message SystemActor {
  string instance_id = 1;
}

// A service account that answered for an act (W9.8, contract v21).
// A mirror of meridian.v1.ServiceAccountActor.
message ServiceAccountActor {
  // Its `SA-` subject, as the sidecar stamped it (W4.9).
  string subject = 1;

  // The deployment-local subject of the person answerable for it when it
  // acted, as the sidecar stamped it; a later change of owner leaves it as
  // it was.
  string owner_subject = 2;

  // The algorithm the service account's call named, one of the
  // identifiers the plugin's version declares (PluginDeclaration.algorithms;
  // W4.9, W4.15; v21's Q16, the order-path plan's refresh, Q24; contract
  // v22): copied by the book from the envelope (MessageMeta.algorithm_id),
  // where the sidecar stamped it from the claims after checking it. Stable
  // across versions, so `reporting` reads it for the decision-maker and
  // executor a regime asks for. Empty where the call named none, and before
  // v22.
  string algorithm_id = 3;
}

// The venue an act is a fact of (W11, contract v22).
// A mirror of meridian.v1.VenueActor.
message VenueActor {
  // The connectivity plugin instance that reported it, as its sidecar
  // stamped it.
  string instance_id = 1;

  // The venue, the venue master's ID, where the plugin names it; empty
  // where it does not.
  string venue_id = 2;
}

// A mirror of meridian.v1.ReferenceVersion.
message ReferenceVersion {
  string instrument_id = 1;

  // The InstrumentRecord's version (W3.6).
  int64 version = 2;
}

// A mirror of meridian.v1.BookPosition.
message BookPosition {
  string account_id = 1;

  string instrument_id = 2;

  HoldingSide side = 3;

  // Settled plus pending, by construction; plus not stated where a v8
  // opening balance opened that bucket.
  Decimal trade_date_quantity = 4;

  // Unset only while some of the quantity is in the not-stated bucket a v8
  // opening balance opened: unknown, never zero.
  optional Decimal settled_quantity = 5;

  // Zero on every position v9 records.
  Decimal not_stated_quantity = 6;

  repeated PendingSettlement pending = 7;

  // Open lots; their open quantities sum to trade_date_quantity, cash
  // excepted.
  repeated Lot lots = 8;

  // The opening balance's sources, with their as-of and basis.
  repeated OpeningSource opened_from = 9;

  // The business date of its last change.
  string effective_date = 10;

  JournalRef last_change = 11;

  // A tombstone, after a merged record's move (W9.9): returned only to a
  // read since a watermark, and delivered once.
  bool removed = 12;

  // What of it cannot move, as the operations plugin last recorded it from
  // a statement (W9.15): an attribute, never a movement.
  repeated Encumbrance encumbrances = 14;

  // Derived, never reported: the quantity on free_basis less its
  // encumbrances. Unset while that quantity is unknown (some not stated).
  optional Decimal free_quantity = 15;

  FreeBasis free_basis = 16;

  // The sleeve within the account (W9's invariants; the order-path plan's
  // refresh, Q33; contract v22): a position is keyed by account,
  // instrument, side and sleeve. Empty for the account's unsleeved part, as
  // every position before v22 is.
  string sleeve = 17;

  // Retired in the domain message, and never reused.
  reserved 13;
  reserved "placeholder";
}

// A mirror of meridian.v1.Lot.
message Lot {
  // Minted by the book.
  string lot_id = 1;

  Decimal open_quantity = 2;

  Decimal original_quantity = 3;

  // As opened, with each basis adjustment applied.
  LotTerms terms = 4;

  JournalRef opened_by = 5;

  repeated JournalRef relieved_by = 6;

  repeated JournalRef adjusted_by = 7;

  // Its position's sleeve (contract v22); empty for the unsleeved part.
  string sleeve = 8;

  // Contract v27 (W9.10; rulings 320 and 396): each relief of the lot, in
  // order, with what the quantity relieved was sold for, so a reader
  // computes realized P&L; the book stores nothing derived. Empty for a lot
  // never relieved, and for a relief before v27 the upgrade could not
  // backfill from its execution.
  repeated LotRelief reliefs = 9;
}

// One relief of a lot (contract v27; W9.10).
// A mirror of meridian.v1.LotRelief.
message LotRelief {
  // The entry that relieved it, also listed in Lot.relieved_by.
  JournalRef relieved_by = 1;

  // The quantity relieved, positive.
  Decimal quantity = 2;

  // What that quantity was sold for, in the execution's asset, fees apart
  // as the execution states them; unset for a relief with no execution
  // behind it (a transfer out, a correction), never zero.
  Money proceeds = 3;

  // ISO 8601: the execution's trade date; empty with no execution.
  string trade_date = 4;
}

// One encumbrance of a position, as the book holds it.
// A mirror of meridian.v1.Encumbrance.
message Encumbrance {
  // PLEDGED to OTHER only; the street's PENDING, REHYPOTHECATED and
  // BORROWED are refused.
  EncumbranceKind kind = 1;

  // Signed as the position's quantity.
  Decimal quantity = 2;

  string pledgee = 3;

  string held_at = 4;

  // Unset where the source names none.
  MarginAgreementRef agreement = 5;

  // The source's code, verbatim; required for OTHER.
  string source_code = 6;

  string detail = 7;

  // The statement it was recorded from.
  StreetRecordRef source = 8;

  // Set by the book: the business date it was first recorded under its
  // kind, pledgee, location and agreement, and the change that last set it.
  string since_date = 9;

  JournalRef set_by = 10;
}

// A mirror of meridian.v1.MarginAgreementRef.
message MarginAgreementRef {
  oneof agreement {
    // Step 4: the statement's external account and segment (Q12). An
    // agreement the book records under a template arrives as another arm.
    StatementSegmentRef statement_segment = 1;
  }
}

// A mirror of meridian.v1.StatementSegmentRef.
message StatementSegmentRef {
  string external_account_id = 1;

  // As the venue names it; empty for the account as a whole.
  string segment = 2;

  // As reported: the external account's institution.
  string counterparty = 3;
}

// The basis a position's free quantity is computed on.
// A mirror of meridian.v1.FreeBasis.
enum FreeBasis {
  FREE_BASIS_UNSPECIFIED = 0;
  // Settled: a pledged or lent security that has not settled cannot be
  // delivered either (the product owner, 2026-10-01, Q2). The book's
  // default, and in v8 its only basis.
  FREE_BASIS_SETTLED = 1;
  FREE_BASIS_TRADE_DATE = 2;
}

// A mirror of meridian.v1.Break.
message Break {
  string break_id = 1;

  string account_id = 2;

  oneof subject {
    PositionKey position = 3;
    FigureKey figure = 4;
  }

  BreakCategory category = 5;

  repeated BreakDifference differences = 6;

  Watermark book_watermark = 7;

  StreetRecordRef street = 8;

  // ISO 8601 business dates; age is derived from them, never stored.
  string first_seen_date = 9;

  string last_seen_date = 10;

  BreakState state = 11;

  repeated BreakCause candidate_causes = 12;

  BreakCause confirmed_cause = 13;

  BreakHandling handling = 14;

  BreakResolution resolution = 15;

  Actor recorded_by = 16;

  JournalRef last_change = 17;

  // An unrecognized security's identifiers, as the street row carries them
  // (W9.3, contract v25): what an open break of that category is matched
  // on, scheme and value in any order, with its category and account.
  // Empty on every other break.
  repeated Identifier unresolved_identifiers = 18;
}

// A mirror of meridian.v1.PositionKey.
message PositionKey {
  string instrument_id = 1;

  HoldingSide side = 2;
}

// A mirror of meridian.v1.FigureKey.
message FigureKey {
  MarginAgreementRef agreement = 1;

  // The figure, by its field's name in the data dictionary.
  string figure = 2;

  // For a collateral balance: its instrument.
  string instrument_id = 3;
}

// A mirror of meridian.v1.BreakCategory.
enum BreakCategory {
  BREAK_CATEGORY_UNSPECIFIED = 0;
  BREAK_CATEGORY_TRADE_DATE_QUANTITY = 1;
  BREAK_CATEGORY_SETTLED_QUANTITY = 2;
  BREAK_CATEGORY_COST_OR_LOTS = 3;
  BREAK_CATEGORY_SETTLED_AGAINST_PENDING = 4;
  BREAK_CATEGORY_BOOK_ONLY = 5;
  BREAK_CATEGORY_STREET_ONLY = 6;
  // A figure the book holds a value of its own for, such as the street's
  // available and not available against the book's position, or an
  // encumbrance against the book's of that kind, location and pledgee.
  BREAK_CATEGORY_FIGURE = 7;
  // Contract v24 (W9.3; the one-ID model, ruled 2026-10-14): a statement row
  // the street kept unresolved because its source is thinner than an
  // instrument record's minimum (W3.7). No instrument and no position: the
  // break names the street record by value. ISO 15022/20022's DSEC.
  BREAK_CATEGORY_UNRECOGNIZED_SECURITY = 8;
}

// A mirror of meridian.v1.BreakDifference.
message BreakDifference {
  // The field, by its name in the data dictionary ("settled_quantity",
  // "lots[2].terms.cost").
  string field = 1;

  BreakValue book = 2;

  BreakValue street = 3;
}

// One side of a difference; unset: absent on that side.
// A mirror of meridian.v1.BreakValue.
message BreakValue {
  oneof value {
    Decimal quantity = 1;
    Money amount = 2;
    string text = 3;
  }
}

// A mirror of meridian.v1.BreakState.
enum BreakState {
  BREAK_STATE_UNSPECIFIED = 0;
  BREAK_STATE_OPEN = 1;
  BREAK_STATE_RESOLVED = 2;
  BREAK_STATE_CLOSED = 3;
}

// The item found to cause a break, linked by value (Q23's target).
// A mirror of meridian.v1.BreakCause.
message BreakCause {
  BreakCauseCategory category = 1;

  oneof item {
    StreetRecordRef street_record = 2;
    JournalRef book_entry = 3;
    PendingSettlementRef pending_settlement = 4;
    // A corporate action's reference, as reported.
    string event_reference = 5;
    bool none_found = 6;
    // The custodian's activity that explains it (contract v14).
    ActivityRef activity = 8;
    // The date read's check of a pending value date (W3.20, W9.4; contract
    // v22): beside BREAK_CAUSE_CATEGORY_VALUE_DATE_NOT_BUSINESS_DAY.
    DateCheck date_check = 9;
  }

  string note = 7;
}

// A mirror of meridian.v1.BreakCauseCategory.
enum BreakCauseCategory {
  BREAK_CAUSE_CATEGORY_UNSPECIFIED = 0;
  BREAK_CAUSE_CATEGORY_UNBOOKED_TRADE = 1;
  BREAK_CAUSE_CATEGORY_SETTLEMENT_TIMING = 2;
  BREAK_CAUSE_CATEGORY_COST_OR_PRICE = 3;
  BREAK_CAUSE_CATEGORY_CORPORATE_ACTION = 4;
  BREAK_CAUSE_CATEGORY_FAIL = 5;
  BREAK_CAUSE_CATEGORY_CUSTODIAN_ERROR = 6;
  BREAK_CAUSE_CATEGORY_UNKNOWN = 7;
  // Income the custodian reinvested in units, which the book has not
  // booked: a money market fund's monthly dividend (contract v14).
  BREAK_CAUSE_CATEGORY_INCOME_REINVESTED = 8;
  // A pending value date that is not a business day on its calendars
  // (W9.4; spec/settlement-calendars-are-core-reference-data, requirement 14
  // and Q9; contract v22): the cause names the date read's check
  // (BreakCause.date_check). The book never moves the date itself.
  BREAK_CAUSE_CATEGORY_VALUE_DATE_NOT_BUSINESS_DAY = 9;
}

// A mirror of meridian.v1.PendingSettlementRef.
message PendingSettlementRef {
  string instrument_id = 1;

  HoldingSide side = 2;

  string value_date = 3;
}

// An activity the street recorded (W2.12), named by value: never a key the
// book follows, and recorded as given (decisions/012).
// A mirror of meridian.v1.ActivityRef.
message ActivityRef {
  // The street's identifier for the activity.
  string activity_id = 1;

  // Its record in the street's partition.
  JournalRef change = 2;

  // ISO 8601: the activity's trade date, as the custodian stated it.
  string trade_date = 3;
}

// What the date read found of one date (W3.20, W9.4; the calendars spec's
// requirement 14; contract v22): the date, the calendars and their versions
// it was checked on, and why the day is closed.
// A mirror of meridian.v1.DateCheck.
message DateCheck {
  // ISO 8601.
  string date = 1;

  // Each calendar it was checked on, with its version.
  repeated CalendarRef calendars = 2;

  // Why the day is closed.
  DateCheckReason reason = 3;

  // On a holiday: its name as the source gives it.
  string holiday_name = 4;
}

// Why a date is not a business day (the calendars spec's requirement 14;
// contract v22).
// A mirror of meridian.v1.DateCheckReason.
enum DateCheckReason {
  DATE_CHECK_REASON_UNSPECIFIED = 0;
  // A weekend day on one of the calendars, not listed open.
  DATE_CHECK_REASON_WEEKEND = 1;
  // A closed day listed on one of the calendars, with its name.
  DATE_CHECK_REASON_HOLIDAY = 2;
  // Outside a calendar's coverage: not known, never a business day.
  DATE_CHECK_REASON_OUTSIDE_COVERAGE = 3;
}

// A mirror of meridian.v1.BreakHandling.
message BreakHandling {
  // A user the deployment knows (W6.1): one granted write on the account
  // through the plugin, or the person taking it (Q11 of the sample
  // operations plugin, ruled 2026-10-01).
  string owner_subject = 1;

  // The operations plugin's own levels; core gives them no meaning.
  uint32 escalation_level = 2;

  // ISO 8601.
  string due_date = 3;
}

// A mirror of meridian.v1.BreakResolution.
message BreakResolution {
  // Resolved: the entries that corrected the book.
  repeated JournalRef entries = 1;

  // Closed: the explanation, no entry.
  string explanation = 2;

  Actor actor = 3;

  string reason = 4;

  // Closed as cleared: the street record where the difference was gone (Q2
  // of the sample operations plugin, ruled 2026-10-01).
  StreetRecordRef cleared_at = 5;
}

// The record: one per account, agreement and business date.
// A mirror of meridian.v1.AccountFigures.
message AccountFigures {
  string account_id = 1;

  string business_date = 2;

  MarginAgreementRef agreement = 3;

  StatementFigures figures = 4;

  repeated ReportedPositionValue position_values = 5;

  StreetRecordRef source = 6;

  JournalRef last_change = 7;
}

// The custodian's, labelled as such (Q8, revised and ruled); never a
// position's own.
// A mirror of meridian.v1.ReportedPositionValue.
message ReportedPositionValue {
  string instrument_id = 1;

  HoldingSide side = 2;

  optional Money market_value = 3;

  optional Money margin_requirement = 4;
}

// A mirror of meridian.v1.AccountAttributes.
message AccountAttributes {
  string account_id = 1;

  // ISO 4217 until the money revision names an asset
  // (sdk-contract/money-names-an-asset-not-only-an-iso-currency).
  string base_currency_code = 2;

  LotReliefMethod lot_relief_default = 3;

  JournalRef last_change = 4;

  // The standing opening balance, set by the book when it journals W9.1;
  // unset while none stands (Q21 of the sample operations plugin, ruled
  // 2026-10-01).
  OpeningBalance opening_balance = 5;

  // Whether a release waits until every compliance plugin covering the
  // account has answered on the order's version (W9.13, W11.6; step 5's Q5;
  // contract v22). True for a new account and for every account the book
  // held at the upgrade, recorded so (decisions/031); the book always
  // states it, so false is a deployment admin's act with its reason.
  bool waits_for_compliance = 6;

  // Contract v24 (W9.13; the order-path plan's v24 item 10): a booking may
  // allocate to it without the instruction naming it, each allocation
  // carrying its reason and ErrorCause and raising an alert (W11.27,
  // W11.34). A deployment admin's mark; unmarking is recorded, and past
  // allocations keep their flag.
  bool error_account = 7;

  // Contract v24 (W9.13; the order-path plan's v24 item 7): a block order's
  // account, with no statement to reconcile against, flat once booked; a
  // balance left after booking holds the booking (W11.28).
  bool allocation_account = 8;

  // Contract v26 (W9.13, W12.2; ruling 316, 2026-10-18): the platform's ID
  // of the base currency's cash instrument, which the book resolves from
  // base_currency_code when the base is set and keeps; empty while the
  // instrument store has not resolved the code. What the analytics
  // component values an account in.
  string base_cash_instrument_id = 9;
}

// A mirror of meridian.v1.LotReliefMethod.
enum LotReliefMethod {
  LOT_RELIEF_METHOD_UNSPECIFIED = 0;
  LOT_RELIEF_METHOD_FIRST_IN_FIRST_OUT = 1;
  LOT_RELIEF_METHOD_LAST_IN_FIRST_OUT = 2;
  LOT_RELIEF_METHOD_HIGHEST_COST = 3;
  LOT_RELIEF_METHOD_LOWEST_COST = 4;
  LOT_RELIEF_METHOD_AVERAGE_COST = 5;
}

// The account's standing opening balance, set by the book when it journals
// W9.1 and cleared when it is reversed (Q21 of the sample operations plugin,
// ruled 2026-10-01): its entry, D0 and sources, read on the account's
// attributes (W9.14).
// A mirror of meridian.v1.OpeningBalance.
message OpeningBalance {
  string entry_id = 1;

  // ISO 8601: D0.
  string as_of_date = 2;

  // As recorded, the street records it was composed from among them.
  repeated OpeningSource sources = 3;

  Actor recorded_by = 4;

  JournalRef journal = 5;

  // The reason the person gave.
  string reason = 6;
}

// A mirror of meridian.v1.AgreementFigures.
message AgreementFigures {
  MarginAgreementRef agreement = 1;

  // As the street recorded them (W2.2), its segment equal to the
  // agreement's.
  StatementFigures figures = 2;

  // On the set with no segment only.
  repeated ReportedPositionValue position_values = 3;
}

// One position's encumbrances, as a statement states them: the whole set,
// empty when the statement reports none.
// A mirror of meridian.v1.PositionEncumbrances.
message PositionEncumbrances {
  string instrument_id = 1;

  HoldingSide side = 2;

  repeated Encumbrance encumbrances = 3;
}

// Step 5's non-order transaction's first kind (Q28). Slice D adds the
// cash-flow class and the other kinds as fields of their own (Q20).
// A mirror of meridian.v1.Adjustment.
message Adjustment {
  // After the opening balance's date.
  string effective_date = 1;

  repeated MovementLine lines = 2;

  repeated BasisAdjustment basis_adjustments = 3;

  // A corporate action's reference, as reported, where it records one; from
  // contract v14, the activity's identifier (W2.12) where the adjustment was
  // proposed from the custodian's activity.
  string event_reference = 4;
}

// A mirror of meridian.v1.MovementLine.
message MovementLine {
  // The deployment's instrument record, a currency's cash instrument
  // included.
  string instrument_id = 1;

  HoldingSide side = 2;

  SettlementBucket bucket = 3;

  // ISO 8601; on a pending line, empty only on an adjustment the street gave
  // no date for; may be years out.
  string value_date = 4;

  // Signed as the position's quantity is, and added to it.
  Decimal quantity = 5;

  // The lot it adds to or relieves. Empty on a line that opens a lot, whose
  // identifier the book mints, and on the account's base currency, which has
  // no lots: from v24 every other currency opens lots with base-currency
  // basis (option (c), W11.13).
  string lot_id = 6;

  // Set on the line that opens a lot, and only there: unset on a line that
  // adds to or relieves a lot, or on the account's base currency.
  LotTerms opens_lot = 7;

  // A pending line's fail, where its source reports one.
  PendingState pending_state = 8;

  // The sleeve within the account it moves (W9's invariants, the order-path
  // plan's refresh, Q33; step 5's requirement 59; contract v22): a cash
  // line's too. Empty for the account's unsleeved part, and on every line
  // before v22.
  string sleeve = 9;
}

// A mirror of meridian.v1.SettlementBucket.
enum SettlementBucket {
  // Refused.
  SETTLEMENT_BUCKET_UNSPECIFIED = 0;
  SETTLEMENT_BUCKET_SETTLED = 1;
  // Pending settlement on the line's value date. With no value date on an
  // adjustment the street gave no date for, or on a line a v8 opening
  // balance recorded ("date not stated").
  SETTLEMENT_BUCKET_PENDING = 2;
  // The source did not say whether it is settled or pending: only on a line
  // a v8 opening balance recorded. Refused from v9.
  SETTLEMENT_BUCKET_NOT_STATED = 3;
}

// A mirror of meridian.v1.BasisAdjustment.
message BasisAdjustment {
  string lot_id = 1;

  oneof cost {
    // Added to the lot's cost; signed. Only on a lot whose cost is known.
    Money cost_change = 2;
    // The lot's cost, stated where it was unknown: a lot a v8 book opened
    // with no cost, given its cost once it is known. Only on a lot whose cost
    // is unknown; from v9 the book opens none.
    Money stated_cost = 4;
  }

  // Where it moves; empty is unchanged.
  string holding_period_start = 3;
}

// Names the entry it reverses; the book negates its lines, at that entry's
// effective date.
// A mirror of meridian.v1.Reversal.
message Reversal {
  string entry_id = 1;
}

// A mirror of meridian.v1.ResolvedByEntries.
message ResolvedByEntries {
  repeated string entry_ids = 1;
}

// A mirror of meridian.v1.Side.
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
  // With the locate it names (Order.locate_id, W11.18).
  SIDE_SELL_SHORT = 3;
  SIDE_SELL_SHORT_EXEMPT = 4;
}

// A mirror of meridian.v1.OrderType.
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
  ORDER_TYPE_STOP = 3;
  ORDER_TYPE_STOP_LIMIT = 4;
  // An RFQ order: from contract v27 its quotes and outcomes are on its RFQ
  // placement (W11.40, W11.41), the buy side as initiator only.
  ORDER_TYPE_REQUEST_FOR_QUOTE = 5;
}

// One leg of an order (step 5's Q26).
// A mirror of meridian.v1.Leg.
message Leg {
  string instrument_id = 1;

  Side side = 2;

  // FIX's LegRatioQty (623).
  Decimal ratio = 3;

  // Contract v28: as option brokers require it: buy to open, sell to close; on
  // a package, per leg. Unspecified on an instrument that is no option or
  // future.
  PositionEffect position_effect = 4;
}

// A mirror of meridian.v1.PositionEffect.
enum PositionEffect {
  // Not stated: an instrument that is no option or future; refused on an
  // option or a future.
  POSITION_EFFECT_UNSPECIFIED = 0;
  // Opens or adds to a position.
  POSITION_EFFECT_OPEN = 1;
  // Closes or reduces a position.
  POSITION_EFFECT_CLOSE = 2;
}

// `portfolio`'s allocation instruction (principle 1; FIX's
// AllocationInstruction).
// A mirror of meridian.v1.AllocationInstruction.
message AllocationInstruction {
  repeated AllocationLine lines = 1;
}

// One account's part of an allocation instruction.
// A mirror of meridian.v1.AllocationLine.
message AllocationLine {
  string account_id = 1;

  // The amount, or, where weighted, unset.
  optional Decimal quantity = 2;

  // A weighted line's share, 0 to 1.
  optional Decimal weight = 3;

  // Slice B's, with the allocation; carried empty until then.
  string sleeve = 4;
}

// A mirror of meridian.v1.TimeInForce.
enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_DAY = 1;
  TIME_IN_FORCE_GOOD_TILL_CANCELLED = 2;
  TIME_IN_FORCE_GOOD_TILL_DATE = 3;
  // With a kill time.
  TIME_IN_FORCE_GOOD_TILL_TIME = 4;
  TIME_IN_FORCE_IMMEDIATE_OR_CANCEL = 5;
  TIME_IN_FORCE_FILL_OR_KILL = 6;
  TIME_IN_FORCE_AT_THE_OPEN = 7;
  TIME_IN_FORCE_AT_THE_CLOSE = 8;
}

// For a broker's order, set by the `oms`.
// A mirror of meridian.v1.Capacity.
enum Capacity {
  CAPACITY_UNSPECIFIED = 0;
  CAPACITY_AGENCY = 1;
  CAPACITY_PRINCIPAL = 2;
  CAPACITY_RISKLESS_PRINCIPAL = 3;
  CAPACITY_MIXED = 4;
}

// Whether an order was received from a client (Q23).
// A mirror of meridian.v1.OrderDirection.
enum OrderDirection {
  // The firm's own order, unmarked.
  ORDER_DIRECTION_UNSPECIFIED = 0;
  // A client's order, proposed by the `portfolio` intake standing for the
  // client's portfolio manager.
  ORDER_DIRECTION_RECEIVED = 1;
}

// A party to an order or an execution, as delivered (requirements 30, 55).
// After FIX's Parties (PartyID 448, PartyIDSource 447, PartyRole 452).
// A mirror of meridian.v1.Party.
message Party {
  // Its identifiers as delivered, each with its scheme.
  repeated Identifier identifiers = 1;

  // Its LEI, where given (requirement 55).
  string lei = 2;

  PartyRole party_role = 3;

  // Its contact as delivered (requirement 30).
  string contact = 4;
}

// A party's role on an order or an execution.
// A mirror of meridian.v1.PartyRole.
enum PartyRole {
  PARTY_ROLE_UNSPECIFIED = 0;
  // The client, as delivered.
  PARTY_ROLE_CLIENT = 1;
  // The counterparty, where known.
  PARTY_ROLE_COUNTERPARTY = 2;
  // Contract v29: the firm a trade is given up to for TRACE (6730(c)(9); FIX
  // PartyRole 14).
  PARTY_ROLE_GIVE_UP_FIRM = 3;
  // Contract v29: the contra side's introducing broker (6730(c)(10)).
  PARTY_ROLE_INTRODUCING_BROKER = 4;
}

// A precision a time was stated in (the order-path plan's refresh, Q38).
// A mirror of meridian.v1.TimePrecision.
enum TimePrecision {
  TIME_PRECISION_UNSPECIFIED = 0;
  TIME_PRECISION_SECOND = 1;
  TIME_PRECISION_MILLISECOND = 2;
  TIME_PRECISION_MICROSECOND = 3;
  TIME_PRECISION_NANOSECOND = 4;
}

// The quote at time of receipt, held as stated (requirement 56; the
// refresh's Q35).
// A mirror of meridian.v1.ReceiptQuote.
message ReceiptQuote {
  optional Money bid = 1;

  optional Money ask = 2;

  ReceiptQuoteSourceKind source_kind = 3;

  // With RECEIPT_QUOTE_SOURCE_KIND_VENUE: the venue, its `VEN-` ID.
  string venue_id = 4;

  int64 quoted_at_ns = 5;

  // The sizes (FIX's BidSize, 134, and OfferSize, 135).
  optional Decimal bid_size = 6;

  optional Decimal ask_size = 7;

  // The lake row it was read from, optional: its dataset and row key.
  string dataset = 8;

  string row_key = 9;
}

// Which quote a quote at time of receipt is (the refresh's Q35, as refined
// and ruled 2026-10-12; the values spelled with the enum's prefix, the
// order-path plan's protos, point 9, ruled 2026-10-12).
// A mirror of meridian.v1.ReceiptQuoteSourceKind.
enum ReceiptQuoteSourceKind {
  RECEIPT_QUOTE_SOURCE_KIND_UNSPECIFIED = 0;
  // The consolidated best bid and offer across venues, the quote Rule 605's
  // statistics reference.
  RECEIPT_QUOTE_SOURCE_KIND_CONSOLIDATED = 1;
  // One named venue's, its `VEN-` ID beside it.
  RECEIPT_QUOTE_SOURCE_KIND_VENUE = 2;
}

// The link on a child order (W11.1; Q41), or, from contract v27, on a
// member of a net order, naming the net as its parent.
// A mirror of meridian.v1.OrderLink.
message OrderLink {
  OrderLinkKind kind = 1;

  string parent_order_id = 2;
}

// The named links (W11.1; step 5's link 1, Q6; the refresh's Q41): split
// from v22, net from v27. Allocation, street order, two-way quote,
// alternatives and basket join with their slices; a block names its members
// on the block order (v24).
// A mirror of meridian.v1.OrderLinkKind.
enum OrderLinkKind {
  ORDER_LINK_KIND_UNSPECIFIED = 0;
  // A child order an `ems` (or the `oms`) worked out of its parent.
  ORDER_LINK_KIND_SPLIT = 1;
  // Contract v27 (W11.1; the gaps spec's D2): a member of a net order, set
  // by the book on each member when the `oms` proposes the net, naming it
  // as the parent.
  ORDER_LINK_KIND_NET = 2;
}

// The standard execution instructions (step 6's requirement 12; FIX's
// ExecInst, tag 18), set by the `oms`; a venue's own parameters are never
// here.
// A mirror of meridian.v1.ExecutionInstruction.
enum ExecutionInstruction {
  EXECUTION_INSTRUCTION_UNSPECIFIED = 0;
  EXECUTION_INSTRUCTION_NOT_HELD = 1;
  EXECUTION_INSTRUCTION_DO_NOT_REDUCE = 2;
  EXECUTION_INSTRUCTION_DO_NOT_INCREASE = 3;
  EXECUTION_INSTRUCTION_REDUCE_ONLY = 4;
  // Self-match prevention, honoured by the connectivity plugin with the
  // venue's own identifier and instruction (step 5, "Self-match and
  // wash-trade prevention").
  EXECUTION_INSTRUCTION_SELF_MATCH_PREVENTION = 5;
}

// What one unit of a price is (contract v18; widened at v29 for fixed
// income, ruling 685, as FIX PriceType (423) states it). Unspecified is
// refused on a Price, and read as per unit on a Trade, a Quote, an order and
// an execution, so every row and record before v29 stands.
// A mirror of meridian.v1.PriceBasis.
enum PriceBasis {
  // Refused on a Price; per unit elsewhere, as before v29.
  PRICE_BASIS_UNSPECIFIED = 0;
  // Per unit of the subject.
  PRICE_BASIS_PER_UNIT = 1;
  // Contract v29: per 100 of face, clean, a Money in the instrument's currency
  // (FIX PriceType 423 = 1; TRACE's and FINRA's price).
  PRICE_BASIS_PERCENT_OF_PAR = 2;
  // Contract v29: a yield, in the row's yield, its money price unset where the
  // source states none (423 = 9; a when-issued trade before its auction).
  PRICE_BASIS_YIELD = 3;
  // Contract v29: a spread in basis points over benchmark_instrument_id, in the
  // row's spread fields (423 = 6).
  PRICE_BASIS_SPREAD = 4;
}

// Contract v29 (ruling 685; W10.4, W11.1): a yield as its source quotes it,
// a v27 Rate-shaped value -- its value in percent, its convention and its
// kind after FIX YieldType (235) -- never computed by the plugin.
// A mirror of meridian.v1.QuotedYield.
message QuotedYield {
  // A percent: 4.312 percent is 4.312, never 0.04312. Never unset.
  UnitValue value = 1;

  // Semi-annual bond-equivalent for a US Treasury, corporate or agency; its day
  // count the instrument's. Never unset.
  RateConvention convention = 2;

  // To maturity, call, put or worst, current, or discount. Unspecified is
  // refused.
  YieldKind kind = 3;

  // States the date a yield to a call or put is to: a plain date. Empty unless
  // the kind is to call or to put, or to worst where worst is a call.
  string to_date = 4;
}

// A value with its unit (contract v27, the lake's rates slice;
// spec/the-lake-holds-researchs-kinds, shared addition 3 and Q8;
// spec/a-public-rates-and-filings-data-plugin, §1 item 2): a Decimal that is
// not money, in base units, with its unit from a closed list or, for a
// physical unit, its UCUM code. A 3.87 per cent fixing is 3.87 percent, never
// a Money.
// A mirror of meridian.v1.UnitValue.
message UnitValue {
  Decimal value = 1;

  ValueUnit unit = 2;

  // For VALUE_UNIT_INDEX, the index's base period as its publisher states
  // it (`2015=100`); empty otherwise.
  string index_base = 3;

  // For VALUE_UNIT_UCUM, the physical unit's UCUM code (`Cel`, `[bbl_us]`);
  // empty otherwise.
  string ucum_code = 4;
}

// The closed list of units a UnitValue takes (contract v27).
// A mirror of meridian.v1.ValueUnit.
enum ValueUnit {
  // Refused.
  VALUE_UNIT_UNSPECIFIED = 0;
  VALUE_UNIT_PERCENT = 1;
  VALUE_UNIT_BASIS_POINTS = 2;
  VALUE_UNIT_SHARES = 3;
  VALUE_UNIT_CONTRACTS = 4;
  // A face amount, in its currency's major unit.
  VALUE_UNIT_PRINCIPAL = 5;
  VALUE_UNIT_RATIO = 6;
  VALUE_UNIT_COUNT = 7;
  VALUE_UNIT_DAYS = 8;
  // An index level, with its base period in index_base.
  VALUE_UNIT_INDEX = 9;
  // A physical unit, named by ucum_code.
  VALUE_UNIT_UCUM = 10;
}

// How a rate accrues (FDP item 1).
// A mirror of meridian.v1.RateConvention.
message RateConvention {
  DayCount day_count = 1;

  Compounding compounding = 2;

  // For COMPOUNDING_COMPOUNDED, the periods a year (2 for a semi-annual
  // bond-equivalent yield); 0 otherwise.
  uint32 periods_per_year = 3;
}

// A mirror of meridian.v1.Compounding.
enum Compounding {
  // Refused.
  COMPOUNDING_UNSPECIFIED = 0;
  COMPOUNDING_SIMPLE = 1;
  COMPOUNDING_COMPOUNDED = 2;
  COMPOUNDING_CONTINUOUS = 3;
  COMPOUNDING_DISCOUNT = 4;
}

// Contract v29: what a quoted yield is to, after FIX YieldType (235).
// A mirror of meridian.v1.YieldKind.
enum YieldKind {
  // Refused.
  YIELD_KIND_UNSPECIFIED = 0;
  // To maturity (FIX YieldType 235 MATURITY).
  YIELD_KIND_TO_MATURITY = 1;
  // To the call date in to_date (CALL).
  YIELD_KIND_TO_CALL = 2;
  // To the put date in to_date (PUT).
  YIELD_KIND_TO_PUT = 3;
  // To the lower of call and maturity, MSRB G-15's disclosed yield (WORST).
  YIELD_KIND_TO_WORST = 4;
  // The coupon over the price (CURRENT).
  YIELD_KIND_CURRENT = 5;
  // A bill's bank-discount rate (a Treasury bill's quote).
  YIELD_KIND_DISCOUNT = 6;
}

// An order (W11.1, W11.2): its identity (account, instrument, side) never
// changes (Q20); each field set by its owner (step 5, "The order's fields").
// A mirror of meridian.v1.Order.
message Order {
  // `ORD-` and a ULID, minted by the book; never reused (decisions/035).
  string order_id = 1;

  string account_id = 2;

  string instrument_id = 3;

  // The sleeve within the account (ruled 2026-10-10); empty for the
  // account's unsleeved part.
  string sleeve = 4;

  Side side = 5;

  // On a short: the prime's locate ID on a locate record in the book
  // (W11.18), which `compliance` checks at release by its own logic.
  string locate_id = 6;

  // The ordered quantity, or, where the order is for an amount, its cash
  // quantity: exactly one is set, as FIX's OrderQty (38) and CashOrderQty
  // (152) are alternatives (ruled 2026-10-12).
  Decimal quantity = 7;

  Money cash_quantity = 8;

  OrderType order_type = 9;

  Money limit_price = 10;

  // A stop or stop-limit order's trigger (FIX's StopPx, tag 99).
  Money stop_price = 40;

  // On a pair: the dealt currency, by its cash instrument's ID.
  string dealt_currency = 11;

  // Contract v23 (W11.1): on an FX order, the pair's quote currency by its
  // cash instrument's ID, so with the order's instrument, the base
  // currency's, it names the pair; a limit or stop is in it.
  string quote_currency = 44;

  // A slot of optional legs (FX swaps, spreads; step 5's Q26).
  repeated Leg legs = 12;

  // `portfolio`'s: accounts with amounts or weights. At release it sums to
  // the ordered quantity, or, unset, the whole is in the order's own account
  // (principle 1; REFUSAL_REASON_ALLOCATION_UNBALANCED). A child order
  // carries none: its parent's governs (Q47).
  AllocationInstruction allocation_instruction = 13;

  // Set by the `oms`, on its proposal or by a change (W11.3).
  TimeInForce time_in_force = 14;

  // ISO 8601: a good-till-date order's date (FIX's ExpireDate, tag 432);
  // and a good-till-time order's kill time (FIX's ExpireTime, tag 126).
  string expire_date = 41;

  int64 expire_time_ns = 42;

  // The standard execution instructions, set by the `oms` (FIX's ExecInst,
  // tag 18).
  repeated ExecutionInstruction execution_instructions = 43;

  // How a sale relieves lots: the method, or the lots it names; unset, the
  // account's lot_relief_default (W9.13, W11.13).
  LotReliefMethod lot_relief_method = 15;

  repeated string relieve_lot_ids = 16;

  Capacity capacity = 17;

  OrderDirection direction = 18;

  // The client, as delivered, with its LEI where given.
  repeated Party parties = 19;

  // Entered by, from the actor; decided by, where it differs (requirement
  // 29).
  PersonRoles person_roles = 20;

  // The reporting fields its decision owns (requirements 55, 56; the
  // refresh's Q36): stored as stated, core reporting nothing.
  string customer_id = 21;

  string firm_designated_id = 22;

  repeated string handling_instructions = 23;

  int64 received_at_ns = 24;

  TimePrecision received_precision = 25;

  ReceiptQuote quote_at_receipt = 26;

  // The orders a firm's order represents, recorded and not checked (Q37).
  repeated string represents_order_ids = 27;

  // Slice C's sell side, carried empty, not v27's (the refresh's Q34): the axe an
  // order was made from in the lake, its source and counterparty.
  string axe_source = 28;

  string axe_counterparty_id = 29;

  // On a child order: its parent, released, whose instrument and side it
  // has (Q46).
  OrderLink link = 30;

  // On an order the book did not create (W11.2); unspecified on one it did.
  OrderOrigin origin = 31;

  // The venue's order ID on such an order, an external reference, never a
  // key.
  string venue_order_id = 32;

  // A fold over its journal (decisions/035), never stored.
  OrderStatus status = 33;

  // Each check recorded on it, naming the version it checked (W11.4).
  repeated Check checks = 34;

  // Its change requests, each tracked to its outcome (requirement 16).
  repeated ChangeRequest change_requests = 35;

  // On a read (W11.17): its placements, executions and charges.
  repeated Placement placements = 36;

  repeated Execution executions = 37;

  repeated Charge charges = 38;

  JournalRef last_change = 39;

  // Contract v24 (W11.1; the order-path plan's v24 item 6): on a block
  // order, its members as proposed -- released orders of one instrument and
  // side, each in no other live block. Empty on any other order.
  repeated string block_member_order_ids = 45;

  // Contract v24 (W11.33): each sleeve cross that filled the order; its
  // filled quantity counts each, and no execution is minted for one.
  repeated string sleeve_cross_ids = 46;

  // Contract v27 (W11.1; the gaps spec's D2): on a net order, its members
  // as proposed -- released FX orders of one pair and one value date, of
  // both sides, each in no other live block or net. Empty on any other
  // order.
  repeated string net_member_order_ids = 47;

  // Contract v27 (W11.1): the date an FX order settles on, as `portfolio`
  // states it (FIX's SettlDate, 64), ISO 8601; empty is spot.
  string value_date = 48;

  // Contract v28: as option brokers require it: buy to open, sell to close.
  // Unspecified on an instrument that is no option or future.
  PositionEffect position_effect = 49;

  // Contract v29: percent of par in limit_price, a yield in limit_yield, or a
  // spread over a benchmark in limit_spread_bps; a when-issued Treasury before
  // its auction is priced in yield. Unspecified: per unit, as before v29.
  PriceBasis price_basis = 50;

  // Contract v29: the least yield on a buy, the most on a sell, in its
  // convention (FIX Yield, 236, with YieldType, 235). Unset unless price_basis
  // is yield.
  QuotedYield limit_yield = 51;

  // Contract v29: over benchmark_instrument_id, the least on a buy (FIX Spread,
  // 218). Unset unless price_basis is spread.
  optional Decimal limit_spread_bps = 52;

  // Contract v29: an on-the-run Treasury's bond record, or a rate_curve record.
  // Empty unless price_basis is spread.
  string benchmark_instrument_id = 53;
}

// The people on an order, a placement or an entered execution (requirement
// 29). Each a person who has signed in (W6.1) or a service account.
// A mirror of meridian.v1.PersonRoles.
message PersonRoles {
  // Stamped from the actor of the proposing or recording command.
  Actor entered_by = 1;

  // The placement's, and an entered execution's: that act's actor.
  Actor executed_by = 2;

  // Named in the command, where it differs from entered by.
  Actor decided_by = 3;
}

// Where an order the book did not create came from (W11.2).
// A mirror of meridian.v1.OrderOrigin.
enum OrderOrigin {
  // An order the book created: proposed (W11.1).
  ORDER_ORIGIN_UNSPECIFIED = 0;
  // A telephoned or outside order, recorded by the `oms` for a person.
  ORDER_ORIGIN_TELEPHONED = 2;
  // An order made from venue-originated fills the `ems` accepted (W11.23;
  // contract v23): entered after the trade, filled, never gated.
  ORDER_ORIGIN_ACCEPTED_EXECUTION = 3;
}

// An order's status: its state, its conditions and its quantities, each
// derived.
// A mirror of meridian.v1.OrderStatus.
message OrderStatus {
  OrderState state = 1;

  repeated StandingOrderCondition conditions = 2;

  OrderQuantities quantities = 3;
}

// An order is in exactly one of seven states (W11's invariants).
// A mirror of meridian.v1.OrderState.
enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  // Proposed, not released: the gate has not passed it (W11.1, W11.6).
  ORDER_STATE_PROPOSED = 1;
  // Ended before release: a check's refuse, or the `oms`'s rejection
  // (W11.4, W11.5). Terminal.
  ORDER_STATE_REFUSED = 2;
  // Released for working, nothing committed or filled yet (W11.6).
  ORDER_STATE_RELEASED = 3;
  // Released with quantity committed at a placement or a child order, or
  // filled in part.
  ORDER_STATE_WORKING = 4;
  // Reported filled reached ordered.
  ORDER_STATE_FILLED = 5;
  // Ended by a cancel, the firm's or the venue's. Terminal.
  ORDER_STATE_CANCELLED = 6;
  // Its time in force ended, by the deployment's clock (W11.13). Terminal.
  ORDER_STATE_EXPIRED = 7;
}

// One condition an order holds, with its reason and who set it.
// A mirror of meridian.v1.StandingOrderCondition.
message StandingOrderCondition {
  OrderCondition condition = 1;

  // In words, for a person; a plugin acts on the condition, never on these.
  string reason = 2;

  // Who set it.
  Actor actor = 3;

  // On claimed: the instance claiming and the user it claims for (W11.7).
  Claimant claimant = 4;

  // On does not tie out: why.
  TieOutReason tie_out_reason = 5;

  // Contract v27 (W11.7): on held, its typed cause, and for a stale
  // reference price the dataset, its age and the ceiling; unspecified and
  // unset on any other condition, and on a hold with no typed cause.
  HoldCause hold_cause = 6;

  StaleReference stale_reference = 7;
}

// The nine conditions an order holds beside its state, each with its reason
// and the actor that set it.
// A mirror of meridian.v1.OrderCondition.
enum OrderCondition {
  ORDER_CONDITION_UNSPECIFIED = 0;
  // A change request is outstanding (W11.3; requirement 16).
  ORDER_CONDITION_CHANGE_REQUESTED = 1;
  // `compliance` requires approval by its policy (W11.5).
  ORDER_CONDITION_APPROVAL_REQUIRED = 2;
  // The account waits for compliance and a compliance plugin covering it
  // has not answered on this version (W11.6; step 5's Q5).
  ORDER_CONDITION_AWAITING_CHECK = 3;
  // Claimed to work it, by an instance for a user (W11.7).
  ORDER_CONDITION_CLAIMED = 4;
  ORDER_CONDITION_HELD = 5;
  // Its working paused: not the trading instruction's pause (Q31).
  ORDER_CONDITION_PAUSED = 6;
  // A placement's outcome is not known (W11.10; requirement 20).
  ORDER_CONDITION_OUTCOME_UNKNOWN = 7;
  // Its quantities do not tie out -- an overfill, or a restatement past its
  // intent (Q15, Q16, Q21) -- until an alignment, a booking to an error
  // account (slice B) or a bust clears it. Never acknowledged.
  ORDER_CONDITION_DOES_NOT_TIE_OUT = 8;
  // A fact arrived after the state it would have changed ended (#12):
  // recorded, flagged, acknowledged by a person (W11.14).
  ORDER_CONDITION_LATE_FACT = 9;
}

// The instance holding a claim, and the user it acts for.
// A mirror of meridian.v1.Claimant.
message Claimant {
  string instance_id = 1;

  oneof user {
    PersonActor person = 2;
    ServiceAccountActor service_account = 3;
  }
}

// Why an order does not tie out (W11's invariants; Q15, Q16).
// A mirror of meridian.v1.TieOutReason.
enum TieOutReason {
  TIE_OUT_REASON_UNSPECIFIED = 0;
  TIE_OUT_REASON_OVERFILL = 1;
  // A restatement past the order's intent.
  TIE_OUT_REASON_RESTATEMENT = 2;
}

// Contract v27 (W11.7; spec/sessions-and-data-report-their-latency-and-quality,
// rulings 374 and 420): why an order is held, typed, beside the words.
// A mirror of meridian.v1.HoldCause.
enum HoldCause {
  // A hold with no typed cause, as every hold before v27.
  HOLD_CAUSE_UNSPECIFIED = 0;
  // The `ems`'s reference price was past its stale ceiling at its
  // pre-trade check, its admin having chosen to refuse.
  HOLD_CAUSE_REFERENCE_PRICE_STALE = 1;
}

// A reference price found past its ceiling at an `ems`'s pre-trade check
// (contract v27; W11.7, W11.8).
// A mirror of meridian.v1.StaleReference.
message StaleReference {
  // The dataset the price came from, `instance:key`.
  string dataset = 1;

  // How old the price's confirmed time was at the check.
  int64 age_ns = 2;

  // The ceiling in force: the tighter of the dataset's and the `ems`
  // admin's own.
  int64 ceiling_ns = 3;
}

// The quantities, derived; idle may go negative, shown, never refused (Q3).
// A mirror of meridian.v1.OrderQuantities.
message OrderQuantities {
  Decimal ordered = 1;

  // Executions at matched or later, a child order's included.
  Decimal reported_filled = 2;

  // Executions at final.
  Decimal final_filled = 3;

  Decimal awaiting_acceptance = 4;

  // Open at live placements and live child orders.
  Decimal committed = 5;

  // Ordered less committed and filled.
  Decimal idle = 6;

  Decimal leaves = 7;
}

// A verdict on an order version or a placement (W11.4).
// A mirror of meridian.v1.Check.
message Check {
  CheckVerdict verdict = 1;

  // The order version it checked: the journal sequence of the order's last
  // change when it checked. Unset on a placement's.
  uint64 order_version = 2;

  // On a check of a placement before it is sent.
  string placement_id = 3;

  string rule = 4;

  string note = 5;

  // The compliance plugin instance that recorded it.
  string instance_id = 6;

  Actor recorded_by = 7;
}

// Ruled 2026-09-30 (requirement 44).
// A mirror of meridian.v1.CheckVerdict.
enum CheckVerdict {
  CHECK_VERDICT_UNSPECIFIED = 0;
  CHECK_VERDICT_PASS = 1;
  CHECK_VERDICT_WARN = 2;
  // Stands until overridden (W11.5); a release is refused while it does.
  CHECK_VERDICT_BLOCK = 3;
  // Ends a proposed order refused; nobody may override it.
  CHECK_VERDICT_REFUSE = 4;
}

// A change request, tracked to its outcome (requirement 16).
// A mirror of meridian.v1.ChangeRequest.
message ChangeRequest {
  // `CRQ-` and a ULID, minted by the book.
  string change_request_id = 1;

  string order_id = 2;

  // On a placement's change.
  string placement_id = 3;

  oneof change {
    OrderChange order_change = 4;
    PlacementChange placement_change = 5;
  }

  string reason = 6;

  EntryMeta entry = 7;

  ChangeRequestOutcome outcome = 8;
}

// What an order's change asks (W11.3).
// A mirror of meridian.v1.OrderChange.
message OrderChange {
  OrderChangeKind kind = 1;

  // The new ordered quantity, on ORDER_CHANGE_KIND_QUANTITY.
  optional Decimal quantity = 2;

  optional Money limit_price = 3;

  TimeInForce time_in_force = 4;

  // Amended in the same act as an increase or a reduction.
  AllocationInstruction allocation_instruction = 5;

  // On ORDER_CHANGE_KIND_AMEND: the instructions now, whole.
  repeated ExecutionInstruction execution_instructions = 6;
}

// What an order's change request asks (W11.3; step 5's Q20).
// A mirror of meridian.v1.OrderChangeKind.
enum OrderChangeKind {
  ORDER_CHANGE_KIND_UNSPECIFIED = 0;
  // Each live placement and child order asked to cancel; cancelled when
  // none is live.
  ORDER_CHANGE_KIND_CANCEL = 1;
  // Its limit, time in force or execution instructions.
  ORDER_CHANGE_KIND_AMEND = 2;
  // A released order with nothing committed, back to proposed.
  ORDER_CHANGE_KIND_RECALL = 3;
  // A proposal withdrawn by its proposer.
  ORDER_CHANGE_KIND_WITHDRAW = 4;
  // An increase or a reduction, `portfolio`'s, its allocation amended in the
  // same act; or the `oms`'s justified alignment.
  ORDER_CHANGE_KIND_QUANTITY = 5;
}

// What a placement's change asks (W11.9).
// A mirror of meridian.v1.PlacementChange.
message PlacementChange {
  PlacementChangeKind kind = 1;

  optional Decimal quantity = 2;

  optional Money limit_price = 3;

  TimeInForce time_in_force = 4;
}

// What a placement's change request asks (W11.9).
// A mirror of meridian.v1.PlacementChangeKind.
enum PlacementChangeKind {
  PLACEMENT_CHANGE_KIND_UNSPECIFIED = 0;
  PLACEMENT_CHANGE_KIND_CANCEL = 1;
  PLACEMENT_CHANGE_KIND_REPLACE = 2;
}

// What became of a change request (requirement 16).
// A mirror of meridian.v1.ChangeRequestOutcome.
enum ChangeRequestOutcome {
  CHANGE_REQUEST_OUTCOME_UNSPECIFIED = 0;
  // Outstanding: the order or placement holds change requested.
  CHANGE_REQUEST_OUTCOME_PENDING = 1;
  CHANGE_REQUEST_OUTCOME_APPLIED = 2;
  // Refused by the venue, as FIX's OrderCancelReject (9).
  CHANGE_REQUEST_OUTCOME_REJECTED = 3;
}

// A placement (W11.8): part of a released order at one connectivity plugin
// linked to the placing `ems`, which it reaches alone.
// A mirror of meridian.v1.Placement.
message Placement {
  // `PLC-` and a ULID, minted by the book. The client order identifier the
  // venue sees is this, or one the plugin derives from it.
  string placement_id = 1;

  string order_id = 2;

  string account_id = 3;

  // The placing `ems`, as its sidecar stamped it.
  string ems_instance_id = 4;

  // The connectivity plugin that sends it, linked to that `ems`.
  string connectivity_instance_id = 5;

  // What the `ems` set in the venue's account field, from its map (W11.22).
  string venue_account_code = 6;

  Decimal quantity = 7;

  Money limit_price = 8;

  TimeInForce time_in_force = 9;

  StrategyInstruction strategy = 10;

  // The reporting fields (requirement 56): the destination, a `VEN-` ID,
  // and route type by the `ems`; the routing time as the connectivity
  // plugin sent it, on its acknowledgement.
  string destination = 11;

  RouteType route_type = 12;

  int64 routed_at_ns = 13;

  TimePrecision routed_precision = 14;

  repeated string handling_instructions = 15;

  // Slice C's sell side, carried empty, not v27's (the refresh's Q34): the RFQ a
  // placement answers, as FIX's QuoteID (tag 117), and the axe, as FIX's
  // IOIID (tag 23).
  string rfq_id = 16;

  string axe_id = 17;

  // The venue's order ID now; every one it has had, in venue_order_ids.
  string venue_order_id = 18;

  PlacementStatus status = 19;

  // Executed by: the actor of the placing command.
  PersonRoles person_roles = 20;

  repeated Check checks = 21;

  // On a rejection: its reason, and the venue's as reported only beside
  // REJECTION_REASON_VENUE_REJECTED.
  RejectionReason rejection_reason = 22;

  AsReported rejection_as_reported = 23;

  JournalRef last_change = 24;

  // Every venue order ID it has had, in order, the current last
  // (requirement 34): external references, never keys.
  repeated string venue_order_ids = 25;

  // Its own change requests, each with its PlacementChange and tracked to
  // its outcome (W11.9; approved 2026-10-13), so its connectivity plugin
  // hears each on the placement. The order's stay on the order.
  repeated ChangeRequest change_requests = 26;

  // Contract v27 (W11.8; the gaps spec's B1): how it is executed, set by
  // the `ems` at its creation and never changed; unspecified is read as
  // DMA.
  PlacementType placement_type = 27;

  // Contract v27 (W11.8; B5): a manual placement's trade details, its
  // evidence and not street data -- the counterparty's contact as the
  // person states it, and the time agreed with its precision. Empty on any
  // other type.
  string counterparty_contact = 28;

  int64 agreed_at_ns = 29;

  TimePrecision agreed_precision = 30;

  // Contract v27 (W11.40, W11.41; slice C's buy side): the dealers' quotes
  // received on an RFQ placement, each with its outcome, and the one the
  // `ems` picked. Empty on any other type.
  repeated PlacementQuote quotes = 31;

  string picked_quote_id = 32;
}

// A strategy for the venue to work (step 6's Q11): the kinds name which of
// a broker's strategies, described in its catalogue on FIXatdl's model
// (W11.20), is its VWAP, TWAP, POV or IS. A connectivity plugin whose
// broker has none rejects it unsupported.
// A mirror of meridian.v1.StrategyInstruction.
message StrategyInstruction {
  StrategyKind kind = 1;

  int64 start_ns = 2;

  int64 end_ns = 3;

  // A participation rate, 0.1 for ten percent.
  optional Decimal participation = 4;

  Urgency urgency = 5;

  // The limits (step 6's Q11): the most participation, and a price beyond
  // which it does not trade, distinct from the order's limit.
  optional Decimal max_participation = 6;

  optional Money price_limit = 7;
}

// A broker's algorithm the placement asks for (step 6's Q11; Q6 as ruled).
// A mirror of meridian.v1.StrategyKind.
enum StrategyKind {
  STRATEGY_KIND_UNSPECIFIED = 0;
  STRATEGY_KIND_VWAP = 1;
  STRATEGY_KIND_TWAP = 2;
  STRATEGY_KIND_POV = 3;
  STRATEGY_KIND_IS = 4;
}

// A strategy's urgency (step 6's Q11): a few levels, as brokers have.
// A mirror of meridian.v1.Urgency.
enum Urgency {
  URGENCY_UNSPECIFIED = 0;
  URGENCY_LOW = 1;
  URGENCY_MEDIUM = 2;
  URGENCY_HIGH = 3;
}

// The route type a placement's destination is reached by (requirement 56).
// A mirror of meridian.v1.RouteType.
enum RouteType {
  ROUTE_TYPE_UNSPECIFIED = 0;
  // To the destination the `ems` chose.
  ROUTE_TYPE_DIRECTED = 1;
  // The broker chooses the destination.
  ROUTE_TYPE_NOT_DIRECTED = 2;
}

// A placement's status, derived.
// A mirror of meridian.v1.PlacementStatus.
message PlacementStatus {
  PlacementState state = 1;

  repeated StandingPlacementCondition conditions = 2;
}

// A placement is in one of eight states.
// A mirror of meridian.v1.PlacementState.
enum PlacementState {
  PLACEMENT_STATE_UNSPECIFIED = 0;
  // Created, not yet sent.
  PLACEMENT_STATE_QUEUED = 1;
  // Sent, not acknowledged.
  PLACEMENT_STATE_SENT = 2;
  // Acknowledged by the venue.
  PLACEMENT_STATE_WORKING = 3;
  // Ended for the day by the venue; not terminal for a good-till-cancelled
  // order, whose quantity stays committed (#20).
  PLACEMENT_STATE_DONE_FOR_DAY = 4;
  PLACEMENT_STATE_FILLED = 5;
  PLACEMENT_STATE_CANCELLED = 6;
  PLACEMENT_STATE_EXPIRED = 7;
  // Refused by the venue, or held back by the connectivity plugin's own
  // pre-trade check, with its RejectionReason.
  PLACEMENT_STATE_REJECTED = 8;
}

// One condition a placement holds; see StandingOrderCondition.
// A mirror of meridian.v1.StandingPlacementCondition.
message StandingPlacementCondition {
  PlacementCondition condition = 1;

  string reason = 2;

  Actor actor = 3;

  // On outcome unknown.
  UnknownReason unknown_reason = 4;

  AsReported status_as_reported = 5;

  // Contract v27 (W11.8): on sent on a stale reference, what the `ems`'s
  // check found.
  StaleReference stale_reference = 6;
}

// The conditions a placement holds beside its state.
// A mirror of meridian.v1.PlacementCondition.
enum PlacementCondition {
  PLACEMENT_CONDITION_UNSPECIFIED = 0;
  PLACEMENT_CONDITION_CHANGE_REQUESTED = 1;
  // With its UnknownReason; its quantity stays committed.
  PLACEMENT_CONDITION_OUTCOME_UNKNOWN = 2;
  // Halted by the venue, which may leave its state unchanged.
  PLACEMENT_CONDITION_SUSPENDED = 3;
  // Held at the venue until a stop or a condition triggers.
  PLACEMENT_CONDITION_AWAITING_TRIGGER = 4;
  // Contract v27 (W11.8): sent while its reference price was past its
  // ceiling, the `ems` admin having chosen to warn; its StaleReference on
  // the condition. A record of the warning, never a refusal.
  PLACEMENT_CONDITION_SENT_ON_STALE_REFERENCE = 5;
}

// Why a placement's outcome is unknown (requirement 20).
// A mirror of meridian.v1.UnknownReason.
enum UnknownReason {
  UNKNOWN_REASON_UNSPECIFIED = 0;
  UNKNOWN_REASON_CONNECTION_LOST = 1;
  UNKNOWN_REASON_REQUEST_UNANSWERED = 2;
  // The venue's status as reported beside it.
  UNKNOWN_REASON_VENUE_STATUS_NOT_MAPPED = 3;
}

// Why a placement was rejected (step 6, "Refusals and rejections"). A
// rejection, not a refusal: core refuses nothing a venue cannot do.
// A mirror of meridian.v1.RejectionReason.
enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  // Asked for what the plugin or the venue does not offer for this account.
  REJECTION_REASON_UNSUPPORTED = 1;
  // The catch-all, the venue's reason beside it in an AsReported only when
  // no contract reason maps.
  REJECTION_REASON_VENUE_REJECTED = 2;
  // The connectivity plugin's own market-access check (Q18).
  REJECTION_REASON_HELD_BY_PRE_TRADE_CHECK = 3;
}

// Contract v27 (W11.8; spec/the-contract-gaps-v26-and-v27-close, B1 to B9):
// how a placement is executed, set by the `ems` at its creation and never
// changed, as FIX's HandlInst (21) is fixed for an order's life.
// Unspecified is read as DMA: a placement from v22 to v26, never backfilled.
// A mirror of meridian.v1.PlacementType.
enum PlacementType {
  PLACEMENT_TYPE_UNSPECIFIED = 0;
  // Direct market access: HandlInst 1 at the edge; carries no strategy.
  PLACEMENT_TYPE_DMA = 1;
  // A broker's algorithm: HandlInst 1 or 2 with its strategy, which it
  // requires.
  PLACEMENT_TYPE_ALGO = 2;
  // Worked by a broker: HandlInst 3 with ExecInst Not held; carries no
  // strategy.
  PLACEMENT_TYPE_CARE = 3;
  // A request for quote: a QuoteRequest, then the picked quote hit as
  // OrdType D (Previously quoted) with its QuoteID; the only type an order
  // of ORDER_TYPE_REQUEST_FOR_QUOTE takes.
  PLACEMENT_TYPE_RFQ = 4;
  // Agreed by phone or chat: names no connectivity instance, delivered to
  // none, its fills the `ems`'s manual entries for a person.
  PLACEMENT_TYPE_MANUAL = 5;
}

// One dealer's quote received on the firm's RFQ placement (contract v27;
// W11.40; requirement 50): a trade detail in the book, the buy side's
// best-execution record, never copied into the lake.
// A mirror of meridian.v1.PlacementQuote.
message PlacementQuote {
  // `PQT-` and a ULID, minted by the book, never reused.
  string quote_id = 1;

  // The dealer, the venue master's `VEN-` ID.
  string dealer_id = 2;

  // The dealer's own QuoteID (FIX 117), as delivered: an external
  // reference, never a key.
  string dealer_quote_id = 3;

  // The side the dealer quoted to the firm: its offer to a buyer, its bid
  // to a seller.
  Side side = 4;

  Money price = 5;

  Decimal quantity = 6;

  int64 received_at_ns = 7;

  // Its ValidUntilTime (FIX 62); 0 when unstated.
  int64 valid_until_ns = 8;

  PlacementQuoteOutcome outcome = 9;

  RawRecordRef raw_record = 10;
}

// Contract v27 (W11.40): what became of a dealer's quote on an RFQ placement.
// A mirror of meridian.v1.PlacementQuoteOutcome.
enum PlacementQuoteOutcome {
  PLACEMENT_QUOTE_OUTCOME_UNSPECIFIED = 0;
  // Received and standing.
  PLACEMENT_QUOTE_OUTCOME_OPEN = 1;
  // Picked by the `ems` (W11.41); the acceptance not yet confirmed.
  PLACEMENT_QUOTE_OUTCOME_PICKED = 2;
  // Accepted at the venue; its fill is reported as on any placement.
  PLACEMENT_QUOTE_OUTCOME_ACCEPTED = 3;
  // Past its valid-until time, or ended by the venue, unpicked or before
  // the acceptance.
  PLACEMENT_QUOTE_OUTCOME_EXPIRED = 4;
  // Withdrawn by its dealer.
  PLACEMENT_QUOTE_OUTCOME_WITHDRAWN = 5;
  // Another quote was accepted.
  PLACEMENT_QUOTE_OUTCOME_NOT_PICKED = 6;
}

// An execution, never edited (W11.11): a bust or a correction is another,
// superseding it.
// A mirror of meridian.v1.Execution.
message Execution {
  // `EXE-` and a ULID, minted by the book.
  string execution_id = 1;

  string order_id = 2;

  string placement_id = 3;

  string account_id = 4;

  string instrument_id = 5;

  // Its order's sleeve (the refresh's Q33).
  string sleeve = 6;

  Side side = 7;

  Decimal quantity = 8;

  Money price = 9;

  int64 trade_time_ns = 10;

  // ISO 8601, as the venue reports it.
  string trade_date = 11;

  // The venue's, or one the plugin derived deterministically (requirement
  // 33); an external reference.
  string venue_execution_id = 12;

  ExecutionKind kind = 13;

  ExecutionSource source = 14;

  Finality finality = 15;

  // Each with its kind, a signed amount and its asset; a rebate negative.
  repeated Fee fees = 16;

  // ISO 8601: the date the venue states, kept as stated; and, where it
  // states none or the plugin also asked, the date read's answer with its
  // basis (W3.20; the calendars spec's requirement 13). The pending lines
  // take the stated date, else the computed one.
  string settlement_date = 17;

  string computed_settlement_date = 18;

  DateBasis settlement_date_basis = 19;

  // The execution it busts or corrects: the last correction, not the
  // original.
  string supersedes = 20;

  // The place of execution, a `VEN-` ID.
  string venue_id = 21;

  // The reporting fields (requirements 55, 57, 58), carried where set.
  string uti = 22;

  string prior_uti = 23;

  string upi = 24;

  // A prime broker.
  string given_up_to = 26;

  string trade_chain_reference = 27;

  string settlement_counterparty = 28;

  // Executed by, on an entered execution.
  PersonRoles person_roles = 29;

  RawRecordRef raw_record = 30;

  JournalRef last_change = 31;

  // On a correction: the date it takes effect, beside the journal's own
  // sequence.
  string effective_date = 32;

  // The counterparty where known, its contact as delivered.
  Party counterparty = 33;

  LiquidityIndicator liquidity_indicator = 34;

  // Who generated the UTI.
  string uti_generated_by = 35;

  // Contract v23 (W11.11, W11.23, W11.24). Its state, derived from the
  // journal.
  ExecutionState state = 36;

  // The venue's order ID (FIX 37), as the venue states it: set on a fill
  // reported on no placement, so the plugin can answer its venue.
  string venue_order_id = 37;

  // On a DK: the reason, and the text the `ems` sent.
  DkReason dk_reason = 38;

  string dk_text = 39;

  // The venue's client order ID (FIX 11), copied from the report of a fill
  // on no placement where the venue sent one, which FIX requires back on BN
  // and Q.
  string venue_client_order_id = 40;

  // Contract v24 (W11.32): each prime's answer to a give-up of the
  // execution, in the order recorded; a rejection moves no position.
  repeated GiveUpRecord give_up_answers = 41;

  // Contract v27 (W11.11; the gaps spec's D4): on an internal cross of a
  // net order, which convention set its rate; unspecified on any other.
  CrossRateSource cross_rate_source = 42;

  // Contract v28: a package is reported once for the package and once per leg,
  // linked. Unspecified: single.
  MultiLegReportingType multi_leg_reporting_type = 43;

  // Contract v28: on a leg reported, the package fill's venue_execution_id as
  // reported; on a leg recorded, the package's execution_id. Empty except on a
  // leg's fill.
  string package_execution_id = 44;

  // Contract v29: per unit, or percent of par (TRACE's decimal price), yield or
  // spread, as the lake's PriceBasis (W10.4). Unspecified: per unit, as before
  // v29.
  PriceBasis price_basis = 45;

  // Contract v29: a when-issued Treasury's yield, a municipal's yield to worst
  // on its confirmation, or TRACE's yield; a QuotedYield. Unset where none is
  // stated.
  QuotedYield yield = 46;

  // Contract v29: second, millisecond, microsecond or nanosecond, on every
  // execution of every asset class. Unspecified where not said; set on every
  // execution from v29 where the source states its precision.
  TimePrecision trade_time_precision = 47;

  // Contract v29: states the factor a pool or TBA trade was done at, where not
  // the latest (6730(d)(2)(B); FIX Factor, 228): an exact decimal. Unset: the
  // latest published Factor row.
  optional Decimal factor_used = 48;

  // Contract v29: true for a new-issue municipal traded when issued, so an
  // empty date is never ambiguous. False: the settlement date is known.
  bool settlement_date_unknown = 49;

  // Contract v29: customer, dealer, non-member affiliate or clearing broker,
  // matching the lake's characteristics by meaning (W10.4). Unspecified where
  // not a fixed-income street report.
  ContraPartyType contra_party_type = 50;

  // Contract v29: a give-up firm (PARTY_ROLE_GIVE_UP_FIRM, 6730(c)(9)) and the
  // contra side's introducing broker (PARTY_ROLE_INTRODUCING_BROKER,
  // 6730(c)(10)), each with its mpid. None where only the counterparty is
  // delivered.
  repeated Party parties = 51;

  // Contract v29: one of the existing four but mixed: a mixed order's fills
  // each carry one. Unspecified where not a broker's trade.
  Capacity capacity = 52;

  // Contract v29: true where the firm takes no transaction-based compensation.
  // False: not so, or not stated.
  bool no_remuneration = 53;

  // Contract v29: true for a back-to-back with a non-member affiliate, same
  // day, same price. False: not so, or not stated.
  bool affiliate_back_to_back = 54;

  // Contract v29: true where priced away from the market, its reason in
  // special_price_reason. False: not so, or not stated.
  bool special_price = 55;

  // Contract v29: true where priced by a weighted-average method. False: not
  // so, or not stated.
  bool weighted_average_price = 56;

  // Contract v29: true for a primary-market trade. False: not so, or not
  // stated.
  bool primary_market = 57;

  // Contract v29: marks a list offering price or takedown trade (G-14 RTRS
  // Procedures (b)(iv)(B)(1)): true where so. False: not so, or not stated.
  bool list_offering_price_takedown = 58;

  // Contract v29: marks a trade without accrued interest (G-14 (b)(iv)(B)(4)):
  // true where traded flat. False: not so, or not stated.
  bool traded_flat = 59;

  // Contract v29: true where traded with stipulations. False: not so, or not
  // stated.
  bool stipulated = 60;

  // Contract v29: true on each execution of a basket of ten or more issues at
  // one agreed price, linked by trade_chain_reference. False: not so, or not
  // stated.
  bool portfolio_trade = 61;

  // Contract v29: up to 50 characters, as the firm writes it. Empty unless
  // special_price.
  string special_price_reason = 62;

  // Contract v29: a futures leg in the series, a series not priced at the
  // market, or hedged. Unspecified: none.
  TreasuryTradeModifier treasury_trade_modifier = 63;

  // Retired in the domain message, and never reused.
  reserved 25;
  reserved "derivative_terms";
}

// A mirror of meridian.v1.ExecutionKind.
enum ExecutionKind {
  EXECUTION_KIND_UNSPECIFIED = 0;
  EXECUTION_KIND_VENUE_REPORTED = 1;
  // Entered by the `ems` or the `oms`, for a person.
  EXECUTION_KIND_MANUAL = 2;
  // Joins with its two-account act.
  EXECUTION_KIND_FROM_INVENTORY = 3;
  EXECUTION_KIND_DONE_AWAY = 4;
  // Joins with its link.
  EXECUTION_KIND_FROM_CHILD_ORDERS = 5;
  // Joins with its two-account act (Q23).
  EXECUTION_KIND_INTERNAL_CROSS = 6;
  // From a status report where the venue sends no fill, its ID derived
  // deterministically (requirement 33).
  EXECUTION_KIND_INFERRED = 7;
}

// A mirror of meridian.v1.ExecutionSource.
enum ExecutionSource {
  EXECUTION_SOURCE_UNSPECIFIED = 0;
  EXECUTION_SOURCE_PRIMARY = 1;
  // Deduplicated against the primary on the venue's identifiers.
  EXECUTION_SOURCE_DROP_COPY = 2;
}

// An execution's finality: a level, and when it reached it.
// A mirror of meridian.v1.Finality.
message Finality {
  FinalityLevel level = 1;

  int64 at_ns = 2;
}

// A level with a time per step; a venue with no steps reports final at once.
// A mirror of meridian.v1.FinalityLevel.
enum FinalityLevel {
  FINALITY_LEVEL_UNSPECIFIED = 0;
  // A hit awaiting the maker's accept (Q13, last look).
  FINALITY_LEVEL_AWAITING_ACCEPTANCE = 1;
  FINALITY_LEVEL_MATCHED = 2;
  // On chain, in a block.
  FINALITY_LEVEL_INCLUDED = 3;
  FINALITY_LEVEL_FINAL = 4;
  // It did not happen after all: a last-look reject, a revert, a re-org.
  FINALITY_LEVEL_FAILED = 5;
}

// A fee (requirement 26), in any asset with a cash instrument (v18).
// A mirror of meridian.v1.Fee.
message Fee {
  FeeKind kind = 1;

  // Signed; a rebate negative.
  Money amount = 2;

  // Contract v24 (W11.27; the order-path plan's v24 item 4): the `oms`'s
  // choice by its policy. A capitalised fee enters the lot's cost on a buy;
  // every fee stays its own cash line either way.
  bool capitalised = 3;
}

// A fee's kind (requirement 26). Grown by revision.
// A mirror of meridian.v1.FeeKind.
enum FeeKind {
  FEE_KIND_UNSPECIFIED = 0;
  FEE_KIND_EXCHANGE = 1;
  // A venue's cancel fee.
  FEE_KIND_CANCEL = 2;
  // Gas, on an on-chain venue.
  FEE_KIND_NETWORK = 3;
  // Contract v23 (the OANDA batch's item 2): a rolling position's financing,
  // charged at each roll (W11.12); and the broker's commission on a fill, as
  // FIX keeps it apart in Commission (12) and CommType (13).
  FEE_KIND_FINANCING = 4;
  FEE_KIND_COMMISSION = 5;
}

// Maker or taker (FIX's LastLiquidityInd, tag 851).
// A mirror of meridian.v1.LiquidityIndicator.
enum LiquidityIndicator {
  LIQUIDITY_INDICATOR_UNSPECIFIED = 0;
  // Added liquidity.
  LIQUIDITY_INDICATOR_MAKER = 1;
  // Removed liquidity.
  LIQUIDITY_INDICATOR_TAKER = 2;
}

// Where an execution stands between the venue and the `ems` (W11.11, W11.23,
// W11.24; decisions/035 as amended at contract v23): derived from the
// journal as an order's status is, never stored; its transitions are the
// transition table's e-rows.
// A mirror of meridian.v1.ExecutionState.
enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  // A fill on no order and no placement, its account mapped, waiting for
  // the `ems` to accept it or answer it DK; one a bust or a correction
  // supersedes stays unmatched, and is answered no more.
  EXECUTION_STATE_UNMATCHED = 1;
  // On a placement: every fill v22 records, and an accepted one.
  EXECUTION_STATE_MATCHED = 2;
  // Answered don't know: recorded and closed, never moving a position.
  EXECUTION_STATE_DONT_KNOW = 3;
}

// Why the `ems` does not know a fill, mirroring FIX's DKReason (127)
// (W11.24; contract v23).
// A mirror of meridian.v1.DkReason.
enum DkReason {
  DK_REASON_UNSPECIFIED = 0;
  DK_REASON_UNKNOWN_INSTRUMENT = 1;
  DK_REASON_WRONG_SIDE = 2;
  DK_REASON_QUANTITY_EXCEEDS_ORDER = 3;
  DK_REASON_NO_MATCHING_ORDER = 4;
  DK_REASON_PRICE_EXCEEDS_LIMIT = 5;
  DK_REASON_CALCULATION_DIFFERENCE = 6;
  // With text, as FIX requires Text (58) when DKReason is Other.
  DK_REASON_OTHER = 7;
}

// A prime's answer to a give-up (W11.32), its own record, as FIX sends each
// AllocationReport (AS) as its own message.
// A mirror of meridian.v1.GiveUpRecord.
message GiveUpRecord {
  GiveUpAnswer answer = 1;

  // As reported, FIX's SecondaryAllocID (793).
  string prime_reference = 2;

  string reason = 3;

  // Its entry in the account's partition.
  EntryMeta entry = 4;
}

// A prime's answer to a give-up (W11.32), as FIX's AllocStatus (87).
// A mirror of meridian.v1.GiveUpAnswer.
enum GiveUpAnswer {
  GIVE_UP_ANSWER_UNSPECIFIED = 0;
  GIVE_UP_ANSWER_ACCEPTED = 1;
  // The trade stays with the executing side; no position moves.
  GIVE_UP_ANSWER_REJECTED = 2;
}

// Contract v27 (W11.11; the gaps spec's D4): which convention set an
// internal cross's rate on a net order. Core supports both; the plugin
// chooses.
// A mirror of meridian.v1.CrossRateSource.
enum CrossRateSource {
  CROSS_RATE_SOURCE_UNSPECIFIED = 0;
  // The net's street rate for every member: the platforms' allocate-back.
  CROSS_RATE_SOURCE_NET_STREET_RATE = 1;
  // The mid at the netting moment.
  CROSS_RATE_SOURCE_MID_AT_NETTING = 2;
}

// A mirror of meridian.v1.MultiLegReportingType.
enum MultiLegReportingType {
  // Read as single.
  MULTI_LEG_REPORTING_TYPE_UNSPECIFIED = 0;
  // A fill of a single-instrument order (FIX 442 = 1).
  MULTI_LEG_REPORTING_TYPE_SINGLE = 1;
  // One leg's fill of a package (442 = 2): the leg's instrument, side,
  // quantity and price.
  MULTI_LEG_REPORTING_TYPE_LEG = 2;
  // The package's fill (442 = 3): no instrument, quantity in package units,
  // the net price.
  MULTI_LEG_REPORTING_TYPE_PACKAGE = 3;
}

// Contract v29: a fixed-income street report's contra party, matching the
// lake's trade characteristics by meaning (W10.4).
// A mirror of meridian.v1.ContraPartyType.
enum ContraPartyType {
  // Not said: not a fixed-income street report.
  CONTRA_PARTY_TYPE_UNSPECIFIED = 0;
  // A customer (TRACE's C).
  CONTRA_PARTY_TYPE_CUSTOMER = 1;
  // A FINRA member or MSRB dealer, named by its MPID.
  CONTRA_PARTY_TYPE_DEALER = 2;
  // A non-member affiliate (TRACE's A1).
  CONTRA_PARTY_TYPE_NON_MEMBER_AFFILIATE = 3;
  // A clearing broker on an RTRS inter-dealer regulatory-only trade.
  CONTRA_PARTY_TYPE_CLEARING_BROKER = 4;
}

// Contract v29: TRACE's Treasury trade modifiers.
// A mirror of meridian.v1.TreasuryTradeModifier.
enum TreasuryTradeModifier {
  // None.
  TREASURY_TRADE_MODIFIER_UNSPECIFIED = 0;
  // A leg of a series with a futures leg (TRACE's .B).
  TREASURY_TRADE_MODIFIER_FUTURES_LEG = 1;
  // A series not priced at the market (TRACE's .S).
  TREASURY_TRADE_MODIFIER_NON_MARKET_SERIES = 2;
  // Hedged (TRACE's H).
  TREASURY_TRADE_MODIFIER_HEDGED = 3;
}

// A fee with no fill, on its placement (W11.12): it moves cash, pending to
// its settlement date, and counts toward no quantity.
// A mirror of meridian.v1.Charge.
message Charge {
  // `CHG-` and a ULID, minted by the book.
  string charge_id = 1;

  string placement_id = 2;

  string order_id = 3;

  string account_id = 4;

  Fee fee = 5;

  string trade_date = 6;

  string settlement_date = 7;

  RawRecordRef raw_record = 8;
}

// A mirror of meridian.v1.ApprovalDecision.
enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  // `compliance` sets approval required, by policy.
  APPROVAL_DECISION_REQUIRE = 1;
  // A person approves.
  APPROVAL_DECISION_APPROVE = 2;
  // A person overrides a block, with a reason.
  APPROVAL_DECISION_OVERRIDE = 3;
  // The `oms` rejects a proposed order it was asked to work (Q23): the
  // order ends refused.
  APPROVAL_DECISION_REJECT = 4;
}

// A mirror of meridian.v1.PlacementEvent.
enum PlacementEvent {
  PLACEMENT_EVENT_UNSPECIFIED = 0;
  PLACEMENT_EVENT_SENT = 1;
  // With the venue's order ID and the routing time.
  PLACEMENT_EVENT_ACKNOWLEDGED = 2;
  PLACEMENT_EVENT_REPLACED = 3;
  PLACEMENT_EVENT_DONE_FOR_DAY = 4;
  // With its RestatementReason.
  PLACEMENT_EVENT_RESTATED = 5;
  PLACEMENT_EVENT_SUSPENDED = 6;
  PLACEMENT_EVENT_TRIGGERED = 7;
  PLACEMENT_EVENT_CANCELLED = 8;
  PLACEMENT_EVENT_EXPIRED = 9;
  // With its RejectionReason.
  PLACEMENT_EVENT_REJECTED = 10;
  // With its UnknownReason; never a rejection.
  PLACEMENT_EVENT_OUTCOME_UNKNOWN = 11;
  // An unknown outcome resolved by asking the venue, never by resending.
  PLACEMENT_EVENT_OUTCOME_RESOLVED = 12;
}

// A restatement's reason, after FIX's; one beyond the order's intent sets
// late fact and does not tie out (Q15).
// A mirror of meridian.v1.RestatementReason.
enum RestatementReason {
  RESTATEMENT_REASON_UNSPECIFIED = 0;
  RESTATEMENT_REASON_CORPORATE_ACTION = 1;
  RESTATEMENT_REASON_RENEWAL = 2;
  RESTATEMENT_REASON_REPRICING = 3;
  RESTATEMENT_REASON_PARTIAL_DECLINE = 4;
  RESTATEMENT_REASON_CANCEL_ON_HALT = 5;
  RESTATEMENT_REASON_CANCEL_ON_SYSTEM_FAILURE = 6;
  // The venue's option: FIX's "Market (Exchange) option".
  RESTATEMENT_REASON_VENUE_OPTION = 7;
  RESTATEMENT_REASON_OTHER = 8;
}

// A well-formed fact naming nothing the book holds, kept with its reason,
// never dropped (requirement 13); placed by its own entry when a later
// record claims it.
// A mirror of meridian.v1.UnplacedFact.
message UnplacedFact {
  // `UNP-` and a ULID, minted by the book.
  string unplaced_id = 1;

  // Empty where its venue account code maps to no account: delivered to no
  // plugin, counted on its connectivity plugin's admin view.
  string account_id = 2;

  // The kind of fact, as data: `execution`, `placement`, `charge`,
  // `locate`, from contract v23 `value-date-roll`, and from contract v25
  // `give-up`.
  string fact_kind = 3;

  UnplacedReason reason = 4;

  RawRecordRef raw_record = 5;

  string venue_account_code = 6;

  oneof fact {
    ReportExecutionRequest execution = 7;
    ReportPlacementRequest placement = 8;
    ReportChargeRequest charge = 9;
    RecordLocateRequest locate = 11;
    // A value-date roll on a code no ems mapped, or meeting no pending line
    // to move (W11.25, contract v23).
    ReportValueDateRollRequest value_date_roll = 14;
    // A give-up's answer naming no execution or allocation the book holds
    // (W11.32, contract v25), its fact_kind `give-up`.
    ReportGiveUpRequest give_up = 15;
  }

  // The entry that placed it, once a later record claimed it.
  JournalRef placed_by = 12;

  // Its latest entry: the one that kept it, or the one that placed it.
  JournalRef last_change = 13;

  // Retired in the domain message, and never reused.
  reserved 10;
  reserved "order";
}

// Why a fact was kept unplaced (requirement 13; W11.13).
// A mirror of meridian.v1.UnplacedReason.
enum UnplacedReason {
  UNPLACED_REASON_UNSPECIFIED = 0;
  // It names a placement the book does not hold.
  UNPLACED_REASON_UNKNOWN_PLACEMENT = 1;
  // Its venue account code maps to no account on the sending connectivity
  // plugin (W11.22).
  UNPLACED_REASON_UNMAPPED_VENUE_ACCOUNT = 2;
  // A value-date roll meeting no pending line on its from date that the
  // sending connectivity plugin's fills or rolls on the code put there
  // (W11.25, contract v23): kept in the account, so operations sees the
  // venue's position and the book's differ.
  UNPLACED_REASON_NOTHING_PENDING = 4;
  // A give-up's answer naming an execution, or an allocation, the book does
  // not hold (W11.32, contract v26): kept whole in UnplacedFact.give_up.
  UNPLACED_REASON_UNKNOWN_EXECUTION = 5;
}

// W11.11. A fact by a connectivity plugin; or, for a person, a manual or
// done-away execution by the `ems` or the `oms`. A fill with no settlement
// date, stated or computed, is refused INVALID_ARGUMENT naming
// `settlement_date` (the refresh's Q39).
// A mirror of meridian.v1.ReportExecutionRequest.
message ReportExecutionRequest {
  string placement_id = 1;

  // A done-away execution's order.
  string order_id = 2;

  // Stamped from venue_account_code on a connectivity plugin's
  // (`venue-account-map`); empty, never refused, where none is mapped, so
  // the fact is kept unplaced. Named on an entry for a person.
  string account_id = 3;

  string venue_account_code = 4;

  string venue_execution_id = 5;

  ExecutionKind kind = 6;

  ExecutionSource source = 7;

  Decimal quantity = 8;

  Money price = 9;

  int64 trade_time_ns = 10;

  string trade_date = 11;

  Finality finality = 12;

  string settlement_date = 13;

  string computed_settlement_date = 14;

  DateBasis settlement_date_basis = 15;

  repeated Fee fees = 16;

  string supersedes = 17;

  string venue_id = 18;

  string uti = 19;

  string prior_uti = 20;

  string upi = 21;

  string given_up_to = 23;

  string trade_chain_reference = 24;

  string settlement_counterparty = 25;

  RawRecordRef raw_record = 26;

  string idempotency_key = 27;

  string effective_date = 28;

  Party counterparty = 29;

  LiquidityIndicator liquidity_indicator = 30;

  string uti_generated_by = 31;

  // Contract v23 (W11.11): a fill on no order and no placement names its
  // instrument, its side and the venue's order ID (FIX 37), each required
  // when no placement is named; and the venue's client order ID (FIX 11)
  // where the venue sent one, which FIX requires back on BN and Q.
  string instrument_id = 32;

  Side side = 33;

  string venue_order_id = 34;

  string venue_client_order_id = 35;

  // Contract v27 (W11.11): on the `oms`'s internal cross of a net order,
  // which convention set its rate; refused INVALID_ARGUMENT naming it where
  // missing on such a cross, or set on any other execution.
  CrossRateSource cross_rate_source = 36;

  // Contract v28: a package is reported once for the package and once per leg,
  // linked. Unspecified: single.
  MultiLegReportingType multi_leg_reporting_type = 37;

  // Contract v28: on a leg reported, the package fill's venue_execution_id as
  // reported; on a leg recorded, the package's execution_id. Empty except on a
  // leg's fill.
  string package_execution_id = 38;

  // Contract v29: per unit, or percent of par (TRACE's decimal price), yield or
  // spread, as the lake's PriceBasis (W10.4). Unspecified: per unit, as before
  // v29.
  PriceBasis price_basis = 39;

  // Contract v29: a when-issued Treasury's yield, a municipal's yield to worst
  // on its confirmation, or TRACE's yield; a QuotedYield. Unset where none is
  // stated.
  QuotedYield yield = 40;

  // Contract v29: second, millisecond, microsecond or nanosecond, on every
  // execution of every asset class. Unspecified where not said; set on every
  // execution from v29 where the source states its precision.
  TimePrecision trade_time_precision = 41;

  // Contract v29: states the factor a pool or TBA trade was done at, where not
  // the latest (6730(d)(2)(B); FIX Factor, 228): an exact decimal. Unset: the
  // latest published Factor row.
  optional Decimal factor_used = 42;

  // Contract v29: true for a new-issue municipal traded when issued, so an
  // empty date is never ambiguous. False: the settlement date is known.
  bool settlement_date_unknown = 43;

  // Contract v29: customer, dealer, non-member affiliate or clearing broker,
  // matching the lake's characteristics by meaning (W10.4). Unspecified where
  // not a fixed-income street report.
  ContraPartyType contra_party_type = 44;

  // Contract v29: a give-up firm (PARTY_ROLE_GIVE_UP_FIRM, 6730(c)(9)) and the
  // contra side's introducing broker (PARTY_ROLE_INTRODUCING_BROKER,
  // 6730(c)(10)), each with its mpid. None where only the counterparty is
  // delivered.
  repeated Party parties = 45;

  // Contract v29: one of the existing four but mixed: a mixed order's fills
  // each carry one. Unspecified where not a broker's trade.
  Capacity capacity = 46;

  // Contract v29: true where the firm takes no transaction-based compensation.
  // False: not so, or not stated.
  bool no_remuneration = 47;

  // Contract v29: true for a back-to-back with a non-member affiliate, same
  // day, same price. False: not so, or not stated.
  bool affiliate_back_to_back = 48;

  // Contract v29: true where priced away from the market, its reason in
  // special_price_reason. False: not so, or not stated.
  bool special_price = 49;

  // Contract v29: true where priced by a weighted-average method. False: not
  // so, or not stated.
  bool weighted_average_price = 50;

  // Contract v29: true for a primary-market trade. False: not so, or not
  // stated.
  bool primary_market = 51;

  // Contract v29: marks a list offering price or takedown trade (G-14 RTRS
  // Procedures (b)(iv)(B)(1)): true where so. False: not so, or not stated.
  bool list_offering_price_takedown = 52;

  // Contract v29: marks a trade without accrued interest (G-14 (b)(iv)(B)(4)):
  // true where traded flat. False: not so, or not stated.
  bool traded_flat = 53;

  // Contract v29: true where traded with stipulations. False: not so, or not
  // stated.
  bool stipulated = 54;

  // Contract v29: true on each execution of a basket of ten or more issues at
  // one agreed price, linked by trade_chain_reference. False: not so, or not
  // stated.
  bool portfolio_trade = 55;

  // Contract v29: up to 50 characters, as the firm writes it. Empty unless
  // special_price.
  string special_price_reason = 56;

  // Contract v29: a futures leg in the series, a series not priced at the
  // market, or hedged. Unspecified: none.
  TreasuryTradeModifier treasury_trade_modifier = 57;

  // Retired in the domain message, and never reused.
  reserved 22;
  reserved "derivative_terms";
}

// W11.10. A fact, each with the raw record it was converted from.
// A mirror of meridian.v1.ReportPlacementRequest.
message ReportPlacementRequest {
  string placement_id = 1;

  PlacementEvent event = 2;

  string venue_order_id = 3;

  int64 routed_at_ns = 4;

  TimePrecision routed_precision = 5;

  RejectionReason rejection_reason = 6;

  AsReported rejection_as_reported = 7;

  UnknownReason unknown_reason = 8;

  AsReported status_as_reported = 9;

  RestatementReason restatement_reason = 10;

  // On a replace or a restatement: the quantity and limit now.
  optional Decimal quantity = 11;

  optional Money limit_price = 12;

  RawRecordRef raw_record = 13;
}

// W11.12.
// A mirror of meridian.v1.ReportChargeRequest.
message ReportChargeRequest {
  string placement_id = 1;

  Fee fee = 2;

  string trade_date = 3;

  string settlement_date = 4;

  RawRecordRef raw_record = 5;
}

// W11.18. By the fund's connectivity plugin; the answer later on the same
// record as its own entry.
// A mirror of meridian.v1.RecordLocateRequest.
message RecordLocateRequest {
  // Stamped from venue_account_code (`venue-account-map`).
  string account_id = 1;

  string venue_account_code = 2;

  string instrument_id = 3;

  optional Decimal quantity_requested = 4;

  LocateAnswer answer = 5;

  // Names the record an answer arriving later is on; empty for a new one.
  string locate_record_id = 6;

  RawRecordRef raw_record = 7;

  string idempotency_key = 8;
}

// The prime's answer.
// A mirror of meridian.v1.LocateAnswer.
message LocateAnswer {
  Decimal quantity_approved = 1;

  optional Decimal rate = 2;

  int64 expires_at_ns = 3;

  string locate_id = 4;
}

// W11.25 (contract v23). By a connectivity plugin whose venue rolls a spot
// position at its daily cut: the account's pending lines in the pair move
// from one value date to the next by one entry, `value-date-rolled`;
// answered with FactReply.
// A mirror of meridian.v1.ReportValueDateRollRequest.
message ReportValueDateRollRequest {
  // Stamped from venue_account_code (`venue-account-map`); empty, never
  // refused, where none is mapped, so the fact is kept unplaced.
  string account_id = 1;

  string venue_account_code = 2;

  // The pair's two cash instruments, as the date read's spot inputs name it.
  repeated string pair = 3;

  // ISO 8601: the value date left, and the date read's answer moved to,
  // with its basis.
  string from_value_date = 4;

  string to_value_date = 5;

  DateBasis value_date_basis = 6;

  int64 rolled_at_ns = 7;

  // The `CHG-` IDs of the roll's financing charges, each reported first.
  repeated string charge_ids = 8;

  RawRecordRef raw_record = 9;

  string idempotency_key = 10;
}

// W11.32: a prime's answer to a give-up, from `connectivity` or
// `confirmation`; a fact, answered with FactReply.
// A mirror of meridian.v1.ReportGiveUpRequest.
message ReportGiveUpRequest {
  // One the book does not hold keeps the fact unplaced.
  string execution_id = 1;

  // Empty where no allocation is booked.
  string allocation_id = 2;

  GiveUpAnswer answer = 3;

  string prime_reference = 4;

  string reason = 5;

  RawRecordRef raw_record = 6;
}

// A trading instruction (W11.15): recorded with its setter's level, a
// deployment admin's on one account in that account's partition, every
// other in the control partition.
// A mirror of meridian.v1.TradingInstruction.
message TradingInstruction {
  TradingInstructionTarget target = 1;

  TradingInstructionValue value = 2;

  SetterLevel setter_level = 3;

  // On a user group's: the persons it covers, by their deployment-local
  // subjects, resolved by core when set and whenever membership changes.
  repeated string covers = 4;

  string reason = 5;

  EntryMeta entry = 6;

  // Its latest entry, which a catch-up reads it by (W11.16).
  JournalRef last_change = 7;
}

// What an instruction names: a deployment admin's an account, All accounts,
// a plugin, a person, a service account or a user group; a plugin admin's
// their plugin, or a person, service account or account within it, naming
// the plugin beside it.
// A mirror of meridian.v1.TradingInstructionTarget.
message TradingInstructionTarget {
  bool all_accounts = 1;

  string account_id = 2;

  // A plugin, by its instance.
  string instance_id = 3;

  // A person, by the deployment-local subject.
  string subject = 4;

  string service_account_id = 5;

  string user_group_id = 6;
}

// Conventions each plugin honours; the book refuses and cancels nothing for
// any (Q1, Q18). The most restrictive in force governs.
// A mirror of meridian.v1.TradingInstructionValue.
enum TradingInstructionValue {
  TRADING_INSTRUCTION_VALUE_UNSPECIFIED = 0;
  TRADING_INSTRUCTION_VALUE_ACTIVE = 1;
  // No new orders.
  TRADING_INSTRUCTION_VALUE_PAUSE = 2;
  // No new orders, and working orders cancelled; a connectivity plugin
  // cancels at its venue at once (W11.9).
  TRADING_INSTRUCTION_VALUE_STOP = 3;
}

// The level an instruction was set at, from the claims; an entry is lifted
// only at the level that set it.
// A mirror of meridian.v1.SetterLevel.
enum SetterLevel {
  SETTER_LEVEL_UNSPECIFIED = 0;
  SETTER_LEVEL_DEPLOYMENT_ADMIN = 1;
  SETTER_LEVEL_PLUGIN_ADMIN = 2;
}

// A locate the fund requested of its prime, the prime's answer on it
// (W11.18; requirement 50a). Each change its own entry; the street never
// holds one.
// A mirror of meridian.v1.Locate.
message Locate {
  // `LOC-` and a ULID, minted by the book.
  string locate_record_id = 1;

  string account_id = 2;

  string instrument_id = 3;

  Decimal quantity_requested = 4;

  // Unset until the prime answers.
  LocateAnswer answer = 5;

  // The prime's locate ID, from its answer, which a short order names.
  string locate_id = 6;

  // Derived from its uses.
  Decimal remaining = 7;

  repeated LocateUse uses = 8;

  RawRecordRef raw_record = 9;

  JournalRef last_change = 10;
}

// One use of a locate, its own entry (W11.19): when a locate is used up is
// `compliance`'s or the `oms`'s logic (principle 3).
// A mirror of meridian.v1.LocateUse.
message LocateUse {
  LocateUseKind kind = 1;

  Decimal quantity = 2;

  string order_id = 3;
}

// A mirror of meridian.v1.LocateUseKind.
enum LocateUseKind {
  LOCATE_USE_KIND_UNSPECIFIED = 0;
  // Reserved against the locate for an order (at release, recommended).
  LOCATE_USE_KIND_RESERVE = 1;
  // Given back: a cancel, or the day's end.
  LOCATE_USE_KIND_GIVE_BACK = 2;
  // Consumed by fills.
  LOCATE_USE_KIND_CONSUME = 3;
}

// A venue's offering per venue account code (W11.20), converted at the edge
// from the venue's own definitions: not a capability, and nothing declared
// about the role. What is not listed is rejected unsupported if sent.
// A mirror of meridian.v1.VenueCatalogue.
message VenueCatalogue {
  // The connectivity plugin it came from: the stamped publisher's.
  string connectivity_instance_id = 1;

  string venue_account_code = 2;

  repeated VenueOrderType order_types = 3;

  repeated VenueStrategy strategies = 4;

  repeated VenueEligibility eligibility = 5;

  // Contract v23 (W11.20, W11.23, W11.24): what the connectivity plugin
  // sends its venue when the `ems` accepts a venue-originated fill or
  // answers it DK. Unspecified, as a v22 catalogue is, reads as none.
  ExecutionAcknowledgement execution_acknowledgement = 6;

  // Contract v26 (W11.20; G1 question 5, approved 2026-10-14): the
  // environment the plugin's session actually reached, read from the
  // vendor's host, in the role-common setting's values -- `live`,
  // `sandbox` or `paper`; empty, as a v25 catalogue is, is no report. A
  // connection is demo only while its setting and this both say `sandbox`
  // or `paper`.
  string environment = 7;

  // Contract v27 (W11.20; the gaps spec's B4): the placement types the
  // venue takes beside its order types; one not listed is rejected
  // unsupported by the connectivity plugin. Empty, as a v26 catalogue is,
  // reads as DMA alone.
  repeated PlacementType placement_types = 8;
}

// An order type the venue offers, with the times in force it takes.
// A mirror of meridian.v1.VenueOrderType.
message VenueOrderType {
  OrderType order_type = 1;

  repeated TimeInForce times_in_force = 2;

  int64 stated_at_ns = 3;
}

// A broker's strategy (the order-path plan's refresh, Q31, as refined and
// ruled 2026-10-12): the strategy and its parameters on the model of FIXatdl,
// the FIX Trading Community's standard for describing algorithmic strategies,
// or mapping one to one onto it, so a broker's published definitions are
// imported at the edge rather than keyed again.
// A mirror of meridian.v1.VenueStrategy.
message VenueStrategy {
  // Which of the contract's kinds it is the broker's, where it is one.
  StrategyKind kind = 1;

  // The broker's name for it.
  string name = 2;

  int64 stated_at_ns = 3;

  // Its parameters, as FIXatdl's Parameter elements describe them.
  repeated StrategyParameter parameters = 4;
}

// One parameter of a broker's strategy, on FIXatdl's Parameter: its name,
// type, whether required (use="required"), its range (minValue, maxValue),
// its allowed values (EnumPair) and its default (initValue). FIXatdl's
// fixTag and the strategy's wireValue stay at the edge: an `ems` never
// meets a FIX tag (W11.20).
// A mirror of meridian.v1.StrategyParameter.
message StrategyParameter {
  string name = 1;

  StrategyParameterType type = 2;

  bool required = 3;

  // In the type's text form; empty where unbounded.
  string min_value = 4;

  string max_value = 5;

  // Empty where any value of the type is allowed.
  repeated string allowed_values = 6;

  string default_value = 7;
}

// FIXatdl's parameter types (Int_t, Float_t, Qty_t, Price_t, PriceOffset_t,
// Amt_t, Percentage_t, Boolean_t, Char_t, String_t, UTCTimestamp_t,
// LocalMktDate_t), in the contract's spelling.
// A mirror of meridian.v1.StrategyParameterType.
enum StrategyParameterType {
  STRATEGY_PARAMETER_TYPE_UNSPECIFIED = 0;
  STRATEGY_PARAMETER_TYPE_INT = 1;
  STRATEGY_PARAMETER_TYPE_FLOAT = 2;
  STRATEGY_PARAMETER_TYPE_QTY = 3;
  STRATEGY_PARAMETER_TYPE_PRICE = 4;
  STRATEGY_PARAMETER_TYPE_PRICE_OFFSET = 5;
  STRATEGY_PARAMETER_TYPE_AMOUNT = 6;
  STRATEGY_PARAMETER_TYPE_PERCENTAGE = 7;
  STRATEGY_PARAMETER_TYPE_BOOLEAN = 8;
  STRATEGY_PARAMETER_TYPE_CHAR = 9;
  STRATEGY_PARAMETER_TYPE_STRING = 10;
  STRATEGY_PARAMETER_TYPE_UTC_TIMESTAMP = 11;
  STRATEGY_PARAMETER_TYPE_LOCAL_MARKET_DATE = 12;
}

// The venue's eligibility for one instrument.
// A mirror of meridian.v1.VenueEligibility.
message VenueEligibility {
  string instrument_id = 1;

  bool fractionable = 2;

  bool shortable = 3;

  int64 stated_at_ns = 4;

  BorrowStatus borrow_status = 5;

  // The options level the venue states for the account; 0 where none.
  uint32 options_level = 6;
}

// A venue's borrow status for an instrument (W11.18's easy- and
// hard-to-borrow).
// A mirror of meridian.v1.BorrowStatus.
enum BorrowStatus {
  BORROW_STATUS_UNSPECIFIED = 0;
  BORROW_STATUS_EASY_TO_BORROW = 1;
  BORROW_STATUS_HARD_TO_BORROW = 2;
}

// The acknowledgement a venue takes of an execution it originated (W11.20;
// contract v23). Never a record of one sent: FIX answers BN with nothing.
// A mirror of meridian.v1.ExecutionAcknowledgement.
enum ExecutionAcknowledgement {
  // Not said: read as EXECUTION_ACKNOWLEDGEMENT_NONE, the venue not told.
  EXECUTION_ACKNOWLEDGEMENT_UNSPECIFIED = 0;
  // The venue takes neither message: nothing is sent at an accept or a DK.
  EXECUTION_ACKNOWLEDGEMENT_NONE = 1;
  // FIX's ExecutionAcknowledgement (35=BN): ExecAckStatus (1036) Accepted
  // at an accept, Don't know / Rejected with DKReason (127) at a DK.
  EXECUTION_ACKNOWLEDGEMENT_BN = 2;
  // FIX's DontKnowTrade (35=Q) at a DK, and nothing at an accept.
  EXECUTION_ACKNOWLEDGEMENT_DONT_KNOW_TRADE = 3;
}

// One account's code at one connectivity plugin: a code once per plugin.
// A mirror of meridian.v1.VenueAccountMapping.
message VenueAccountMapping {
  string connectivity_instance_id = 1;

  string venue_account_code = 2;

  // An account the deployment admin granted the `ems`'s instance (W6.30).
  string account_id = 3;
}

// What the accept adds to the order the fills make (W11.23): the rest is
// the fills'.
// A mirror of meridian.v1.NewOrderFromExecutions.
message NewOrderFromExecutions {
  string sleeve = 1;

  string note = 2;
}

// One account's part of a booking (W11.27).
// A mirror of meridian.v1.Allocation.
message Allocation {
  // `ALC-` and a ULID, minted by the book even for one account, never
  // reused (FIX IndividualAllocID, 467); empty on a command.
  string allocation_id = 1;

  // An account the allocation instruction names, or one marked an error
  // account (W9.13).
  string account_id = 2;

  // The instruction line's sleeve, the order's own the default; empty for
  // the account's unsleeved part.
  string sleeve = 3;

  Decimal quantity = 4;

  // The price the account's confirmation states.
  Money average_price = 5;

  // Quantity times average price, as the `oms` rounds it; the residual on a
  // named allocation.
  Money gross_amount = 6;

  // Each kind summing exactly to the executions' fees of that kind.
  repeated Fee fees = 7;

  // Derived from gross and fees, not checked by the book.
  Money net_amount = 8;

  // The date `operations` reconciles the allocation by, superseding the
  // fill's.
  string intended_settlement_date = 9;

  // Priced at the average, as the SEC's average-price notation marks a
  // confirmation.
  bool average_priced = 10;

  // The receiving account's own lots to relieve; empty, by the method.
  repeated string relieve_lot_ids = 11;

  // A person's words, required on an error-account allocation
  // (REFUSAL_REASON_REASON_REQUIRED).
  string reason = 12;

  // Unspecified unless the allocation is to an error account.
  ErrorCause error_cause = 13;

  // Required with ERROR_CAUSE_OTHER (INVALID_ARGUMENT naming it), as FIX's
  // Text (58).
  string error_text = 14;

  // Each prime's answer to a give-up of the allocation, in the order
  // recorded (W11.32).
  repeated GiveUpRecord give_up_answers = 15;

  // Contract v29: the accrued interest the customer pays or receives, a Money
  // in the settlement currency (FIX AccruedInterestAmt, 159, on Confirmation
  // 35=AK); final money is net_amount plus it. Unset on an allocation in an
  // instrument that accrues nothing; on a fixed-income allocation booked before
  // v29, unset, a backfilled record saying it was not recorded (decisions/031).
  optional Money accrued_interest = 16;

  // Contract v29: signed, a Money for the whole allocation: positive a markup
  // on a sale to the customer, negative a markdown on a purchase from it, the
  // name following the side as the rules name it; inside the price, never a fee
  // (a FIX export writes MiscFeeType 8). Unset where none: an agency trade, or
  // unset on an allocation booked before v29.
  optional Money markup = 17;

  // Contract v29: per unit in the instrument's price basis: per 100 of face for
  // a bond. Unset where no markup is disclosed, or unset on an allocation
  // booked before v29.
  optional Money prevailing_market_price = 18;

  // Contract v29: the rules' ladder in their order, one enum for both
  // regulators. Unspecified where no PMP.
  PrevailingMarketPriceBasis prevailing_market_price_basis = 19;

  // Contract v29: an EXE- execution (the firm's own contemporaneous trade) or a
  // lake row's dataset, row key and version (a trade, a quote, an engine
  // result's row), with its time. Unset where no PMP.
  PrevailingMarketPriceReference prevailing_market_price_reference = 20;

  // Contract v29: one of the existing four but mixed. Unspecified where not a
  // broker's trade; unset on an allocation booked before v29, each fixed-income
  // one given a backfilled record saying it was not recorded (decisions/031).
  Capacity capacity = 21;

  // Contract v29: for an allocation booking one execution its time; for an
  // average-priced allocation the time the oms fixed the customer's price, the
  // time all terms sufficient to compute the dollar price were agreed (FINRA
  // Rule 6710(d)'s time of execution). 0 where not a customer trade, or unset
  // on an allocation booked before v29.
  int64 execution_time_ns = 22;

  // Contract v29: to the second at least for a confirmation. Unspecified where
  // execution_time_ns is 0.
  TimePrecision execution_time_precision = 23;

  // Contract v29: as Execution.no_remuneration, for the same regulators. False:
  // not so, or not stated.
  bool no_remuneration = 24;
}

// Why an allocation is to an error account (W11.27; the order-path plan's
// v24 item 10). FIX has no standard list.
// A mirror of meridian.v1.ErrorCause.
enum ErrorCause {
  // Not an error-account allocation.
  ERROR_CAUSE_UNSPECIFIED = 0;
  // The venue filled more than ordered; the excess booked to the error
  // account.
  ERROR_CAUSE_OVERFILL = 1;
  ERROR_CAUSE_CLIENT_RENEGED = 2;
  // A venue-originated fill accepted to the wrong order (W11.23).
  ERROR_CAUSE_WRONG_ACCEPT = 3;
  // The firm's own booking error.
  ERROR_CAUSE_BOOKING_ERROR = 4;
  // Another cause, which error_text says.
  ERROR_CAUSE_OTHER = 5;
}

// Contract v29 (711): how a prevailing market price was found, the rules'
// ladder in their order, one enum for both regulators.
// A mirror of meridian.v1.PrevailingMarketPriceBasis.
enum PrevailingMarketPriceBasis {
  // Not stated: no PMP, or booked before v29.
  PREVAILING_MARKET_PRICE_BASIS_UNSPECIFIED = 0;
  // The dealer's contemporaneous cost or proceeds, the presumption (FINRA
  // 2121.02(b)(1); MSRB G-30 .06(a)(i)).
  PREVAILING_MARKET_PRICE_BASIS_CONTEMPORANEOUS_COST = 1;
  // Contemporaneous inter-dealer transactions in the security.
  PREVAILING_MARKET_PRICE_BASIS_INTER_DEALER_TRANSACTIONS = 2;
  // Contemporaneous dealer transactions with institutional accounts.
  PREVAILING_MARKET_PRICE_BASIS_INSTITUTIONAL_TRANSACTIONS = 3;
  // Contemporaneous quotations.
  PREVAILING_MARKET_PRICE_BASIS_QUOTATIONS = 4;
  // Similar securities.
  PREVAILING_MARKET_PRICE_BASIS_SIMILAR_SECURITIES = 5;
  // An economic model.
  PREVAILING_MARKET_PRICE_BASIS_ECONOMIC_MODEL = 6;
}

// Contract v29 (711; FINRA Rule 2121.02(b), MSRB G-30 .06(a)): what a
// prevailing market price was read from -- an EXE- execution, the firm's own
// contemporaneous trade, or a lake row's dataset, row key and version -- with
// its time.
// A mirror of meridian.v1.PrevailingMarketPriceReference.
message PrevailingMarketPriceReference {
  // Names the firm's own contemporaneous trade: an EXE- execution. Empty where
  // the PMP came from the lake.
  string execution_id = 1;

  // Names the lake dataset the row is in: as Source.dataset. Empty where the
  // PMP came from an execution.
  string dataset = 2;

  // Names the lake row: its row key. Empty where the PMP came from an
  // execution.
  string row_key = 3;

  // Names the row's version: the version read. 0 where the PMP came from an
  // execution.
  int64 version = 4;

  // States the time of the price taken: the trade's or quote's time. Never 0
  // when set.
  int64 at_ns = 5;
}

// A booking of an order's executions to their accounts (W11.27 to W11.30).
// A mirror of meridian.v1.Booking.
message Booking {
  // `BKG-` and a ULID, minted by the book, never reused (decisions/035,
  // point 7); the reference the street echoes back.
  string booking_id = 1;

  // The order's `ORD-` ID; a child's executions are booked as its parent's.
  string order_id = 2;

  // The order's account, whose partition the booking is in; the allocation
  // account for a block.
  string account_id = 3;

  // An explicit list on one order, sharing instrument, side, trade date and
  // settlement date, as FIX's AllocationInstruction (J) requires of NoExecs.
  repeated string execution_ids = 4;

  // One per account, summing exactly to the executions booked in quantity,
  // gross and each fee kind.
  repeated Allocation allocations = 5;

  // Derived from its journal, never stored.
  BookingState state = 6;

  // The book's words for what moved executed away from allocated, as FIX
  // keeps a rejection's reason in AllocRejCode (88); empty unless held.
  string held_reason = 7;

  // Its latest entry, which a catch-up reads it by (W4.3).
  JournalRef last_change = 8;
}

// A booking's state (W11.30), derived from its journal, never stored.
// A mirror of meridian.v1.BookingState.
enum BookingState {
  BOOKING_STATE_UNSPECIFIED = 0;
  // Booked, its allocations tying out, not yet handed off or closed.
  BOOKING_STATE_BOOKED = 1;
  // Executed no longer equals allocated -- a bust, a correction, a late
  // fill or a later fee since booking -- or a hand-off's check failed; its
  // reason in held_reason, and a held-booking alert raised.
  BOOKING_STATE_HELD = 2;
  // Handed off to `operations`, which owns each allocation's post-trade
  // life.
  BOOKING_STATE_HANDED_OFF = 3;
  // A client's booking the firm does not settle, closed, its error-account
  // allocations handed off.
  BOOKING_STATE_CLOSED = 4;
  // Cancelled by the `oms` before the hand-off, so its executions may be
  // booked again.
  BOOKING_STATE_CANCELLED = 5;
}

// A booking's correction (W11.29), as FIX's AllocTransType (71).
// A mirror of meridian.v1.BookingCorrectionKind.
enum BookingCorrectionKind {
  BOOKING_CORRECTION_KIND_UNSPECIFIED = 0;
  // The `oms`'s, before the hand-off or closing.
  BOOKING_CORRECTION_KIND_CANCEL = 1;
  // `operations`', after it, with the full new allocation set: a new
  // version, the state kept.
  BOOKING_CORRECTION_KIND_REPLACE = 2;
}

// A cross between two sleeves of one account (W11.33), its tax and
// performance layers; no execution is minted for it.
// A mirror of meridian.v1.SleeveCross.
message SleeveCross {
  // `SXC-` and a ULID, minted by the book, never reused.
  string sleeve_cross_id = 1;

  // One account; a cross between accounts is an internal cross, a real
  // trade.
  string account_id = 2;

  string instrument_id = 3;

  // Empty for the account's unsleeved part.
  string giving_sleeve = 4;

  string receiving_sleeve = 5;

  Decimal quantity = 6;

  // The plugin's choice (mid, last or close): each moved lot's performance
  // cost, never its tax basis.
  Money cross_price = 7;

  // Which price and when, the plugin's words.
  string price_source = 8;

  // Each order's filled quantity counts the cross.
  repeated string order_ids = 9;

  string reason = 10;
}

// What an alert is about (W11.34); v26 adds rule results to the same record.
// A mirror of meridian.v1.AlertKind.
enum AlertKind {
  ALERT_KIND_UNSPECIFIED = 0;
  // An allocation to an error account, raised by the book on each.
  ALERT_KIND_ERROR_ACCOUNT_BOOKING = 1;
  // A booking held, raised by the book and cleared by it at the hand-off
  // or closing.
  ALERT_KIND_BOOKING_HELD = 2;
  // `compliance`'s own, through RaiseAlert.
  ALERT_KIND_COMPLIANCE = 3;
}

// What an alert is about: a booking and its allocation, or for
// `compliance`'s own an order or a position.
// A mirror of meridian.v1.AlertSubject.
message AlertSubject {
  string order_id = 1;

  string booking_id = 2;

  string allocation_id = 3;

  // An instrument and a side in the account, as a break names one (W9.4).
  PositionKey position = 4;
}

// A post-trade alert in an account's partition (W11.34), raised,
// acknowledged or cleared, never deleted; landed in the compliance spec's
// shape.
// A mirror of meridian.v1.Alert.
message Alert {
  // `ALR-` and a ULID, minted by the book, never reused.
  string alert_id = 1;

  string account_id = 2;

  AlertKind kind = 3;

  AlertState state = 4;

  // The book's words or `compliance`'s.
  string reason = 5;

  // What it is about.
  AlertSubject subject = 6;

  // A held booking's: the moment the `operations` plugin's
  // affirmation_deadline falls on the trade date, in the deployment's time
  // zone; zero otherwise.
  int64 due_by = 7;

  // Its latest entry, which a catch-up reads it by (W4.3).
  JournalRef last_change = 8;
}

// An alert's state (W11.34); nothing is deleted.
// A mirror of meridian.v1.AlertState.
enum AlertState {
  ALERT_STATE_UNSPECIFIED = 0;
  // Raised, by the book or by `compliance`.
  ALERT_STATE_RAISED = 1;
  // Acknowledged by `compliance` for a person, with a reason; never
  // clearing it.
  ALERT_STATE_ACKNOWLEDGED = 2;
  // Cleared by the book: a held booking handed off or closed.
  ALERT_STATE_CLEARED = 3;
}

// The venue master's record of one venue (W1.16). The platform mints its ID;
// a deployment keeps what it pulled (W3.5) and answers it (W3.14).
// A mirror of meridian.v1.VenueRecord.
message VenueRecord {
  // The venue's ID for life, "VEN-...", minted by the platform.
  string venue_id = 1;

  string name = 2;

  // ISO 3166-1 alpha-2: where the venue operates.
  string country_code = 3;

  VenueKind kind = 4;

  // Its identifiers: an ISO 10383 MIC under the scheme `iso10383`, operating
  // or segment, where it has one; a vendor's code as a `symbol` with its
  // source. In force from `valid_from_ns`. An amend replaces them.
  repeated Identifier identifiers = 5;

  // A segment's operating venue, the venue master's ID; empty for a venue
  // that is its own operating venue.
  string operating_venue_id = 6;

  // An IANA time zone: the venue's local time, which its sessions and a
  // business date at it are in.
  string time_zone = 7;

  // Monotonic, assigned by the platform, starting at 1.
  int64 version = 8;

  // When this version became true.
  int64 valid_from_ns = 9;

  // When the platform recorded it. Stamped by the platform, never accepted
  // from a caller.
  int64 record_time_ns = 10;

  // Active, or decommissioned: an expired MIC is a decommissioned venue,
  // which still resolves for a date it was in force. The security master's
  // lifecycle; a venue is never in its define state.
  InstrumentLifecycleState lifecycle_state = 11;
}

// What kind of venue it is. A closed list, grown by revision.
// A mirror of meridian.v1.VenueKind.
enum VenueKind {
  VENUE_KIND_UNSPECIFIED = 0;
  // A regulated exchange.
  VENUE_KIND_EXCHANGE = 1;
  // An alternative trading system, or a multilateral trading facility.
  VENUE_KIND_ALTERNATIVE_TRADING_SYSTEM = 2;
  // An exchange of crypto assets.
  VENUE_KIND_CRYPTO_EXCHANGE = 3;
  // A network of dealers quoting on request, over the counter or by
  // indication: RFQ, OTC and, for now, IOI networks.
  VENUE_KIND_DEALER_NETWORK = 4;
  // A facility trades are reported to, not traded on: a trade reporting
  // facility, an alternative display facility, an approved publication
  // arrangement.
  VENUE_KIND_REPORTING_FACILITY = 5;
}

// One listed day, naming the source it came from: never listed without one.
// A mirror of meridian.v1.CalendarDay.
message CalendarDay {
  // ISO 8601, a plain date.
  string date = 1;

  CalendarDayKind kind = 2;

  // The holiday's name as the source gives it.
  string name = 3;

  // A source_id among the version's sources.
  string source = 4;
}

// What a listed day is.
// A mirror of meridian.v1.CalendarDayKind.
enum CalendarDayKind {
  CALENDAR_DAY_KIND_UNSPECIFIED = 0;
  // A weekday that is not a business day: a holiday, an ad hoc closure.
  CALENDAR_DAY_KIND_CLOSED = 1;
  // A weekend day that is nevertheless a business day.
  CALENDAR_DAY_KIND_OPEN = 2;
}

// A calendar's weekend, dated, so a change of weekend takes effect on its
// day.
// A mirror of meridian.v1.CalendarWeekend.
message CalendarWeekend {
  // A set: each weekday once.
  repeated Weekday weekdays = 1;

  // ISO 8601.
  string valid_from_date = 2;
}

// A mirror of meridian.v1.Weekday.
enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_MONDAY = 1;
  WEEKDAY_TUESDAY = 2;
  WEEKDAY_WEDNESDAY = 3;
  WEEKDAY_THURSDAY = 4;
  WEEKDAY_FRIDAY = 5;
  WEEKDAY_SATURDAY = 6;
  WEEKDAY_SUNDAY = 7;
}

// The first and last dates a calendar vouches for (requirement 4): outside
// them a date's status is not known, never a business day by default.
// A mirror of meridian.v1.CalendarCoverage.
message CalendarCoverage {
  // ISO 8601, inclusive.
  string from_date = 1;

  string to_date = 2;
}

// A source a calendar or a rule version cites, with the moment the platform
// read it (requirement 3).
// A mirror of meridian.v1.CalendarSource.
message CalendarSource {
  // Unique within the version, which its days name.
  string source_id = 1;

  string name = 2;

  // Where it is read: a public primary source's address.
  string address = 3;

  int64 read_at_ns = 4;
}

// A venue's trading sessions (contract v27; W1.20, W3.19; ruling 419): the
// minimal kind staleness needs, sessions a day in local time.
// A mirror of meridian.v1.TradingSessions.
message TradingSessions {
  // IANA.
  string time_zone = 1;

  repeated TradingSession sessions = 2;

  // Each day whose sessions differ: an early close, a late open, a day
  // closed; an early close announced later is a new version.
  repeated TradingSessionDay early_closes = 3;
}

// One session, on the weekdays it runs.
// A mirror of meridian.v1.TradingSession.
message TradingSession {
  repeated Weekday weekdays = 1;

  // Minutes after local midnight: the start, and the end, exclusive, at most
  // 1440.
  uint32 start_minute = 2;

  uint32 end_minute = 3;

  // An extended session: pre-market or after-hours.
  bool extended = 4;

  // Contract v29: a plain date, as CalendarWeekend.valid_from_date says a
  // weekend's: a session's hours that changed are two rows, each from its date,
  // so a backfill to 2016 states the hours in force then (FINRA's 08:00 to
  // 20:00 among them). Empty: in force since the calendar's coverage began.
  string valid_from_date = 5;
}

// One dated day's sessions, in place of the weekday's.
// A mirror of meridian.v1.TradingSessionDay.
message TradingSessionDay {
  // ISO 8601, a plain date.
  string date = 1;

  // None for a day closed.
  repeated TradingSession sessions = 2;

  // A source_id among the version's sources.
  string source = 3;
}

// W3.20: an instrument's settlement date by its market's rule.
// A mirror of meridian.v1.SettlementDateInputs.
message SettlementDateInputs {
  string instrument_id = 1;

  string trade_date = 2;
}

// W3.20: a pair's spot date, from a trade date or from an execution's moment
// through the pair's cut.
// A mirror of meridian.v1.SpotDateInputs.
message SpotDateInputs {
  repeated string pair = 1;

  string trade_date = 2;

  // In place of trade_date: the moment, its trade date taken through the
  // cut.
  int64 at_ns = 3;
}

// W3.20: a tenor date from a trade date.
// A mirror of meridian.v1.TenorDateInputs.
message TenorDateInputs {
  repeated string pair = 1;

  Tenor tenor = 2;

  string trade_date = 3;
}

// A mirror of meridian.v1.Tenor.
message Tenor {
  // Of the unit; 1 for the short dates.
  int32 count = 1;

  TenorUnit unit = 2;
}

// A mirror of meridian.v1.TenorUnit.
enum TenorUnit {
  TENOR_UNIT_UNSPECIFIED = 0;
  TENOR_UNIT_DAY = 1;
  TENOR_UNIT_WEEK = 2;
  TENOR_UNIT_MONTH = 3;
  TENOR_UNIT_YEAR = 4;
  // The short dates, counted in single business days from the trade date,
  // the next day and spot.
  TENOR_UNIT_OVERNIGHT = 5;
  TENOR_UNIT_TOM_NEXT = 6;
  TENOR_UNIT_SPOT_NEXT = 7;
}

// W3.20: a date rolled by a convention on a set of calendars.
// A mirror of meridian.v1.RollInputs.
message RollInputs {
  string date = 1;

  BusinessDayConvention convention = 2;

  // By their `CAL-` IDs; a day is good only if good in every one.
  repeated string calendars = 3;
}

// W3.20: whether a date is a business day on a set of calendars.
// A mirror of meridian.v1.BusinessDayInputs.
message BusinessDayInputs {
  string date = 1;

  repeated string calendars = 2;
}

// Why a date was or was not computed (requirement 9).
// A mirror of meridian.v1.DateOutcome.
enum DateOutcome {
  DATE_OUTCOME_UNSPECIFIED = 0;
  DATE_OUTCOME_COMPUTED = 1;
  // Transient: reported missing, the conductor pulls it, the asker retries.
  DATE_OUTCOME_CALENDAR_NOT_HELD = 2;
  // Never a business day by default.
  DATE_OUTCOME_OUTSIDE_COVERAGE = 3;
  DATE_OUTCOME_RULE_NOT_HELD = 4;
}

// A deployment's record was replaced by another (W3.8): from contract v10, a
// record a person merged into the one that stays (W3.13); before it, a
// placeholder by its INS- ID. Stores keyed by instrument move what they hold
// under it onto the one that stays (W3.9, W9.9); records of what was
// reported keep it.
//
// From contract v24 also a provisional record resolved and a platform merge,
// each with its cause, heard by every role (W3.8) and caught up by
// ListReplacements (W3.22).
// A mirror of meridian.v1.InstrumentReplacedEvent.
message InstrumentReplacedEvent {
  // The record replaced.
  string replaced_instrument_id = 1;

  // What replaces it.
  InstrumentRecord instrument = 2;

  int64 replaced_at_ns = 3;

  // Contract v24 (W3.8): why it was replaced; unspecified only on a
  // replacement recorded before v24 and not yet backfilled.
  ReplacementCause cause = 4;

  // Contract v24 (W3.22): monotonic per deployment; ListReplacements reads
  // after it. Zero only on a replacement recorded before v24.
  int64 sequence = 5;
}

// Why a record was replaced (W3.8, contract v24).
// A mirror of meridian.v1.ReplacementCause.
enum ReplacementCause {
  // A replacement before v24 whose facts are missing, recorded as a gap.
  REPLACEMENT_CAUSE_UNSPECIFIED = 0;
  // A person merged the record into the one that stays (W3.13).
  REPLACEMENT_CAUSE_MERGED = 1;
  // A provisional record resolved to the platform's INS- record.
  REPLACEMENT_CAUSE_RESOLVED = 2;
  // The platform merged two INS- records, followed from the replacement
  // feed (W3.27).
  REPLACEMENT_CAUSE_PLATFORM_MERGED = 3;
}

// A value at a template field's path, with its provenance (W3.4, W3.23).
// A mirror of meridian.v1.TemplateFieldValue.
message TemplateFieldValue {
  // The field's path in the template; one the template lacks is refused
  // naming it.
  string path = 1;

  // As the template's field type writes it.
  string value = 2;

  // The source it was reconciled from; unset, the plugin's own source.
  Provenance provenance = 3;
}

// A security template (W1.24, W3.24; the intent's "security template"): the
// platform authors, versions and publishes it, and a deployment's store
// holds every version and never changes one.
// A mirror of meridian.v1.SecurityTemplate.
message SecurityTemplate {
  // `TPL-`, the platform's, never a deployment's.
  string template_id = 1;

  // Published and immutable; a change is a new version.
  string template_version = 2;

  // The platform's words for it.
  string name = 3;

  AssetClass asset_class = 4;

  // Unspecified for a class's base template.
  InstrumentType instrument_type = 5;

  // True for the one template per asset class carrying identifiers, a
  // description and a currency; the platform mints no INS- record under it.
  bool base = 6;

  // The v24 slot for its calculation package, defined and kept empty: from
  // contract v26 the package is calculation_package.
  string calculation = 7;

  // Each by its path, its type and whether it is required.
  repeated TemplateField fields = 8;

  // The identifier schemes it matches on, each by its scheme's spelling,
  // share_class_figi first. Contract v29 (677): a debt template matches on
  // figi and agency_pool, the terms (issuer, coupon, maturity) checked on
  // mint, a disagreement a near-match.
  repeated string match_rule = 9;

  // Contract v26 (W1.24; the intent's rulings 9 and 11; the v26 plan's
  // question 225): its calculation package, declarative data; unset on a
  // class's base template and on a version published before v26.
  CalculationPackage calculation_package = 10;

  // Contract v28: true: readable and runnable, so past answers recompute, and
  // minted under no more; its instruments move to successor_version, each by a
  // recorded change. False: in use.
  bool withdrawn = 11;

  // Contract v28: a published version of the same template. Empty unless
  // withdrawn.
  string successor_version = 12;
}

// One field of a template (W3.24).
// A mirror of meridian.v1.TemplateField.
message TemplateField {
  // As an offer (TemplateFieldValue.path) and a missing field name it.
  string path = 1;

  // One of the contract's types, as a dictionary entry's type is written.
  string type = 2;

  // A record without it is incomplete, its missing fields listed (W3.7).
  bool required = 3;

  // Contract v28: mint, complete or optional, the intent's three levels.
  // Unspecified on a version published before v28.
  FieldRequirement requirement = 4;

  // Contract v28: true: a repeating group, as FIX's are, its values offered by
  // path with an index (deliverable[0].quantity). False: one value.
  bool repeated = 5;
}

// A mirror of meridian.v1.FieldRequirement.
enum FieldRequirement {
  // A version published before v28: read from required, true as mint and false
  // as optional.
  FIELD_REQUIREMENT_UNSPECIFIED = 0;
  // The platform mints an INS- record only when its source fills it.
  FIELD_REQUIREMENT_MINT = 1;
  // Minted without it, the record listing it missing until it is filled.
  FIELD_REQUIREMENT_COMPLETE = 2;
  // Never missing.
  FIELD_REQUIREMENT_OPTIONAL = 3;
}

// A template version's calculation package (W1.24): the pricing model it
// binds, the market objects it reads, and test cases with exact answers,
// which the analytics engine's built-in model and every implementation
// routed for it must equal exactly. Data, never code.
// A mirror of meridian.v1.CalculationPackage.
message CalculationPackage {
  // `cash`, `quoted_price` or `binary_event` in v26, and the version.
  string model_id = 1;

  int32 model_version = 2;

  // The kinds of its pricing inputs, as the lake names them: `close`,
  // `nav`, `outcome`.
  repeated string pricing_inputs = 3;

  // Where its corporate-action factors come from, for returns (the first
  // release's Q7); empty where none applies.
  string corporate_action_factors = 4;

  // Its version, which every valuation names.
  string calculation_version = 5;

  repeated CalculationTestCase test_cases = 6;

  // Contract v28: a table keyed by exercise style and, where it matters, the
  // underlying's asset class; a combination with no row is refused at publish.
  // None: the package's own model_id and model_version bind every instrument.
  repeated ModelBinding model_bindings = 7;
}

// One test case of a calculation package: inputs and the exact answer, each
// as canonical JSON (RFC 8785).
// A mirror of meridian.v1.CalculationTestCase.
message CalculationTestCase {
  string name = 1;

  string inputs = 2;

  string expected = 3;
}

// Contract v28 (CalculationPackage.model_bindings): binds the model by term
// (ruling 576).
// A mirror of meridian.v1.ModelBinding.
message ModelBinding {
  // The style an instrument's terms state. Unspecified: any style.
  ExerciseStyle exercise_style = 1;

  // Equity or fund (the tree with discrete dividends), referential (an index).
  // Unspecified: any underlying.
  AssetClass underlying_asset_class = 2;

  // American_binomial, black_scholes, black_76 or quoted_price in v28. Never
  // empty.
  string model_id = 3;

  // 1 or more. Never 0.
  int32 model_version = 4;
}

// A price of one kind for one subject. An FX rate is the price of one
// currency's cash instrument in another (spec/the-lake, Q3); the lake never
// inverts or crosses a rate.
// A mirror of meridian.v1.Price.
message Price {
  ObservationMeta meta = 1;

  PriceKind kind = 2;

  // The price of one unit of the subject, in the asset it was quoted in.
  Money price = 3;

  PriceBasis basis = 4;

  // The source's stated interval around the price, plus or minus, in the
  // price's own unit (W10.4; contract 28, amended 2026-10-31, ruling 895):
  // Pyth's confidence beside its aggregate price. Unset where the source
  // states none; never negative. A dataset filling it declares
  // meridian.v1.Price.confidence among its data types.
  optional Decimal confidence = 5;

  // Contract v29: its value, convention and kind: TRACE's yield, Treasury's
  // high yield, a broker's YTM or YTW. Unset where the source states no yield.
  QuotedYield yield = 6;

  // Contract v29: basis points over benchmark_instrument_id. Unset unless the
  // basis is spread.
  optional Decimal spread_bps = 7;

  // Contract v29: an on-the-run Treasury's bond record or a rate_curve record.
  // Empty unless the basis is spread, or a yield stated against a benchmark.
  string benchmark_instrument_id = 8;
}

// The envelope every row of every data type carries, as its first field
// (spec/the-lake, requirement 4).
// A mirror of meridian.v1.ObservationMeta.
message ObservationMeta {
  // The data plugin's identity for this observation, made from its raw record, so
  // the same observation recorded again changes nothing and a changed value
  // under it is a restatement. 1 to 128 characters.
  string row_key = 1;

  // The entities the row is about, each resolved through W3.1: 1 to 8.
  repeated SubjectRef subjects = 2;

  // Where the row came from.
  Source source = 3;

  // When the value became true, the event happened, or the period began.
  int64 valid_from_ns = 4;

  // The period's end, exclusive; 0 for an instant, or a value in force until
  // the next.
  int64 valid_until_ns = 5;

  // The business date a daily value is for, an ISO 8601 date (2026-10-09),
  // in the calendar its dataset declares (DatasetDeclaration.day_time_zone);
  // empty for a value that is not daily. A plain date, never a moment.
  string business_date = 6;

  // The source's own timestamps, at most one of each kind: 0 to 6.
  repeated SourceTime source_times = 7;

  // When the data plugin's sidecar published it: the envelope's publication time,
  // which the sidecar stamps. A plugin's value is never read.
  int64 sent_at_ns = 8;

  // When the lake committed this version: the time a point-in-time read
  // cuts at. Decided by the lake.
  int64 recorded_at_ns = 9;

  // 1 for the first record of the row key, one more for each restatement.
  // Decided by the lake.
  uint64 version = 10;

  // Its place in its dataset's partition, from 1, with no holes. Decided by
  // the lake.
  uint64 sequence = 11;

  // The sequence of the previous row of the same subject, data type and
  // dataset; 0 for the first. Decided by the lake.
  uint64 previous_sequence = 12;

  // The raw record it was converted from, in the writing plugin's storage.
  RawRecordRef raw = 13;

  // Each vendor value that failed conversion, beside a field left not
  // known: 0 to 16.
  repeated AsReported unconverted = 14;

  // Contract v23 (W10.4): set only when a daily value's business date is a
  // closed day of its dataset's calendar, or outside its coverage -- the
  // date, each calendar with its version, the reason and the holiday's
  // name. Recorded as reported, never refused. Decided by the lake.
  DateCheck closed_day = 15;

  // Contract v28: the series' identifier -- the occ_osi symbol, or a future's
  // or future option's exchange ticker carrying its venue's MIC in source --
  // on a row whose subject is the underlying; in the row's conflation key.
  // None: the row is about its subjects alone.
  repeated Identifier series_key = 16;

  // Contract v28: set at the edge; on a read, the row's effective state, the
  // highest of its own and every assessment of it. Unspecified: valid.
  QualityState quality = 17;

  // Contract v28: each check it failed, with the assessments' reasons on a
  // read. None on a valid row.
  repeated QualityReason quality_reasons = 18;
}

// One entity a row is about.
// A mirror of meridian.v1.SubjectRef.
message SubjectRef {
  // The deployment's own ID for the entity: an instrument's in the lake's
  // 1a and 1b. 1 to 64 characters.
  string entity_id = 1;

  // Contract v28: one of a small closed list; a row names up to 64 subjects.
  // Unspecified: subject.
  SubjectRole role = 2;
}

// A mirror of meridian.v1.SubjectRole.
enum SubjectRole {
  // Read as subject: every row before v28.
  SUBJECT_ROLE_UNSPECIFIED = 0;
  // What the row is about.
  SUBJECT_ROLE_SUBJECT = 1;
  // Who holds: a 13F manager, a 13D or 13G filer.
  SUBJECT_ROLE_HOLDER = 2;
  // What is held, or an issue rated.
  SUBJECT_ROLE_HELD = 3;
  // Who issued it.
  SUBJECT_ROLE_ISSUER = 4;
  // An insider reporting ownership.
  SUBJECT_ROLE_REPORTING_OWNER = 5;
  // Who filed.
  SUBJECT_ROLE_FILER = 6;
  // What a derivative is on.
  SUBJECT_ROLE_UNDERLYING = 7;
  // The rating agency (FDP Q7).
  SUBJECT_ROLE_RATER = 8;
}

// Where a row came from.
// A mirror of meridian.v1.Source.
message Source {
  // The instance that recorded it, stamped by its sidecar.
  string instance = 1;

  // That plugin's version when it recorded it: decided by the lake from the
  // version the deployment launched the instance at, never the plugin's word.
  string plugin_version = 2;

  // A dataset the instance's catalogue declares: the instance, a colon, and
  // the dataset's key (coinbase-1:daily). 1 to 96 characters.
  string dataset = 3;

  // The venue the observation originated on, the venue master's ID; empty
  // when it is not venue-specific, which is the consolidated view. A trade's
  // is the venue it printed on (contract v19): the market centre a
  // consolidated dataset's trade names, a FINRA print's reporting facility.
  string venue_id = 4;
}

// One of the source's own timestamps.
// A mirror of meridian.v1.SourceTime.
message SourceTime {
  SourceTimeKind kind = 1;

  // That clock's reading, in UTC, as the source gave it.
  int64 at_ns = 2;
}

// Which of the source's clocks a timestamp is.
// A mirror of meridian.v1.SourceTimeKind.
enum SourceTimeKind {
  // Refused.
  SOURCE_TIME_KIND_UNSPECIFIED = 0;
  // When it happened at its origin.
  SOURCE_TIME_KIND_EVENT = 1;
  // When a consolidator published it.
  SOURCE_TIME_KIND_CONSOLIDATED = 2;
  // When a reporting facility received it.
  SOURCE_TIME_KIND_REPORTED = 3;
  // When the vendor received it.
  SOURCE_TIME_KIND_VENDOR_RECEIVED = 4;
  // When the source released it: a close, a panel, a model.
  SOURCE_TIME_KIND_PUBLISHED = 5;
}

// A mirror of meridian.v1.QualityState.
enum QualityState {
  // Read as valid: every row before v28.
  QUALITY_STATE_UNSPECIFIED = 0;
  // No check failed.
  QUALITY_STATE_VALID = 1;
  // Served, flagged.
  QUALITY_STATE_SUSPICIOUS = 2;
  // Left out of default and side-by-side reads; served only to a read naming
  // its dataset with include_quarantined.
  QUALITY_STATE_INVALID = 3;
}

// A mirror of meridian.v1.QualityReason.
enum QualityReason {
  // Refused on a row whose state is not valid.
  QUALITY_REASON_UNSPECIFIED = 0;
  // A field failing its dictionary bound, the raw record kept at the edge.
  QUALITY_REASON_SCHEMA = 1;
  // The same source sequence or content under a new row key.
  QUALITY_REASON_DUPLICATE = 2;
  // Bid above ask beyond the dataset's tolerance.
  QUALITY_REASON_CROSSED_QUOTE = 3;
  // After a gap in the source's sequence, until resynced.
  QUALITY_REASON_SEQUENCE_GAP = 4;
  // A source time earlier than the subject's last beyond tolerance.
  QUALITY_REASON_OUT_OF_ORDER = 5;
  // Arrived past the stale ceiling.
  QUALITY_REASON_STALE = 6;
  // A source time ahead of the clock beyond the skew allowance, or before the
  // session's start.
  QUALITY_REASON_IMPLAUSIBLE_TIMESTAMP = 7;
  // Outside a robust rolling baseline, a signal plugin's judgment.
  QUALITY_REASON_PRICE_OUTLIER = 8;
  // Apart from another dataset for the same subject beyond tolerance, a signal
  // plugin's judgment.
  QUALITY_REASON_CROSS_SOURCE_DISAGREEMENT = 9;
}

// Which price.
// A mirror of meridian.v1.PriceKind.
enum PriceKind {
  // Refused.
  PRICE_KIND_UNSPECIFIED = 0;
  // The dataset's declared close for the business date: the official close
  // where the venue has one, otherwise the last price of the day the
  // dataset declares.
  PRICE_KIND_CLOSE = 1;
  // The last eligible trade's price at the valid time.
  PRICE_KIND_LAST = 2;
  // A fund's net asset value per share, for the business date.
  PRICE_KIND_NAV = 3;
  // A contract's settlement price, for the business date.
  PRICE_KIND_SETTLEMENT = 4;
  // The best bid at the valid time, or the business date's closing bid.
  PRICE_KIND_BID = 5;
  // The best ask at the valid time, or the business date's closing ask.
  PRICE_KIND_ASK = 6;
  // The mid at the valid time, or the business date's closing mid.
  PRICE_KIND_MID = 7;
}

// Open, high, low and close over an interval, the envelope's valid time: a
// daily bar names its business date. Empty `source.venue_id` is the
// consolidated view across venues.
// A mirror of meridian.v1.Bar.
message Bar {
  ObservationMeta meta = 1;

  // One asset for all four, and for the vwap, or the bar is refused.
  Money open = 2;

  Money high = 3;

  Money low = 4;

  Money close = 5;

  // Eligible quantity over the interval, in units of the instrument, never
  // negative.
  Decimal volume = 6;

  // Volume-weighted average price over the interval; unset when the source
  // gives none.
  optional Money vwap = 7;

  // Trades counted in the bar; unset when the source gives none.
  optional uint64 trade_count = 8;
}

// One trade as its source reported it. Valid from its event time at its venue,
// `valid_until_ns` 0, and no business date: real-time data is keyed by UTC
// instants. The consolidator's, the reporting facility's and the vendor's
// times are `source_times`. A correction or a withdrawal is a new version
// under the same row key.
// A mirror of meridian.v1.Trade.
message Trade {
  ObservationMeta meta = 1;

  // The trade's price per unit of the subject, naming its cash instrument.
  Money price = 2;

  // The quantity traded, in units of the instrument: more than zero.
  Decimal quantity = 3;

  // What the trade may count for, and its characteristics, in the platform's
  // words: converted from the source's condition codes at the edge, never a
  // vendor's code.
  TradeAttributes attributes = 4;

  // The side that took liquidity; unspecified when the source does not say,
  // never guessed from the price's movement.
  Aggressor aggressor = 5;

  // The source's own sequence number; 0 when it gives none. Not the lake's.
  uint64 source_sequence = 6;

  // True in a version saying the source withdrew the trade. A source stating
  // no cancels or corrections declares so on its suite's a-trade-withdrawn
  // case (contract v29, ruling 900).
  bool cancelled = 7;

  // Contract v28: the bid and ask, their sizes and the quote's own source
  // time. Unset: the source states none and the plugin kept none; never joined
  // from kept quotes.
  QuoteAtTrade quote_at_trade = 8;

  // Contract v29: per unit, percent of par, a yield or a spread, as
  // Price.basis. Unspecified: per unit, as every trade before v29.
  PriceBasis basis = 9;

  // Contract v29: its value, convention and kind: TRACE's yield, Treasury's
  // high yield, a broker's YTM or YTW. Unset where the source states no yield.
  QuotedYield yield = 10;

  // Contract v29: basis points over benchmark_instrument_id. Unset unless the
  // basis is spread.
  optional Decimal spread_bps = 11;

  // Contract v29: an on-the-run Treasury's bond record or a rate_curve record.
  // Empty unless the basis is spread, or a yield stated against a benchmark.
  string benchmark_instrument_id = 12;

  // Contract v29: true where the source disseminates a cap -- TRACE's 5MM+
  // investment grade, 1MM+ high yield, 25MM+ good-delivery TBA -- and quantity
  // is the cap, the least it was. False: the quantity is as traded.
  bool quantity_capped = 13;
}

// What a trade may count for (spec/the-lake, "Trade attributes"): written on
// each trade, so no reader needs a table to compute a bar.
// A mirror of meridian.v1.TradeAttributes.
message TradeAttributes {
  // For the consolidated bar across venues.
  Eligibility consolidated = 1;

  // For its own venue's bar.
  Eligibility market_centre = 2;

  // Its characteristics: 0 to 16. None is a regular trade, unless
  // `meta.unconverted` names a code that did not convert; from contract v29
  // (900), none listed means none the source states, a source that never
  // states one marking its suite case not presented.
  repeated TradeCharacteristic characteristics = 3;
}

// Whether a trade may set each statistic of a bar; not whether it did.
// A mirror of meridian.v1.Eligibility.
message Eligibility {
  Eligible high_low = 1;

  Eligible open = 2;

  Eligible close = 3;

  Eligible volume = 4;
}

// Whether a trade may set a statistic.
// A mirror of meridian.v1.Eligible.
enum Eligible {
  // Not known: a code the data plugin could not convert. A reader computing a bar
  // reads it as not eligible, and says so.
  ELIGIBLE_UNSPECIFIED = 0;
  ELIGIBLE_ELIGIBLE = 1;
  ELIGIBLE_NOT_ELIGIBLE = 2;
}

// A trade's characteristics in the platform's words: a closed list grown by
// revision, none a vendor's code.
// A mirror of meridian.v1.TradeCharacteristic.
enum TradeCharacteristic {
  // Refused.
  TRADE_CHARACTERISTIC_UNSPECIFIED = 0;
  // Printed by the venue's opening auction.
  TRADE_CHARACTERISTIC_OPENING_AUCTION = 1;
  // Printed by the venue's closing auction.
  TRADE_CHARACTERISTIC_CLOSING_AUCTION = 2;
  // Printed by another auction: a reopening after a halt, an intraday auction.
  TRADE_CHARACTERISTIC_OTHER_AUCTION = 3;
  // Smaller than the instrument's round lot.
  TRADE_CHARACTERISTIC_ODD_LOT = 4;
  // Outside the venue's regular session.
  TRADE_CHARACTERISTIC_EXTENDED_HOURS = 5;
  // Reported out of its time order.
  TRADE_CHARACTERISTIC_OUT_OF_SEQUENCE = 6;
  // Reported later than its venue's rules require.
  TRADE_CHARACTERISTIC_LATE_REPORT = 7;
  // Priced as an average over several executions.
  TRADE_CHARACTERISTIC_AVERAGE_PRICE = 8;
  // Settling other than on the regular cycle: cash, next day, seller's option.
  TRADE_CHARACTERISTIC_NON_REGULAR_SETTLEMENT = 9;
  // Part of an order sweeping several venues at once.
  TRADE_CHARACTERISTIC_INTERMARKET_SWEEP = 10;
  // Priced from another instrument or a benchmark, not by the market at the
  // time.
  TRADE_CHARACTERISTIC_DERIVATIVELY_PRICED = 11;
  // Priced at a reference price from earlier in the day.
  TRADE_CHARACTERISTIC_PRIOR_REFERENCE_PRICE = 12;
  // Executed contingent on another trade.
  TRADE_CHARACTERISTIC_CONTINGENT = 13;
  // A cross of two orders by one participant.
  TRADE_CHARACTERISTIC_CROSS = 14;
  // Contract v28: A leg of a complex order's execution: its price is the
  // package's, so a side inferred from it is not applicable.
  TRADE_CHARACTERISTIC_MULTI_LEG = 15;
  // Contract v28: An option print tied to a stock trade, or the reverse.
  TRADE_CHARACTERISTIC_STOCK_OPTION_TIED = 16;
  // Contract v28: A trade made on an exchange's floor.
  TRADE_CHARACTERISTIC_FLOOR = 17;
  // Contract v29: fixed income: the reporting dealer's contra was a customer
  // (TRACE's C).
  TRADE_CHARACTERISTIC_CONTRA_CUSTOMER = 18;
  // Contract v29: fixed income: an inter-dealer trade (TRACE's D).
  TRADE_CHARACTERISTIC_CONTRA_DEALER = 19;
  // Contract v29: fixed income: the contra was a non-member affiliate (TRACE's
  // A).
  TRADE_CHARACTERISTIC_CONTRA_AFFILIATE = 20;
  // Contract v29: fixed income: executed on an alternative trading system.
  TRADE_CHARACTERISTIC_ATS_EXECUTED = 21;
  // Contract v29: fixed income: the reporting dealer acted as agent.
  TRADE_CHARACTERISTIC_AGENCY_CAPACITY = 22;
  // Contract v29: fixed income: the reporting dealer acted as principal or
  // riskless principal.
  TRADE_CHARACTERISTIC_PRINCIPAL_CAPACITY = 23;
  // Contract v29: fixed income: traded when issued, before the security's issue
  // date.
  TRADE_CHARACTERISTIC_WHEN_ISSUED = 24;
  // Contract v29: fixed income: a primary-market trade, not secondary.
  TRADE_CHARACTERISTIC_PRIMARY_MARKET = 25;
  // Contract v29: fixed income: priced away from the market for a reason the
  // report states (TRACE's special price).
  TRADE_CHARACTERISTIC_SPECIAL_PRICE = 26;
  // Contract v29: municipal: a primary-market sale at the list offering price,
  // or a takedown (RTRS's list offering price or takedown indicator, G-14 RTRS
  // Procedures).
  TRADE_CHARACTERISTIC_LIST_OFFERING_PRICE_TAKEDOWN = 27;
  // Contract v29: municipal: the dealer took no markup, markdown or commission
  // in the price, compensated otherwise (RTRS's non-transaction-based
  // compensation indicator).
  TRADE_CHARACTERISTIC_NON_TRANSACTION_COMPENSATION = 28;
  // Contract v29: fixed income: traded without accrued interest, as a bond in
  // default (RTRS's traded flat indicator).
  TRADE_CHARACTERISTIC_TRADED_FLAT = 29;
}

// The side that took liquidity.
// A mirror of meridian.v1.Aggressor.
enum Aggressor {
  // Not known.
  AGGRESSOR_UNSPECIFIED = 0;
  // The buyer took the offer.
  AGGRESSOR_BUY = 1;
  // The seller hit the bid.
  AGGRESSOR_SELL = 2;
}

// Contract v28 (Trade.quote_at_trade): carries the quote in force when the
// print happened (G9; approved 573).
// A mirror of meridian.v1.QuoteAtTrade.
message QuoteAtTrade {
  // As the source states it, or as the plugin last received it on the same
  // feed. Unset: no bid in force.
  optional Money bid = 1;

  // As the source states it, or as the plugin last received it on the same
  // feed. Unset: no ask in force.
  optional Money ask = 2;

  // As stated. Unset: not stated.
  optional Decimal bid_quantity = 3;

  // As stated. Unset: not stated.
  optional Decimal ask_quantity = 4;

  // The quote's own source time, so a reader can refuse a stale one. 0: the
  // source states no quote time.
  int64 source_time_ns = 5;

  // True: the best bid and offer the plugin last received on the same feed
  // before the print. False: the source stated the quote with the print.
  bool as_last_received = 6;
}

// The best bid and offer, on a venue or consolidated: in force from its valid
// time until the next quote for the same subject, dataset, venue and asset. Keyed by
// UTC instants, with no business date. Book depth is not in slice 1.
// A mirror of meridian.v1.Quote.
message Quote {
  ObservationMeta meta = 1;

  // The best price on each side, naming its cash instrument, one asset for
  // both; unset when that side is empty.
  optional Money bid = 2;

  optional Money ask = 3;

  // The quantity at each price, in units of the instrument, more than zero;
  // unset when the source gives none.
  optional Decimal bid_quantity = 4;

  optional Decimal ask_quantity = 5;

  // The quote's state: 0 to 4. None is firm and trading.
  repeated QuoteCharacteristic characteristics = 6;

  // Contract v29: true where the source states a size bucket rather than a
  // size, and bid_quantity is the bucket's floor, the least it was, as
  // Trade.quantity_capped reads TRACE's caps. False: bid_quantity is the size
  // as stated.
  bool bid_size_capped = 7;

  // Contract v29: true where the source states a size bucket rather than a
  // size, and ask_quantity is the bucket's floor, the least it was. False:
  // ask_quantity is the size as stated.
  bool ask_size_capped = 8;

  // Contract v29: per unit or percent of par in bid and ask; a yield in
  // bid_yield and ask_yield; a spread in bid_spread_bps and ask_spread_bps.
  // Unspecified: per unit, as every quote before v29.
  PriceBasis basis = 9;

  // Contract v29: its value, convention and kind. Unset unless the basis is
  // yield, or the source states a yield beside the price.
  QuotedYield bid_yield = 10;

  // Contract v29: basis points over benchmark_instrument_id. Unset unless the
  // basis is spread.
  optional Decimal bid_spread_bps = 11;

  // Contract v29: its value, convention and kind. Unset unless the basis is
  // yield, or the source states a yield beside the price.
  QuotedYield ask_yield = 12;

  // Contract v29: basis points over benchmark_instrument_id. Unset unless the
  // basis is spread.
  optional Decimal ask_spread_bps = 13;

  // Contract v29: as Trade.benchmark_instrument_id. Empty unless the basis is
  // spread.
  string benchmark_instrument_id = 14;
}

// A quote's state in the platform's words.
// A mirror of meridian.v1.QuoteCharacteristic.
enum QuoteCharacteristic {
  // Refused.
  QUOTE_CHARACTERISTIC_UNSPECIFIED = 0;
  // Not firm: a price a participant need not trade at.
  QUOTE_CHARACTERISTIC_INDICATIVE = 1;
  // Trading in the subject is halted.
  QUOTE_CHARACTERISTIC_HALTED = 2;
}

// An event contract's outcome, as its venue determined it, at one stage
// (W10.4; the lake plan's "vL1c"). One row key per contract: each change of
// stage is a new version under it. Valid from the determination's time, an
// event SourceTime, with no business date: an outcome is not a daily value.
// A mirror of meridian.v1.Outcome.
message Outcome {
  ObservationMeta meta = 1;

  // What the instrument pays, in the platform's words.
  OutcomeDetermination determination = 2;

  // The venue's stage of the determination.
  OutcomeStage stage = 3;

  // What one contract settles at, in the payout asset: always set.
  Money settlement_value = 4;

  // When the venue paid out; 0 until then.
  int64 settled_at_ns = 5;

  // The venue's own word for the determination, as reported.
  AsReported determination_as_reported = 6;

  // Contract v27 (W10.4; the options and event contracts spec's G1): when a
  // proposed outcome's challenge window ends, as the venue reports it; 0
  // when not stated. Never derived by core.
  int64 challenge_ends_at_ns = 7;
}

// What an event contract's instrument pays (the lake plan's "vL1c", item 1).
// A mirror of meridian.v1.OutcomeDetermination.
enum OutcomeDetermination {
  // Refused.
  OUTCOME_DETERMINATION_UNSPECIFIED = 0;
  // Its full payout.
  OUTCOME_DETERMINATION_PAYS = 1;
  OUTCOME_DETERMINATION_PAYS_NOTHING = 2;
  // Part of its payout: a scalar result, or a resolution at half.
  OUTCOME_DETERMINATION_PAYS_PART = 3;
}

// The venue's stage of a determination (item 2).
// A mirror of meridian.v1.OutcomeStage.
enum OutcomeStage {
  // Refused.
  OUTCOME_STAGE_UNSPECIFIED = 0;
  // Proposed and open to challenge.
  OUTCOME_STAGE_PROPOSED = 1;
  // Determined; an amended determination is a new version here.
  OUTCOME_STAGE_DETERMINED = 2;
  OUTCOME_STAGE_DISPUTED = 3;
  OUTCOME_STAGE_FINAL = 4;
}

// Which datasets a read is answered from (the intent's Q4): exactly one of
// the deployment's default, named datasets, or every entitled dataset side by
// side. None set is the default.
// A mirror of meridian.v1.SourceChoice.
message SourceChoice {
  // The deployment's priority for the data type and kind, with failover.
  bool default = 1;

  // These datasets, in this order: 0 to 16.
  repeated string named = 2;

  // Every dataset the reader is entitled to, each row naming its own.
  bool side_by_side = 3;

  // Contract v28: true, on a read naming its datasets: invalid rows are
  // answered, each with its state and reasons; refused on a default or
  // side-by-side read. False: invalid rows are left out.
  bool include_quarantined = 4;
}

// A subject, dataset or field a read could not serve, and why; the rest still
// answer.
// A mirror of meridian.v1.Unanswered.
message Unanswered {
  SubjectRef subject = 1;

  string dataset = 2;

  // The field by its dictionary entry; empty for the whole row.
  string field = 3;

  UnansweredReason reason = 4;
}

// Why a part of a read was not answered.
// A mirror of meridian.v1.UnansweredReason.
enum UnansweredReason {
  // Refused.
  UNANSWERED_REASON_UNSPECIFIED = 0;
  // The reader is not entitled to the dataset, or the field.
  UNANSWERED_REASON_NOT_ENTITLED = 1;
  // No dataset covers the subject.
  UNANSWERED_REASON_NOT_COVERED = 2;
  // The lake asked the dataset's source for it (W10.7); the reader hears the
  // rows once recorded.
  UNANSWERED_REASON_ASKED_SOURCE = 3;
  // The dataset recorded nothing for the subject within its cadence.
  UNANSWERED_REASON_SOURCE_SILENT = 4;
  // The subject is not one the deployment's entities resolve.
  UNANSWERED_REASON_UNRESOLVED = 5;
  // Older than the history the dataset reaches, or the lake keeps.
  UNANSWERED_REASON_BEYOND_HISTORY = 6;
  // The dataset's licence forbids keeping it, and it was served, not kept.
  UNANSWERED_REASON_NOT_KEPT = 7;
  // Contract v29: the dataset's only rows for the subject at the as-of are
  // invalid: left out, never fallen back to, named so a reader can tell it from
  // silence (ruling 619 (1)).
  UNANSWERED_REASON_QUARANTINED = 8;
}

// What a dataset in an answer is, once per answer rather than on every row
// (spec/the-lake, requirement 6).
// A mirror of meridian.v1.DatasetRef.
message DatasetRef {
  string dataset = 1;

  // The instance that serves it.
  string instance = 2;

  // Who originated the data, and who carried it when an aggregator did, as
  // the catalogue declares them.
  string vendor = 3;

  string aggregator = 4;

  // The dataset's catalogue entry, as its instance declared it: set in a
  // listing of datasets (W10.9) and on an entitlements change (W10.1),
  // unset in a read's answer.
  DatasetDeclaration declaration = 5;

  // For the Data sources page, in a listing of datasets (W10.9; approved
  // 2026-10-10): the rows the lake keeps of the dataset carrying a value as
  // reported beside a field left not known; and the identifiers and venues
  // its instance reported missing (W3.2, W3.15), as the lake heard them. 0
  // in a read's answer and on an entitlements change.
  uint64 unconverted_count = 6;

  uint64 miss_count = 7;

  // Contract v23 (W10.9): the rows the lake keeps of the dataset flagged on
  // a closed day of its calendar, a weekend or a holiday; and those flagged
  // outside its coverage, counted apart. 0 in a read's answer and on an
  // entitlements change.
  uint64 closed_day_count = 8;

  uint64 outside_coverage_count = 9;

  // Contract v27 (W10.9; rulings 369 and 417): the dataset's declared
  // delay, from its catalogue, 0 for real time; and its stale ceiling, the
  // data plugin admin's `stale_after` for it, 0 when none is set. Set in a
  // listing and in every read's answer.
  int64 declared_delay_ns = 10;

  int64 stale_after_ns = 11;

  // Contract v27 (W10.9; ruling 418): in a listing, the latest liveness the
  // lake keeps for the dataset, one per venue; empty in a read's answer.
  repeated DatasetLiveness liveness = 12;

  // Contract v29: rows in force whose effective state is valid, counted by the
  // lake as of the listing. 0 where the dataset holds no valid rows, and in a
  // read's answer and an entitlements change.
  uint64 valid_count = 13;

  // Contract v29: rows in force served flagged suspicious, counted by the lake
  // as of the listing. 0 where the dataset holds no suspicious rows, and in a
  // read's answer and an entitlements change.
  uint64 suspicious_count = 14;

  // Contract v29: rows in force left out of default reads as invalid, counted
  // by the lake as of the listing. 0 where the dataset holds no invalid rows,
  // and in a read's answer and an entitlements change.
  uint64 invalid_count = 15;
}

// One dataset a data plugin serves. Its identity in a deployment is the instance
// and its key (spec/the-lake, Q19).
// A mirror of meridian.v1.DatasetDeclaration.
message DatasetDeclaration {
  // The dataset's name within the plugin: 1 to 40 characters, lowercase
  // letters, digits and underscores, beginning with a letter. The dataset's
  // ID in a deployment is the instance, a colon, and this.
  string key = 1;

  // Who originated the data, and who carries it when an aggregator does:
  // data, not vocabulary. The vendor 1 to 64 characters; the aggregator 0 to
  // 64, empty when reached directly.
  string vendor = 2;

  string aggregator = 3;

  // The lake's data types it serves and the optional fields it fills, each
  // by its dictionary entry: a type by its message (meridian.v1.Price), a
  // field by its entry (meridian.v1.Bar.vwap). 1 to 32.
  repeated string data_types = 4;

  // How its rows can arrive, among which the deployment chooses: 1 to 3,
  // each once.
  repeated ObservationMode modes = 5;

  // How often it updates, in seconds: what says it is silent. 0 for a
  // dataset that updates only when asked.
  uint32 cadence = 6;

  // How far back it reaches, in days; 0 when it states none.
  uint32 history = 7;

  // The terms its vendor's standard terms impose, which the deployment's
  // licence confirms or replaces (spec/the-lake, Q8). Its dataset and who
  // set it are empty here.
  DatasetLicence licence_default = 8;

  // The day a daily value's business date is in (plans/the-lake-prices-the-
  // book, Q5 and Q28): an IANA time zone, and the minute after local midnight
  // the day ends, 0 for midnight. What says which candle or session counts
  // as a business date, and when it is final; never a holiday calendar.
  string day_time_zone = 9;

  uint32 day_end_minute = 10;

  // The venue the dataset is, the venue master's ID; empty for a dataset
  // that is not one venue's, which is the consolidated view. A row naming
  // no venue is the dataset's view.
  string venue_id = 11;

  // The settlement calendar its business dates follow, its `CAL-` ID
  // (W10.1; spec/settlement-calendars-are-core-reference-data, requirement
  // 15; the lake's Q28; contract v22), beside day_time_zone and
  // day_end_minute. In v22 the lake keeps it and applies nothing by it; a
  // daily value dated on a day it says is closed is flagged from v23 (W10.4,
  // ruled 2026-10-12), recorded as reported and never refused. Empty names
  // none, as before.
  string calendar_id = 12;

  // Its declared delay (W10.1; contract v27, rulings 368, 369 and 382): how
  // far behind real time the vendor serves it, its staleness and its edge
  // age judged against the delay plus the ceiling. 0 for real time. One
  // dataset per timeliness.
  int64 declared_delay_ns = 13;

  // What class of source its prices come from (W10.1; contract 28, amended
  // 2026-10-31, ruling 906): traded, firm quotes, a composite or evaluated,
  // unspecified when not stated. A price keeps its real kind -- bid, mid,
  // ask, close, last -- and the class says what stands behind it: Pyth's is
  // a mid of class composite. Shown on the Data sources page; no default
  // read is ordered by it.
  PriceSourceClass price_source_class = 14;
}

// How a dataset's rows arrive (the lake intent's Q9 and Q10).
// A mirror of meridian.v1.ObservationMode.
enum ObservationMode {
  // Refused.
  OBSERVATION_MODE_UNSPECIFIED = 0;
  // Fetched when a reader's read is wanted (W10.7).
  OBSERVATION_MODE_PULL = 1;
  // Recorded on the source's own timetable, unasked.
  OBSERVATION_MODE_PUSH = 2;
  // Kept current from the source's stream while a standing want stands.
  OBSERVATION_MODE_STREAM = 3;
}

// A dataset's licence: its catalogue's default terms (unset dataset and
// author), or the deployment's licence a deployment admin set, which is what
// is enforced (W10.1, spec/the-lake, Q8). Records what the admin entered;
// it says nothing about whether a deployment meets a vendor's terms.
// A mirror of meridian.v1.DatasetLicence.
message DatasetLicence {
  // The dataset; empty in a catalogue's default.
  string dataset = 1;

  // Whether the lake may keep its rows; false serves them, not kept.
  bool kept = 2;

  // How long the lake keeps a row, in days from when it was recorded; 0
  // keeps it as long as the licence allows, with no limit set. At most
  // 36,500.
  uint32 retention_days = 3;

  // Whether data derived from it may be made. Deprecated from contract v27
  // (ruling 479), kept for one release: the terms' three answers are
  // derived_use_terms. A reader finding derived_use_terms unspecified reads
  // this, false as internal_only and true as not_restricted (ruling 180);
  // a v27 writer sets both.
  bool derived_use = 4;

  // Whether it may be shown. From contract v27 read as `meters` containing
  // `display`, for one release, then retired.
  bool display = 5;

  // The fields readable by default, by their dictionary entries; empty for
  // every field. At most 64.
  repeated string default_fields = 6;

  // Whether its terms are one person's (Q16): the Data sources page warns
  // when more than one person holds read on a plugin entitled to it.
  bool personal_use = 7;

  // Who set it and when, the delegation and client a person acted through,
  // and why, as the dashboard stamped and kept them: empty in a catalogue's
  // default.
  string updated_by = 8;

  int64 updated_at_ns = 9;

  string acting_through_delegation = 10;

  string client_name = 11;

  string note = 12;

  // The prepared change it was set from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 13;

  // §1a: the version of the platform's standard terms filled in; the basis;
  // the timeliness and its delay, with the label shown beside every value;
  // the licensing source behind the vendor, where one is, or, where the
  // vendor serves an aggregate, whose aggregate it is (contract 28, amended
  // 2026-10-31, ruling 896: Pyth's aggregate of its publishers), which a data
  // plugin declares through the SDK's typed declaration.
  string terms_version = 14;

  AccessBasis access_basis = 15;

  Timeliness timeliness = 16;

  uint32 delay_minutes = 17;

  string delay_label = 18;

  string underlying_source = 19;

  // §1b: the meters that apply, empty unless the basis is licensed, and how
  // each counts.
  repeated LicenceMeter meters = 20;

  DisplayTerms display_terms = 21;

  NonDisplayTerms non_display = 22;

  EnterpriseTerms enterprise = 23;

  // §1c: use rights. The derived-data answer, which replaces the boolean
  // derived_use (ruling 479).
  DerivedUse derived_use_terms = 36;

  optional bool derived_multi_instrument_free = 24;

  bool derived_creation_is_non_display = 25;

  Redistribution redistribution = 26;

  OutsideComputation outside_computation = 27;

  repeated ProhibitedUse prohibited_uses = 28;

  // §1d: attribution, which travels with the data into pages, exports and
  // MCP answers.
  bool attribution_required = 29;

  string attribution_text = 30;

  CopyrightClass copyright_class = 31;

  bool no_more_restrictive_terms = 32;

  string not_affiliated_notice = 33;

  // §1e: the reporting owed to the vendor, which the deployment produces and
  // never sends.
  ReportCadence report_cadence = 34;

  uint32 report_due_day = 35;

  // Contract v28: personal or commercial use, and a buyer-revenue threshold,
  // as the vendor's terms state them; shown, never enforced by core. Unset:
  // the terms state no eligibility.
  DataEligibility eligibility = 37;
}

// A mirror of meridian.v1.AccessBasis.
enum AccessBasis {
  ACCESS_BASIS_UNSPECIFIED = 0;
  // Meters apply.
  ACCESS_BASIS_LICENSED = 1;
  // Free; conditions may apply.
  ACCESS_BASIS_OPEN = 2;
  ACCESS_BASIS_PUBLIC_DOMAIN = 3;
}

// A mirror of meridian.v1.Timeliness.
enum Timeliness {
  TIMELINESS_UNSPECIFIED = 0;
  TIMELINESS_REAL_TIME = 1;
  TIMELINESS_DELAYED = 2;
  TIMELINESS_END_OF_DAY = 3;
  TIMELINESS_HISTORICAL = 4;
}

// A mirror of meridian.v1.LicenceMeter.
enum LicenceMeter {
  LICENCE_METER_UNSPECIFIED = 0;
  // Counts persons (or devices).
  LICENCE_METER_DISPLAY = 1;
  // Counts plugins (or categories).
  LICENCE_METER_NON_DISPLAY = 2;
  // A flat fee per deployment.
  LICENCE_METER_ENTERPRISE = 3;
}

// The display meter's terms (§1b).
// A mirror of meridian.v1.DisplayTerms.
message DisplayTerms {
  DisplayUnit unit = 1;

  CountBasis count_basis = 2;

  // Separate professional and non-professional prices.
  bool professional_split = 3;

  ProfessionalDefinition professional_definition = 4;
}

// A mirror of meridian.v1.DisplayUnit.
enum DisplayUnit {
  DISPLAY_UNIT_UNSPECIFIED = 0;
  DISPLAY_UNIT_PERSON = 1;
  DISPLAY_UNIT_DEVICE = 2;
}

// The population the vendor bills on.
// A mirror of meridian.v1.CountBasis.
enum CountBasis {
  COUNT_BASIS_UNSPECIFIED = 0;
  COUNT_BASIS_SERVED = 1;
  COUNT_BASIS_ENTITLED = 2;
}

// A mirror of meridian.v1.ProfessionalDefinition.
enum ProfessionalDefinition {
  PROFESSIONAL_DEFINITION_UNSPECIFIED = 0;
  // The platform's one text, on the CT Plan's use-based test.
  PROFESSIONAL_DEFINITION_STANDARD = 1;
  // The vendor's, with a link.
  PROFESSIONAL_DEFINITION_VENDOR = 2;
}

// The non-display meter's terms (§1b).
// A mirror of meridian.v1.NonDisplayTerms.
message NonDisplayTerms {
  repeated NonDisplayCategory categories = 1;

  NonDisplayCount counts = 2;

  // One natural person's own automated use is free.
  bool personal_exempt = 3;
}

// By name, never number: the plans number them differently.
// A mirror of meridian.v1.NonDisplayCategory.
enum NonDisplayCategory {
  NON_DISPLAY_CATEGORY_UNSPECIFIED = 0;
  // Matching or crossing.
  NON_DISPLAY_CATEGORY_TRADING_PLATFORM = 1;
  NON_DISPLAY_CATEGORY_AUTOMATED_TRADING = 2;
  NON_DISPLAY_CATEGORY_INTERNAL = 3;
  NON_DISPLAY_CATEGORY_FOR_CLIENTS = 4;
}

// A mirror of meridian.v1.NonDisplayCount.
enum NonDisplayCount {
  NON_DISPLAY_COUNT_UNSPECIFIED = 0;
  NON_DISPLAY_COUNT_PER_PLUGIN = 1;
  // One fee per category, whatever the number of plugins.
  NON_DISPLAY_COUNT_PER_CATEGORY = 2;
}

// The enterprise meter's terms (§1b).
// A mirror of meridian.v1.EnterpriseTerms.
message EnterpriseTerms {
  repeated EnterpriseReplaces replaces = 1;

  EnterpriseForm form = 2;

  EnterpriseScope scope = 3;

  // Whether counts are no longer owed to the vendor; the deployment counts
  // regardless.
  bool reporting_waived = 4;
}

// A mirror of meridian.v1.EnterpriseReplaces.
enum EnterpriseReplaces {
  ENTERPRISE_REPLACES_UNSPECIFIED = 0;
  ENTERPRISE_REPLACES_DISPLAY_PROFESSIONAL = 1;
  ENTERPRISE_REPLACES_DISPLAY_NON_PROFESSIONAL = 2;
  ENTERPRISE_REPLACES_NON_DISPLAY = 3;
}

// A mirror of meridian.v1.EnterpriseForm.
enum EnterpriseForm {
  ENTERPRISE_FORM_UNSPECIFIED = 0;
  ENTERPRISE_FORM_FLAT = 1;
  // The most the per-unit fees can sum to.
  ENTERPRISE_FORM_CAP = 2;
}

// A mirror of meridian.v1.EnterpriseScope.
enum EnterpriseScope {
  ENTERPRISE_SCOPE_UNSPECIFIED = 0;
  ENTERPRISE_SCOPE_DEPLOYMENT = 1;
}

// A mirror of meridian.v1.DerivedUse.
enum DerivedUse {
  // Not stated: read the deprecated boolean derived_use, false as
  // internal_only and true as not_restricted.
  DERIVED_USE_UNSPECIFIED = 0;
  DERIVED_USE_NOT_RESTRICTED = 1;
  DERIVED_USE_INTERNAL_ONLY = 2;
  DERIVED_USE_REDISTRIBUTION_NEEDS_LICENCE = 3;
}

// A mirror of meridian.v1.Redistribution.
enum Redistribution {
  REDISTRIBUTION_UNSPECIFIED = 0;
  REDISTRIBUTION_NOT_ALLOWED = 1;
  REDISTRIBUTION_LICENCE_REQUIRED = 2;
  REDISTRIBUTION_ALLOWED_WITH_ATTRIBUTION = 3;
}

// A mirror of meridian.v1.OutsideComputation.
enum OutsideComputation {
  OUTSIDE_COMPUTATION_UNSPECIFIED = 0;
  OUTSIDE_COMPUTATION_ALLOWED = 1;
  // Only inside one person's request, served uncached.
  OUTSIDE_COMPUTATION_PER_REQUEST_NO_RETENTION = 2;
  OUTSIDE_COMPUTATION_NOT_ALLOWED = 3;
}

// A mirror of meridian.v1.ProhibitedUse.
enum ProhibitedUse {
  PROHIBITED_USE_UNSPECIFIED = 0;
  PROHIBITED_USE_MODEL_TRAINING = 1;
  PROHIBITED_USE_REPLICATE_SERVICE = 2;
  PROHIBITED_USE_INDEX_CREATION = 3;
}

// A mirror of meridian.v1.CopyrightClass.
enum CopyrightClass {
  COPYRIGHT_CLASS_UNSPECIFIED = 0;
  COPYRIGHT_CLASS_PUBLIC_DOMAIN = 1;
  COPYRIGHT_CLASS_COPYRIGHT_CITATION_REQUIRED = 2;
  COPYRIGHT_CLASS_COPYRIGHT_PREAPPROVAL_REQUIRED = 3;
}

// A mirror of meridian.v1.ReportCadence.
enum ReportCadence {
  REPORT_CADENCE_UNSPECIFIED = 0;
  REPORT_CADENCE_NONE = 1;
  REPORT_CADENCE_MONTHLY = 2;
  REPORT_CADENCE_ANNUAL_DECLARATION = 3;
  REPORT_CADENCE_ON_CHANGE = 4;
}

// Contract v28 (DatasetLicence.eligibility): states who may take the dataset
// (ruling 491).
// A mirror of meridian.v1.DataEligibility.
message DataEligibility {
  // Each use the terms admit. None: any use.
  repeated DataUse uses = 1;

  // The terms admit a buyer whose annual revenue is below it. Unset: no upper
  // threshold.
  optional Decimal buyer_revenue_below = 2;

  // The terms admit a buyer whose annual revenue is at least it. Unset: no
  // lower threshold.
  optional Decimal buyer_revenue_at_least = 3;

  // The ISO 4217 code the terms state the thresholds in, USD. Empty where
  // neither threshold is set; set whenever one is.
  string buyer_revenue_currency_code = 4;
}

// A mirror of meridian.v1.DataUse.
enum DataUse {
  // Never sent.
  DATA_USE_UNSPECIFIED = 0;
  // A natural person's own investing.
  DATA_USE_PERSONAL = 1;
  // A firm's use.
  DATA_USE_COMMERCIAL = 2;
}

// What class of source a dataset's prices come from (contract 28, amended
// 2026-10-31, ruling 906).
// A mirror of meridian.v1.PriceSourceClass.
enum PriceSourceClass {
  // Not stated, as in every catalogue before the amendment.
  PRICE_SOURCE_CLASS_UNSPECIFIED = 0;
  // Prices of trades done: a venue's last, its close or its settlement.
  PRICE_SOURCE_CLASS_TRADED = 1;
  // Prices someone stands ready to deal at: a venue's or a dealer's
  // executable bid and ask, and the mid between them.
  PRICE_SOURCE_CLASS_FIRM_QUOTE = 2;
  // An aggregate of several contributors' prices by the vendor's stated
  // method, as Pyth's aggregate of its publishers is.
  PRICE_SOURCE_CLASS_COMPOSITE = 3;
  // A pricing service's or a model's evaluation, not a price dealt or
  // offered, as an evaluated bond price or a vendor's model price is.
  PRICE_SOURCE_CLASS_EVALUATED = 4;
}

// A dataset's latest sign of life: its source's heartbeat or poll, which
// confirms the values in force. Not a row, and never kept as one.
// A mirror of meridian.v1.DatasetLiveness.
message DatasetLiveness {
  // A dataset the recording instance declares, `instance:key`.
  string dataset = 1;

  // The venue it is for, the venue master's ID; empty for the dataset's
  // consolidated view.
  string venue_id = 2;

  // The source's last heartbeat or poll, on the one clock.
  int64 alive_at_ns = 3;

  // The recording instance, stamped by its sidecar.
  string instance = 4;
}

// A plugin instance's entitlement to a dataset, as the conductor keeps it
// (W10.1). Set by a deployment admin; never sent to the platform.
// A mirror of meridian.v1.DatasetEntitlement.
message DatasetEntitlement {
  string dataset = 1;

  // The plugin instance entitled.
  string instance = 2;

  // Whether it may read the dataset; false withdraws it.
  bool allowed = 3;

  // The fields it may read, by their dictionary entries; empty for every
  // field. At most 64.
  repeated string fields = 4;

  // Who set it and when, the deployment-local subject the dashboard
  // stamped; the delegation and client a person acted through, empty in a
  // browser; and why. Each change is its own record (decisions/031).
  string updated_by = 5;

  int64 updated_at_ns = 6;

  string acting_through_delegation = 7;

  string client_name = 8;

  string note = 9;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 10;
}

// A job (W12.1): what to compute, over what, against which inputs, named by
// reference. A read: it changes no record.
// A mirror of meridian.v1.Job.
message Job {
  // The accounts it is over, each in the client's read scope, which the
  // sidecar stamps on the request; one outside it is refused naming it.
  repeated string account_ids = 1;

  // Its inputs, by reference.
  InputRefs inputs = 2;

  // The measures, each by definition and version.
  repeated MeasureRef measures = 3;

  // Trades added to one account's positions (W12.5); unset for none.
  WhatIf what_if = 4;

  // Contract v27 (W12.1; ruling 458): a business date, ISO 8601 in the
  // deployment's time zone -- the book at that date's end, the lake at that
  // date's closes; empty for now. Refused beside inputs.book_at or
  // inputs.lake_as_of_ns, and for a date after today's.
  string business_date = 5;

  // Contract v27 (W12.1; ruling 459): the cash instrument the figures are
  // converted to, by its `INS-` ID; empty answers each account in its base
  // currency.
  string reporting_currency = 6;

  // Contract v28: each an underlying, an expiration window or series keys;
  // series not held are priced from their chain rows, never minted (ruling
  // 561). None: the job is over its accounts alone.
  repeated ChainRef chains = 7;

  // Contract v28: the axes the engine generates the points from; the answer's
  // hash covers it. Unset: no inline scenario.
  ScenarioSet scenario_set = 8;

  // Contract v28: its row key and version in the lake (W12.8); refused beside
  // scenario_set. Unset: no saved scenario.
  ScenarioRef scenario_ref = 9;
}

// A job's inputs, by reference (requirement 3): one watermark and one as-of
// for the whole job (requirements 7, 8).
// A mirror of meridian.v1.InputRefs.
message InputRefs {
  // The book's watermark; unset for now, which the component resolves to
  // the watermark it read and answers in the provenance.
  Watermark book_at = 1;

  // The lake's recorded-time cut-off; 0 for now, resolved likewise.
  int64 lake_as_of_ns = 2;

  // The lake's source choice; none set is the deployment's default.
  SourceChoice sources = 3;
}

// A measure, by definition and version (requirement 14).
// A mirror of meridian.v1.MeasureRef.
message MeasureRef {
  // A definition the component serves: `market_value`, `exposure`,
  // `concentration`, `pnl`, `historical_var`, `expected_shortfall`,
  // `resolution_payoff`, `implied_distribution` in v26; from v27 `pnl`
  // version 2 (realized beside unrealized) and `execution_cost`.
  string definition = 1;

  // Its version, 1 or more.
  int32 version = 2;

  // What to break the figures down by, each a breakdown the definition
  // allows: `account`, `asset_class`, `currency`, `instrument`, `sleeve`,
  // `country`, or a scheme the deployment holds by its name.
  repeated string breakdowns = 3;

  // For an event measure, the event group it is over (W3.30).
  string event_group_id = 4;
}

// Trades added to one account's positions for a what-if (W12.5): never a
// book record unless proposed.
// A mirror of meridian.v1.WhatIf.
message WhatIf {
  string account_id = 1;

  repeated WhatIfTrade trades = 2;
}

// A mirror of meridian.v1.WhatIfTrade.
message WhatIfTrade {
  string instrument_id = 1;

  Side side = 2;

  Decimal quantity = 3;

  // An assumed price; unset for the price at the job's as-of.
  optional Money price = 4;
}

// Contract v28 (Job.chains): names chains a job prices (contract v28).
// A mirror of meridian.v1.ChainRef.
message ChainRef {
  // Its INS- record, the subject of its chain rows. Never empty.
  string underlying_instrument_id = 1;

  // A plain date. Empty: from the earliest.
  string expiration_from = 2;

  // A plain date. Empty: to the latest.
  string expiration_to = 3;

  // Their occ_osi symbols, or tickers each carrying its venue's MIC in source.
  // None: every series in the window.
  repeated Identifier series_keys = 4;
}

// Contract v28 (Job.scenario_set): carries a scenario set inline, unsaved (the
// one-API spec's Q20).
// A mirror of meridian.v1.ScenarioSet.
message ScenarioSet {
  // A person's or a plugin's words. Never empty.
  string name = 1;

  // Their product is the set; only the axes are saved, never the points. Never
  // empty.
  repeated ScenarioAxis axes = 2;
}

// Contract v28 (ScenarioSet.axes): names the axes the set's points are
// generated from (ruling 582).
// A mirror of meridian.v1.ScenarioAxis.
message ScenarioAxis {
  // Spot, vol, date, minutes, or a person's word. Never empty.
  string name = 1;

  // Each a scenario; position 0 first. Never empty.
  repeated Scenario steps = 2;
}

// Contract v28 (ScenarioAxis.steps): lists an axis's steps in order.
// A mirror of meridian.v1.Scenario.
message Scenario {
  // A person's or a plugin's words. Never empty.
  string name = 1;

  // Each to one object or every object of a kind. None: the base, nothing
  // moved.
  repeated Shock shocks = 2;
}

// Contract v28 (Scenario.shocks): carries the shocks applied together.
// A mirror of meridian.v1.Shock.
message Shock {
  // The market object, by the lake's names. Unspecified is refused.
  ShockObject object = 1;

  // A subject ID, or every object of the kind. Never unset, except on a time
  // shock.
  ShockTarget target = 2;

  // One of the forms its object takes. Unspecified is refused: a form is
  // stated, never inferred (ruling 581).
  ShockForm form = 3;

  // The unit its value is in. Unspecified is refused but on a time shock to
  // settlement.
  ShockUnit unit = 4;

  // Signed, in the shock's unit. Unset on a bucketed shock, whose buckets
  // carry the values, and on a time shock to settlement.
  optional Decimal value = 5;

  // Each a tenor and its value; linear between key tenors. None except on a
  // bucketed shock.
  repeated ShockBucket buckets = 6;
}

// A mirror of meridian.v1.ShockObject.
enum ShockObject {
  // Refused.
  SHOCK_OBJECT_UNSPECIFIED = 0;
  // An instrument's price, or an FX rate as its currency's cash instrument's
  // price (ruling 584).
  SHOCK_OBJECT_SPOT = 1;
  // An underlying's fitted volatility surface.
  SHOCK_OBJECT_VOL_SURFACE = 2;
  // A rate curve or a single rate, a referential record.
  SHOCK_OBJECT_RATE = 3;
  // The valuation time.
  SHOCK_OBJECT_TIME = 4;
}

// Contract v28 (Shock.target): names the object shocked (ruling 583).
// A mirror of meridian.v1.ShockTarget.
message ShockTarget {
  // An INS- record: an instrument, a currency's cash instrument, an underlying
  // for its surface, a referential rate or curve. Empty where every is true.
  string subject_id = 1;

  // True: every spot, every surface or every rate the job reads; refused
  // beside a subject_id. False: subject_id names the object.
  bool every = 2;
}

// A mirror of meridian.v1.ShockForm.
enum ShockForm {
  // Refused.
  SHOCK_FORM_UNSPECIFIED = 0;
  // Spot: a relative move, the default for spot.
  SHOCK_FORM_RELATIVE = 1;
  // Spot: an absolute move in the price's currency; time: a shift by its unit.
  SHOCK_FORM_ABSOLUTE = 2;
  // Vol or rates: the same move at every expiry or tenor.
  SHOCK_FORM_PARALLEL = 3;
  // Vol by expiry bucket, rates by key tenor, linear between keys.
  SHOCK_FORM_BUCKETED = 4;
  // Time: each option moved to its own settlement time (G16).
  SHOCK_FORM_TO_SETTLEMENT = 5;
}

// A mirror of meridian.v1.ShockUnit.
enum ShockUnit {
  // Refused, except on a time shock to settlement.
  SHOCK_UNIT_UNSPECIFIED = 0;
  // Spot, relative: 10 is +10%.
  SHOCK_UNIT_PERCENT = 1;
  // Spot, absolute, in the price's currency.
  SHOCK_UNIT_PRICE = 2;
  // Vol, absolute: 2 is +2 vol points.
  SHOCK_UNIT_VOL_POINTS = 3;
  // Rates: 25 is +25 bp.
  SHOCK_UNIT_BASIS_POINTS = 4;
  // Time, calendar days.
  SHOCK_UNIT_DAYS = 5;
  // Time, calendar minutes, counted over 525,600 a year (G16).
  SHOCK_UNIT_MINUTES = 6;
}

// Contract v28 (Shock.buckets): states a bucketed shock's values.
// A mirror of meridian.v1.ShockBucket.
message ShockBucket {
  // A count and a unit (1M, 3M, 10Y), v27's Tenor. Never unset.
  Tenor tenor = 1;

  // Signed, in the shock's unit. Never unset.
  Decimal value = 2;
}

// Contract v28 (Job.scenario_ref): names a saved scenario or set.
// A mirror of meridian.v1.ScenarioRef.
message ScenarioRef {
  // Its row key in the signal plugin's scenarios dataset. Never empty.
  string row_key = 1;

  // The signal plugin's scenarios dataset. Never empty.
  string dataset = 2;

  // The row key's version; an edited scenario is a new version. 0: the latest
  // version.
  uint64 version = 3;
}

// A job's answer (W12.1, W12.4): figures, what was not evaluated and why,
// and what it was computed from. Not a record: recomputable from its
// provenance, cached by hash and losable (Q12).
// A mirror of meridian.v1.JobAnswer.
message JobAnswer {
  string job_id = 1;

  repeated Figure figures = 2;

  repeated NotEvaluated not_evaluated = 3;

  AnswerProvenance provenance = 4;

  // Where ReadJobAnswer's next page starts, for its cursor; empty on the
  // last page, and on an answer RunJob gave inline, which is always whole
  // (contract v28's amendment, ruling 794).
  string next_cursor = 5;
}

// One figure (requirement 5; the first release's Q13 and Q14).
// A mirror of meridian.v1.Figure.
message Figure {
  // The measure it answers.
  MeasureRef measure = 1;

  // The account it is for; empty for a figure across the job's accounts.
  string account_id = 2;

  // Its place in each breakdown the measure asked for.
  repeated BreakdownValue breakdown = 3;

  // Which scenario it is under: base, a what-if, a historical day, an
  // outcome.
  ScenarioKey scenario_key = 4;

  // The value, for a figure that is one; unset for a weight.
  optional Decimal value = 5;

  // A weight or a probability, as its two parts, so a bound is compared by
  // cross-multiplication, never a rounded division; unset for a value.
  optional Decimal numerator = 6;

  optional Decimal denominator = 7;

  // The cash instrument a value is in: the account's base currency or the
  // client's stated reporting currency; empty for a weight.
  string currency_instrument_id = 8;

  // How it was computed: exact in v26, model from v28.
  ComputedAs computed_as = 9;

  // Contract v27 (W12.2; ruling 374): its oldest input's source time; 0 for
  // a figure that read no market data.
  int64 oldest_input_source_ns = 10;

  // Contract v28: its occ_osi symbol, or a ticker carrying its venue's MIC in
  // source. None: the figure names an INS- record or none.
  repeated Identifier series_key = 11;
}

// A figure's place in one breakdown.
// A mirror of meridian.v1.BreakdownValue.
message BreakdownValue {
  // The breakdown, as MeasureRef.breakdowns names it.
  string breakdown = 1;

  // Its value: an asset class's name, an ISO 4217 code or a cash
  // instrument's ID, an instrument's ID, a sleeve, a country's ISO 3166-1
  // alpha-2 code, or a scheme's class.
  string value = 2;
}

// Which scenario a figure is under (the first release's Q13, approved
// 2026-10-14): one shape for what-ifs, VaR's days, resolution payoffs and,
// from v28, a grid point, which adds a kind and no field.
// A mirror of meridian.v1.ScenarioKey.
message ScenarioKey {
  ScenarioKind kind = 1;

  // For a historical day, the business date, ISO 8601.
  string business_date = 2;

  // For an outcome, the member of the event group that resolves YES.
  string outcome_instrument_id = 3;

  // Contract v28: the saved row key, or `inline` for a job's own set. Empty
  // except on a scenario point.
  string scenario_row_key = 4;

  // Contract v28: the row key's version. 0 except on a saved scenario's point.
  uint64 scenario_version = 5;

  // Contract v28: one position per axis, from 0, in the set's axis order: the
  // point is the product of those steps. None except on a scenario set's
  // point.
  repeated uint32 axis_positions = 6;
}

// A mirror of meridian.v1.ScenarioKind.
enum ScenarioKind {
  // Read as base.
  SCENARIO_KIND_UNSPECIFIED = 0;
  // The positions and market as they are.
  SCENARIO_KIND_BASE = 1;
  // With the job's what-if trades added (W12.5).
  SCENARIO_KIND_WHAT_IF = 2;
  // One historical day's returns applied, for historical VaR and ES.
  SCENARIO_KIND_HISTORICAL_DAY = 3;
  // One member of an event group resolving YES (`resolution_payoff`).
  SCENARIO_KIND_OUTCOME = 4;
  // No named member resolving YES, for a group mutually exclusive and not
  // exhaustive (the options and event contracts spec's question 4).
  SCENARIO_KIND_NONE_OF_THE_NAMED = 5;
  // Contract v28: One point of a scenario or a scenario set, keyed by its set
  // and axis positions.
  SCENARIO_KIND_SCENARIO_POINT = 6;
}

// How a figure was computed (the first release's Q14, approved 2026-10-14
// as `exact` and `model`).
// A mirror of meridian.v1.ComputedAs.
enum ComputedAs {
  // Read as exact by a v26 reader; never sent by the component.
  COMPUTED_AS_UNSPECIFIED = 0;
  // Exact decimal from quantities, quoted prices and FX.
  COMPUTED_AS_EXACT = 1;
  // A model's floating-point value, crossing at its definition's scale,
  // rounded half to even (Q8): from v28.
  COMPUTED_AS_MODEL = 2;
}

// A position or a figure not evaluated, and why (requirement 9): never
// zero.
// A mirror of meridian.v1.NotEvaluated.
message NotEvaluated {
  string account_id = 1;

  // The instrument; empty where the whole measure is not evaluated.
  string instrument_id = 2;

  MeasureRef measure = 3;

  NotEvaluatedReason reason = 4;

  // The dataset not entitled, the implementation unavailable, or the
  // scheme not held, where the reason names one.
  string detail = 5;

  // Contract v27 (W12.2; ruling 374): on a stale price, its age at the
  // job's as-of and the ceiling in force, the tighter of the dataset's and
  // the client's; 0 on any other reason.
  int64 age_ns = 6;

  int64 ceiling_ns = 7;

  // Contract v28: its key, as Figure.series_key. None.
  repeated Identifier series_key = 8;
}

// A mirror of meridian.v1.NotEvaluatedReason.
enum NotEvaluatedReason {
  NOT_EVALUATED_REASON_UNSPECIFIED = 0;
  // No price of the kind the model declares at the as-of.
  NOT_EVALUATED_REASON_PRICE_MISSING = 1;
  // A price older than the client's setting for its source allows.
  NOT_EVALUATED_REASON_PRICE_STALE = 2;
  // A conversion leg to the base or reporting currency missing.
  NOT_EVALUATED_REASON_CONVERSION_MISSING = 3;
  // A dataset the client is not entitled to, named in detail (Q11).
  NOT_EVALUATED_REASON_NOT_ENTITLED = 4;
  // A local `LCL-` record: never priced.
  NOT_EVALUATED_REASON_LOCAL_RECORD = 5;
  // The routed implementation did not answer by the deadline, for a figure
  // a compliance rule reads (requirement 22).
  NOT_EVALUATED_REASON_IMPLEMENTATION_UNAVAILABLE = 6;
  // A breakdown whose scheme the deployment does not hold (requirement 17).
  NOT_EVALUATED_REASON_SCHEME_NOT_HELD = 7;
  // An implied distribution over a group not exhaustive in the version in
  // force (the first release's Q5): the raw prices and their sum still
  // answered.
  NOT_EVALUATED_REASON_GROUP_NOT_EXHAUSTIVE = 8;
  // History too short or too sparse for the definition's window.
  NOT_EVALUATED_REASON_HISTORY_INSUFFICIENT = 9;
  // Contract v27 (W12.2; ruling 325): a lot's cost the book does not
  // record, which the measure needs.
  NOT_EVALUATED_REASON_COST_MISSING = 10;
  // Contract v28: An option quote below its intrinsic value: no implied
  // volatility exists for it.
  NOT_EVALUATED_REASON_BELOW_INTRINSIC = 11;
  // Contract v28: A surface fit that failed a no-arbitrage check or did not
  // converge.
  NOT_EVALUATED_REASON_FIT_FAILED = 12;
  // Contract v28: The only input in force is invalid, its dataset in detail
  // (ruling 421).
  NOT_EVALUATED_REASON_INPUT_QUARANTINED = 13;
  // Contract v29: a debt record minted incomplete, its missing fields named --
  // a callable bond without its calls -- so no yield to worst or cash flow is
  // computed from a guess.
  NOT_EVALUATED_REASON_TERMS_INCOMPLETE = 14;
}

// What an answer was computed from (requirements 4 and 35; Q7). Named so it
// is not mistaken for meridian.v1.Provenance, a value's source.
// A mirror of meridian.v1.AnswerProvenance.
message AnswerProvenance {
  // The watermark and the as-of the job read at.
  Watermark book_watermark = 1;

  int64 lake_as_of_ns = 2;

  // Each dataset read, as the lake's replies named them.
  repeated string datasets = 3;

  repeated InstrumentInput instruments = 4;

  repeated ModelRef models = 5;

  repeated MeasureRef measures = 6;

  // Each event group read, at the version in force.
  repeated EventGroupInput event_groups = 7;

  // The routing table's version (W12.6).
  int64 routing_version = 8;

  // The component's version.
  string engine_version = 9;

  // `sha256:` and the hex of SHA-256 over the RFC 8785 canonical JSON of
  // the inputs: two answers with the same hash are the same answer.
  string answer_hash = 10;

  // Contract v27 (W12.7): the job's business date, where it had one.
  string business_date = 11;

  // Contract v27 (W12.7; ruling 460): each position's input price.
  repeated InputPrice input_prices = 12;

  // Contract v27 (W12.7; ruling 462): each conversion leg, direct or
  // derived, with the pivot a cross went through.
  repeated ConversionLeg conversion_legs = 13;
}

// One instrument a job read, by its record's and template's versions.
// A mirror of meridian.v1.InstrumentInput.
message InstrumentInput {
  string instrument_id = 1;

  int64 record_version = 2;

  string template_id = 3;

  string template_version = 4;

  // The template's calculation package's version (W1.24).
  string calculation_version = 5;
}

// A pricing model and the implementation that answered for it.
// A mirror of meridian.v1.ModelRef.
message ModelRef {
  // `cash`, `quoted_price` or `binary_event` in v26.
  string model_id = 1;

  int32 model_version = 2;

  // `built-in`, or a `pricing` plugin's instance ID.
  string implementation = 3;

  // The component's version for the built-in one; the plugin's version
  // for a plugin's.
  string implementation_version = 4;
}

// One event group a job read, at its version.
// A mirror of meridian.v1.EventGroupInput.
message EventGroupInput {
  string event_group_id = 1;

  int64 version = 2;
}

// One position's input price (contract v27; ruling 460).
// A mirror of meridian.v1.InputPrice.
message InputPrice {
  string instrument_id = 1;

  Money price = 2;

  // The lake row it came from: its dataset, row key and version.
  string dataset = 3;

  string row_key = 4;

  uint64 version = 5;

  // Its source time: the `event` time where present, else the earliest.
  int64 source_ns = 6;
}

// One conversion leg (contract v27; ruling 462): from one cash instrument to
// another, at a rate, direct from the lake or derived from it.
// A mirror of meridian.v1.ConversionLeg.
message ConversionLeg {
  string from_instrument_id = 1;

  string to_instrument_id = 2;

  // Units of `to` per unit of `from`; an inverted rate is 1 ÷ x rounded half
  // to even to 18 places.
  Decimal rate = 3;

  ConversionDerivation derivation = 4;

  // A cross's pivot, by its cash instrument's ID; empty otherwise.
  string via_instrument_id = 5;

  // The dataset the lake's rate came from.
  string dataset = 6;
}

// How a conversion leg's rate was found (contract v27; ruling 462). Never
// for a crypto or stablecoin leg, which converts by its own lake price.
// A mirror of meridian.v1.ConversionDerivation.
enum ConversionDerivation {
  CONVERSION_DERIVATION_UNSPECIFIED = 0;
  // The lake's rate in the leg's direction.
  CONVERSION_DERIVATION_DIRECT = 1;
  // The lake's rate the other way, inverted.
  CONVERSION_DERIVATION_INVERTED = 2;
  // Through a pivot, by the deployment's pivot order.
  CONVERSION_DERIVATION_CROSSED = 3;
}

// A measure's versioned definition (requirements 14 to 17; Q15): shipped
// with the component, each fixing every parameter that changes its number.
// A mirror of meridian.v1.MeasureDefinition.
message MeasureDefinition {
  string definition = 1;

  int32 version = 2;

  // Its parameters, fixed by the version: a VaR's confidence, horizon,
  // window, return type, missing-day treatment and quantile.
  repeated MeasureParameter parameters = 3;

  // The breakdowns it allows.
  repeated string breakdowns = 4;

  // The scale its values are rounded to, once, half to even; at most 18.
  int32 scale = 5;

  // The component's words for it.
  string description = 6;
}

// A mirror of meridian.v1.MeasureParameter.
message MeasureParameter {
  string name = 1;

  // As the definition writes it: `0.99`, `500`, `relative`.
  string value = 2;
}

// A batch the component hands the `pricing` instance a model id is routed
// to (W12.3), delivered to that instance alone and caught up by sequence.
// A mirror of meridian.v1.PriceBatchRequest.
message PriceBatchRequest {
  string batch_id = 1;

  // The routed instance, which alone hears it (matrix/directed.tsv).
  string pricing_instance_id = 2;

  string model_id = 3;

  int32 model_version = 4;

  repeated PricingUnit units = 5;

  // When the component stops waiting for the answer.
  int64 deadline_ns = 6;

  // `sha256:` over the batch's inputs, naming it: a batch answered twice is
  // harmless.
  string batch_hash = 7;

  // Its place in the instance's sequence, which ListPriceBatches reads
  // after.
  int64 sequence = 8;
}

// One instrument to price under one scenario, with exactly the market
// objects its model declares (requirement 20).
// A mirror of meridian.v1.PricingUnit.
message PricingUnit {
  string instrument_id = 1;

  string template_version = 2;

  ScenarioKey scenario_key = 3;

  repeated MarketObjectValue inputs = 4;
}

// A market object's value, by the lake's terms (Q6): observed, or a
// scenario's in its place.
// A mirror of meridian.v1.MarketObjectValue.
message MarketObjectValue {
  // The instrument it is about.
  string subject_id = 1;

  // The lake's kind: `close`, `nav`, `mid`, `last`, or `outcome`.
  string kind = 2;

  // A price, in the asset it is quoted in; for `outcome`, the settlement
  // value per contract.
  Money value = 3;

  // The dataset it came from; empty for a scenario's value.
  string dataset = 4;
}

// A mirror of meridian.v1.PricedUnit.
message PricedUnit {
  string instrument_id = 1;

  ScenarioKey scenario_key = 2;

  // A value per unit, in the base currency the batch's inputs convert to.
  // From contract v27, under quoted_price, rounded half to even to 18
  // decimal places, as the built-in implementation rounds it (rulings 453
  // and 486).
  Money value_per_unit = 3;
}

// A sensitivity a model declares: carried empty in v26.
// A mirror of meridian.v1.Sensitivity.
message Sensitivity {
  string instrument_id = 1;

  ScenarioKey scenario_key = 2;

  // The sensitivity's name, as the model declares it.
  string name = 3;

  Decimal value = 4;
}

// A job answered later has finished (W12.4), heard by the instance that ran
// it alone.
// A mirror of meridian.v1.JobFinishedEvent.
message JobFinishedEvent {
  string job_id = 1;

  // The instance that ran it, which alone hears it (matrix/directed.tsv).
  string client_instance_id = 2;

  string answer_hash = 3;

  int64 finished_at_ns = 4;

  // Its place in the instance's sequence, which ListFinishedJobs reads
  // after.
  int64 sequence = 5;
}

// A flag a venue may not state (A2): unknown is never false.
// A mirror of meridian.v1.EventGroupFlag.
enum EventGroupFlag {
  // Read as not stated.
  EVENT_GROUP_FLAG_UNSPECIFIED = 0;
  EVENT_GROUP_FLAG_TRUE = 1;
  EVENT_GROUP_FLAG_FALSE = 2;
  EVENT_GROUP_FLAG_NOT_STATED = 3;
}

// One range member's bounds as its venue states them (contract v27; ruling
// 464): the binary event contract template's floor, cap and bound_unit.
// A mirror of meridian.v1.EventGroupMemberBound.
message EventGroupMemberBound {
  // One of the report's members.
  string instrument_id = 1;

  EventContractBound floor = 2;

  EventContractBound cap = 3;

  string bound_unit = 4;
}

// An event's group of contracts, at a version.
// A mirror of meridian.v1.EventGroup.
message EventGroup {
  // `EVG-` and a ULID, the platform's; `LCL-` and a ULID for a deployment's
  // own while it waits (A8's gap measure).
  string event_group_id = 1;

  // The venue that states it, the venue master's ID.
  string venue_id = 2;

  // The venue's reference for its event: Kalshi's event ticker,
  // Polymarket's event slug.
  string venue_event_ref = 3;

  // The venue's words for it.
  string title = 4;

  repeated string member_instrument_ids = 5;

  EventGroupFlag mutually_exclusive = 6;

  EventGroupFlag exhaustive = 7;

  // The venue's series, for a recurring event (A5); no series record in
  // v26.
  string series_id = 8;

  // Monotonic from 1; a new version for each change of a flag or a member.
  int64 version = 9;

  // When this version became true, as the venue states it.
  int64 valid_from_ns = 10;

  // Stamped by the store.
  int64 record_time_ns = 11;

  // True for the deployment's own `LCL-` group, not yet matched or minted.
  bool provisional = 12;

  // Its place in the store's sequence of event groups, which a read after
  // a sequence catches up by.
  int64 sequence = 13;
}

// A rate (W10.4): a fixing, an average, an index level or a curve point, for
// one subject -- a referential `INS-` record -- as one source stated it. A
// curve is one record; its points are rows, each with its tenor. Conflated
// per subject, dataset, kind, tenor, maturity and convention.
// A mirror of meridian.v1.Rate.
message Rate {
  ObservationMeta meta = 1;

  RateKind kind = 2;

  // The value with its unit: a percent, basis points or an index level.
  UnitValue value = 3;

  RateConvention convention = 4;

  // A curve point's tenor, a count and a unit (`3M`, `10Y`, `ON`), or its
  // exact maturity, ISO 8601; neither on a rate that is no curve point.
  Tenor tenor = 5;

  string maturity_date = 6;

  // True while the source marks it preliminary; its final value is the next
  // version of the row key.
  bool preliminary = 7;

  // Optional, as the source states them: the volume transacted, how many
  // transactions, and the distribution's percentiles (SOFR's 1st, 25th,
  // 75th and 99th). Not stated is unset, never zero.
  optional Money volume = 8;

  optional uint64 transaction_count = 9;

  repeated RatePercentile percentiles = 10;
}

// What a rate is (FDP item 1).
// A mirror of meridian.v1.RateKind.
enum RateKind {
  // Refused.
  RATE_KIND_UNSPECIFIED = 0;
  // A reference rate's daily fixing: SOFR, EFFR, €STR.
  RATE_KIND_FIXING = 1;
  // A compounded or simple average over a period: the SOFR averages.
  RATE_KIND_AVERAGE = 2;
  // An index's level: the SOFR Index.
  RATE_KIND_INDEX_LEVEL = 3;
  // A par yield curve's point.
  RATE_KIND_PAR_YIELD = 4;
  // A zero-coupon yield curve's point.
  RATE_KIND_ZERO = 5;
  // A bill's bank-discount rate.
  RATE_KIND_DISCOUNT = 6;
  // A bill's coupon-equivalent (bond-equivalent) yield.
  RATE_KIND_COUPON_EQUIVALENT = 7;
}

// One percentile of a rate's distribution, as the source states it.
// A mirror of meridian.v1.RatePercentile.
message RatePercentile {
  // 1 to 99.
  uint32 percentile = 1;

  Decimal value = 2;
}

// One histogram snapshot over an interval: a session's metric, or a dataset's
// age at a hop.
// A mirror of meridian.v1.LatencySnapshot.
message LatencySnapshot {
  int64 interval_start_ns = 1;

  int64 interval_ns = 2;

  // The session, by the plugin's own name for it; empty for a dataset's.
  string session = 3;

  // The dataset, `instance:key`, and the hop; empty and unspecified for a
  // session's.
  string dataset = 4;

  AgeHop hop = 5;

  LatencyMetric metric = 6;

  LatencyHistogram histogram = 7;

  LatencyCounters counters = 8;

  // The source's clock minus ours, corrected by half the round trip.
  int64 clock_skew_ns = 9;

  // The session's last message or heartbeat.
  int64 alive_at_ns = 10;

  // The absolute ceilings in force, as the plugin's settings hold them.
  LatencyCeilings ceilings = 11;

  // The reporting instance, stamped by its sidecar.
  string instance_id = 12;
}

// Where a dataset's age is measured.
// A mirror of meridian.v1.AgeHop.
enum AgeHop {
  AGE_HOP_UNSPECIFIED = 0;
  // The data plugin, on parsing the vendor's message: the feed delay.
  AGE_HOP_EDGE = 1;
  AGE_HOP_SIDECAR = 2;
  AGE_HOP_LAKE = 3;
  AGE_HOP_BUS = 4;
  AGE_HOP_ANALYTICS = 5;
  // The `ems`, at its pre-trade check.
  AGE_HOP_EMS_CHECK = 6;
  AGE_HOP_PAGE = 7;
}

// A mirror of meridian.v1.LatencyMetric.
enum LatencyMetric {
  LATENCY_METRIC_UNSPECIFIED = 0;
  // Round trip: FIX TestRequest to its Heartbeat, a WebSocket ping to its
  // pong, a REST call's duration.
  LATENCY_METRIC_RTT = 1;
  // Connectivity: placement sent to the venue's acknowledgement.
  LATENCY_METRIC_ORDER_ACK = 2;
  // Connectivity: the venue's transaction time to the fill received.
  LATENCY_METRIC_FILL_DELAY = 3;
  // A dataset's age at a hop.
  LATENCY_METRIC_AGE = 4;
}

// A sparse log-linear histogram, HdrHistogram's layout (ruling 416).
// A mirror of meridian.v1.LatencyHistogram.
message LatencyHistogram {
  int64 lowest_ns = 1;

  // 2 in v27.
  uint32 significant_digits = 2;

  repeated LatencyBucket buckets = 3;

  int64 min_ns = 4;

  int64 max_ns = 5;

  // Values recorded in the interval.
  uint64 total = 6;
}

// One bucket with a count; empty buckets are not sent.
// A mirror of meridian.v1.LatencyBucket.
message LatencyBucket {
  uint32 bucket = 1;

  uint64 count = 2;
}

// A session's congestion in the interval.
// A mirror of meridian.v1.LatencyCounters.
message LatencyCounters {
  uint64 gaps = 1;

  uint64 resends = 2;

  uint64 reconnects = 3;

  uint64 rate_limited = 4;

  // Messages queued to send, at their peak.
  uint64 backlog_peak = 5;
}

// The plugin admin's session_ceilings for the connection, in force; 0 is no
// ceiling.
// A mirror of meridian.v1.LatencyCeilings.
message LatencyCeilings {
  int64 rtt_p99_ns = 1;

  int64 order_ack_p99_ns = 2;

  int64 fill_delay_p99_ns = 3;

  int64 feed_delay_p99_ns = 4;

  int64 clock_skew_max_ns = 5;

  uint32 gaps_per_hour = 6;

  uint32 reconnects_per_hour = 7;

  uint32 backlog_max = 8;
}

// The standard benchmarks (C2).
// A mirror of meridian.v1.TcaBenchmark.
enum TcaBenchmark {
  TCA_BENCHMARK_UNSPECIFIED = 0;
  // The mid at the order's proposal.
  TCA_BENCHMARK_DECISION = 1;
  // The mid at the order's release to the desk.
  TCA_BENCHMARK_ARRIVAL = 2;
  // The mid at the placement's routed_at_ns: the broker's arrival.
  TCA_BENCHMARK_PLACEMENT_ARRIVAL = 3;
  TCA_BENCHMARK_MID_AT_FILL = 4;
  // Needs trades: never measured for FX spot from one venue.
  TCA_BENCHMARK_INTERVAL_VWAP = 5;
  // A named fixing, licensed by the deployment.
  TCA_BENCHMARK_FIX = 6;
}

// One execution's cost against one benchmark, written by the analytics
// component (W12.1's `execution_cost`), keyed by execution and benchmark. The
// lake's first rows naming an account: read within the reader's scope.
// A mirror of meridian.v1.ExecutionCost.
message ExecutionCost {
  // The envelope: its subject the execution's instrument; its source the
  // analytics component and the dataset `analytics:execution_cost`.
  ObservationMeta meta = 1;

  string execution_id = 2;

  string order_id = 3;

  // Empty for a fill on no placement accepted to a new order, and for an
  // internal cross.
  string placement_id = 4;

  string account_id = 5;

  TcaBenchmark benchmark = 6;

  // The benchmark's price and the moment it was taken at; unset and 0 when
  // unanswered.
  Money benchmark_price = 7;

  int64 benchmark_at_ns = 8;

  // The quote the benchmark came from: its dataset and row key, never mixed
  // silently.
  string benchmark_dataset = 9;

  string benchmark_row_key = 10;

  // For TCA_BENCHMARK_FIX, the fixing's `INS-` record; empty otherwise.
  string fixing_id = 11;

  Money execution_price = 12;

  Side side = 13;

  // The execution's notional, in its asset.
  Money notional = 14;

  // Side-adjusted, positive a cost: s × (price − benchmark) ÷ benchmark ×
  // 10⁴; unset when unanswered.
  optional Decimal cost_bps = 15;

  // Fees and financing, apart, in bps of notional; unset where none.
  optional Decimal fees_bps = 16;

  optional Decimal financing_bps = 17;

  // As the connectivity plugin reported them.
  LiquidityIndicator liquidity_indicator = 18;

  string venue_id = 19;

  // Why it was not measured, beside no price and no cost; unspecified when
  // measured.
  TcaUnanswered unanswered = 20;

  // The quote's staleness bound in force: 5 seconds by default, the tighter
  // of it and the dataset's stale ceiling.
  int64 staleness_bound_ns = 21;

  // The execution's time precision as stated: a manual fill's.
  TimePrecision time_precision = 22;

  // The placement's last-look rejections, and its time to fill; never a
  // cost in bps.
  uint32 reject_count = 23;

  int64 time_to_fill_ns = 24;
}

// Why a benchmark was not measured (C4, C8).
// A mirror of meridian.v1.TcaUnanswered.
enum TcaUnanswered {
  TCA_UNANSWERED_UNSPECIFIED = 0;
  // No quote in force within the staleness bound: never an imputed value.
  TCA_UNANSWERED_NO_QUOTE = 1;
  // The benchmark has no moment for this execution: a venue-originated fill
  // accepted to a new order has no decision or arrival time.
  TCA_UNANSWERED_NOT_MEASURED = 2;
}

// Contract v28 (RequestSeriesRecordsRequest.series): names the series wanted
// (W3.31).
// A mirror of meridian.v1.SeriesWant.
message SeriesWant {
  // The occ_osi symbol, or a future's or future option's exchange ticker
  // carrying its venue's ISO 10383 MIC in source. Never empty.
  repeated Identifier series_key = 1;

  // The INS- record the chain rows name as their subject. Never empty.
  string underlying_instrument_id = 2;

  // Which part of the deployment's series request rule allows it (W6.37).
  // Unspecified is refused.
  SeriesRequestCause cause = 3;
}

// A mirror of meridian.v1.SeriesRequestCause.
enum SeriesRequestCause {
  // Refused.
  SERIES_REQUEST_CAUSE_UNSPECIFIED = 0;
  // An order or a proposal names it, or is about to.
  SERIES_REQUEST_CAUSE_ORDER = 1;
  // A standing want for an underlying's series.
  SERIES_REQUEST_CAUSE_STANDING = 2;
}

// Contract v28 (RequestSeriesRecordsReply.answers): answers each series.
// A mirror of meridian.v1.SeriesAnswer.
message SeriesAnswer {
  // As asked. Never empty.
  repeated Identifier series_key = 1;

  // The INS- record the platform matched or minted. Empty where queued or
  // refused.
  string instrument_id = 2;

  // True: asked again daily, as W3.4's queued requests are. False.
  bool pending_review = 3;

  // True: nothing was sent to the platform. False.
  bool refused_by_rule = 4;
}

// Contract v28: a listed option or future series as its source lists it: its
// key, its underlying and its terms as the template's fields, never minting it
// (contract v28).
// A mirror of meridian.v1.ListedSeries.
message ListedSeries {
  // Its row key, the underlying as its subject, the series_key, its source,
  // valid time and version; an adjustment is the next version of its key.
  // Never unset.
  ObservationMeta meta = 1;

  // The listed_option, future or future_option template's TPL- ID. Never
  // empty.
  string template_id = 2;

  // A published version the catalogue holds. Never empty.
  string template_version = 3;

  // Each by its template path, the values the platform needs for a
  // template-complete request (W3.31). Never empty.
  repeated TemplateFieldValue fields = 4;

  // Filled by the lake on a read, from the instrument store, never minted.
  // Empty: the deployment holds no record with the series' key; never set by a
  // writer.
  string instrument_id = 5;
}

// Contract v28: a value per contract per trading date as its source publishes
// it: open interest, volume, block volume (contract v28).
// A mirror of meridian.v1.Statistic.
message Statistic {
  // Its key, its subject (the contract's INS- record, or the underlying with
  // the series_key), its source and its business_date, the trading date it is
  // for. Never unset.
  ObservationMeta meta = 1;

  // The kind, a closed list growing by revision. Unspecified is refused.
  StatisticKind kind = 2;

  // Contracts for an option or a future, shares for an equity. Never unset; a
  // source that does not state one records no row, never a zero.
  UnitValue value = 3;
}

// A mirror of meridian.v1.StatisticKind.
enum StatisticKind {
  // Refused.
  STATISTIC_KIND_UNSPECIFIED = 0;
  // Contracts open at the trading date's end, as the clearing house or the
  // chain states it.
  STATISTIC_KIND_OPEN_INTEREST = 1;
  // Contracts traded on the date; cleared volume where the source is the
  // clearing house.
  STATISTIC_KIND_VOLUME = 2;
  // Contracts traded in blocks on the date, as the source states it.
  STATISTIC_KIND_BLOCK_VOLUME = 3;
  // Shares sold short on the date as reported to a FINRA facility, FINRA's
  // daily short-sale volume file (ruling 593).
  STATISTIC_KIND_SHORT_VOLUME = 4;
  // All shares reported to that facility on the date, the same file's total
  // (ruling 593).
  STATISTIC_KIND_TOTAL_VOLUME = 5;
}

// Contract v28: a listed option's exercise, assignment or expiry, or a
// future's day of settlement variation, reported, proposed or released, each
// its own record (contract v28, W9.16 to W9.19).
// A mirror of meridian.v1.LifecycleEvent.
message LifecycleEvent {
  // LCE- and a ULID, minted by the book, never reused. Empty on a request;
  // never empty on a record.
  string event_id = 1;

  // An account in the sender's scope. Never empty.
  string account_id = 2;

  // A listed_option, future_option or future INS- record; from contract v29 a
  // debt record (bond, mbs_pool, tba, cmo_tranche, certificate_of_deposit).
  // Never empty.
  string instrument_id = 3;

  // The event's kind, a closed list. Unspecified is refused.
  LifecycleEventKind kind = 4;

  // Decided by the book. Unset on a request.
  LifecycleEventState state = 5;

  // Contracts exercised, assigned or expired; on a variation, the contracts
  // held at the settlement; from contract v29, on a debt record, its face
  // (original face for a pool or a tranche). Never unset.
  Decimal quantity = 6;

  // A plain date: the exercise, assignment or expiry date, or the settlement's
  // trading date. Never empty.
  string event_date = 7;

  // Each instrument and its signed quantity, as the broker states it, the
  // deliverable's components among them. None: an expiry, a cash settlement or
  // a variation; refused on a physical exercise or assignment.
  repeated LifecycleDelivery deliveries = 8;

  // Signed, positive received: a cash settlement's amount, a deliverable's
  // cash component, or a day's variation. Unset where no cash moves.
  optional Money cash = 9;

  // The exchange's settlement price for a variation; the settlement value for
  // a cash-settled option. Unset on an exercise or assignment with physical
  // delivery and on an expiry; refused unset on a variation.
  optional Money settlement_price = 10;

  // As the plugin read it; with the account, the book's key for a report sent
  // twice. Empty on a proposal, and where the broker states none.
  string external_event_id = 11;

  // The proposal's event_id. Empty except on a report that answered a
  // proposal, and on a release.
  string answers_event_id = 12;

  // The underlying's close against the strike for an exercise by exception, or
  // the settlement price. Unset except on a proposal.
  optional Money proposal_basis = 13;

  // The plugin's raw record, kept at the edge. Unset on a proposal.
  RawRecordRef raw_record = 14;

  // Its journal entry. Unset on a request.
  JournalRef last_change = 15;

  // Contract v29: maturity, full call, partial call, put or sinking-fund draw,
  // as the custodian states it; a partial call by lottery can only be reported,
  // never derived. Unspecified on any kind but redemption.
  RedemptionEventKind redemption_kind = 16;

  // Contract v29: per 100 of face, before accrued, as the custodian states it;
  // the lots close at it. Unset on any kind but redemption.
  optional Decimal redemption_price = 17;

  // Contract v29: a plain date, the accrual start. Empty on any kind but coupon
  // received.
  string period_start_date = 18;

  // Contract v29: a plain date, exclusive, the accrual end. Empty on any kind
  // but coupon received.
  string period_end_date = 19;

  // Contract v29: a plain date: a coupon's, a redemption's or a paydown's.
  // Empty where the kind has none.
  string record_date = 20;

  // Contract v29: the agency's published factor the paydown or accretion
  // brought the pool or class to, an exact decimal, as the Factor row (W10.4).
  // Unset on any kind but paydown and accretion.
  optional Decimal factor = 21;

  // Contract v29: the factor the event moved from; cash on a paydown is
  // (prior_factor - factor) times original face. Unset on any kind but paydown
  // and accretion.
  optional Decimal prior_factor = 22;

  // Contract v29: signed: positive a Z class's accretion, negative an IO's
  // notional fall; no cash moves and the lots stay in original face. Unset on
  // any kind but accretion.
  optional Decimal face_change = 23;
}

// A mirror of meridian.v1.LifecycleEventKind.
enum LifecycleEventKind {
  // Refused.
  LIFECYCLE_EVENT_KIND_UNSPECIFIED = 0;
  // A long option exercised: by the holder, or by exception at expiry.
  LIFECYCLE_EVENT_KIND_EXERCISE = 1;
  // A short option assigned, as the broker allocated it.
  LIFECYCLE_EVENT_KIND_ASSIGNMENT = 2;
  // An option expired with nothing delivered or paid.
  LIFECYCLE_EVENT_KIND_EXPIRY = 3;
  // A future's day of variation against the settlement price, a cash line only
  // (ruling 562).
  LIFECYCLE_EVENT_KIND_SETTLEMENT_VARIATION = 4;
  // Contract v29: coupon received: a debt record's interest paid to the holder
  // of record, cash only, the period and record date stated (683).
  LIFECYCLE_EVENT_KIND_COUPON_RECEIVED = 5;
  // Contract v29: redemption: a maturity, a full or partial call, a put or a
  // sinking-fund draw, closing or reducing lots at the redemption price (683).
  LIFECYCLE_EVENT_KIND_REDEMPTION = 6;
  // Contract v29: paydown: principal returned on a pool or tranche, cash equal
  // to the factor's fall times original face, the lots kept in original face
  // and their cost relieved pro rata (680).
  LIFECYCLE_EVENT_KIND_PAYDOWN = 7;
  // Contract v29: accretion: a Z class's face increase or an IO's notional
  // fall, no cash (682).
  LIFECYCLE_EVENT_KIND_ACCRETION = 8;
  // Contract v29: tba allocation: at pool notice, the TBA's lots closed and the
  // delivered pools' lots opened (681).
  LIFECYCLE_EVENT_KIND_TBA_ALLOCATION = 9;
  // Contract v29: strip: a whole bond exchanged for its STRIPS components, the
  // basis allocated by relative value.
  LIFECYCLE_EVENT_KIND_STRIP = 10;
  // Contract v29: reconstitution: STRIPS components exchanged back for the
  // whole bond.
  LIFECYCLE_EVENT_KIND_RECONSTITUTION = 11;
}

// A mirror of meridian.v1.LifecycleEventState.
enum LifecycleEventState {
  // Never on a record; a sender leaves it unset.
  LIFECYCLE_EVENT_STATE_UNSPECIFIED = 0;
  // Proposed by servicing, moving nothing.
  LIFECYCLE_EVENT_STATE_PROPOSED = 1;
  // A proposal a report answered.
  LIFECYCLE_EVENT_STATE_ANSWERED = 2;
  // A report, or a released proposal, its movement lines journaled.
  LIFECYCLE_EVENT_STATE_BOOKED = 3;
  // A booked event a later correction names.
  LIFECYCLE_EVENT_STATE_SUPERSEDED = 4;
}

// Contract v28 (LifecycleEvent.deliveries): states what changed hands on
// physical delivery.
// A mirror of meridian.v1.LifecycleDelivery.
message LifecycleDelivery {
  // The underlying, a deliverable component, or a currency's cash instrument.
  // Never empty.
  string instrument_id = 1;

  // Signed: positive received into the account, negative delivered out. Never
  // unset; never zero.
  Decimal quantity = 2;

  // The strike, or an adjusted deliverable's stated price. Unset: the strike,
  // by the option's terms.
  optional Money price = 3;
}

// Contract v29 (683): what a redemption record redeemed, as the custodian
// states it.
// A mirror of meridian.v1.RedemptionEventKind.
enum RedemptionEventKind {
  // Unset on any kind but redemption; refused on a redemption.
  REDEMPTION_EVENT_KIND_UNSPECIFIED = 0;
  // Repaid at maturity.
  REDEMPTION_EVENT_KIND_MATURITY = 1;
  // Called in full: CDM CorporateActionTypeEnum EarlyRedemption.
  REDEMPTION_EVENT_KIND_FULL_CALL = 2;
  // Called in part, by lottery or pro rata: no CDM type, held more.
  REDEMPTION_EVENT_KIND_PARTIAL_CALL = 3;
  // Put by the holder.
  REDEMPTION_EVENT_KIND_PUT = 4;
  // A mandatory sinking-fund draw: no CDM type, held more.
  REDEMPTION_EVENT_KIND_SINKING_FUND = 5;
}

// Contract v28: one value of a signal plugin's own series, naming its rule and
// inputs, never presented as a publisher's figure; from the amendment of
// 2026-10-31 (ruling 955), or a publisher's figure a data plugin records,
// marked published_by.
// A mirror of meridian.v1.DerivedSeries.
message DerivedSeries {
  // Its key, subject, the recording plugin's own dataset, its business date
  // and version. Never unset.
  ObservationMeta meta = 1;

  // Its own name for it: iv30, the index's level, a positioning summary's
  // part; for a publisher's figure, its name for the publisher's series.
  // Never empty.
  string series = 2;

  // As derived, or as the publisher states it where published_by is set.
  // Never unset; from contract v29 (638) unset where the value is an amount
  // of money, which money_value carries.
  UnitValue value = 3;

  // A definition and its version, an analytics measure's where one was used;
  // for a publisher's figure, the publisher's definition. Never unset.
  MeasureRef rule = 4;

  // Each dataset read and the as-of it was read at, so licences and counts can
  // follow it. Never empty on a value the plugin derived; may be empty on a
  // publisher's figure.
  repeated DerivedInput inputs = 5;

  // Contract 28, amended 2026-10-31 (W10.4; ruling 955): whose figure the
  // value is, in words, 0 to 64 characters -- a data plugin's row records a
  // publisher's figure and is refused without it; empty on a signal plugin's
  // own measure. A page shows it labelled with whose, never as our measure.
  string published_by = 6;

  // Contract v29: a Money naming its cash instrument: a dollar volume, an
  // expected move in the underlying's currency. Unset unless the series is an
  // amount of money; value is then unset.
  optional Money money_value = 7;
}

// Contract v28 (DerivedSeries.inputs): names what the value was derived from.
// A mirror of meridian.v1.DerivedInput.
message DerivedInput {
  // As the lake named it. Never empty.
  string dataset = 1;

  // Nanoseconds since the epoch. 0: not pinned.
  int64 as_of_ns = 2;
}

// Contract v28: a scenario or scenario set a signal plugin saved, each change
// the next version of its key (contract v28, W12.8).
// A mirror of meridian.v1.SavedScenario.
message SavedScenario {
  // Its row key (the plugin's), its dataset and version; an edit is the next
  // version. Never unset.
  ObservationMeta meta = 1;

  // One point. Unset where scenario_set is set.
  Scenario scenario = 2;

  // Its axes, never its points. Unset where scenario is set.
  ScenarioSet scenario_set = 3;

  // A person's words. Empty: no description.
  string description = 4;
}

// Contract v28 (CompanyRecord.former_names): carries its former names, dated.
// A mirror of meridian.v1.FormerName.
message FormerName {
  // As the source states it. Never empty.
  string name = 1;

  // A plain date. Empty where the source states none.
  string valid_from = 2;

  // A plain date. Never empty.
  string valid_until = 3;
}

// Contract v28: a filing as its publisher accepted it, keyed by accession, its
// documents kept at the edge (contract v28).
// A mirror of meridian.v1.Filing.
message Filing {
  // Its row key, its subjects with their roles, its source, valid time and
  // business date where it has one, its published time, version and sequence.
  // Never unset.
  ObservationMeta meta = 1;

  // Its accession and form. Never unset.
  FilingRef filing = 2;

  // A short platform list over the forms as reported. Unspecified is refused.
  FilingKind kind = 3;

  // 2.02 for results of operations, which dates an earnings report. None: the
  // form has no items, or none stated.
  repeated string items = 4;

  // A plain date. Empty where the form states none.
  string period_of_report = 5;

  // A plain date; the acceptance time is the envelope's published source time.
  // Never empty.
  string filed_date = 6;
}

// Contract v28 (Filing.filing): names the filing.
// A mirror of meridian.v1.FilingRef.
message FilingRef {
  // EDGAR's accession number, 0000320193-26-000105. Never empty.
  string accession_number = 1;

  // 10-K, 8-K, 13F-HR, SC 13D/A. Never empty.
  string form = 2;
}

// A mirror of meridian.v1.FilingKind.
enum FilingKind {
  // Refused.
  FILING_KIND_UNSPECIFIED = 0;
  // 10-K, 20-F, 40-F.
  FILING_KIND_ANNUAL_REPORT = 1;
  // 10-Q.
  FILING_KIND_QUARTERLY_REPORT = 2;
  // 8-K, 6-K.
  FILING_KIND_CURRENT_REPORT = 3;
  // DEF 14A and its kin.
  FILING_KIND_PROXY = 4;
  // S-1, F-1 and their amendments.
  FILING_KIND_REGISTRATION = 5;
  // Forms 3, 4 and 5.
  FILING_KIND_OWNERSHIP = 6;
  // 13F-HR.
  FILING_KIND_HOLDINGS_REPORT = 7;
  // Schedules 13D and 13G.
  FILING_KIND_BENEFICIAL_OWNERSHIP = 8;
  // Any other form, its form as reported.
  FILING_KIND_OTHER = 9;
}

// Contract v28: a value a filer reported for a concept and period, each later
// filing's different value the next version (contract v28).
// A mirror of meridian.v1.ReportedFact.
message ReportedFact {
  // Its row key, its subjects with their roles, its source, valid time and
  // business date where it has one, its published time, version and sequence.
  // Never unset.
  ObservationMeta meta = 1;

  // Its taxonomy prefix and name, us-gaap:EarningsPerShareBasic. Never empty.
  string concept = 2;

  // In the currency the filer reported. Unset where value is set.
  optional Money amount = 3;

  // Shares, a ratio, a per-share figure as reported. Unset where amount is
  // set; a fact with neither is refused.
  UnitValue value = 4;

  // A plain date. Empty on an instant.
  string period_start = 5;

  // A plain date. Never empty.
  string period_end = 6;

  // Each an axis and a member, as reported. None: the fact is for the filer as
  // a whole.
  repeated FactDimension dimensions = 7;

  // Its accession and form. Never unset.
  FilingRef filing = 8;
}

// Contract v28 (ReportedFact.dimensions): qualifies the fact by its
// dimensions.
// A mirror of meridian.v1.FactDimension.
message FactDimension {
  // As reported, us-gaap:StatementBusinessSegmentsAxis. Never empty.
  string axis = 1;

  // As reported. Never empty.
  string member = 2;
}

// Contract v28: a holder's report of its holdings as of a date, complete or
// not (contract v28).
// A mirror of meridian.v1.HoldingsReport.
message HoldingsReport {
  // Its row key, its subjects with their roles, its source, valid time and
  // business date where it has one, its published time, version and sequence.
  // Never unset.
  ObservationMeta meta = 1;

  // The form family. Unspecified is refused.
  HoldingsReportKind kind = 2;

  // A plain date: a 13F's quarter end, a 13D's event date. Never empty.
  string report_date = 3;

  // True: a security missing from it reads as sold (a 13F). False: a security
  // missing from it says nothing.
  bool complete = 4;

  // Its accession and form. Never unset.
  FilingRef filing = 5;
}

// A mirror of meridian.v1.HoldingsReportKind.
enum HoldingsReportKind {
  // Refused.
  HOLDINGS_REPORT_KIND_UNSPECIFIED = 0;
  // A 13F-HR.
  HOLDINGS_REPORT_KIND_FORM_13F = 1;
  // A Schedule 13D or its amendment.
  HOLDINGS_REPORT_KIND_SCHEDULE_13D = 2;
  // A Schedule 13G or its amendment.
  HOLDINGS_REPORT_KIND_SCHEDULE_13G = 3;
}

// Contract v28: one holding of a holdings report (contract v28).
// A mirror of meridian.v1.Holding.
message Holding {
  // Its row key, its subjects with their roles, its source, valid time and
  // business date where it has one, its published time, version and sequence.
  // Never unset.
  ObservationMeta meta = 1;

  // The HoldingsReport's row key. Never empty.
  string report_row_key = 2;

  // Shares or principal, as reported. Unset where the report states none.
  UnitValue quantity = 3;

  // As reported. Unset where the report states none.
  optional Money market_value = 4;

  // A percent, as reported. Unset where the report states none (a 13F).
  UnitValue percent_of_class = 5;
}

// Contract v28: a corporate action as announced, a declared dividend in v28:
// market data, never a servicing event (contract v28).
// A mirror of meridian.v1.CorporateActionAnnounced.
message CorporateActionAnnounced {
  // Its row key, its subjects with their roles, its source, valid time and
  // business date where it has one, its published time, version and sequence.
  // Never unset.
  ObservationMeta meta = 1;

  // The action's kind, growing by revision. Unspecified is refused.
  CorporateActionKind kind = 2;

  // As declared. Never unset on a cash dividend.
  Money amount_per_share = 3;

  // A plain date. Never empty: a row is recorded only where the rule finds it.
  string declared_date = 4;

  // A plain date. Never empty: a row is recorded only where the rule finds it.
  string ex_date = 5;

  // A plain date. Never empty: a row is recorded only where the rule finds it.
  string record_date = 6;

  // A plain date. Never empty: a row is recorded only where the rule finds it.
  string payment_date = 7;

  // A definition and its version. Never unset.
  MeasureRef rule = 8;

  // An 8-K's accession. Unset where the source is no filing.
  FilingRef filing = 9;
}

// A mirror of meridian.v1.CorporateActionKind.
enum CorporateActionKind {
  // Refused.
  CORPORATE_ACTION_KIND_UNSPECIFIED = 0;
  // A declared cash dividend.
  CORPORATE_ACTION_KIND_CASH_DIVIDEND = 1;
}

// Contract v28: a rating agency's action on a rating, from its published
// history (contract v28).
// A mirror of meridian.v1.RatingAction.
message RatingAction {
  // Its row key, its subjects with their roles, its source, valid time and
  // business date where it has one, its published time, version and sequence.
  // Never unset.
  ObservationMeta meta = 1;

  // The agency's symbol, AA+, Baa2. Empty on a withdrawal.
  string rating = 2;

  // The 17g-7 rating type: issuer, issue, long or short term. Never empty.
  string rating_class = 3;

  // The action, from the history's action type. Unspecified is refused.
  RatingActionKind action = 4;
}

// A mirror of meridian.v1.RatingActionKind.
enum RatingActionKind {
  // Refused.
  RATING_ACTION_KIND_UNSPECIFIED = 0;
  // A new rating.
  RATING_ACTION_KIND_NEW = 1;
  // Raised.
  RATING_ACTION_KIND_UPGRADE = 2;
  // Lowered.
  RATING_ACTION_KIND_DOWNGRADE = 3;
  // Affirmed.
  RATING_ACTION_KIND_AFFIRMED = 4;
  // Withdrawn.
  RATING_ACTION_KIND_WITHDRAWN = 5;
}

// Contract v28: a signal plugin's escalation of one row version's quality, its
// own record, never a rewrite (contract v28, W10.12).
// A mirror of meridian.v1.QualityAssessment.
message QualityAssessment {
  // As the lake names it. Never empty.
  string dataset = 1;

  // Its row key as recorded. Never empty.
  string row_key = 2;

  // The row key's version; a later version is assessed afresh. Never 0.
  uint64 version = 3;

  // Suspicious or invalid; refused when lower than the row's effective state,
  // since states only escalate. Unspecified is refused.
  QualityState state = 4;

  // Price_outlier, cross_source_disagreement, or an edge reason re-judged.
  // Never empty.
  repeated QualityReason reasons = 5;

  // Stamped by the sidecar. Never empty on a record; a plugin leaves it empty.
  string assessed_by_instance = 6;

  // Contract v29: the row's message by its full name, as a want names it:
  // meridian.v1.Price, meridian.v1.Bar; so a day's close and its bar, sharing a
  // key, escalate apart. Never empty from v29; empty on an assessment recorded
  // before it, read as the row key's only kind.
  string data_type = 7;
}

// Contract v29 (W10.4): one month's factor of a pool or a REMIC class, as the
// agency publishes it; current face is original face times the latest row.
// A mirror of meridian.v1.Factor.
message Factor {
  // Its subject the pool's or tranche's INS- record, its source the agency's
  // dataset, its business date the factor's publication date, version and
  // sequence; a republished factor is the next version. Never unset.
  ObservationMeta meta = 1;

  // The fraction of original face outstanding after the month's payment, an
  // exact decimal as the agency publishes it (rounded, not truncated, by
  // Freddie Mac since 2016); above 1 on an accreting Z class. Never unset.
  Decimal factor = 2;

  // YYYYMM, the agency's factor month. Never empty.
  string factor_month = 3;

  // States the record date of the month's payment: a plain date. Empty where
  // the agency states none.
  string record_date = 4;

  // A plain date: the 25th for UMBS, the 15th or 20th for Ginnie Mae I and II,
  // rolled. Empty where the agency states none.
  string payment_date = 5;

  // The annual rate the agency's reset file states. Unset on a fixed-rate pool
  // or class.
  optional Decimal coupon_rate = 6;
}

// Contract v28, amended 2026-10-28 (W10.6; rulings 856, 858 and 859): one
// expiration of an underlying's listed series, as the lake's listing holds it.
// A mirror of meridian.v1.Expiration.
message Expiration {
  // The series' expiration_date as listed, else its last_trade_date, else its
  // final_settlement_date. Never empty.
  string expiration_date = 1;

  // The listed series of the type asked expiring on the date, each counted
  // once however many datasets list it. Never 0: a date no series expires on
  // is not answered.
  uint32 series_count = 2;
}

// A custodial position that changed, and the statement that changed it.
// A mirror of meridian.v1.CustodialPositionUpdatedEvent.
message CustodialPositionUpdatedEvent {
  CustodialPosition position = 1;

  // The statement that caused this. Lets a reader explain any position by
  // pointing at what produced it.
  string statement_id = 2;

  // The previous quantity, so a subscriber can render a delta without holding
  // its own history.
  Decimal previous_quantity = 4;

  // The change's number in the street's partition, chained per account with
  // the positions changed before it, and who caused it (W2.4, W4.3).
  JournalRef journal = 5;

  ChangeCause cause = 6;

  // Retired in the domain message, and never reused.
  reserved 3;
  reserved "previous_quantity_scaled_1e8";
}

// A mirror of meridian.v1.PositionChangedEvent.
message PositionChangedEvent {
  BookPosition position = 1;

  Decimal previous_trade_date_quantity = 2;

  EntryMeta entry = 3;

  JournalRef journal = 4;

  ChangeCause cause = 5;
}

// A mirror of meridian.v1.BreakChangedEvent.
message BreakChangedEvent {
  // Not `break`, a keyword in the SDKs' languages.
  Break break_record = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// A mirror of meridian.v1.AccountFiguresRecordedEvent.
message AccountFiguresRecordedEvent {
  AccountFigures figures = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// A mirror of meridian.v1.AccountAttributeChangedEvent.
message AccountAttributeChangedEvent {
  AccountAttributes attributes = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// An activity was re-resolved (W2.16): the re-resolution whole, so a
// reconciliation whose break waited on an unresolved code re-runs its
// candidate causes without a second read.
// A mirror of meridian.v1.ActivityReResolvedEvent.
message ActivityReResolvedEvent {
  // The account it is on, as its re-resolution names it.
  string account_id = 1;

  ActivityReResolution re_resolution = 2;

  // Who caused it, and its number: the re-resolution's journal, at the top
  // as every delivered record carries it (W4.3).
  ChangeCause cause = 3;

  JournalRef journal = 4;
}

// A price the lake recorded, on its dataset's subject: one row, with its
// version and sequence. Delivered latest value first per subject, dataset,
// kind, venue and, from contract v19, the price's asset (conflated).
// A mirror of meridian.v1.PricesRecordedEvent.
message PricesRecordedEvent {
  Price price = 1;
}

// A bar the lake recorded, on its dataset's subject. Delivered latest value
// first per subject, dataset, venue and interval start (conflated).
// A mirror of meridian.v1.BarsRecordedEvent.
message BarsRecordedEvent {
  Bar bar = 1;
}

// What the lake asks of the instance serving a dataset. Coalesced: readers'
// identical wants are one.
// A mirror of meridian.v1.ObservationsWantedEvent.
message ObservationsWantedEvent {
  // The want's identifier, which the rows recorded for it name.
  string want_id = 1;

  string dataset = 2;

  // The data type, by its message's full name: meridian.v1.Price,
  // meridian.v1.Bar, and from contract v19 meridian.v1.Trade or
  // meridian.v1.Quote; from contract v29 meridian.v1.Factor, for a pool or a
  // class held (W10.7).
  string data_type = 3;

  // 1 to 500.
  repeated SubjectRef subjects = 4;

  // For prices, which kinds; empty for every kind.
  repeated PriceKind kinds = 5;

  // For bars, the bars' length.
  int64 interval_ns = 6;

  // The business date wanted, or the valid-time range; neither for the
  // latest.
  string business_date = 7;

  int64 valid_from_ns = 8;

  int64 valid_until_ns = 9;

  // Keep the subjects current until the want is withdrawn (W10.7): by the
  // vendor's stream where the dataset is streamed, by its schedule otherwise.
  bool standing = 10;

  // Contract v28, amended 2026-10-28 (ruling 821; the v29 plan's item E9):
  // a chain want's window, plain dates, inclusive, the union of its readers'
  // windows. Empty: from the earliest; to the latest.
  string expiration_from = 11;

  string expiration_to = 12;

  // Contract v28, amended 2026-10-28: the series a chain want is of, by key,
  // as ListQuotesRequest.series_keys names them, 0 to 500. None: not a want
  // of named series.
  repeated Identifier series_keys = 13;

  // Contract v28, amended 2026-10-28: true: every series of the subjects,
  // narrowed by the window. False: the subjects' own rows only.
  bool all_series = 14;
}

// A standing want no reader has asked within the dataset's cadence.
// A mirror of meridian.v1.WantWithdrawnEvent.
message WantWithdrawnEvent {
  string want_id = 1;

  string dataset = 2;
}

// A trade the lake recorded, on its dataset's subject (contract v19). Never
// conflated: every trade is delivered, at most once, and a reader that lost
// some catches up from the lake by the watermark it last saw (ListTrades).
// A mirror of meridian.v1.TradesRecordedEvent.
message TradesRecordedEvent {
  Trade trade = 1;
}

// A quote the lake recorded, on its dataset's subject (contract v19).
// Delivered latest value first per subject, dataset, venue and the quote's
// asset (conflated).
// A mirror of meridian.v1.QuotesRecordedEvent.
message QuotesRecordedEvent {
  Quote quote = 1;
}

// A mirror of meridian.v1.OrderUpdatedEvent.
message OrderUpdatedEvent {
  Order order = 1;

  // What changed, by field.
  repeated string changed = 2;

  EntryMeta entry = 3;

  JournalRef journal = 4;

  ChangeCause cause = 5;
}

// To the `ems`, `oms` and `compliance` within scope, and to the
// connectivity plugin it names, alone of its role (matrix/directed.tsv).
// A mirror of meridian.v1.PlacementUpdatedEvent.
message PlacementUpdatedEvent {
  Placement placement = 1;

  repeated string changed = 2;

  EntryMeta entry = 3;

  JournalRef journal = 4;

  ChangeCause cause = 5;
}

// W9's PositionChanged follows for each position it moved.
// A mirror of meridian.v1.ExecutionRecordedEvent.
message ExecutionRecordedEvent {
  Execution execution = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// A mirror of meridian.v1.UnplacedFactRecordedEvent.
message UnplacedFactRecordedEvent {
  UnplacedFact unplaced = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// To every subscriber, without an account scope.
// A mirror of meridian.v1.TradingInstructionChangedEvent.
message TradingInstructionChangedEvent {
  TradingInstruction instruction = 1;

  JournalRef journal = 2;

  ChangeCause cause = 3;
}

// A mirror of meridian.v1.LocateUpdatedEvent.
message LocateUpdatedEvent {
  Locate locate = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// W11.20. Published by a connectivity plugin, per venue account code its
// `ems` mapped; kept by the conductor, latest per code, each change its own
// record; heard by the `ems` and the `oms`.
// A mirror of meridian.v1.VenueCatalogueEvent.
message VenueCatalogueEvent {
  VenueCatalogue catalogue = 1;

  // Stamped by the sidecar, whatever the plugin sent.
  string publisher_instance_id = 2;
}

// An outcome the lake recorded, on its dataset's subject (contract v23).
// Never conflated: every version is delivered, and a reader that lost some
// catches up from the lake by the watermark it last saw (ListOutcomes).
// A mirror of meridian.v1.OutcomesRecordedEvent.
message OutcomesRecordedEvent {
  Outcome outcome = 1;
}

// W11.30: to `operations`, `oms`, `compliance`, `portfolio` and `reporting`
// within scope, by the account the booking is in.
// A mirror of meridian.v1.BookingUpdatedEvent.
message BookingUpdatedEvent {
  // Its whole new state, safe to apply twice.
  Booking booking = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// W11.35: to `compliance`, `reporting`, `oms` and `operations` within scope.
// A mirror of meridian.v1.AlertChangedEvent.
message AlertChangedEvent {
  Alert alert = 1;

  JournalRef journal = 2;

  ChangeCause cause = 3;
}

// A rate the lake recorded, on its dataset's subject (W10.5): conflated.
// A mirror of meridian.v1.RatesRecordedEvent.
message RatesRecordedEvent {
  Rate rate = 1;
}

// A dataset's liveness, on its subject: conflated per dataset and venue.
// A mirror of meridian.v1.LivenessRecordedEvent.
message LivenessRecordedEvent {
  DatasetLiveness liveness = 1;
}

// Contract v28 (W10.5): StatisticsRecorded's event.
// A mirror of meridian.v1.StatisticsRecordedEvent.
message StatisticsRecordedEvent {
  // The row as recorded, with its version and sequence. Never unset.
  Statistic statistic = 1;
}

// Contract v28 (W9.19): LifecycleEventRecorded's event.
// A mirror of meridian.v1.LifecycleEventRecordedEvent.
message LifecycleEventRecordedEvent {
  // The event as committed. Never unset.
  LifecycleEvent event = 1;

  // The partition and sequence the entry committed at; the event is sent only
  // after it commits (W9's invariants; amendment to DESIGN28, 2026-10-24).
  // Never unset.
  JournalRef journal = 2;

  // The message that caused it, its instance and its identifiers, as every
  // delivery's cause (W9.8). Never unset.
  ChangeCause cause = 3;
}

// Contract v28 (W10.5): FilingsRecorded's event.
// A mirror of meridian.v1.FilingsRecordedEvent.
message FilingsRecordedEvent {
  // The row as recorded. Never unset.
  Filing filing = 1;
}

// Contract v28 (W10.5): CorporateActionsRecorded's event.
// A mirror of meridian.v1.CorporateActionsRecordedEvent.
message CorporateActionsRecordedEvent {
  // The row as recorded. Never unset.
  CorporateActionAnnounced action = 1;
}

// Contract v28, amended 2026-10-30 (W10.5; spec/one-data-access-model,
// step 2; rulings 847 and 886): a listed series the lake recorded, new or the
// next version of its key, on its dataset's subject, heard by ListSeries'
// askers so a copy of a chain follows its listing. Delivered latest value
// first per subject, dataset and series key (conflated); after a loss a
// reader reads the listing again by its underlying (ListSeries).
// A mirror of meridian.v1.SeriesRecordedEvent.
message SeriesRecordedEvent {
  ListedSeries series = 1;
}

// Contract v29 (W10.5): FactorsRecorded's event, unconflated.
// A mirror of meridian.v1.FactorsRecordedEvent.
message FactorsRecordedEvent {
  // Carries a factor after it commits: the row as kept. Never unset.
  Factor factor = 1;
}
