// What an event answers: the message's identifier on the bus. A refusal is
// the call's error status, naming what was refused and why.
message Published {
  string message_id = 1;
}

// Every external account a connection reaches, as the connector sees it now.
//
// Published before anything is recorded against any of them, so linking one
// (W6.4) is a choice among the accounts on offer rather than a guess made
// after a statement was refused for want of a link: one SnapTrade connection
// can reach several brokerage accounts, and an administrator links the ones
// they mean. The whole list each time, so an account missing from it is one
// the connection no longer reaches.
// The params of ReportExternalAccounts: meridian.v1.ExternalAccountsEvent, less what the sidecar sets.
message ReportExternalAccountsParams {
  repeated ExternalAccount accounts = 1;
}

// How fresh a connected account's data is, as reported by the rail.
//
// And why, when it is not current. Published so an operator can tell stale
// data from absent data, which look identical on a holdings screen and mean
// completely different things. And "unhealthy" alone cannot say whose fix it
// is: a connection that needs a person to sign in again, one somebody
// disabled, and one that is a day late by design look the same as a flag and
// ask for three different things.
// The params of ReportSyncStatus: meridian.v1.SyncStatusEvent, less what the sidecar sets.
message ReportSyncStatusParams {
  string source = 1;

  // When the rail last successfully synced this account from the institution.
  // Not when the data is as of: a venue a day late by design syncs today what
  // was true yesterday, which the two fields below say.
  int64 last_synced_at_ns = 3;

  // Whether the rail currently considers the connection healthy. A false here
  // with a recent last_synced_at_ns means the data is good but the connection
  // has since broken. `state` says why.
  bool connection_healthy = 4;

  // Rail-supplied text, for whatever `state` does not say. Diagnostic only;
  // nothing branches on it.
  string status_detail = 5;

  int64 observed_at_ns = 6;

  // The account as the rail knows it, which the sidecar translates.
  string external_account_id = 7;

  // Whether the data is current, and if not, why: which is also whose fix it
  // is and what the dashboard tells a deployment admin to do.
  SyncState state = 8;

  // When the holdings the rail serves are as of, and when the history
  // (transactions) is. Separately, because venues keep them apart and a
  // connection can have one current and the other not: SnapTrade reports
  // holdings to the minute and transactions by the day. Zero where the rail
  // does not say.
  int64 holdings_as_of_ns = 9;

  int64 history_as_of_ns = 10;

  // The first date the source can read the account's activity from, ISO
  // 8601 (contract v14, W2.10): how far back a backfill reaches, beside how
  // fresh the history is. Empty where the source does not say.
  string history_from = 11;

  // Set by the sidecar, never by a plugin (stamped.tsv).
  reserved 2;
  reserved "account_id";
}

// Open one statement: the connector's snapshot of one account, at one moment.
//
// A statement is the connector's, not the venue's: none of the eight venues
// surveyed has a statement of its own, and every one gives a live snapshot.
// So the connector reads an account, and what it read is a statement.
//
// Two dates, and they are not the same thing. `as_of_date` is the date the
// positions reflect. `read_at_ns` is when the connector fetched them. A
// statement read this morning may be as of yesterday's close, and conflating
// the two is how stale data passes for current.
// The params of RecordHoldingsStatement: meridian.v1.RecordHoldingsStatementRequest, less what the sidecar sets.
message RecordHoldingsStatementParams {
  // The rail namespace, e.g. "snaptrade".
  string source = 1;

  // The connector's identifier for this snapshot, made from the account it
  // read and the time it read it, so the same read sent twice has the same
  // one. Used to recognise a redelivery of the same statement.
  string external_statement_id = 2;

  // ISO 8601 date the positions are as of.
  string as_of_date = 3;

  int64 read_at_ns = 4;

  // How many holding rows will follow, per W2.2.
  //
  // The only thing that marks the end of a statement. Nothing else in the
  // sequence does: rows arrive as separate messages and none of them is
  // distinguishable as the last. The kernel closes the statement when this many
  // have landed, and a statement whose rows never all arrive stays open rather
  // than publishing counts that are wrong.
  //
  // The connector holds the whole list before it publishes any of it, so it
  // knows this without reading anything twice.
  int32 expected_rows = 5;

  // Superseded from contract v7 by `figures` (W2.2): read from a plugin
  // before v7 as the set with no segment, refused from one at v7 sent
  // beside `figures`. Kept, never reused.
  optional Money buying_power = 6;

  optional Money margin_requirement = 7;

  optional Money maintenance_excess = 8;

  // Deprecated from contract v11, for `provenance` (a currency the venue did
  // not state is derived by the plugin's rule, and says so): read from a
  // plugin before v11 for the notice the stability list gives, then
  // reserved. True when the venue stated no currency for the figures and the
  // connector's was its own assumption. Of every set in `figures`.
  bool currency_assumed = 9;

  // The account as the rail knows it; the sidecar sets account_id from its
  // link and refuses the statement when there is none (stamped.tsv). A
  // statement is one account's, and a row naming another is refused.
  string external_account_id = 10;

  // One set per margin segment the venue reports (Q6, Q12); no two name
  // the same segment. Never derived: a figure computed here from the
  // holdings would be ours presented as the custodian's, and margin is
  // where that difference costs money.
  repeated StatementFigures figures = 12;

  // The institution holding the external account, as the connector names
  // it: the brokerage behind an aggregator, or the venue itself for a
  // direct connector. Empty where it does not say.
  string institution = 13;

  // The account servicer holds a lien or a right of set-off over the
  // account, as the statement reports it; unset where it does not say
  // (contract v8; reference/encumbrance-survey). Not an encumbrance: it
  // reduces no holding's available quantity.
  optional bool security_interest = 14;

  // The raw record the statement's figures were converted from (contract
  // v11). Required of a custody plugin by its suite.
  RawRecordRef raw_record = 15;

  // Each value the plugin closed rather than read -- the institution taken
  // from the connection, an as-of date it derived, a figures' currency the
  // venue left out -- by its path here (contract v11). A value with none is
  // the venue's.
  repeated Provenance provenance = 16;

  // Set by the sidecar, never by a plugin (stamped.tsv).
  reserved 11;
  reserved "account_id";

  // W4.9: the person this is sent for, as the assertion the plugin was
  // handed for them (the Meridian-Caller header, decoded). Unset, the plugin
  // acts as itself. Set, the sidecar admits a command on an account only
  // in a session at ACCESS_LEVEL_WRITE, when the person may write the
  // account it names, and stamps them on it; one to the deployment's
  // configuration (platform.config) only in a session at
  // ACCESS_LEVEL_ADMIN, and never without.
  meridian.v1.CallerAssertion acting_for = 1000;
}

// The result of RecordHoldingsStatement: meridian.v1.RecordHoldingsStatementReply.
message RecordHoldingsStatementResult {
  // Kernel-assigned. Every row references it.
  string statement_id = 1;

  // True when this statement had already been recorded and the existing one is
  // being returned. Makes redelivery a no-op rather than a duplicate.
  bool already_recorded = 2;
}

// One holding, for one account, at one instrument, on one side.
//
// Either `instrument_id` is set, meaning the connector resolved it (to the
// deployment's record, held or minted when nothing matched, W3.7),
// or `unresolved_identifiers` is set, meaning the resolve was ambiguous. Never
// both, and never neither. A row that could not be resolved is still recorded, because a
// dropped holding is invisible and an operator comparing against their
// brokerage would find a silent discrepancy with nothing to investigate.
//
// Cash is a holding like any other: of the currency's cash instrument, which
// the identifier scheme `iso4217` names ({scheme: iso4217, value: USD}), its
// quantity the cash the venue reports in that currency. A crypto asset held as
// cash, such as USDC at Coinbase, is a holding of that asset's instrument.
// The params of RecordHolding: meridian.v1.RecordHoldingRequest, less what the sidecar sets.
message RecordHoldingParams {
  string statement_id = 1;

  // Set when resolution succeeded.
  string instrument_id = 3;

  // Set when it did not: everything the connector held, so an operator can see
  // exactly what could not be accounted for.
  repeated Identifier unresolved_identifiers = 4;

  // The trade-date quantity: what is held counting every trade executed,
  // settled or not. Required. Signed to match `side`: negative is short.
  Decimal quantity = 9;

  // The rail's valuation of the holding, in its currency. Recorded as
  // reported, not recomputed: this is the custodian's belief, and rederiving it
  // would discard the thing that makes a later comparison meaningful. Unset
  // where the venue reported none (SnapTrade and Kalshi do not), which is not
  // a value of zero.
  optional Money market_value = 10;

  // The account as the rail knows it. The connector sets this and leaves
  // `account_id` empty; the sidecar sets `account_id` from the link in the
  // connector's settings (W6.4), and refuses the row, with that reason, when
  // there is none. Refused is not dropped: the external account is reported
  // unlinked, and the next statement after it is linked records it (W2).
  string external_account_id = 8;

  // Long or short, stated rather than read off the sign, and the quantity's
  // sign matches it. A venue that reports an account's long and short of one
  // instrument apart (Schwab) sends two rows, one on each side; one that
  // reports a signed number (E*TRADE, Kalshi) sends the side its sign means.
  // A Kalshi NO position is a short row of the market's one contract.
  HoldingSide side = 11;

  // The settle-date quantity: what is held counting only settled trades,
  // where the venue reports it, and unset where it does not. For cash, the
  // settled cash.
  optional Decimal settle_date_quantity = 12;

  // Deprecated from contract v11, for `provenance`: a currency the venue
  // did not state is derived by the plugin's named rule, and says so. Read
  // from a plugin before v11 for the notice the stability list gives, then
  // reserved. True when the venue stated no currency and the row's was the
  // connector's assumption.
  bool currency_assumed = 13;

  // Deprecated from contract v11: each asset is counted once, the cash of a
  // currency net of any holding the custodian also counts as cash, netted
  // by the plugin at the edge (sdk-contract/the-street-counts-each-asset-once).
  // Accepted from a plugin before v11 for the notice the stability list
  // gives, then reserved; no reader acts on it.
  bool also_counted_in_cash = 14;

  // As the venue reports them, unset or empty where it reports none, never
  // derived (W2.3; sdk-contract/a-holding-carries-its-cost). The holding's
  // total cost.
  optional Money cost_basis = 15;

  // Its lots as the custodian lists them; none is not one lot, and lots
  // whose quantities do not sum to the holding's are recorded as reported.
  repeated ReportedLot lots = 16;

  optional Money margin_requirement = 17;

  // The venue's average cost per unit, in the venue's unit (SnapTrade: per
  // share, for an option whose quantity counts contracts). Never computed
  // from cost_basis, nor cost_basis from it: nothing multiplies it by the
  // quantity or a multiplier (Q-A, 2026-10-01).
  optional Money average_cost = 18;

  // Available and not, each as the source reports it, never derived from
  // the other or from the quantity, unset where the source gives none --
  // never zero, never the holding's quantity (W2.3; contract v8;
  // reference/encumbrance-survey): the statement's AVAI and NAVL, a venue's
  // order-netted figure with its basis saying so.
  optional Decimal available_quantity = 19;

  optional Decimal not_available_quantity = 20;

  AvailableBasis available_basis = 21;

  // Each sub-balance the source reports as encumbered, one per kind,
  // location and pledgee; empty means none reported, not none held.
  repeated ReportedEncumbrance encumbrances = 22;

  // The raw record the row was converted from, in the plugin's own storage
  // (contract v11; decisions/028): carried, never followed, past the plugin.
  // Required of a custody plugin by its suite; a row the plugin derived
  // wholly, as cash net of a fund, names the record it derived it from.
  RawRecordRef raw_record = 23;

  // Each value the plugin closed rather than read, by its path in the row:
  // `quantity` for cash net of a fund the custodian also counts as cash,
  // `settle_date_quantity`, `pending`, `market_value.currency_code` (contract
  // v11). A value with none is the venue's, from `raw_record`.
  repeated Provenance provenance = 24;

  // The quantities not yet settled, each with its value date (contract
  // v11). With `settle_date_quantity` they account for `quantity`. As the
  // source reports them, or closed by the plugin with their provenance.
  repeated ReportedPending pending = 25;

  // Set when the row is a backfill of a row already recorded (contract
  // v11): the street journals the named field as an amendment beside the row
  // as first recorded, never an overwrite (W2.4).
  Backfill backfill = 26;

  // Set by the sidecar, never by a plugin (stamped.tsv).
  reserved 2;
  reserved "account_id";

  // Retired in the domain message, and never reused.
  reserved 5, 6, 7;
  reserved "quantity_scaled_1e8", "market_value_scaled_1e8", "currency";

  // W4.9: the person this is sent for, as the assertion the plugin was
  // handed for them (the Meridian-Caller header, decoded). Unset, the plugin
  // acts as itself. Set, the sidecar admits a command on an account only
  // in a session at ACCESS_LEVEL_WRITE, when the person may write the
  // account it names, and stamps them on it; one to the deployment's
  // configuration (platform.config) only in a session at
  // ACCESS_LEVEL_ADMIN, and never without.
  meridian.v1.CallerAssertion acting_for = 1000;
}

// The result of RecordHolding: meridian.v1.RecordHoldingReply.
message RecordHoldingResult {
  string holding_id = 1;

  // True when the row carried an instrument and updated a position. False for
  // an unresolved row, which updates nothing, because there is no position to
  // update until the deployment knows what it holds.
  bool resolved = 2;
}

// Read custodial positions, and the unresolved holdings beside them (W2.7).
// The params of ListCustodialPositions: meridian.v1.ListCustodialPositionsRequest, less what the sidecar sets.
message ListCustodialPositionsParams {
  // Empty means every account in the reader's scope for a plugin, every
  // account for a core component (W4.11).
  string account_id = 1;

  // When true, the reply also carries holdings that never resolved, so one
  // request answers both "what does the custodian say I hold" and "what could I
  // not account for".
  bool include_unresolved = 2;

  int32 page_size = 3;

  // Opaque: the previous reply's `next_cursor`, or empty for the first page.
  // Unresolved holdings come with the first page only, so a read across
  // pages sees each once.
  string cursor = 4;

  // Only the positions whose last change is above it, tombstones included.
  Watermark since = 5;
}

// The result of ListCustodialPositions: meridian.v1.ListCustodialPositionsReply.
message ListCustodialPositionsResult {
  repeated CustodialPosition positions = 1;

  // Populated only when include_unresolved was set.
  repeated UnresolvedHolding unresolved = 2;

  string next_cursor = 3;

  // The point in the store's record the page was read at.
  Watermark as_of = 4;
}

// Read completed statements and their figures (W2.9).
//
// How a reconciliation, or a plugin seeding after a restart, reads the
// figures without having heard W2.5: they are on the statement and on no
// position. An open statement is not listed.
// The params of ListStatements: meridian.v1.ListStatementsRequest, less what the sidecar sets.
message ListStatementsParams {
  // Empty: every account in the reader's scope.
  string account_id = 1;

  // ISO 8601; empty for any date.
  string as_of_date = 2;

  // Only statements completed after it.
  Watermark since = 3;

  int32 page_size = 4;

  // Opaque: the previous reply's `next_cursor`, or empty for the first page.
  string cursor = 5;
}

// The result of ListStatements: meridian.v1.ListStatementsReply.
message ListStatementsResult {
  // Completed statements only, each as it was announced (W2.5).
  repeated StatementRecordedEvent statements = 1;

  string next_cursor = 2;

  // The point in the store's record the page was read at.
  Watermark as_of = 3;
}

// Record one activity (W2.10), as a holding row is recorded.
// The params of RecordActivity: meridian.v1.RecordActivityRequest, less what the sidecar sets.
message RecordActivityParams {
  // The account as the rail knows it, which the sidecar translates.
  string external_account_id = 2;

  // The plugin's scheme for its source, as on a statement.
  string source = 3;

  CustodialActivity activity = 4;

  // Set by the sidecar, never by a plugin (stamped.tsv).
  reserved 1;
  reserved "account_id";

  // W4.9: the person this is sent for, as the assertion the plugin was
  // handed for them (the Meridian-Caller header, decoded). Unset, the plugin
  // acts as itself. Set, the sidecar admits a command on an account only
  // in a session at ACCESS_LEVEL_WRITE, when the person may write the
  // account it names, and stamps them on it; one to the deployment's
  // configuration (platform.config) only in a session at
  // ACCESS_LEVEL_ADMIN, and never without.
  meridian.v1.CallerAssertion acting_for = 1000;
}

// The result of RecordActivity: meridian.v1.RecordActivityReply.
message RecordActivityResult {
  // Street-assigned.
  string activity_id = 1;

  // True when the activity had already been recorded, by its source,
  // account and external_activity_id, and the existing one is returned.
  // Makes redelivery a no-op rather than a duplicate.
  bool already_recorded = 2;
}

// Read an account's activity (W2.11), by trade date, paged.
// The params of ListActivities: meridian.v1.ListActivitiesRequest, less what the sidecar sets.
message ListActivitiesParams {
  // Empty: every account in the reader's scope.
  string account_id = 1;

  // ISO 8601, inclusive; empty for no bound on that side.
  string trade_date_from = 2;

  string trade_date_to = 3;

  // Only activities recorded after it.
  Watermark since = 4;

  int32 page_size = 5;

  // Opaque: the previous reply's `next_cursor`, or empty for the first page.
  string cursor = 6;
}

// The result of ListActivities: meridian.v1.ListActivitiesReply.
message ListActivitiesResult {
  // Each as it was announced (W2.12), by trade date.
  repeated ActivityRecordedEvent activities = 1;

  string next_cursor = 2;

  // The point in the store's record the page was read at.
  Watermark as_of = 3;

  // The first date the source can read the named account's activity from,
  // as its sync status last said (W2.1): an opening balance older than it
  // has no activity to explain it. Empty where the request names no account
  // or the source has not said.
  string history_from = 4;

  // The re-resolutions of the activities answered (W2.16, contract v15),
  // each naming its activity and account, in the order recorded; on a read
  // since a watermark, every re-resolution recorded after it, whether or not
  // its activity was. The activities above stay as first recorded: an
  // activity's instrument is its latest re-resolution's, or its own where
  // there is none. Empty where none was re-resolved, and before v15.
  repeated ActivityReResolution re_resolutions = 5;
}

// Re-resolve a recorded activity (W2.15): its instrument resolved later, or
// otherwise -- a plan's own code linked after the activity was reported. The
// activity is named as it was recorded (W2.10), by its source, the external
// account and the custodian's identifier; only its instrument is
// re-resolved, and the activity as first recorded never changes
// (decisions/031).
// The params of ReResolveActivity: meridian.v1.ReResolveActivityRequest, less what the sidecar sets.
message ReResolveActivityParams {
  // The account as the rail knows it, which the sidecar translates.
  string external_account_id = 2;

  // The source and the custodian's identifier the activity was recorded
  // under: with the account, the key that names it. No activity under it is
  // a refusal, naming it.
  string source = 3;

  string external_activity_id = 4;

  // The instrument it now resolves to, the deployment's record; empty where
  // the link it had been resolved by was removed, and then it is unresolved
  // again, its code as first reported.
  string instrument_id = 5;

  // How it was resolved this time: supplied by the named person who set the
  // link, or derived by a named rule. Never the custodian's word.
  Provenance provenance = 6;

  // When what resolves it was made: the link set, a table setting row's
  // changed_at, the rule run. The street stamps its own record time.
  int64 resolved_at_ns = 7;

  // Set by the sidecar, never by a plugin (stamped.tsv).
  reserved 1;
  reserved "account_id";

  // W4.9: the person this is sent for, as the assertion the plugin was
  // handed for them (the Meridian-Caller header, decoded). Unset, the plugin
  // acts as itself. Set, the sidecar admits a command on an account only
  // in a session at ACCESS_LEVEL_WRITE, when the person may write the
  // account it names, and stamps them on it; one to the deployment's
  // configuration (platform.config) only in a session at
  // ACCESS_LEVEL_ADMIN, and never without.
  meridian.v1.CallerAssertion acting_for = 1000;
}

// The result of ReResolveActivity: meridian.v1.ReResolveActivityReply.
message ReResolveActivityResult {
  // The activity re-resolved, by the street's identifier for it.
  string activity_id = 1;

  // True when the activity's latest resolution already named this
  // instrument and provenance, and nothing was recorded.
  bool already_recorded = 2;
}

// Read the latest sync status of each account in scope, or those recorded
// since a watermark (W2.14), paged.
// The params of ListSyncStatuses: meridian.v1.ListSyncStatusesRequest, less what the sidecar sets.
message ListSyncStatusesParams {
  // Empty: every account in the reader's scope.
  string account_id = 1;

  // Only sync statuses recorded after it, every one in the order recorded;
  // unset, the latest per account.
  Watermark since = 2;

  int32 page_size = 3;

  // Opaque: the previous reply's `next_cursor`, or empty for the first page.
  string cursor = 4;
}

// The result of ListSyncStatuses: meridian.v1.ListSyncStatusesReply.
message ListSyncStatusesResult {
  // Each as it was announced (W2.13).
  repeated SyncStatusRecordedEvent statuses = 1;

  string next_cursor = 2;

  // The point in the store's record the page was read at.
  Watermark as_of = 3;
}

// Reverse resolution: identifiers to an instrument, as of a date. Answered
// from every date the instrument store holds, without the platform (contract
// v19): an identifier that left a record answers the record that held it on
// the date asked. Asked by `reporting` (contract v19), it is read-only:
// nothing is minted, joined, offered or listed, and nothing matched is a
// miss, not found.
// The params of ResolveIdentifier: meridian.v1.ResolveIdentifierRequest, less what the sidecar sets.
message ResolveIdentifierParams {
  // At least one. Matched strongest-first: a global scheme before a
  // source-scoped symbol.
  repeated Identifier identifiers = 1;

  // Reference time. The date the mapping is being asked about.
  int64 as_of_ns = 2;

  // Narrows a symbol match. Empty means unconstrained.
  string exchange_mic = 3;

  string currency = 4;

  // What the plugin's source states of the security, where it states it,
  // and nothing it would have to guess (principle 14). Kept on the record as
  // offers with the instance as their source, in force only when a person
  // accepts them (W3.1, contract v10). Unspecified, or empty, is not stated.
  AssetClass stated_asset_class = 5;

  // An ISO 4217 code: the source's, or, with its entry in provenance, one
  // derived by a named rule or supplied by a person (contract v23).
  string stated_currency = 6;

  string stated_description = 7;

  // Its type within the stated class, where the source says it (contract
  // v11): a custodian's sweep fund is a money market fund.
  InstrumentType stated_instrument_type = 8;

  // Where the security's currency came from, where the plugin closed it
  // rather than read it from the security's own record (contract v23,
  // W3.1): one entry, `stated_currency` by its path, supplied by a named
  // person on the plugin's page (the linked account's currency its admin
  // set), derived by a named rule, or reported from another of the source's
  // records. None where the source stated it. Kept with the offer; a
  // currency supplied or derived never narrows a symbol match.
  repeated Provenance provenance = 9;
}

// The result of ResolveIdentifier: meridian.v1.ResolveIdentifierReply.
message ResolveIdentifierResult {
  bool found = 1;

  string instrument_id = 2;

  // Set only when found is false.
  MissReason miss_reason = 3;

  // True when nothing matched and this resolve minted instrument_id, the
  // deployment's record for the set (W3.7, contract v10); found is true
  // alongside it. A later resolve of the same identifiers matches the
  // record, and is not minted. Until v10, true meant a placeholder.
  bool minted = 4;

  // Contract v24 (W3.1, W3.7; decisions/037, point 2 as amended): the
  // record answered is the deployment's provisional LCL- record -- the
  // platform not reached within the bounded ask, its staff to review the
  // request, or no open identifier to ask by -- naming its template, asked
  // again on reconnect or once it has an open identifier.
  bool provisional = 5;
}

// A resolution missed. A fact, not a request.
//
// The publisher reports what it held and continues. It does not ask for a mint,
// does not wait for one, and has no authority to perform one. Keeping the
// authority to create identity on the far side of an event boundary is what
// stops a misbehaving feed from filling the master with junk.
// The params of ReportMissingInstrument: meridian.v1.MissingInstrumentDetectedEvent, less what the sidecar sets.
message ReportMissingInstrumentParams {
  // The namespace the miss occurred in, e.g. "snaptrade".
  string source = 1;

  // Unspecified when the publisher does not know it.
  AssetClass asset_class = 9;

  // Everything the publisher held at the miss. Enough for a reader to attempt a
  // pull against a global scheme, or to mint a stub carrying them.
  repeated Identifier identifiers = 3;

  // Reference time of the missed resolve. The reaction must target the mapping
  // effective then, not the mapping effective now.
  int64 as_of_ns = 4;

  MissReason reason = 6;

  int64 observed_at_ns = 7;

  // The source's kind as reported, set only when it did not convert to an
  // asset class and `asset_class` is unspecified (contract v11;
  // spec/vendor-differences-have-a-place-in-the-contract, requirement 4).
  // For a person setting the class; never read.
  AsReported asset_class_as_reported = 10;

  // Set by the sidecar, never by a plugin (stamped.tsv).
  reserved 5;
  reserved "publisher_instance_id";

  // Retired in the domain message, and never reused.
  reserved 2, 8;
  reserved "placeholder_instrument_id";
}

// Forward resolution: an instrument identifier to its record.
// The params of ResolveInstrument: meridian.v1.ResolveInstrumentRequest, less what the sidecar sets.
message ResolveInstrumentParams {
  string instrument_id = 1;

  // Selects the version whose values were in force on the date, never which
  // record: an instrument ID is never reused (decisions/034). 0 for now.
  int64 as_of_ns = 2;
}

// The result of ResolveInstrument: meridian.v1.ResolveInstrumentReply.
message ResolveInstrumentResult {
  bool found = 1;

  InstrumentRecord instrument = 2;
}

