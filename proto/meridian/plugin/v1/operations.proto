  Watermark watermark = 4;
}

// A batch of bars, recorded whole or refused naming the item and field:
// 1 to 500.
// The params of RecordBars: meridian.v1.RecordBarsRequest, less what the sidecar sets.
message RecordBarsParams {
  repeated Bar bars = 1;

  // The want these answer, as it was delivered; empty for rows recorded
  // unasked.
  string want_id = 2;

  // W4.9: the person this is sent for, as the assertion the plugin was
  // handed for them (the Meridian-Caller header, decoded). Unset, the plugin
  // acts as itself. Set, the sidecar admits a command on an account only
  // in a session at ACCESS_LEVEL_WRITE, when the person may write the
  // account it names, and stamps them on it; one to the deployment's
  // configuration (platform.config) only in a session at
  // ACCESS_LEVEL_ADMIN, and never without.
  meridian.v1.CallerAssertion acting_for = 1000;
}

// What a batch did, once it committed.
// The result of RecordBars: meridian.v1.RecordObservationsReply.
message RecordBarsResult {
  // Rows recorded for the first time.
  uint32 recorded = 1;

  // Rows recorded as a new version of a row key held.
  uint32 restated = 2;

  // Rows identical to the version in force, which changed nothing.
  uint32 unchanged = 3;

  // The dataset's sequence once the batch committed.
  Watermark watermark = 4;
}

// Prices for subjects, at one of: the latest in force at a valid time
// (`at_ns`, 0 for now); a business date; or a valid-time range, from
// inclusive to exclusive. Exactly one is given; none is the latest now.
// The params of ListPrices: meridian.v1.ListPricesRequest, less what the sidecar sets.
message ListPricesParams {
  // 1 to 500.
  repeated SubjectRef subjects = 1;

  // Which kinds; empty for every kind.
  repeated PriceKind kinds = 2;

  SourceChoice sources = 3;

  int64 at_ns = 4;

  string business_date = 5;

  int64 valid_from_ns = 6;

  int64 valid_until_ns = 7;

  // The recorded-time cut-off, 0 for now: what the lake knew then.
  int64 as_of_ns = 8;

  // At most 500 rows, 100 when 0.
  uint32 page_size = 9;

  string cursor = 10;
}

// The result of ListPrices: meridian.v1.ListPricesReply.
message ListPricesResult {
  repeated Price prices = 1;

  // What could not be served, each with its reason; a default read's
  // fallback names why the datasets above it did not answer.
  repeated Unanswered unanswered = 2;

  // Each dataset the answer includes.
  repeated DatasetRef datasets = 3;

  // The sequence per dataset partition the read was answered at.
  Watermark watermark = 4;

  // Empty when the read is exhausted.
  string next_cursor = 5;
}

// Bars for subjects, at a valid time, a business date or a range, as a
// price's read.
// The params of ListBars: meridian.v1.ListBarsRequest, less what the sidecar sets.
message ListBarsParams {
  // 1 to 500.
  repeated SubjectRef subjects = 1;

  // The bars' length; 0 for every length.
  int64 interval_ns = 2;

  SourceChoice sources = 3;

  int64 at_ns = 4;

  string business_date = 5;

  int64 valid_from_ns = 6;

  int64 valid_until_ns = 7;

  int64 as_of_ns = 8;

  // At most 500 rows, 100 when 0.
  uint32 page_size = 9;

  string cursor = 10;
}

// The result of ListBars: meridian.v1.ListBarsReply.
message ListBarsResult {
  repeated Bar bars = 1;

  repeated Unanswered unanswered = 2;

  repeated DatasetRef datasets = 3;

  Watermark watermark = 4;

  string next_cursor = 5;
}

// What a `dgm` cannot serve of a want, per subject, with its reason.
// The params of DeclineWant: meridian.v1.DeclineWantRequest, less what the sidecar sets.
message DeclineWantParams {
  string want_id = 1;

  // 1 to 500.
  repeated SubjectRef subjects = 2;

  // not_covered, source_silent or beyond_history.
  UnansweredReason reason = 3;

  // W4.9: the person this is sent for, as the assertion the plugin was
  // handed for them (the Meridian-Caller header, decoded). Unset, the plugin
  // acts as itself. Set, the sidecar admits a command on an account only
  // in a session at ACCESS_LEVEL_WRITE, when the person may write the
  // account it names, and stamps them on it; one to the deployment's
  // configuration (platform.config) only in a session at
  // ACCESS_LEVEL_ADMIN, and never without.
  meridian.v1.CallerAssertion acting_for = 1000;
}

// The result of DeclineWant: meridian.v1.DeclineWantReply.
message DeclineWantResult {
}

// The datasets a reader may read, with their catalogue entries; and, to the
// dashboard, every dataset with its licence and entitlements.
// The params of ListDatasets: meridian.v1.ListDatasetsRequest, less what the sidecar sets.
message ListDatasetsParams {
}

// The result of ListDatasets: meridian.v1.ListDatasetsReply.
message ListDatasetsResult {
  // Each with its declaration.
  repeated DatasetRef datasets = 1;

  // Each dataset's licence: to the dashboard; to a plugin, those of the
  // datasets it may read.
  repeated DatasetLicence licences = 2;

  // To the dashboard every entitlement; to a plugin, its own.
  repeated DatasetEntitlement entitlements = 3;
}

// What a plugin asks to hear. A row it names that no role it holds hears
// is refused, PERMISSION_DENIED, naming it.
message ReceiveRequest {
  // The rows to hear, by their matrix names ("CustodialPositionUpdated");
  // empty for every row the plugin's roles hear.
  repeated string rows = 1;

  // The subjects wanted of the conflated rows, by their entity IDs: the
  // sidecar delivers only rows about them (spec/the-lake, Q12). Empty for
  // none of those rows; at most 500.
  repeated string subjects = 2;
}

// One item of the stream: a row's message in plugin-facing form beside
// what is known of it, or the mark of deliveries the sidecar dropped. At
// most once, bounded at 1024 queued for the plugin, within its read scope
// by the account matrix/scoped.tsv names for each row's message.
message Delivery {
  DeliveryMeta meta = 1;

  oneof item {
    Lost lost = 2;

    // One arm per row a role hears, numbered as matrix/scoped.tsv's `arm`
    // says, and never reused.
    // W2.5: platform.street.event.statement-recorded.
    StatementRecordedEvent statement_recorded = 16;
    // W2.6: platform.street.event.custodial-position-updated.
    CustodialPositionUpdatedEvent custodial_position_updated = 17;
    // W9.8: platform.book.event.position-changed.
    PositionChangedEvent position_changed = 18;
    // W9.8: platform.book.event.break-changed.
    BreakChangedEvent break_changed = 19;
    // W9.8: platform.book.event.account-figures-recorded.
    AccountFiguresRecordedEvent account_figures_recorded = 20;
    // W9.8: platform.book.event.account-attribute-changed.
    AccountAttributeChangedEvent account_attribute_changed = 21;
    // W2.12: platform.street.event.activity-recorded.
    ActivityRecordedEvent activity_recorded = 22;
    // W2.13: platform.street.event.sync-status-recorded.
    SyncStatusRecordedEvent sync_status_recorded = 23;
    // W2.16: platform.street.event.activity-re-resolved.
    ActivityReResolvedEvent activity_re_resolved = 24;
    // W10.5: platform.lake.{dataset}.event.prices-recorded.
    PricesRecordedEvent prices_recorded = 25;
    // W10.5: platform.lake.{dataset}.event.bars-recorded.
    BarsRecordedEvent bars_recorded = 26;
    // W10.7: platform.lake.event.observations-wanted.
    ObservationsWantedEvent observations_wanted = 27;
    // W10.7: platform.lake.event.want-withdrawn.
    WantWithdrawnEvent want_withdrawn = 28;
  }
}

// What is known of a delivery beside its message.
message DeliveryMeta {
  // From the envelope.
  string message_id = 1;
  string correlation_id = 2;
  string causation_id = 3;
  int64 published_at_ns = 4;

  // The row, as ReceiveRequest names it; empty on a Lost.
  string row = 5;

  // Copied from the record's journal and cause; unset on a Lost, and on a
  // conflated row, whose sequence is in its own message.
  JournalRef journal = 6;
  ChangeCause cause = 7;

  // The cause's instance is this plugin's (Q6).
  bool own = 8;
}

// The sidecar dropped deliveries it knows of, at this point in the stream:
// its queue for the plugin full (1024), or the bus's drop count for the
// plugin's subscription risen.
message Lost {
  // How many, where the sidecar knows; 0 when it knows only that some were.
  uint64 dropped = 1;

  // The rows they were of; empty when it cannot say, which is every row.
  repeated string rows = 2;
}

// One account a connection reaches, as the custodian presents it.
// A mirror of meridian.v1.ExternalAccount.
message ExternalAccount {
  // Stable: the connector makes it so where the venue does not, and it is the
  // `external_account_id` the account's rows name. SnapTrade's changes on
  // reconnect unless its `institution_account_id` is used; Kalshi's is a
  // subaccount and a matching engine joined. A handle the venue wants on each
  // call (E*TRADE's accountIdKey, Schwab's hash) stays inside the plugin.
  string external_account_id = 1;

  // The custodian's own name for it, as a person there would recognise it.
  string name = 2;

  // Deprecated from contract v11, for `account_kind` (Q13, reversed on the
  // revision, 2026-10-01): the venue's own word, verbatim and for display
  // only. A plugin built for v11 leaves it empty; the sidecar accepts it
  // from an earlier one for the notice the stability list gives, and the
  // dashboard shows it only where no kind is sent; then it is reserved.
  string venue_account_type = 3;

  // The account's kind, converted by the plugin from the venue's own type
  // (contract v11). For display and for grouping accounts across plugins;
  // nothing gates on it, and what an account may do is the platform's
  // restriction set when that is ruled.
  AccountKind account_kind = 4;

  // The venue's type as reported, set only when the kind is not known
  // because the type did not convert (spec/vendor-differences-have-a-place-
  // in-the-contract, requirement 4). For a person to map; never read.
  AsReported account_kind_as_reported = 5;
}

// An account's kind (contract v11): one coarse kind, the platform's own
// words, never a venue's.
// A mirror of meridian.v1.AccountKind.
enum AccountKind {
  // Not known: the venue's type says neither cash nor margin nor
  // retirement, and travels beside it as reported.
  ACCOUNT_KIND_UNSPECIFIED = 0;
  // Trades settle in full from the account's own cash; no borrowing.
  ACCOUNT_KIND_CASH = 1;
  // The account may borrow against its holdings under a margin agreement.
  ACCOUNT_KIND_MARGIN = 2;
  // A tax-advantaged retirement account, whether or not it allows limited
  // margin.
  ACCOUNT_KIND_RETIREMENT = 3;
}

// A vendor's value the plugin could not convert, beside the field's
// not-known value (requirements 4, 5 and 28): the one place a vendor's own
// code crosses the sidecar. Narrow, flagged and transitional: only the value
// that failed, never alone, and gone once a mapping exists. The sidecar
// checks that each part is present and within its length, and never reads
// its meaning; nothing past the plugin interprets it.
// A mirror of meridian.v1.AsReported.
message AsReported {
  // Whose vocabulary: the plugin's registry name and, where the vendor has
  // several, its code set ("<plugin>:account-type").
  string scheme = 1;

  // The vendor's code, as sent.
  string code = 2;

  // The vendor's own words for it, as sent; the code again where it gives
  // none.
  string text = 3;
}

// Why a connection's data is, or is not, current.
//
// The venues surveyed fail in exactly these ways (reference/broker-apis.md),
// and each asks something different of a person, which is the point of
// naming them rather than leaving them to a flag and free text.
// A mirror of meridian.v1.SyncState.
enum SyncState {
  // Not said: a connector written before this was. Shown as what
  // connection_healthy says.
  SYNC_STATE_UNSPECIFIED = 0;
  // Current. Nothing to do.
  SYNC_STATE_CURRENT = 1;
  // Still serving, but older than it should be: holdings_as_of_ns says since
  // when. Usually the rail's to recover; nothing to do but wait.
  SYNC_STATE_STALE = 2;
  // A person must sign in again at the venue before it serves anything new:
  // E*TRADE and Interactive Brokers daily, Schwab weekly, Interactive Brokers
  // also when connected but signed out.
  SYNC_STATE_NEEDS_SIGN_IN = 3;
  // The connection is disabled and serves only what it last read, as
  // SnapTrade does. Somebody re-enables it.
  SYNC_STATE_DISABLED = 4;
  // Late on purpose, as Interactive Brokers through SnapTrade is by a business
  // day. Expected; nothing to do.
  SYNC_STATE_DELAYED_BY_DESIGN = 5;
  // The venue does not provide holdings through this connection, as some
  // brokerages hide them from SnapTrade (its `holdings_unavailable`). Waiting
  // changes nothing: holdings will not arrive this way, so the account is
  // connected another way or through another venue.
  SYNC_STATE_HOLDINGS_UNAVAILABLE = 6;
}

// An amount of currency: a Decimal and the asset it is in.
//
// One message rather than an amount with its currency beside it, so a message
// holding amounts in several currencies -- a USD price, a EUR commission --
// cannot pair the wrong ones. An amount is never separated from its currency.
//
// In the currency's major unit, whatever the venue counted in: a plugin that
// read cents converts before anything reaches the bus (decisions/023).
//
// From contract v18 a Money always names an instrument (decisions/023 as
// amended; the ruling of 2026-09-30): the cash instrument of the asset it is
// in, fiat and tokens alike, in the deployment's instrument store. A plugin
// may name a fiat currency by its ISO 4217 code alone, which core resolves,
// dated, to its cash instrument; an asset with no ISO 4217 code (USDC, USDT, a
// network's gas token) is named by its instrument alone, which the plugin
// resolves as it resolves any instrument (W3.1). What is kept and read back
// names the instrument.
// A mirror of meridian.v1.Money.
message Money {
  Decimal amount = 1;

  // ISO 4217, e.g. "USD": the currency's code, where the asset has one.
  // Empty for an asset with no ISO 4217 code, which `instrument_id` alone
  // names; a token's code here is refused. From v18 a plugin may send this
  // alone and core fills `instrument_id`.
  string currency_code = 2;

  // The cash instrument of the asset the amount is in, the deployment's own
  // ID (contract v18). Empty from a plugin that named a fiat currency by
  // `currency_code` alone, which core resolves; set by core on what it keeps
  // and answers. Both set must name the same asset, or the amount is
  // refused; neither set is refused.
  string instrument_id = 3;
}

// A number: a 128-bit two's-complement integer and its scale. The value is the
// integer times 10^-scale, so 1.50 is 150 at scale 2 and stays 1.50.
//
// The scale travels with the value rather than being fixed for the contract,
// because the venues disagree: Alpaca takes nine decimal places, a crypto
// asset eighteen, and a cheap token's holding runs past what 64 bits hold at
// any fixed scale that serves them both. The scale is the one the value was
// stated with; nothing normalises it.
//
// The integer's magnitude is below 10^38, which is at most 38 significant
// digits, and the scale is 0 to 18. The widest value the broker survey found,
// 100 billion units at 18 decimals, is well inside it.
// A mirror of meridian.v1.Decimal.
message Decimal {
  // The integer's upper 64 bits, signed: negative for a negative value.
  sfixed64 high = 1;

  // Its lower 64 bits, unsigned. The integer is high * 2^64 + low.
  fixed64 low = 2;

  // How many decimal places the integer carries, 0 to 18.
  uint32 scale = 3;
}

// A statement's figures for one margin segment, each as the venue reported
// it and unset where it reported none; never derived.
// A mirror of meridian.v1.StatementFigures.
message StatementFigures {
  // The segment as the venue names it, verbatim ("securities",
  // "commodities", an FCM's class); empty for the account as a whole.
  string segment = 1;

  optional Money buying_power = 2;

  optional Money margin_requirement = 3;

  // Negative is a deficit.
  optional Money maintenance_excess = 4;

  optional Money initial_margin = 5;

  optional Money variation_margin = 6;

  // A brokerage's own total account value, as it reports it (Q-B); never a
  // sum of the holdings.
  optional Money net_liquidation = 7;

  // The collateral held under this segment, as reported (W2.2; Q12, Q13).
  // A balance moves nothing: posted collateral the custodian also lists as a
  // holding is a holding row too, and collateral received under a security
  // interest is never one.
  repeated ReportedCollateral collateral = 8;
}

// One collateral balance under a margin segment, each field as the venue
// reports it and unset where it does not; never derived.
// A mirror of meridian.v1.ReportedCollateral.
message ReportedCollateral {
  // Posted by the account, or received by it. Unspecified is refused.
  CollateralDirection direction = 1;

  // Resolved as a holding's instrument is (W3.1): the deployment's record,
  // minted for it or held, the currency's cash instrument for cash; or,
  // when the resolve was ambiguous, the identifiers the connector held.
  // Exactly one of the two, as on RecordHoldingRequest.
  string instrument_id = 2;

  repeated Identifier unresolved_identifiers = 3;

  Decimal quantity = 4;

  optional Money value = 5;

  // A fraction of the value: 0.15 is 15%, a venue's percentage written as
  // its fraction.
  optional Decimal haircut = 6;

  optional Money value_after_haircut = 7;

  // Where it is held, as the venue names it: the FCM, the dealer, a
  // third-party custodian. Empty where it does not say.
  string held_at = 8;

  // Whether the receiver may reuse it, as the agreement states and the venue
  // reports it; unset where it does not say (contract v8). Received
  // collateral is never a position (Q13), reusable or not.
  optional bool reusable = 9;
}

// Whether a collateral balance was posted by the account or received by it.
// A mirror of meridian.v1.CollateralDirection.
enum CollateralDirection {
  // Not said. Refused: collateral is posted or received.
  COLLATERAL_DIRECTION_UNSPECIFIED = 0;
  COLLATERAL_DIRECTION_POSTED = 1;
  COLLATERAL_DIRECTION_RECEIVED = 2;
}

// One typed identifier for an instrument.
//
// `scheme` says what kind of identifier this is: a global scheme ("figi",
// "isin", "cusip", "sedol") or a source-scoped one ("symbol"). A source-scoped
// identifier is only meaningful alongside its source, which is why `source` is
// present and why a bare symbol can never drive a global resolve.
// A mirror of meridian.v1.Identifier.
message Identifier {
  string scheme = 1;

  string value = 2;

  // The namespace a source-scoped identifier belongs to, e.g. "snaptrade".
  // Empty for a global scheme.
  string source = 3;
}

// A reference to the raw record a row was converted from, in the writing
// plugin's own storage (requirement 7, Q9; decisions/028). Opaque: core and
// every other plugin carry it and never follow it; a person follows it on
// the owning plugin's page. A record in a unit the plugin archived
// resolves to "archived, restorable" (contract v16); one past its window and
// deleted, following it says so, and the row stands.
// A mirror of meridian.v1.RawRecordRef.
message RawRecordRef {
  // The writing plugin's own instance, which its SDK sets from its
  // registration; the sidecar refuses a reference naming another.
  string instance_id = 1;

  // The plugin's own key for the record.
  string key = 2;
}

// Where a value a plugin sent came from, where the plugin closed it rather
// than read it from its vendor (requirements 31 to 34; plans/an-order-reaches-
// a-venue-through-the-book, Q13). A value with none on its message is the
// vendor's, from the message's raw record.
// A mirror of meridian.v1.Provenance.
message Provenance {
  // The value it is for, by its path in the message: `quantity`,
  // `settle_date_quantity`, `pending`, `market_value.currency_code`.
  string field = 1;

  ProvenanceKind kind = 2;

  // The raw record it was read from: on a value reported by the vendor
  // (from a record other than the message's own) or from a second source.
  // Never on a value supplied or derived.
  RawRecordRef raw_record = 3;

  // The second source, by name.
  string source = 4;

  // The person who supplied it, as the plugin's page knew them.
  string person = 5;

  // The rule that derived it, by name, as the plugin documents it.
  string rule = 6;
}

// The four kinds of provenance (requirement 32), the same meanings as an
// instrument value's source (v10's InstrumentValueSource).
// A mirror of meridian.v1.ProvenanceKind.
enum ProvenanceKind {
  // Not said; refused.
  PROVENANCE_KIND_UNSPECIFIED = 0;
  // Reported by the vendor.
  PROVENANCE_KIND_REPORTED = 1;
  // From a second source of the plugin's own.
  PROVENANCE_KIND_SECOND_SOURCE = 2;
  // Supplied by a named person, on the plugin's page.
  PROVENANCE_KIND_SUPPLIED = 3;
  // Derived by a named rule in the plugin's code.
  PROVENANCE_KIND_DERIVED = 4;
}

// Which side of an instrument a holding or a custodial position is on.
//
// A side of its own rather than the sign alone, because a venue can report
// both sides of one instrument at once, and two rows keyed by account and
// instrument alone would overwrite each other.
// A mirror of meridian.v1.HoldingSide.
enum HoldingSide {
  // Not said. Refused by the street store: a holding says which side it is on.
  HOLDING_SIDE_UNSPECIFIED = 0;
  HOLDING_SIDE_LONG = 1;
  HOLDING_SIDE_SHORT = 2;
}

// One lot of a holding, as the custodian lists it.
// A mirror of meridian.v1.ReportedLot.
message ReportedLot {
  // Signed as the holding's quantity: negative is short.
  Decimal quantity = 1;

  // The lot's total cost, unset where not reported; its sign as reported,
  // never flipped (Q-D, 2026-10-01).
  optional Money cost = 2;

  // ISO 8601; empty where not reported.
  string acquired_date = 3;
}

// What a source's available figure is net of.
// A mirror of meridian.v1.AvailableBasis.
enum AvailableBasis {
  // The source does not say.
  AVAILABLE_BASIS_UNSPECIFIED = 0;
  AVAILABLE_BASIS_SETTLED = 1;
  AVAILABLE_BASIS_TRADED = 2;
  AVAILABLE_BASIS_CONTRACTUAL = 3;
  // A venue's figure net of its open orders (Alpaca's qty_available,
  // Binance's free): the order reservation is the oms's, never an
  // encumbrance.
  AVAILABLE_BASIS_ORDER_NETTED = 4;
}

// One sub-balance of a holding, as the source reports it.
// A mirror of meridian.v1.ReportedEncumbrance.
message ReportedEncumbrance {
  EncumbranceKind kind = 1;

  // Signed as the holding's quantity. Larger than the holding is recorded
  // as reported: the custodian's data, which the reconciliation flags.
  Decimal quantity = 2;

  // Whether the source reports it available; unset where it does not say,
  // since the kind does not imply it.
  optional bool available = 3;

  // The source's own code or label, verbatim ("PLED"); required for OTHER.
  string source_code = 4;

  // To whom it is pledged, posted or lent, as reported (a name, a BIC or an
  // LEI); empty where not stated.
  string pledgee = 5;

  // The safekeeping place or third party holding it, as reported; empty
  // where not stated.
  string held_at = 6;

  // The margin segment it is under where the source names one, as the venue
  // names it; with the holding's external account, a margin agreement's key.
  // Empty otherwise: a custody statement never names one.
  string segment = 7;

  // The source's narrative; empty where none.
  string detail = 8;
}

// Why some of a holding cannot move (reference/encumbrance-survey, 3.1).
// Pending settlement stays in the settlement buckets: PENDING, like
// REHYPOTHECATED and BORROWED, is the street's, for the statement's own
// consistency, and the book holds none of the three.
// A mirror of meridian.v1.EncumbranceKind.
enum EncumbranceKind {
  // Not said. Refused: a sub-balance says which it is.
  ENCUMBRANCE_KIND_UNSPECIFIED = 0;
  // Pledged in place to a pledgee (PLED).
  ENCUMBRANCE_KIND_PLEDGED = 1;
  // Delivered to a third party as collateral (COLO).
  ENCUMBRANCE_KIND_POSTED = 2;
  // Lent (LOAN).
  ENCUMBRANCE_KIND_ON_LOAN = 3;
  // Blocked for a stated purpose (BLOK, BLCA, BLOT, BLOV).
  ENCUMBRANCE_KIND_BLOCKED = 4;
  // Movable only under conditions or with documents (RSTR, WDOC).
  ENCUMBRANCE_KIND_RESTRICTED = 5;
  // Between depositories, agents or registers (TRAN, REGO, BTRA).
  ENCUMBRANCE_KIND_IN_TRANSIT = 6;
  // A sub-balance the plugin cannot map: its source_code required.
  ENCUMBRANCE_KIND_OTHER = 7;
  // The street's only: as reported, for the consistency check.
  ENCUMBRANCE_KIND_PENDING = 8;
  // The street's only: used by the broker under a right of use; it does not
  // reduce the available quantity.
  ENCUMBRANCE_KIND_REHYPOTHECATED = 9;
  // The street's only: borrowed, title to us, with a return obligation.
  ENCUMBRANCE_KIND_BORROWED = 10;
}

// A quantity not yet settled, and the date it is due to (W2.3, contract
// v11). Signed as its holding's quantity is: a short's pending is negative.
// A mirror of meridian.v1.ReportedPending.
message ReportedPending {
  // ISO 8601.
  string value_date = 1;

  Decimal quantity = 2;
}

// A write marked as a backfill (requirement 27): a field a contract revision
// added, re-converted from the plugin's raw records and sent for a row
// already recorded. The store journals it as an amendment beside the row as
// first recorded, never an overwrite, this its cause.
// A mirror of meridian.v1.Backfill.
message Backfill {
  // The contract version that added the field, as `v<N>`.
  string contract_version = 1;

  // The field, by its path in the message.
  string field = 2;
}

// A point in a store's record: a sequence per partition. What a read
// answers it was read at, and what a read of changes since takes.
// A mirror of meridian.v1.Watermark.
message Watermark {
  repeated PartitionSequence partitions = 1;
}

// One partition's sequence within a watermark.
// A mirror of meridian.v1.PartitionSequence.
message PartitionSequence {
  string partition = 1;

  uint64 sequence = 2;
}

// What the custodian says an account holds of an instrument, on one side,
// right now. Keyed by all three: an account may hold an instrument long and
// short at once, as a venue reporting them apart says.
//
// Custodial, and named so deliberately. This is the custodian's belief, arrived
// at by reading their statements; it is not what the deployment calculates from
// its own activity. Those are different numbers whose disagreement is the
// entire subject of reconciliation, and a message called `Position` would make
// a consumer guess which one it had.
//
// Our own book does not exist yet. When it does it gets its own message and its
// own name, and no reader of this one silently changes meaning.
// A mirror of meridian.v1.CustodialPosition.
message CustodialPosition {
  string account_id = 1;

  // The deployment's record for the instrument, whatever its ID; a record a
  // person merged into another moves onto the one that stays (W3.9).
  string instrument_id = 2;

  // The trade-date quantity, signed to match `side`.
  Decimal quantity = 9;

  // Unset where the custodian reported no value, which is not zero.
  Money market_value = 10;

  // The statement this was last stated by, and when. One not restated recently
  // is not wrong, but it is worth showing differently.
  string last_statement_id = 6;

  string as_of_date = 7;

  int64 updated_at_ns = 8;

  HoldingSide side = 11;

  // The settle-date quantity, where the custodian reported one.
  Decimal settle_date_quantity = 12;

  // Deprecated from contract v11, as on RecordHoldingRequest: the street
  // counts each asset once. Set only from a plugin before v11.
  bool also_counted_in_cash = 13;

  // As the custodian reported them on the row that last stated this, unset
  // or empty where it reported none (W2.3).
  Money cost_basis = 14;

  repeated ReportedLot lots = 15;

  Money margin_requirement = 16;

  // Its last change: a delivery at or below it is already in it.
  JournalRef last_change = 17;

  // A tombstone (W2.6, W3.9): returned only to a read since a watermark,
  // and delivered once.
  bool removed = 18;

  // As on RecordHoldingRequest (Q-A).
  Money average_cost = 19;

  // As on RecordHoldingRequest, from the row that last stated this.
  Decimal available_quantity = 20;

  Decimal not_available_quantity = 21;

  AvailableBasis available_basis = 22;

  repeated ReportedEncumbrance encumbrances = 23;

  // As on RecordHoldingRequest, from the row that last stated this, with
  // what a backfill added to it (contract v11).
  RawRecordRef raw_record = 24;

  repeated Provenance provenance = 25;

  repeated ReportedPending pending = 26;

  // Retired in the domain message, and never reused.
  reserved 3, 4, 5;
  reserved "quantity_scaled_1e8", "market_value_scaled_1e8", "currency";
}

// Where a change sits in its store's record (spec/plugins-hear-and-read, Q1
// as clarified 2026-10-01).
// A mirror of meridian.v1.JournalRef.
message JournalRef {
  // The partition the change was made in: the street store's one, or a
  // book partition.
  string partition = 1;

  // Its number there: the partition's next, taken in the change's own
  // transaction, so the numbers have no holes.
  uint64 sequence = 2;

  // The number of the previous change the same row made for the same
  // account, 0 for its first: what a plugin hearing only some accounts
  // checks for a gap in its own.
  uint64 previous_sequence = 3;
}

// A holding the deployment received but could not name.
// A mirror of meridian.v1.UnresolvedHolding.
message UnresolvedHolding {
  string holding_id = 1;

  string account_id = 2;

  repeated Identifier identifiers = 3;

  // Signed, as the row stated it: negative is a short row.
  Decimal quantity = 10;

  // Unset where the custodian reported no value.
  Money market_value = 11;

  string source = 7;

  string as_of_date = 8;

  // Whether an escalation has already been raised for these identifiers, so the
  // view can separate "nobody has looked at this" from "this is with the
  // administrator".
  bool escalated = 9;

  // The raw record the row was converted from (contract v11).
  RawRecordRef raw_record = 12;

  // Retired in the domain message, and never reused.
  reserved 4, 5, 6;
  reserved "quantity_scaled_1e8", "market_value_scaled_1e8", "currency";
}

// A statement is complete.
//
// The unresolved count is the number an operator actually watches; a statement
// that is complete and fully resolved is the only quiet outcome.
// A mirror of meridian.v1.StatementRecordedEvent.
message StatementRecordedEvent {
  string statement_id = 1;

  string source = 2;

  string as_of_date = 3;

  int32 rows_received = 4;

  int32 rows_resolved = 5;

  int32 rows_unresolved = 6;

  int64 recorded_at_ns = 7;

  // The account the statement is of: its external account's, or, from a
  // plugin before v7, its rows' (W2.2).
  string account_id = 8;

  // The statement's figures as recorded, one set per segment (W2.2).
  repeated StatementFigures figures = 9;

  // Deprecated from contract v11, as on the statement: for `provenance`.
  bool currency_assumed = 10;

  // The completion's number in the street's partition, chained per account
  // with the statements before it, and who caused it: the row whose landing
  // completed it (W2.5, W4.3).
  JournalRef journal = 11;

  ChangeCause cause = 12;

  // The account as the rail knows it, and the institution holding it, as
  // the statement named them: with the source and a segment, what a margin
  // agreement is keyed by and an opening balance names as its source. Empty
  // from a plugin before v7.
  string external_account_id = 13;

  string institution = 14;

  // As the statement reported it (contract v8).
  optional bool security_interest = 15;

  // As the statement carried them (contract v11): its raw record, and the
  // provenance of each value its plugin closed.
  RawRecordRef raw_record = 16;

  repeated Provenance provenance = 17;
}

// Who caused a change, as the store recorded it when it committed (Q3).
// A mirror of meridian.v1.ChangeCause.
message ChangeCause {
  // The instance that sent the command, as its sidecar stamped it.
  string instance_id = 1;

  // The person it was sent for (W4.9); empty when the plugin acted as itself.
  string acting_for_subject = 2;

  string correlation_id = 3;

  // The command's message_id.
  string causation_id = 4;

  int64 committed_at_ns = 5;
}

// One activity on an account, as the custodian states it: a purchase, a
// sale, a reinvested dividend, a dividend or interest, a fee or a tax, a
// split or another corporate action, a transfer, a contribution, a
// withdrawal or a journal (spec/the-custodians-activity-explains-a-break).
//
// Evidence, never a source: the street keeps it as reported and derives no
// position, lot or cash figure from it, and nothing here moves the book. It
// explains a break and proposes an adjustment for a person to confirm
// (W9.4, W9.7). Never netted or deduplicated against holdings: a sweep
// fund's purchases appear as the custodian lists them.
//
// The account it is on is named beside it, by the request that records it
// and the record the street keeps, so the account the sidecar stamped is the
// only one.
// A mirror of meridian.v1.CustodialActivity.
message CustodialActivity {
  // The custodian's own identifier for the activity: what lets the street
  // recognise one sent twice. A custodian restating an activity under a new
  // identifier is a new activity, reported, never merged.
  string external_activity_id = 1;

  // What happened, in the platform's own words, converted by the plugin
  // from the custodian's type.
  ActivityKind kind = 2;

  // The custodian's type as reported, set only when `kind` is not known
  // because the type did not convert. For a person to map; never read.
  AsReported kind_as_reported = 3;

  // The instrument it concerns, resolved at the edge as a holding's is
  // (W3.1): the deployment's record, or the currency's cash instrument.
  // Empty where the activity concerns none, or where the custodian's code
  // did not resolve, and then `instrument_as_reported` carries it.
  string instrument_id = 4;

  // The custodian's code for the instrument as reported, set only when it
  // did not resolve: a plan's own fund code no person has linked yet.
  AsReported instrument_as_reported = 5;

  // ISO 8601: when it was traded or took effect, and when it settles or
  // settled. The settlement date is empty where the custodian does not
  // state it.
  string trade_date = 6;

  string settlement_date = 7;

  // The units of the instrument it moved, signed by what it did to the
  // account: positive added units (a purchase, a reinvestment, the shares a
  // split added, a transfer in), negative removed them (a sale, a fee taken
  // in units, a transfer out). Unset where it moved none, a cash dividend's
  // say, which is not zero.
  optional Decimal units = 8;

  // The price per unit, as stated. Unset where the custodian states none;
  // never worked out from the amount and the units.
  optional Money price = 9;

  // The amount of cash it moved, in its currency, signed by what it did to
  // the account's cash: positive in (a sale, a dividend, a contribution),
  // negative out (a purchase, a fee, a withdrawal). Unset where it moved
  // none, a split's say, which is not zero.
  optional Money amount = 10;

  // The custodian's own description, as reported. Diagnostic and for a
  // person; nothing branches on it.
  string description = 11;

  // The raw record it was converted from, in the plugin's own storage
  // (decisions/028), and the provenance of each value the plugin closed
  // rather than read: an instrument linked once by a named person, a
  // settlement date derived by a named rule.
  RawRecordRef raw_record = 12;

  repeated Provenance provenance = 13;
}

// What an activity was (contract v14): a closed list, the platform's own
// words, never a custodian's.
// A mirror of meridian.v1.ActivityKind.
enum ActivityKind {
  // Not known: the custodian's type converts to none of these, and travels
  // beside it as reported.
  ACTIVITY_KIND_UNSPECIFIED = 0;
  // Units bought.
  ACTIVITY_KIND_PURCHASE = 1;
  // Units sold.
  ACTIVITY_KIND_SALE = 2;
  // Income the custodian reinvested in units, as a money market fund's
  // monthly dividend is.
  ACTIVITY_KIND_REINVESTMENT = 3;
  // A dividend paid in cash.
  ACTIVITY_KIND_DIVIDEND = 4;
  // Interest paid in cash.
  ACTIVITY_KIND_INTEREST = 5;
  // A fee, in cash or in units.
  ACTIVITY_KIND_FEE = 6;
  // A tax withheld or paid.
  ACTIVITY_KIND_TAX = 7;
  // A split, the units it added or removed.
  ACTIVITY_KIND_SPLIT = 8;
  // Another corporate action, as the custodian states it.
  ACTIVITY_KIND_CORPORATE_ACTION = 9;
  // Units or cash moved in from another account.
  ACTIVITY_KIND_TRANSFER_IN = 10;
  // Units or cash moved out to another account.
  ACTIVITY_KIND_TRANSFER_OUT = 11;
  // Cash paid into the account.
  ACTIVITY_KIND_CONTRIBUTION = 12;
  // Cash taken out of the account.
  ACTIVITY_KIND_WITHDRAWAL = 13;
  // A movement between the account's own positions or sub-accounts, as the
  // custodian journals it.
  ACTIVITY_KIND_JOURNAL = 14;
}

// An activity was recorded (W2.12): the whole record, so a reconciliation
// waiting on a cause re-runs its candidates without a second read. Also each
// item of a read (W2.11), as it was announced.
// A mirror of meridian.v1.ActivityRecordedEvent.
message ActivityRecordedEvent {
  string activity_id = 1;

  // The account it is on, and as the rail knows it.
  string account_id = 2;

  string external_account_id = 3;

  string source = 4;

  CustodialActivity activity = 5;

  int64 recorded_at_ns = 6;

  // The record's number in the street's partition, chained per account with
  // the activities before it, and who caused it (W2.12, W4.3).
  JournalRef journal = 7;

  ChangeCause cause = 8;
}

// One re-resolution as the street keeps it, beside the activity it names
// (W2.16): its own record, chained per account with the re-resolutions
// before it and apart from the activities, so activity-recorded keeps what
// it said at v14.
// A mirror of meridian.v1.ActivityReResolution.
message ActivityReResolution {
  // The activity it sits beside, and the account it is recorded against.
  string activity_id = 1;

  string account_id = 7;

  // The instrument the activity now resolves to, empty where unresolved
  // again, and how.
  string instrument_id = 2;

  Provenance provenance = 3;

  // When what resolves it was made, as the plugin sent it; when the street
  // recorded it, never back-dated.
  int64 resolved_at_ns = 4;

  int64 recorded_at_ns = 5;

  // Its own number in the street's partition, chained per account with the
  // re-resolutions before it.
  JournalRef journal = 6;
}

// A sync status was recorded (W2.13): the street heard a custody plugin's
// sync status (W2.1) and kept it, so operations tells a connection that needs
// a person to sign in again apart from data that is merely old. The whole
// record; also each item of a read (W2.14), as it was announced.
// A mirror of meridian.v1.SyncStatusRecordedEvent.
message SyncStatusRecordedEvent {
  // As the custody plugin published it, its account as the sidecar stamped
  // it: empty when the external account is not linked, and then delivered to
  // no plugin.
  SyncStatusEvent status = 1;

  int64 recorded_at_ns = 2;

  // The record's number in the street's partition, chained per account with
  // the sync statuses before it, and who caused it (W2.13, W4.3).
  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// How fresh a connected account's data is, as reported by the rail.
//
// And why, when it is not current. Published so an operator can tell stale
// data from absent data, which look identical on a holdings screen and mean
// completely different things. And "unhealthy" alone cannot say whose fix it
// is: a connection that needs a person to sign in again, one somebody
// disabled, and one that is a day late by design look the same as a flag and
// ask for three different things.
// A mirror of meridian.v1.SyncStatusEvent.
message SyncStatusEvent {
  string source = 1;

  // The account the external account is linked to (W6.4), set by the sidecar.
  // Empty when it is not linked.
  string account_id = 2;

  // When the rail last successfully synced this account from the institution.
  // Not when the data is as of: a venue a day late by design syncs today what
  // was true yesterday, which the two fields below say.
  int64 last_synced_at_ns = 3;

  // Whether the rail currently considers the connection healthy. A false here
  // with a recent last_synced_at_ns means the data is good but the connection
  // has since broken. `state` says why.
  bool connection_healthy = 4;

  // Rail-supplied text, for whatever `state` does not say. Diagnostic only;
  // nothing branches on it.
  string status_detail = 5;

  int64 observed_at_ns = 6;

  // The account as the rail knows it, which the sidecar translates.
  string external_account_id = 7;

  // Whether the data is current, and if not, why: which is also whose fix it
  // is and what the dashboard tells a deployment admin to do.
  SyncState state = 8;

  // When the holdings the rail serves are as of, and when the history
  // (transactions) is. Separately, because venues keep them apart and a
  // connection can have one current and the other not: SnapTrade reports
  // holdings to the minute and transactions by the day. Zero where the rail
  // does not say.
  int64 holdings_as_of_ns = 9;

  int64 history_as_of_ns = 10;

  // The first date the source can read the account's activity from, ISO
  // 8601 (contract v14, W2.10): how far back a backfill reaches, beside how
  // fresh the history is. Empty where the source does not say.
  string history_from = 11;
}

// The kind of claim holding an instrument gives. A closed list, ruled by the
// product owner (sdk-contract/asset-class-is-an-enum, 2026-09-28 and
// 2026-09-30); a class joins it by a ruling, never because a feed sent one.
// Spelled in text as the value's name without its prefix, lower case:
// `equity`, `debt`, `fund`, `derivative`, `crypto_asset`, `event_contract`,
// `cash`.
//
// What kind of instrument within a class is its instrument type
// (InstrumentType, contract v11), which grows one type at a time as a
// workflow needs it.
// A mirror of meridian.v1.AssetClass.
enum AssetClass {
  // No class. Held only by a stub minted from a deployment's miss (W3.4),
  // which may not know one; activating an instrument requires a class (W1.8).
  ASSET_CLASS_UNSPECIFIED = 0;
  // A share of ownership.
  ASSET_CLASS_EQUITY = 1;
  // Somebody owes the holder.
  ASSET_CLASS_DEBT = 2;
  // A share of a pool: ETFs and mutual funds among them.
  ASSET_CLASS_FUND = 3;
  // A contract whose value comes from something else: options and futures
  // among them.
  ASSET_CLASS_DERIVATIVE = 4;
  ASSET_CLASS_CRYPTO_ASSET = 5;
  // Pays on whether an event happens.
  ASSET_CLASS_EVENT_CONTRACT = 6;
  // A holding of a currency's cash instrument (spec/the-account-side-fits-every-venue).
  ASSET_CLASS_CASH = 7;
}

// What kind of instrument within its asset class (contract v11; the product
// owner, 2026-10-02: "Yes to put instrument type into v11 scope"). In the
// contract's own words, ISO 10962 (CFI) a reference and not the vocabulary;
// a type joins when a workflow needs it, each with its dictionary entry, and
// each is under one asset class. Spelled in text as the value's name without
// its prefix, lower case: `money_market_fund`.
// A mirror of meridian.v1.InstrumentType.
enum InstrumentType {
  // No type stated: the asset class says all the record says.
  INSTRUMENT_TYPE_UNSPECIFIED = 0;
  // Under fund: a fund that invests in short-term debt under SEC rule 2a-7
  // and aims to keep its value, with the attributes of MoneyMarketFund.
  // Held as a fund, never as cash, even where a custodian sweeps cash into it.
  INSTRUMENT_TYPE_MONEY_MARKET_FUND = 1;
}

// Why a resolution did not produce exactly one instrument.
// A mirror of meridian.v1.MissReason.
enum MissReason {
  MISS_REASON_UNSPECIFIED = 0;
  // No instrument matched.
  MISS_REASON_NOT_FOUND = 1;
  // More than one matched. Reported as a miss rather than resolved by picking,
  // because picking would be wrong about half the time and would be silent.
  MISS_REASON_AMBIGUOUS = 2;
}

// The canonical instrument record.
//
// Three time axes, and conflating any two of them produces a resolution bug
// that only appears when an identifier is reused:
//
//   reference time  the as-of a resolution is FOR. A query parameter, never a
//                   field here.
//   effective time  valid_from_ns -- when this mapping became true in the world.
//   record time     record_time_ns -- when the authority knew it.
//
// Identifiers get reused: a ticker freed by a delisting is later reassigned to
// a different instrument. A consumer resolving a historical date must key on
// effective time, not on when it happened to learn the mapping.
// A mirror of meridian.v1.InstrumentRecord.
message InstrumentRecord {
  // The record's key for life. On the platform's master, "INS-...", minted
  // by it (W1). In a deployment, the deployment's own (decisions/030): "LCL-"
  // for a record its instrument store minted (W3.7), which says who minted it
  // and nothing about whether it is resolved; or the "INS-" ID of a record
  // applied from the platform before contract v10, which it keeps. A global
  // ID the platform answers later joins `identifiers` (scheme
  // `open_meridian`), never replacing this.
  string instrument_id = 1;

  // The full identifier set. An amend replaces this authoritatively.
  repeated Identifier identifiers = 2;

  AssetClass asset_class = 11;

  // ISO 4217.
  string currency = 4;

  // ISO 10383 market identifier code. Empty where there is no listing venue.
  // Deprecated from contract v18 for `listing_venue_id`, the venue master's
  // ID, of which the MIC is one identifier; read until the platform's and
  // the deployments' records carry venue IDs.
  string exchange_mic = 5;

  string description = 6;

  InstrumentLifecycleState lifecycle_state = 7;

  // Monotonic, assigned by the store, starting at 1. An apply carrying a
  // version at or below the one held is a no-op, which is what makes replica
  // application idempotent and overlapping pulls harmless.
  int64 version = 8;

  // Effective time. When this version's mapping became true.
  int64 valid_from_ns = 9;

  // Record time. Stamped by the store, never accepted from a caller: knowledge
  // cannot be back-dated.
  int64 record_time_ns = 10;

  // In a deployment (contract v10): where each value in force came from --
  // the asset class, the currency, the description and each identifier --
  // with the person who set or accepted it, or the plugin that reported it
  // (W3, requirement 1). Empty on the platform's master, whose changelog
  // says it (W1.7).
  repeated InstrumentValueSource sources = 12;

  // In a deployment (contract v10): values offered by a plugin's source
  // (W3.1) or the platform (W3.3), in force only when a person accepts one
  // (W3.10). A later offer never overwrites a value in force.
  repeated OfferedValue offers = 13;

  // Its type within its asset class (contract v11), in force once a person
  // set or accepted it, as the asset class is. Unspecified where none is.
  InstrumentType instrument_type = 14;

  // A money market fund's attributes (contract v11); set only on a record
  // whose type is money market fund.
  MoneyMarketFund money_market_fund = 15;

  // The venue it is listed on, the venue master's ID (contract v18): a
  // segment's venue where the listing is on one. Empty where it is listed
  // on no venue, or its venue is not yet known.
  string listing_venue_id = 16;

  // Retired in the domain message, and never reused.
  reserved 3;
}

// Lifecycle. The transition verbs are the commands; nothing sets this directly.
// A mirror of meridian.v1.InstrumentLifecycleState.
enum InstrumentLifecycleState {
  INSTRUMENT_LIFECYCLE_STATE_UNSPECIFIED = 0;
  // Identity exists, attributes may be incomplete. A holding can reference it,
  // which is the point: a position may arrive before anyone has decided what
  // the instrument is.
  INSTRUMENT_LIFECYCLE_STATE_DEFINE = 1;
  // Fully defined.
  INSTRUMENT_LIFECYCLE_STATE_ACTIVE = 2;
  // Retired. Existing holdings stay resolvable, because history does not stop
  // being true when an instrument stops trading.
  INSTRUMENT_LIFECYCLE_STATE_DECOMMISSIONED = 3;
}

// Where a value in force on a deployment's record came from (W3,
// requirements 1 and 3).
// A mirror of meridian.v1.InstrumentValueSource.
message InstrumentValueSource {
  InstrumentField field = 1;

  // For INSTRUMENT_FIELD_IDENTIFIER: which identifier.
  Identifier identifier = 2;

  // In words, as the value was set with.
  string source = 3;

  // The person who set or accepted it: the deployment-local subject core
  // stamped from the command's envelope (W4.9), never typed. Empty for an
  // identifier a plugin reported, the platform's global ID, and a value
  // applied from the platform before contract v10.
  string person = 4;

  // The plugin instance whose resolve joined the identifier (W3.1). Empty
  // otherwise.
  string instance_id = 5;

  // When the store recorded it.
  int64 recorded_at_ns = 6;

  // Why a value held was changed, where given.
  string note = 7;

  // The delegation the person acted through, when they set or accepted the
  // value through a client -- an agent on the deployment's MCP surface --
  // rather than at the dashboard in a browser (W3.10, W6.20, contract v12):
  // stamped from the command's envelope (W4.9), never typed. Empty beside a
  // person at the dashboard, and wherever person is.
  string acting_through_delegation = 8;

  // The client's registered name, beside acting_through_delegation, as the
  // envelope carried it; empty whenever it is.
  string client_name = 9;
}

// Which value of a deployment's instrument record (W3, contract v10).
// A mirror of meridian.v1.InstrumentField.
enum InstrumentField {
  INSTRUMENT_FIELD_UNSPECIFIED = 0;
  INSTRUMENT_FIELD_ASSET_CLASS = 1;
  INSTRUMENT_FIELD_CURRENCY = 2;
  INSTRUMENT_FIELD_DESCRIPTION = 3;
  // One of its identifiers, named beside the field.
  INSTRUMENT_FIELD_IDENTIFIER = 4;
  // Contract v11.
  INSTRUMENT_FIELD_INSTRUMENT_TYPE = 5;
  INSTRUMENT_FIELD_MONEY_MARKET_FUND = 6;
}

// A value offered for a deployment's record (W3.1, W3.3), shown beside its
// field and in force only when a person accepts it (W3.10).
// A mirror of meridian.v1.OfferedValue.
message OfferedValue {
  InstrumentValue value = 1;

  // The plugin instance whose source stated it. Empty for the platform's
  // answer and for an offer the store derives itself (ISO 4217 for an
  // `iso4217` identifier).
  string instance_id = 2;

  int64 offered_at_ns = 3;
}

// One value for a deployment's record, set or offered, with where it came
// from (W3.10, W3.1, W3.3).
// A mirror of meridian.v1.InstrumentValue.
message InstrumentValue {
  oneof value {
    // One of the closed list; never unspecified.
    AssetClass asset_class = 1;
    // An ISO 4217 code, three capital letters; never a pseudo-currency such
    // as BASE.
    string currency = 2;
    string description = 3;
    Identifier identifier = 4;
    // Contract v11: one under the record's asset class; never unspecified.
    InstrumentType instrument_type = 6;
    // Contract v11: on a money market fund only, each attribute stated.
    MoneyMarketFund money_market_fund = 7;
  }

  // Where the value came from, in words: a statement, a prospectus, "ISO
  // 4217", "the platform, record INS-... version 3". Required on a value a
  // person sets.
  string source = 5;
}

// A money market fund's attributes, from SEC rule 2a-7 as amended in 2023
// (the product owner, 2026-10-02, the custody audit's Q4). Its observations
// -- its NAV on a day, its seven-day yield, its liquid assets, a fee imposed
// -- are the lake's, not the record's.
// A mirror of meridian.v1.MoneyMarketFund.
message MoneyMarketFund {
  MoneyMarketFundCategory category = 1;

  MoneyMarketFundInvestors investors = 2;

  MoneyMarketFundNav nav = 3;

  LiquidityFeeRegime liquidity_fee = 4;
}

// What a money market fund invests in.
// A mirror of meridian.v1.MoneyMarketFundCategory.
enum MoneyMarketFundCategory {
  MONEY_MARKET_FUND_CATEGORY_UNSPECIFIED = 0;
  // Cash, government securities and repurchase agreements backed by them.
  MONEY_MARKET_FUND_CATEGORY_GOVERNMENT = 1;
  // Also corporate short-term debt.
  MONEY_MARKET_FUND_CATEGORY_PRIME = 2;
  // Short-term municipal debt.
  MONEY_MARKET_FUND_CATEGORY_TAX_EXEMPT = 3;
}

// Whom a money market fund is offered to.
// A mirror of meridian.v1.MoneyMarketFundInvestors.
enum MoneyMarketFundInvestors {
  MONEY_MARKET_FUND_INVESTORS_UNSPECIFIED = 0;
  // Natural persons only.
  MONEY_MARKET_FUND_INVESTORS_RETAIL = 1;
  MONEY_MARKET_FUND_INVESTORS_INSTITUTIONAL = 2;
}

// How a money market fund prices its shares.
// A mirror of meridian.v1.MoneyMarketFundNav.
enum MoneyMarketFundNav {
  MONEY_MARKET_FUND_NAV_UNSPECIFIED = 0;
  // A stable share price of 1.00: the book takes its position as one lot at
  // stable value (W9.1).
  MONEY_MARKET_FUND_NAV_STABLE = 1;
  // A share price that floats with its holdings: lots like any fund.
  MONEY_MARKET_FUND_NAV_FLOATING = 2;
}

// When a money market fund charges a fee on redemptions.
// A mirror of meridian.v1.LiquidityFeeRegime.
enum LiquidityFeeRegime {
  LIQUIDITY_FEE_REGIME_UNSPECIFIED = 0;
  // Charged when daily net redemptions pass 5% of net assets: an
  // institutional prime or tax-exempt fund.
  LIQUIDITY_FEE_REGIME_MANDATORY = 1;
  // At the board's discretion, where in the fund's interest.
  LIQUIDITY_FEE_REGIME_DISCRETIONARY = 2;
  // No liquidity fee: a government fund that has not chosen one, which
  // neither of the others describes (contract v12).
  LIQUIDITY_FEE_REGIME_NONE = 3;
}

// The only thing holdings are recorded against. A plugin creates one only by
// linking an external account to a new one, acting for a deployment admin in
// a session opened by Manage (W6.4).
// A mirror of meridian.v1.AccountRecord.
message AccountRecord {
  string account_id = 1;

  string name = 2;

  AccountState state = 3;

  int64 created_at_ns = 4;

  // Free text, optional, and searchable as the name is (W6.3). Where the
  // account is held, e.g. "Fidelity". At most 200 characters.
  string custodian = 5;

  // What the account is, e.g. "Roth IRA". At most 200 characters.
  string account_type = 6;

  // One ownership or grouping label, e.g. "Fund I". At most 200 characters.
  string owner = 7;

  // Anything else worth knowing about it. At most 2,000 characters.
  string note = 8;
}

// A mirror of meridian.v1.AccountState.
enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  ACCOUNT_STATE_OPEN = 1;
  // Closed, not deleted: an account is the subject of records that outlive it.
  ACCOUNT_STATE_CLOSED = 2;
}

// A mirror of meridian.v1.OpeningSource.
message OpeningSource {
  OpeningSourceKind kind = 1;

  // The custodian or system as it is known in the deployment (the external
  // account's institution, the prior system's name).
  string name = 2;

  // ISO 8601: the date the source's figures are as of.
  string as_of_date = 3;

  PositionBasis basis = 4;

  // The street records it was composed from, by value (decisions/012).
  repeated StreetRecordRef street_records = 5;
}

// A mirror of meridian.v1.OpeningSourceKind.
enum OpeningSourceKind {
  OPENING_SOURCE_KIND_UNSPECIFIED = 0;
  OPENING_SOURCE_KIND_CUSTODIAN = 1;
  OPENING_SOURCE_KIND_PRIOR_SYSTEM = 2;
}

// A mirror of meridian.v1.PositionBasis.
enum PositionBasis {
  POSITION_BASIS_UNSPECIFIED = 0;
  POSITION_BASIS_TRADE_DATE = 1;
  POSITION_BASIS_SETTLE_DATE = 2;
}

// A street record named by value: never a key the book follows.
// A mirror of meridian.v1.StreetRecordRef.
message StreetRecordRef {
  string statement_id = 1;

  // The custodial position's change, where one was compared or used.
  JournalRef change = 2;

  // ISO 8601: the custodian's as-of date.
  string as_of_date = 3;
}

// A mirror of meridian.v1.OpeningPosition.
message OpeningPosition {
  string instrument_id = 1;

  HoldingSide side = 2;

  Decimal trade_date_quantity = 3;

  // Required (v9): where the source states none, a person supplies it.
  // Unset, the opening balance is refused (REFUSAL_REASON_INCOMPLETE).
  optional Decimal settled_quantity = 4;

  // Each with its value date; with the settled quantity they account for
  // the whole trade-date quantity, or the balance is refused.
  repeated PendingSettlement pending = 5;

  // As reported and completed by a person, each with its quantity, cost and
  // acquisition date; required but on cash, which sends none (v9).
  repeated OpeningLot lots = 6;
}

// A mirror of meridian.v1.PendingSettlement.
message PendingSettlement {
  // ISO 8601. Required at an opening balance (v9); empty on a position only
  // for "date not stated", from a v8 opening balance or an adjustment the
  // street gave no date for.
  string value_date = 1;

  Decimal quantity = 2;

  PendingState state = 3;
}

// A mirror of meridian.v1.PendingState.
message PendingState {
  bool failing = 1;

  // As reported.
  string fail_reason = 2;

  // ISO 8601; the date it is now expected; the bucket keeps its intended
  // date ("Three more considerations", 2).
  string expected_date = 3;
}

// A mirror of meridian.v1.OpeningLot.
message OpeningLot {
  Decimal quantity = 1;

  LotTerms terms = 2;
}

// A mirror of meridian.v1.LotTerms.
message LotTerms {
  // Each unset where not known; never derived one from the other. A lot the
  // book opens carries its cost and acquisition date (v9): an opening
  // balance or an adjustment without either is refused
  // (REFUSAL_REASON_INCOMPLETE); a lot a v8 book opened may lack them.
  optional Money unit_cost = 1;

  optional Money cost = 2;

  string acquired_date = 3;

  // Apart from acquisition, for wash-sale tacking; empty is the acquired
  // date.
  string holding_period_start = 4;

  string settlement_date = 5;

  LotSource source = 6;
}

// A mirror of meridian.v1.LotSource.
enum LotSource {
  LOT_SOURCE_UNSPECIFIED = 0;
  // As the opening balance's source reported it (Q2).
  LOT_SOURCE_OPENING_BALANCE = 1;
  // Opened by an adjustment resolving a break (Q28). Step 5 adds the
  // book's own trade, slice D a transfer in.
  LOT_SOURCE_ADJUSTMENT = 2;
}

// What a journal entry records beside its JournalRef and ChangeCause.
// A mirror of meridian.v1.EntryMeta.
message EntryMeta {
  // Minted by the book.
  string entry_id = 1;

  // An open list a reader takes as data (Q19): in v8 opening-balance,
  // placeholder-moved (instrument-merged from v10), figures-recorded, break-recorded, break-handled,
  // break-resolved, break-closed, adjustment, reversal, attribute-set.
  string kind = 2;

  Actor actor = 3;

  // The time on the message that caused it, and when the book received it;
  // when it committed is the cause's committed_at_ns.
  int64 event_time_ns = 4;

  int64 received_at_ns = 5;

  // ISO 8601: the business date it stands for.
  string effective_date = 6;

  // The control partition's sequence in force (decisions/024's note).
  uint64 control_sequence = 7;

  // Each instrument it names, with the reference record's version in force
  // when it was recorded; none where the store has no version (Q31).
  repeated ReferenceVersion reference_versions = 8;

  // Required on a justified act: an opening balance, an adjustment, a
  // reversal, a resolution, handling, an attribute.
  string reason = 9;

  // The breaks it records, handles, resolves or closes.
  repeated string break_ids = 10;

  // The key the plugin sent the command with, where it sent one (Q12 of the
  // sample operations plugin, ruled 2026-10-01).
  string idempotency_key = 11;
}

// Who made a change (step 5's requirement 28, landed with v8). Set by the
// book from the envelope the sidecar stamped (W4.9), never by a plugin.
// A mirror of meridian.v1.Actor.
message Actor {
  oneof kind {
    // A person the sidecar vouched for, by the deployment-local subject
    // W6.1 records.
    PersonActor person = 1;
    // A finding reported with no user: the plugin instance that sent it;
    // the book's own act (a merged record followed) leaves it empty.
    SystemActor system = 2;
  }
}

// A mirror of meridian.v1.PersonActor.
message PersonActor {
  string subject = 1;

  // The delegation the person acted through, and the client's registered
  // name, as the sidecar stamped them beside the person (W4.9, decisions/029;
  // contract v10). Empty for a person at the dashboard in a browser, and on
  // every act recorded before v10. The person stays the actor.
  string delegation_id = 2;

  string client_name = 3;
}

// A mirror of meridian.v1.SystemActor.
message SystemActor {
  string instance_id = 1;
}

// A mirror of meridian.v1.ReferenceVersion.
message ReferenceVersion {
  string instrument_id = 1;

  // The InstrumentRecord's version (W3.6).
  int64 version = 2;
}

// A mirror of meridian.v1.BookPosition.
message BookPosition {
  string account_id = 1;

  string instrument_id = 2;

  HoldingSide side = 3;

  // Settled plus pending, by construction; plus not stated where a v8
  // opening balance opened that bucket.
  Decimal trade_date_quantity = 4;

  // Unset only while some of the quantity is in the not-stated bucket a v8
  // opening balance opened: unknown, never zero.
  optional Decimal settled_quantity = 5;

  // Zero on every position v9 records.
  Decimal not_stated_quantity = 6;

  repeated PendingSettlement pending = 7;

  // Open lots; their open quantities sum to trade_date_quantity, cash
  // excepted.
  repeated Lot lots = 8;

  // The opening balance's sources, with their as-of and basis.
  repeated OpeningSource opened_from = 9;

  // The business date of its last change.
  string effective_date = 10;

  JournalRef last_change = 11;

  // A tombstone, after a merged record's move (W9.9): returned only to a
  // read since a watermark, and delivered once.
  bool removed = 12;

  // What of it cannot move, as the operations plugin last recorded it from
  // a statement (W9.15): an attribute, never a movement.
  repeated Encumbrance encumbrances = 14;

  // Derived, never reported: the quantity on free_basis less its
  // encumbrances. Unset while that quantity is unknown (some not stated).
  optional Decimal free_quantity = 15;

  FreeBasis free_basis = 16;

  // Retired in the domain message, and never reused.
  reserved 13;
  reserved "placeholder";
}

// A mirror of meridian.v1.Lot.
message Lot {
  // Minted by the book.
  string lot_id = 1;

  Decimal open_quantity = 2;

  Decimal original_quantity = 3;

  // As opened, with each basis adjustment applied.
  LotTerms terms = 4;

  JournalRef opened_by = 5;

  repeated JournalRef relieved_by = 6;

  repeated JournalRef adjusted_by = 7;
}

// One encumbrance of a position, as the book holds it.
// A mirror of meridian.v1.Encumbrance.
message Encumbrance {
  // PLEDGED to OTHER only; the street's PENDING, REHYPOTHECATED and
  // BORROWED are refused.
  EncumbranceKind kind = 1;

  // Signed as the position's quantity.
  Decimal quantity = 2;

  string pledgee = 3;

  string held_at = 4;

  // Unset where the source names none.
  MarginAgreementRef agreement = 5;

  // The source's code, verbatim; required for OTHER.
  string source_code = 6;

  string detail = 7;

  // The statement it was recorded from.
  StreetRecordRef source = 8;

  // Set by the book: the business date it was first recorded under its
  // kind, pledgee, location and agreement, and the change that last set it.
  string since_date = 9;

  JournalRef set_by = 10;
}

// A mirror of meridian.v1.MarginAgreementRef.
message MarginAgreementRef {
  oneof agreement {
    // Step 4: the statement's external account and segment (Q12). An
    // agreement the book records under a template arrives as another arm.
    StatementSegmentRef statement_segment = 1;
  }
}

// A mirror of meridian.v1.StatementSegmentRef.
message StatementSegmentRef {
  string external_account_id = 1;

  // As the venue names it; empty for the account as a whole.
  string segment = 2;

  // As reported: the external account's institution.
  string counterparty = 3;
}

// The basis a position's free quantity is computed on.
// A mirror of meridian.v1.FreeBasis.
enum FreeBasis {
  FREE_BASIS_UNSPECIFIED = 0;
  // Settled: a pledged or lent security that has not settled cannot be
  // delivered either (the product owner, 2026-10-01, Q2). The book's
  // default, and in v8 its only basis.
  FREE_BASIS_SETTLED = 1;
  FREE_BASIS_TRADE_DATE = 2;
}

// A mirror of meridian.v1.Break.
message Break {
  string break_id = 1;

  string account_id = 2;

  oneof subject {
    PositionKey position = 3;
    FigureKey figure = 4;
  }

  BreakCategory category = 5;

  repeated BreakDifference differences = 6;

  Watermark book_watermark = 7;

  StreetRecordRef street = 8;

  // ISO 8601 business dates; age is derived from them, never stored.
  string first_seen_date = 9;

  string last_seen_date = 10;

  BreakState state = 11;

  repeated BreakCause candidate_causes = 12;

  BreakCause confirmed_cause = 13;

  BreakHandling handling = 14;

  BreakResolution resolution = 15;

  Actor recorded_by = 16;

  JournalRef last_change = 17;
}

// A mirror of meridian.v1.PositionKey.
message PositionKey {
  string instrument_id = 1;

  HoldingSide side = 2;
}

// A mirror of meridian.v1.FigureKey.
message FigureKey {
  MarginAgreementRef agreement = 1;

  // The figure, by its field's name in the data dictionary.
  string figure = 2;

  // For a collateral balance: its instrument.
  string instrument_id = 3;
}

// A mirror of meridian.v1.BreakCategory.
enum BreakCategory {
  BREAK_CATEGORY_UNSPECIFIED = 0;
  BREAK_CATEGORY_TRADE_DATE_QUANTITY = 1;
  BREAK_CATEGORY_SETTLED_QUANTITY = 2;
  BREAK_CATEGORY_COST_OR_LOTS = 3;
  BREAK_CATEGORY_SETTLED_AGAINST_PENDING = 4;
  BREAK_CATEGORY_BOOK_ONLY = 5;
  BREAK_CATEGORY_STREET_ONLY = 6;
  // A figure the book holds a value of its own for, such as the street's
  // available and not available against the book's position, or an
  // encumbrance against the book's of that kind, location and pledgee.
  BREAK_CATEGORY_FIGURE = 7;
}

// A mirror of meridian.v1.BreakDifference.
message BreakDifference {
  // The field, by its name in the data dictionary ("settled_quantity",
  // "lots[2].terms.cost").
  string field = 1;

  BreakValue book = 2;

  BreakValue street = 3;
}

// One side of a difference; unset: absent on that side.
// A mirror of meridian.v1.BreakValue.
message BreakValue {
  oneof value {
    Decimal quantity = 1;
    Money amount = 2;
    string text = 3;
  }
}

// A mirror of meridian.v1.BreakState.
enum BreakState {
  BREAK_STATE_UNSPECIFIED = 0;
  BREAK_STATE_OPEN = 1;
  BREAK_STATE_RESOLVED = 2;
  BREAK_STATE_CLOSED = 3;
}

// The item found to cause a break, linked by value (Q23's target).
// A mirror of meridian.v1.BreakCause.
message BreakCause {
  BreakCauseCategory category = 1;

  oneof item {
    StreetRecordRef street_record = 2;
    JournalRef book_entry = 3;
    PendingSettlementRef pending_settlement = 4;
    // A corporate action's reference, as reported.
    string event_reference = 5;
    bool none_found = 6;
    // The custodian's activity that explains it (contract v14).
    ActivityRef activity = 8;
  }

  string note = 7;
}

// A mirror of meridian.v1.BreakCauseCategory.
enum BreakCauseCategory {
  BREAK_CAUSE_CATEGORY_UNSPECIFIED = 0;
  BREAK_CAUSE_CATEGORY_UNBOOKED_TRADE = 1;
  BREAK_CAUSE_CATEGORY_SETTLEMENT_TIMING = 2;
  BREAK_CAUSE_CATEGORY_COST_OR_PRICE = 3;
  BREAK_CAUSE_CATEGORY_CORPORATE_ACTION = 4;
  BREAK_CAUSE_CATEGORY_FAIL = 5;
  BREAK_CAUSE_CATEGORY_CUSTODIAN_ERROR = 6;
  BREAK_CAUSE_CATEGORY_UNKNOWN = 7;
  // Income the custodian reinvested in units, which the book has not
  // booked: a money market fund's monthly dividend (contract v14).
  BREAK_CAUSE_CATEGORY_INCOME_REINVESTED = 8;
}

// A mirror of meridian.v1.PendingSettlementRef.
message PendingSettlementRef {
  string instrument_id = 1;

  HoldingSide side = 2;

  string value_date = 3;
}

// An activity the street recorded (W2.12), named by value: never a key the
// book follows, and recorded as given (decisions/012).
// A mirror of meridian.v1.ActivityRef.
message ActivityRef {
  // The street's identifier for the activity.
  string activity_id = 1;

  // Its record in the street's partition.
  JournalRef change = 2;

  // ISO 8601: the activity's trade date, as the custodian stated it.
  string trade_date = 3;
}

// A mirror of meridian.v1.BreakHandling.
message BreakHandling {
  // A user the deployment knows (W6.1): one granted write on the account
  // through the plugin, or the person taking it (Q11 of the sample
  // operations plugin, ruled 2026-10-01).
  string owner_subject = 1;

  // The operations plugin's own levels; core gives them no meaning.
  uint32 escalation_level = 2;

  // ISO 8601.
  string due_date = 3;
}

// A mirror of meridian.v1.BreakResolution.
message BreakResolution {
  // Resolved: the entries that corrected the book.
  repeated JournalRef entries = 1;

  // Closed: the explanation, no entry.
  string explanation = 2;

  Actor actor = 3;

  string reason = 4;

  // Closed as cleared: the street record where the difference was gone (Q2
  // of the sample operations plugin, ruled 2026-10-01).
  StreetRecordRef cleared_at = 5;
}

// The record: one per account, agreement and business date.
// A mirror of meridian.v1.AccountFigures.
message AccountFigures {
  string account_id = 1;

  string business_date = 2;

  MarginAgreementRef agreement = 3;

  StatementFigures figures = 4;

  repeated ReportedPositionValue position_values = 5;

  StreetRecordRef source = 6;

  JournalRef last_change = 7;
}

// The custodian's, labelled as such (Q8, revised and ruled); never a
// position's own.
// A mirror of meridian.v1.ReportedPositionValue.
message ReportedPositionValue {
  string instrument_id = 1;

  HoldingSide side = 2;

  optional Money market_value = 3;

  optional Money margin_requirement = 4;
}

// A mirror of meridian.v1.AccountAttributes.
message AccountAttributes {
  string account_id = 1;

  // ISO 4217 until the money revision names an asset
  // (sdk-contract/money-names-an-asset-not-only-an-iso-currency).
  string base_currency_code = 2;

  LotReliefMethod lot_relief_default = 3;

  JournalRef last_change = 4;

  // The standing opening balance, set by the book when it journals W9.1;
  // unset while none stands (Q21 of the sample operations plugin, ruled
  // 2026-10-01).
  OpeningBalance opening_balance = 5;
}

// A mirror of meridian.v1.LotReliefMethod.
enum LotReliefMethod {
  LOT_RELIEF_METHOD_UNSPECIFIED = 0;
  LOT_RELIEF_METHOD_FIRST_IN_FIRST_OUT = 1;
  LOT_RELIEF_METHOD_LAST_IN_FIRST_OUT = 2;
  LOT_RELIEF_METHOD_HIGHEST_COST = 3;
  LOT_RELIEF_METHOD_LOWEST_COST = 4;
  LOT_RELIEF_METHOD_AVERAGE_COST = 5;
}

// The account's standing opening balance, set by the book when it journals
// W9.1 and cleared when it is reversed (Q21 of the sample operations plugin,
// ruled 2026-10-01): its entry, D0 and sources, read on the account's
// attributes (W9.14).
// A mirror of meridian.v1.OpeningBalance.
message OpeningBalance {
  string entry_id = 1;

  // ISO 8601: D0.
  string as_of_date = 2;

  // As recorded, the street records it was composed from among them.
  repeated OpeningSource sources = 3;

  Actor recorded_by = 4;

  JournalRef journal = 5;

  // The reason the person gave.
  string reason = 6;
}

// A mirror of meridian.v1.AgreementFigures.
message AgreementFigures {
  MarginAgreementRef agreement = 1;

  // As the street recorded them (W2.2), its segment equal to the
  // agreement's.
  StatementFigures figures = 2;

  // On the set with no segment only.
  repeated ReportedPositionValue position_values = 3;
}

// One position's encumbrances, as a statement states them: the whole set,
// empty when the statement reports none.
// A mirror of meridian.v1.PositionEncumbrances.
message PositionEncumbrances {
  string instrument_id = 1;

  HoldingSide side = 2;

  repeated Encumbrance encumbrances = 3;
}

// Step 5's non-order transaction's first kind (Q28). Slice D adds the
// cash-flow class and the other kinds as fields of their own (Q20).
// A mirror of meridian.v1.Adjustment.
message Adjustment {
  // After the opening balance's date.
  string effective_date = 1;

  repeated MovementLine lines = 2;

  repeated BasisAdjustment basis_adjustments = 3;

  // A corporate action's reference, as reported, where it records one; from
  // contract v14, the activity's identifier (W2.12) where the adjustment was
  // proposed from the custodian's activity.
  string event_reference = 4;
}

// A mirror of meridian.v1.MovementLine.
message MovementLine {
  // The deployment's instrument record, a currency's cash instrument
  // included.
  string instrument_id = 1;

  HoldingSide side = 2;

  SettlementBucket bucket = 3;

  // ISO 8601; on a pending line, empty only on an adjustment the street gave
  // no date for; may be years out.
  string value_date = 4;

  // Signed as the position's quantity is, and added to it.
  Decimal quantity = 5;

  // The lot it adds to or relieves. Empty on a line that opens a lot, whose
  // identifier the book mints, and on cash, which has no lots.
  string lot_id = 6;

  // Set on the line that opens a lot, and only there.
  LotTerms opens_lot = 7;

  // A pending line's fail, where its source reports one.
  PendingState pending_state = 8;
}

// A mirror of meridian.v1.SettlementBucket.
enum SettlementBucket {
  // Refused.
  SETTLEMENT_BUCKET_UNSPECIFIED = 0;
  SETTLEMENT_BUCKET_SETTLED = 1;
  // Pending settlement on the line's value date. With no value date on an
  // adjustment the street gave no date for, or on a line a v8 opening
  // balance recorded ("date not stated").
  SETTLEMENT_BUCKET_PENDING = 2;
  // The source did not say whether it is settled or pending: only on a line
  // a v8 opening balance recorded. Refused from v9.
  SETTLEMENT_BUCKET_NOT_STATED = 3;
}

// A mirror of meridian.v1.BasisAdjustment.
message BasisAdjustment {
  string lot_id = 1;

  oneof cost {
    // Added to the lot's cost; signed. Only on a lot whose cost is known.
    Money cost_change = 2;
    // The lot's cost, stated where it was unknown: a lot a v8 book opened
    // with no cost, given its cost once it is known. Only on a lot whose cost
    // is unknown; from v9 the book opens none.
    Money stated_cost = 4;
  }

  // Where it moves; empty is unchanged.
  string holding_period_start = 3;
}

// Names the entry it reverses; the book negates its lines, at that entry's
// effective date.
// A mirror of meridian.v1.Reversal.
message Reversal {
  string entry_id = 1;
}

// A mirror of meridian.v1.ResolvedByEntries.
message ResolvedByEntries {
  repeated string entry_ids = 1;
}

// The venue master's record of one venue (W1.16). The platform mints its ID;
// a deployment keeps what it pulled (W3.5) and answers it (W3.14).
// A mirror of meridian.v1.VenueRecord.
message VenueRecord {
  // The venue's ID for life, "VEN-...", minted by the platform.
  string venue_id = 1;

  string name = 2;

  // ISO 3166-1 alpha-2: where the venue operates.
  string country_code = 3;

  VenueKind kind = 4;

  // Its identifiers: an ISO 10383 MIC under the scheme `iso10383`, operating
  // or segment, where it has one; a vendor's code as a `symbol` with its
  // source. In force from `valid_from_ns`. An amend replaces them.
  repeated Identifier identifiers = 5;

  // A segment's operating venue, the venue master's ID; empty for a venue
  // that is its own operating venue.
  string operating_venue_id = 6;

  // An IANA time zone: the venue's local time, which its sessions and a
  // business date at it are in.
  string time_zone = 7;

  // Monotonic, assigned by the platform, starting at 1.
  int64 version = 8;

  // When this version became true.
  int64 valid_from_ns = 9;

  // When the platform recorded it. Stamped by the platform, never accepted
  // from a caller.
  int64 record_time_ns = 10;

  // Active, or decommissioned: an expired MIC is a decommissioned venue,
  // which still resolves for a date it was in force. The security master's
  // lifecycle; a venue is never in its define state.
  InstrumentLifecycleState lifecycle_state = 11;
}

// What kind of venue it is. A closed list, grown by revision.
// A mirror of meridian.v1.VenueKind.
enum VenueKind {
  VENUE_KIND_UNSPECIFIED = 0;
  // A regulated exchange.
  VENUE_KIND_EXCHANGE = 1;
  // An alternative trading system, or a multilateral trading facility.
  VENUE_KIND_ALTERNATIVE_TRADING_SYSTEM = 2;
  // An exchange of crypto assets.
  VENUE_KIND_CRYPTO_EXCHANGE = 3;
  // A network of dealers quoting on request, over the counter or by
  // indication: RFQ, OTC and, for now, IOI networks.
  VENUE_KIND_DEALER_NETWORK = 4;
  // A facility trades are reported to, not traded on: a trade reporting
  // facility, an alternative display facility, an approved publication
  // arrangement.
  VENUE_KIND_REPORTING_FACILITY = 5;
}

// A price of one kind for one subject. An FX rate is the price of one
// currency's cash instrument in another (spec/the-lake, Q3); the lake never
// inverts or crosses a rate.
// A mirror of meridian.v1.Price.
message Price {
  ObservationMeta meta = 1;

  PriceKind kind = 2;

  // The price of one unit of the subject, in the asset it was quoted in.
  Money price = 3;

  PriceBasis basis = 4;
}

// The envelope every row of every data type carries, as its first field
// (spec/the-lake, requirement 4).
// A mirror of meridian.v1.ObservationMeta.
message ObservationMeta {
  // The `dgm`'s identity for this observation, made from its raw record, so
  // the same observation recorded again changes nothing and a changed value
  // under it is a restatement. 1 to 128 characters.
  string row_key = 1;

  // The entities the row is about, each resolved through W3.1: 1 to 8.
  repeated SubjectRef subjects = 2;

  // Where the row came from.
  Source source = 3;

  // When the value became true, the event happened, or the period began.
  int64 valid_from_ns = 4;

  // The period's end, exclusive; 0 for an instant, or a value in force until
  // the next.
  int64 valid_until_ns = 5;

  // The business date a daily value is for, an ISO 8601 date (2026-10-09),
  // in the calendar its dataset declares (DatasetDeclaration.day_time_zone);
  // empty for a value that is not daily. A plain date, never a moment.
  string business_date = 6;

  // The source's own timestamps, at most one of each kind: 0 to 6.
  repeated SourceTime source_times = 7;

  // When the `dgm`'s sidecar published it: the envelope's publication time,
  // which the sidecar stamps. A plugin's value is never read.
  int64 sent_at_ns = 8;

  // When the lake committed this version: the time a point-in-time read
  // cuts at. Decided by the lake.
  int64 recorded_at_ns = 9;

  // 1 for the first record of the row key, one more for each restatement.
  // Decided by the lake.
  uint64 version = 10;

  // Its place in its dataset's partition, from 1, with no holes. Decided by
  // the lake.
  uint64 sequence = 11;

  // The sequence of the previous row of the same subject, data type and
  // dataset; 0 for the first. Decided by the lake.
  uint64 previous_sequence = 12;

  // The raw record it was converted from, in the writing plugin's storage.
  RawRecordRef raw = 13;

  // Each vendor value that failed conversion, beside a field left not
  // known: 0 to 16.
  repeated AsReported unconverted = 14;
}

// One entity a row is about.
// A mirror of meridian.v1.SubjectRef.
message SubjectRef {
  // The deployment's own ID for the entity: an instrument's in the lake's
  // 1a. 1 to 64 characters.
  string entity_id = 1;
}

// Where a row came from.
// A mirror of meridian.v1.Source.
message Source {
  // The instance that recorded it, stamped by its sidecar.
  string instance = 1;

  // That plugin's version when it recorded it: decided by the lake from the
  // version the deployment launched the instance at, never the plugin's word.
  string plugin_version = 2;

  // A dataset the instance's catalogue declares: the instance, a colon, and
  // the dataset's key (coinbase-1:daily). 1 to 96 characters.
  string dataset = 3;

  // The venue the observation originated on, the venue master's ID; empty
  // when it is not venue-specific, which is the consolidated view.
  string venue_id = 4;
}

// One of the source's own timestamps.
// A mirror of meridian.v1.SourceTime.
message SourceTime {
  SourceTimeKind kind = 1;

  // That clock's reading, in UTC, as the source gave it.
  int64 at_ns = 2;
}

// Which of the source's clocks a timestamp is.
// A mirror of meridian.v1.SourceTimeKind.
enum SourceTimeKind {
  // Refused.
  SOURCE_TIME_KIND_UNSPECIFIED = 0;
  // When it happened at its origin.
  SOURCE_TIME_KIND_EVENT = 1;
  // When a consolidator published it.
  SOURCE_TIME_KIND_CONSOLIDATED = 2;
  // When a reporting facility received it.
  SOURCE_TIME_KIND_REPORTED = 3;
  // When the vendor received it.
  SOURCE_TIME_KIND_VENDOR_RECEIVED = 4;
  // When the source released it: a close, a panel, a model.
  SOURCE_TIME_KIND_PUBLISHED = 5;
}

// Which price.
// A mirror of meridian.v1.PriceKind.
enum PriceKind {
  // Refused.
  PRICE_KIND_UNSPECIFIED = 0;
  // The dataset's declared close for the business date: the official close
  // where the venue has one, otherwise the last price of the day the
  // dataset declares.
  PRICE_KIND_CLOSE = 1;
  // The last eligible trade's price at the valid time.
  PRICE_KIND_LAST = 2;
  // A fund's net asset value per share, for the business date.
  PRICE_KIND_NAV = 3;
  // A contract's settlement price, for the business date.
  PRICE_KIND_SETTLEMENT = 4;
  // The best bid at the valid time, or the business date's closing bid.
  PRICE_KIND_BID = 5;
  // The best ask at the valid time, or the business date's closing ask.
  PRICE_KIND_ASK = 6;
  // The mid at the valid time, or the business date's closing mid.
  PRICE_KIND_MID = 7;
}

// What one unit of a price is.
// A mirror of meridian.v1.PriceBasis.
enum PriceBasis {
  // Refused.
  PRICE_BASIS_UNSPECIFIED = 0;
  // Per unit of the subject.
  PRICE_BASIS_PER_UNIT = 1;
}

// Open, high, low and close over an interval, the envelope's valid time: a
// daily bar names its business date. Empty `source.venue_id` is the
// consolidated view across venues.
// A mirror of meridian.v1.Bar.
message Bar {
  ObservationMeta meta = 1;

  // One asset for all four, and for the vwap, or the bar is refused.
  Money open = 2;

  Money high = 3;

  Money low = 4;

  Money close = 5;

  // Eligible quantity over the interval, in units of the instrument, never
  // negative.
  Decimal volume = 6;

  // Volume-weighted average price over the interval; unset when the source
  // gives none.
  optional Money vwap = 7;

  // Trades counted in the bar; unset when the source gives none.
  optional uint64 trade_count = 8;
}

// Which datasets a read is answered from (the intent's Q4): exactly one of
// the deployment's default, named datasets, or every entitled dataset side by
// side. None set is the default.
// A mirror of meridian.v1.SourceChoice.
message SourceChoice {
  // The deployment's priority for the data type and kind, with failover.
  bool default = 1;

  // These datasets, in this order: 0 to 16.
  repeated string named = 2;

  // Every dataset the reader is entitled to, each row naming its own.
  bool side_by_side = 3;
}

// A subject, dataset or field a read could not serve, and why; the rest still
// answer.
// A mirror of meridian.v1.Unanswered.
message Unanswered {
  SubjectRef subject = 1;

  string dataset = 2;

  // The field by its dictionary entry; empty for the whole row.
  string field = 3;

  UnansweredReason reason = 4;
}

// Why a part of a read was not answered.
// A mirror of meridian.v1.UnansweredReason.
enum UnansweredReason {
  // Refused.
  UNANSWERED_REASON_UNSPECIFIED = 0;
  // The reader is not entitled to the dataset, or the field.
  UNANSWERED_REASON_NOT_ENTITLED = 1;
  // No dataset covers the subject.
  UNANSWERED_REASON_NOT_COVERED = 2;
  // The lake asked the dataset's source for it (W10.7); the reader hears the
  // rows once recorded.
  UNANSWERED_REASON_ASKED_SOURCE = 3;
  // The dataset recorded nothing for the subject within its cadence.
  UNANSWERED_REASON_SOURCE_SILENT = 4;
  // The subject is not one the deployment's entities resolve.
  UNANSWERED_REASON_UNRESOLVED = 5;
  // Older than the history the dataset reaches, or the lake keeps.
  UNANSWERED_REASON_BEYOND_HISTORY = 6;
  // The dataset's licence forbids keeping it, and it was served, not kept.
  UNANSWERED_REASON_NOT_KEPT = 7;
}

// What a dataset in an answer is, once per answer rather than on every row
// (spec/the-lake, requirement 6).
// A mirror of meridian.v1.DatasetRef.
message DatasetRef {
  string dataset = 1;

  // The instance that serves it.
  string instance = 2;

  // Who originated the data, and who carried it when an aggregator did, as
  // the catalogue declares them.
  string vendor = 3;

  string aggregator = 4;

  // The dataset's catalogue entry, as its instance declared it: set in a
  // listing of datasets (W10.9) and on an entitlements change (W10.1),
  // unset in a read's answer.
  DatasetDeclaration declaration = 5;

  // For the Data sources page, in a listing of datasets (W10.9; approved
  // 2026-10-10): the rows the lake keeps of the dataset carrying a value as
  // reported beside a field left not known; and the identifiers and venues
  // its instance reported missing (W3.2, W3.15), as the lake heard them. 0
  // in a read's answer and on an entitlements change.
  uint64 unconverted_count = 6;

  uint64 miss_count = 7;
}

// One dataset a `dgm` serves. Its identity in a deployment is the instance
// and its key (spec/the-lake, Q19).
// A mirror of meridian.v1.DatasetDeclaration.
message DatasetDeclaration {
  // The dataset's name within the plugin: 1 to 40 characters, lowercase
  // letters, digits and underscores, beginning with a letter. The dataset's
  // ID in a deployment is the instance, a colon, and this.
  string key = 1;

  // Who originated the data, and who carries it when an aggregator does:
  // data, not vocabulary. The vendor 1 to 64 characters; the aggregator 0 to
  // 64, empty when reached directly.
  string vendor = 2;

  string aggregator = 3;

  // The lake's data types it serves and the optional fields it fills, each
  // by its dictionary entry: a type by its message (meridian.v1.Price), a
  // field by its entry (meridian.v1.Bar.vwap). 1 to 32.
  repeated string data_types = 4;

  // How its rows can arrive, among which the deployment chooses: 1 to 3,
  // each once.
  repeated ObservationMode modes = 5;

  // How often it updates, in seconds: what says it is silent. 0 for a
  // dataset that updates only when asked.
  uint32 cadence = 6;

  // How far back it reaches, in days; 0 when it states none.
  uint32 history = 7;

  // The terms its vendor's standard terms impose, which the deployment's
  // licence confirms or replaces (spec/the-lake, Q8). Its dataset and who
  // set it are empty here.
  DatasetLicence licence_default = 8;

  // The day a daily value's business date is in (plans/the-lake-prices-the-
  // book, Q5 and Q28): an IANA time zone, and the minute after local midnight
  // the day ends, 0 for midnight. What says which candle or session counts
  // as a business date, and when it is final; never a holiday calendar.
  string day_time_zone = 9;

  uint32 day_end_minute = 10;

  // The venue the dataset is, the venue master's ID; empty for a dataset
  // that is not one venue's, which is the consolidated view. A row naming
  // no venue is the dataset's view.
  string venue_id = 11;
}

// How a dataset's rows arrive (the lake intent's Q9 and Q10).
// A mirror of meridian.v1.ObservationMode.
enum ObservationMode {
  // Refused.
  OBSERVATION_MODE_UNSPECIFIED = 0;
  // Fetched when a reader's read is wanted (W10.7).
  OBSERVATION_MODE_PULL = 1;
  // Recorded on the source's own timetable, unasked.
  OBSERVATION_MODE_PUSH = 2;
  // Kept current from the source's stream while a standing want stands.
  OBSERVATION_MODE_STREAM = 3;
}

// A dataset's licence: its catalogue's default terms (unset dataset and
// author), or the deployment's licence a deployment admin set, which is what
// is enforced (W10.1, spec/the-lake, Q8). Records what the admin entered;
// it says nothing about whether a deployment meets a vendor's terms.
// A mirror of meridian.v1.DatasetLicence.
message DatasetLicence {
  // The dataset; empty in a catalogue's default.
  string dataset = 1;

  // Whether the lake may keep its rows; false serves them, not kept.
  bool kept = 2;

  // How long the lake keeps a row, in days from when it was recorded; 0
  // keeps it as long as the licence allows, with no limit set. At most
  // 36,500.
  uint32 retention_days = 3;

  // Whether data derived from it may be made, and shown.
  bool derived_use = 4;

  bool display = 5;

  // The fields readable by default, by their dictionary entries; empty for
  // every field. At most 64.
  repeated string default_fields = 6;

  // Whether its terms are one person's (Q16): the Data sources page warns
  // when more than one person holds read on a plugin entitled to it.
  bool personal_use = 7;

  // Who set it and when, the delegation and client a person acted through,
  // and why, as the dashboard stamped and kept them: empty in a catalogue's
  // default.
  string updated_by = 8;

  int64 updated_at_ns = 9;

  string acting_through_delegation = 10;

  string client_name = 11;

  string note = 12;
}

// A plugin instance's entitlement to a dataset, as the conductor keeps it
// (W10.1). Set by a deployment admin; never sent to the platform.
// A mirror of meridian.v1.DatasetEntitlement.
message DatasetEntitlement {
  string dataset = 1;

  // The plugin instance entitled.
  string instance = 2;

  // Whether it may read the dataset; false withdraws it.
  bool allowed = 3;

  // The fields it may read, by their dictionary entries; empty for every
  // field. At most 64.
  repeated string fields = 4;

  // Who set it and when, the deployment-local subject the dashboard
  // stamped; the delegation and client a person acted through, empty in a
  // browser; and why. Each change is its own record (decisions/031).
  string updated_by = 5;

  int64 updated_at_ns = 6;

  string acting_through_delegation = 7;

  string client_name = 8;

  string note = 9;
}

// A custodial position that changed, and the statement that changed it.
// A mirror of meridian.v1.CustodialPositionUpdatedEvent.
message CustodialPositionUpdatedEvent {
  CustodialPosition position = 1;

  // The statement that caused this. Lets a reader explain any position by
  // pointing at what produced it.
  string statement_id = 2;

  // The previous quantity, so a subscriber can render a delta without holding
  // its own history.
  Decimal previous_quantity = 4;

  // The change's number in the street's partition, chained per account with
  // the positions changed before it, and who caused it (W2.4, W4.3).
  JournalRef journal = 5;

  ChangeCause cause = 6;

  // Retired in the domain message, and never reused.
  reserved 3;
  reserved "previous_quantity_scaled_1e8";
}

// A mirror of meridian.v1.PositionChangedEvent.
message PositionChangedEvent {
  BookPosition position = 1;

  Decimal previous_trade_date_quantity = 2;

  EntryMeta entry = 3;

  JournalRef journal = 4;

  ChangeCause cause = 5;
}

// A mirror of meridian.v1.BreakChangedEvent.
message BreakChangedEvent {
  // Not `break`, a keyword in the SDKs' languages.
  Break break_record = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// A mirror of meridian.v1.AccountFiguresRecordedEvent.
message AccountFiguresRecordedEvent {
  AccountFigures figures = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// A mirror of meridian.v1.AccountAttributeChangedEvent.
message AccountAttributeChangedEvent {
  AccountAttributes attributes = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// An activity was re-resolved (W2.16): the re-resolution whole, so a
// reconciliation whose break waited on an unresolved code re-runs its
// candidate causes without a second read.
// A mirror of meridian.v1.ActivityReResolvedEvent.
message ActivityReResolvedEvent {
  // The account it is on, as its re-resolution names it.
  string account_id = 1;

  ActivityReResolution re_resolution = 2;

  // Who caused it, and its number: the re-resolution's journal, at the top
  // as every delivered record carries it (W4.3).
  ChangeCause cause = 3;

  JournalRef journal = 4;
}

// A price the lake recorded, on its dataset's subject: one row, with its
// version and sequence. Delivered latest value first per subject, dataset,
// kind and venue (conflated).
// A mirror of meridian.v1.PricesRecordedEvent.
message PricesRecordedEvent {
  Price price = 1;
}

// A bar the lake recorded, on its dataset's subject. Delivered latest value
// first per subject, dataset, venue and interval start (conflated).
// A mirror of meridian.v1.BarsRecordedEvent.
message BarsRecordedEvent {
  Bar bar = 1;
}

// What the lake asks of the instance serving a dataset. Coalesced: readers'
// identical wants are one.
// A mirror of meridian.v1.ObservationsWantedEvent.
message ObservationsWantedEvent {
  // The want's identifier, which the rows recorded for it name.
  string want_id = 1;

  string dataset = 2;

  // The data type, by its message's full name: meridian.v1.Price or
  // meridian.v1.Bar.
  string data_type = 3;

  // 1 to 500.
  repeated SubjectRef subjects = 4;

  // For prices, which kinds; empty for every kind.
  repeated PriceKind kinds = 5;

  // For bars, the bars' length.
  int64 interval_ns = 6;

  // The business date wanted, or the valid-time range; neither for the
  // latest.
  string business_date = 7;

  int64 valid_from_ns = 8;

  int64 valid_until_ns = 9;

  // Keep the subjects current until the want is withdrawn (W10.7).
  bool standing = 10;
}

// A standing want no reader has asked within the dataset's cadence.
// A mirror of meridian.v1.WantWithdrawnEvent.
message WantWithdrawnEvent {
  string want_id = 1;

  string dataset = 2;
}
