}

// The result of ListBars: meridian.v1.ListBarsReply.
message ListBarsResult {
  repeated Bar bars = 1;

  repeated Unanswered unanswered = 2;

  repeated DatasetRef datasets = 3;

  Watermark watermark = 4;

  string next_cursor = 5;
}

// Trades for subjects (contract v19): a valid-time range, from inclusive to
// exclusive, within one day of each dataset as it declares its day; or the
// rows recorded after a watermark, whatever their valid time, which is how a
// reader that lost trades catches up, a late or out-of-sequence print
// included. Exactly one is given.
// The params of ListTrades: meridian.v1.ListTradesRequest, less what the sidecar sets.
message ListTradesParams {
  // 1 to 500.
  repeated SubjectRef subjects = 1;

  SourceChoice sources = 2;

  int64 valid_from_ns = 3;

  int64 valid_until_ns = 4;

  // The watermark the reader last saw: the rows each dataset partition it
  // names recorded after its sequence there.
  Watermark after_watermark = 5;

  // The recorded-time cut-off, 0 for now: what the lake knew then.
  int64 as_of_ns = 6;

  // At most 500 rows, 100 when 0.
  uint32 page_size = 7;

  string cursor = 8;

  // Contract v20 (W10.6): for a data plugin only, the last trade its own instance
  // recorded of each subject asked, per dataset and venue, with the
  // watermark the answer was read at, so it backfills a restart's gap from
  // the venue's history. The range and watermark are then left empty. A
  // data plugin reads only its own instance's rows, by no entitlement; refused
  // from any other reader, naming it.
  bool latest_recorded = 9;

  // Contract v28: the series' keys (occ_osi, or a ticker carrying its venue's
  // MIC in source), each row keyed by one answered with the subjects asked. None: rows keyed by a
  // series are not answered unless all_series is true.
  repeated Identifier series_keys = 10;

  // Contract v28: true: rows keyed by any series of the underlying are
  // answered beside its own. False: rows keyed by a series are left out, so a
  // v27 reader of an underlying never receives its chain.
  bool all_series = 11;

  // Contract v28, amended 2026-10-28 (ruling 821): a plain date. Narrows
  // the series rows all_series answers to the series expiring in the window,
  // inclusive, as the lake's listing holds them. Set only with all_series, or
  // refused naming expiration_from. Empty: from the earliest.
  string expiration_from = 12;

  // Contract v28, amended 2026-10-28 (ruling 821): a plain date, inclusive.
  // Set only with all_series, or refused naming expiration_from. Empty: to
  // the latest.
  string expiration_to = 13;

  // Contract v28, amended 2026-10-28 (ruling 821): the dictionary entries of
  // meridian.v1.Trade to answer, 0 to 32. The envelope (meta) is always
  // answered. A field not asked is left unset and is not listed as
  // unanswered; an entry of another message is refused naming fields. None:
  // every field.
  repeated string fields = 14;
}

// The result of ListTrades: meridian.v1.ListTradesReply.
message ListTradesResult {
  repeated Trade trades = 1;

  repeated Unanswered unanswered = 2;

  repeated DatasetRef datasets = 3;

  Watermark watermark = 4;

  string next_cursor = 5;
}

// Quotes for subjects (contract v19), at one of: the latest in force at a
// valid time (`at_ns`, 0 for now), per subject, dataset, venue and the
// quote's asset; or a valid-time range within one day of each dataset as it
// declares its day. A reader that lost quotes reads the latest in force.
// The params of ListQuotes: meridian.v1.ListQuotesRequest, less what the sidecar sets.
