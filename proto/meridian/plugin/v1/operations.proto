// by the account matrix/scoped.tsv names for each row's message.
message Delivery {
  DeliveryMeta meta = 1;

  oneof item {
    Lost lost = 2;

    // One arm per row a role hears, numbered as matrix/scoped.tsv's `arm`
    // says, and never reused.
    // W2.5: platform.street.event.statement-recorded.
    StatementRecordedEvent statement_recorded = 16;
    // W2.6: platform.street.event.custodial-position-updated.
    CustodialPositionUpdatedEvent custodial_position_updated = 17;
    // W9.8: platform.book.event.position-changed.
    PositionChangedEvent position_changed = 18;
    // W9.8: platform.book.event.break-changed.
    BreakChangedEvent break_changed = 19;
    // W9.8: platform.book.event.account-figures-recorded.
    AccountFiguresRecordedEvent account_figures_recorded = 20;
    // W9.8: platform.book.event.account-attribute-changed.
    AccountAttributeChangedEvent account_attribute_changed = 21;
    // W2.12: platform.street.event.activity-recorded.
    ActivityRecordedEvent activity_recorded = 22;
    // W2.13: platform.street.event.sync-status-recorded.
    SyncStatusRecordedEvent sync_status_recorded = 23;
    // W2.16: platform.street.event.activity-re-resolved.
    ActivityReResolvedEvent activity_re_resolved = 24;
    // W10.5: platform.lake.{dataset}.event.prices-recorded.
    PricesRecordedEvent prices_recorded = 25;
    // W10.5: platform.lake.{dataset}.event.bars-recorded.
    BarsRecordedEvent bars_recorded = 26;
    // W10.7: platform.lake.event.observations-wanted.
    ObservationsWantedEvent observations_wanted = 27;
    // W10.7: platform.lake.event.want-withdrawn.
    WantWithdrawnEvent want_withdrawn = 28;
    // W10.5: platform.lake.{dataset}.event.trades-recorded.
    TradesRecordedEvent trades_recorded = 29;
    // W10.5: platform.lake.{dataset}.event.quotes-recorded.
    QuotesRecordedEvent quotes_recorded = 30;
    // W11.13: platform.book.event.order-updated.
    OrderUpdatedEvent order_updated = 31;
    // W11.13: platform.book.event.placement-updated.
    // Reaches a connectivity plugin only at the instance its
    // placement.connectivity_instance_id names (matrix/directed.tsv).
    PlacementUpdatedEvent placement_updated = 32;
    // W11.13: platform.book.event.execution-recorded.
    // Reaches a connectivity plugin only at the instance its
    // execution.raw_record.instance_id names (matrix/directed.tsv).
    ExecutionRecordedEvent execution_recorded = 33;
    // W11.13: platform.book.event.unplaced-fact-recorded.
    UnplacedFactRecordedEvent unplaced_fact_recorded = 34;
    // W11.16: platform.book.event.trading-instruction-changed.
    TradingInstructionChangedEvent trading_instruction_changed = 35;
    // W11.18: platform.book.event.locate-updated.
    LocateUpdatedEvent locate_updated = 36;
    // W11.20: platform.config.event.venue-catalogue.
    VenueCatalogueEvent report_venue_catalogue = 37;
    // W10.5: platform.lake.{dataset}.event.outcomes-recorded.
    OutcomesRecordedEvent outcomes_recorded = 38;
    // W3.8: platform.reference.event.instrument-replaced.
    InstrumentReplacedEvent replace_merged_instrument = 39;
    // W11.30: platform.book.event.booking-updated.
    BookingUpdatedEvent booking_updated = 40;
    // W11.35: platform.book.event.alert-changed.
    AlertChangedEvent alert_changed = 41;
  }
}

// What is known of a delivery beside its message.
message DeliveryMeta {
  // From the envelope.
  string message_id = 1;
  string correlation_id = 2;
  string causation_id = 3;
  int64 published_at_ns = 4;

  // The row, as ReceiveRequest names it; empty on a Lost.
  string row = 5;

  // Copied from the record's journal and cause; unset on a Lost, and on a
  // conflated row, whose sequence is in its own message.
  JournalRef journal = 6;
  ChangeCause cause = 7;

  // The cause's instance is this plugin's (Q6).
  bool own = 8;
}

// The sidecar dropped deliveries it knows of, at this point in the stream:
// its queue for the plugin full (1024), or the bus's drop count for the
// plugin's subscription risen.
message Lost {
  // How many, where the sidecar knows; 0 when it knows only that some were.
  uint64 dropped = 1;

  // The rows they were of; empty when it cannot say, which is every row.
  repeated string rows = 2;
}

// One account a connection reaches, as the custodian presents it.
// A mirror of meridian.v1.ExternalAccount.
message ExternalAccount {
  // Stable: the connector makes it so where the venue does not, and it is the
  // `external_account_id` the account's rows name. SnapTrade's changes on
  // reconnect unless its `institution_account_id` is used; Kalshi's is a
  // subaccount and a matching engine joined. A handle the venue wants on each
  // call (E*TRADE's accountIdKey, Schwab's hash) stays inside the plugin.
  string external_account_id = 1;

  // The custodian's own name for it, as a person there would recognise it.
  string name = 2;

  // Deprecated from contract v11, for `account_kind` (Q13, reversed on the
  // revision, 2026-10-01): the venue's own word, verbatim and for display
  // only. A plugin built for v11 leaves it empty; the sidecar accepts it
  // from an earlier one for the notice the stability list gives, and the
  // dashboard shows it only where no kind is sent; then it is reserved.
  string venue_account_type = 3;

  // The account's kind, converted by the plugin from the venue's own type
  // (contract v11). For display and for grouping accounts across plugins;
  // nothing gates on it, and what an account may do is the platform's
  // restriction set when that is ruled.
  AccountKind account_kind = 4;

  // The venue's type as reported, set only when the kind is not known
  // because the type did not convert (spec/vendor-differences-have-a-place-
  // in-the-contract, requirement 4). For a person to map; never read.
  AsReported account_kind_as_reported = 5;
}

// An account's kind (contract v11): one coarse kind, the platform's own
// words, never a venue's.
// A mirror of meridian.v1.AccountKind.
enum AccountKind {
  // Not known: the venue's type says neither cash nor margin nor
  // retirement, and travels beside it as reported.
  ACCOUNT_KIND_UNSPECIFIED = 0;
  // Trades settle in full from the account's own cash; no borrowing.
  ACCOUNT_KIND_CASH = 1;
  // The account may borrow against its holdings under a margin agreement.
  ACCOUNT_KIND_MARGIN = 2;
  // A tax-advantaged retirement account, whether or not it allows limited
  // margin.
  ACCOUNT_KIND_RETIREMENT = 3;
}

// A vendor's value the plugin could not convert, beside the field's
// not-known value (requirements 4, 5 and 28): the one place a vendor's own
// code crosses the sidecar. Narrow, flagged and transitional: only the value
// that failed, never alone, and gone once a mapping exists. The sidecar
// checks that each part is present and within its length, and never reads
// its meaning; nothing past the plugin interprets it.
// A mirror of meridian.v1.AsReported.
message AsReported {
  // Whose vocabulary: the plugin's registry name and, where the vendor has
  // several, its code set ("<plugin>:account-type").
  string scheme = 1;

  // The vendor's code, as sent.
  string code = 2;

  // The vendor's own words for it, as sent; the code again where it gives
  // none.
  string text = 3;
}

// Why a connection's data is, or is not, current.
//
// The venues surveyed fail in exactly these ways (reference/broker-apis.md),
// and each asks something different of a person, which is the point of
// naming them rather than leaving them to a flag and free text.
// A mirror of meridian.v1.SyncState.
enum SyncState {
  // Not said: a connector written before this was. Shown as what
  // connection_healthy says.
  SYNC_STATE_UNSPECIFIED = 0;
  // Current. Nothing to do.
  SYNC_STATE_CURRENT = 1;
  // Still serving, but older than it should be: holdings_as_of_ns says since
  // when. Usually the rail's to recover; nothing to do but wait.
  SYNC_STATE_STALE = 2;
  // A person must sign in again at the venue before it serves anything new:
  // E*TRADE and Interactive Brokers daily, Schwab weekly, Interactive Brokers
  // also when connected but signed out.
  SYNC_STATE_NEEDS_SIGN_IN = 3;
  // The connection is disabled and serves only what it last read, as
  // SnapTrade does. Somebody re-enables it.
  SYNC_STATE_DISABLED = 4;
  // Late on purpose, as Interactive Brokers through SnapTrade is by a business
  // day. Expected; nothing to do.
  SYNC_STATE_DELAYED_BY_DESIGN = 5;
  // The venue does not provide holdings through this connection, as some
  // brokerages hide them from SnapTrade (its `holdings_unavailable`). Waiting
  // changes nothing: holdings will not arrive this way, so the account is
  // connected another way or through another venue.
  SYNC_STATE_HOLDINGS_UNAVAILABLE = 6;
}

// An amount of currency: a Decimal and the asset it is in.
//
// One message rather than an amount with its currency beside it, so a message
// holding amounts in several currencies -- a USD price, a EUR commission --
// cannot pair the wrong ones. An amount is never separated from its currency.
//
// In the currency's major unit, whatever the venue counted in: a plugin that
// read cents converts before anything reaches the bus (decisions/023).
//
// From contract v18 a Money always names an instrument (decisions/023 as
// amended; the ruling of 2026-09-30): the cash instrument of the asset it is
// in, fiat and tokens alike, in the deployment's instrument store. A plugin
// may name a fiat currency by its ISO 4217 code alone, which core resolves,
// dated, to its cash instrument; an asset with no ISO 4217 code (USDC, USDT, a
// network's gas token) is named by its instrument alone, which the plugin
// resolves as it resolves any instrument (W3.1). What is kept and read back
// names the instrument.
// A mirror of meridian.v1.Money.
message Money {
  Decimal amount = 1;

  // ISO 4217, e.g. "USD": the currency's code, where the asset has one.
  // Empty for an asset with no ISO 4217 code, which `instrument_id` alone
  // names; a token's code here is refused. From v18 a plugin may send this
  // alone and core fills `instrument_id`.
  string currency_code = 2;

  // The cash instrument of the asset the amount is in, the deployment's own
  // ID (contract v18). Empty from a plugin that named a fiat currency by
  // `currency_code` alone, which core resolves; set by core on what it keeps
  // and answers. Both set must name the same asset, or the amount is
  // refused; neither set is refused.
  string instrument_id = 3;
}

// A number: a 128-bit two's-complement integer and its scale. The value is the
// integer times 10^-scale, so 1.50 is 150 at scale 2 and stays 1.50.
//
// The scale travels with the value rather than being fixed for the contract,
// because the venues disagree: Alpaca takes nine decimal places, a crypto
// asset eighteen, and a cheap token's holding runs past what 64 bits hold at
// any fixed scale that serves them both. The scale is the one the value was
// stated with; nothing normalises it.
//
// The integer's magnitude is below 10^38, which is at most 38 significant
// digits, and the scale is 0 to 18. The widest value the broker survey found,
// 100 billion units at 18 decimals, is well inside it.
// A mirror of meridian.v1.Decimal.
message Decimal {
  // The integer's upper 64 bits, signed: negative for a negative value.
  sfixed64 high = 1;

  // Its lower 64 bits, unsigned. The integer is high * 2^64 + low.
  fixed64 low = 2;

  // How many decimal places the integer carries, 0 to 18.
  uint32 scale = 3;
}

// A statement's figures for one margin segment, each as the venue reported
// it and unset where it reported none; never derived.
// A mirror of meridian.v1.StatementFigures.
message StatementFigures {
  // The segment as the venue names it, verbatim ("securities",
  // "commodities", an FCM's class); empty for the account as a whole.
  string segment = 1;

  optional Money buying_power = 2;

  optional Money margin_requirement = 3;

  // Negative is a deficit.
  optional Money maintenance_excess = 4;

  optional Money initial_margin = 5;

  optional Money variation_margin = 6;

  // A brokerage's own total account value, as it reports it (Q-B); never a
  // sum of the holdings.
  optional Money net_liquidation = 7;

  // The collateral held under this segment, as reported (W2.2; Q12, Q13).
  // A balance moves nothing: posted collateral the custodian also lists as a
  // holding is a holding row too, and collateral received under a security
  // interest is never one.
  repeated ReportedCollateral collateral = 8;
}

// One collateral balance under a margin segment, each field as the venue
// reports it and unset where it does not; never derived.
// A mirror of meridian.v1.ReportedCollateral.
message ReportedCollateral {
  // Posted by the account, or received by it. Unspecified is refused.
  CollateralDirection direction = 1;

  // Resolved as a holding's instrument is (W3.1): the deployment's record,
  // minted for it or held, the currency's cash instrument for cash; or,
  // when the resolve was ambiguous, the identifiers the connector held.
  // Exactly one of the two, as on RecordHoldingRequest.
  string instrument_id = 2;

  repeated Identifier unresolved_identifiers = 3;

  Decimal quantity = 4;

  optional Money value = 5;

  // A fraction of the value: 0.15 is 15%, a venue's percentage written as
  // its fraction.
  optional Decimal haircut = 6;

  optional Money value_after_haircut = 7;

  // Where it is held, as the venue names it: the FCM, the dealer, a
  // third-party custodian. Empty where it does not say.
  string held_at = 8;

  // Whether the receiver may reuse it, as the agreement states and the venue
  // reports it; unset where it does not say (contract v8). Received
  // collateral is never a position (Q13), reusable or not.
  optional bool reusable = 9;
}

// Whether a collateral balance was posted by the account or received by it.
// A mirror of meridian.v1.CollateralDirection.
enum CollateralDirection {
  // Not said. Refused: collateral is posted or received.
  COLLATERAL_DIRECTION_UNSPECIFIED = 0;
  COLLATERAL_DIRECTION_POSTED = 1;
  COLLATERAL_DIRECTION_RECEIVED = 2;
}

// One typed identifier for an instrument.
//
// `scheme` says what kind of identifier this is: a global scheme ("figi",
// "isin", "cusip", "sedol") or a source-scoped one ("symbol"). A source-scoped
// identifier is only meaningful alongside its source, which is why `source` is
// present and why a bare symbol can never drive a global resolve.
// A mirror of meridian.v1.Identifier.
message Identifier {
  string scheme = 1;

  string value = 2;

  // The namespace a source-scoped identifier belongs to, e.g. "snaptrade".
  // Empty for a global scheme.
  string source = 3;

  // When the identifier named the record it is on (contract v19;
  // decisions/034): from, inclusive, and until, exclusive, 0 until it left.
  // An identifier that leaves a record has its window closed at that date,
  // never deleted, so a resolve as of a date before answers the record that
  // held it. Filled by the instrument store on what it answers and by the
  // platform on a pull; a plugin never sets either, and the sidecar sends
  // both empty.
  int64 valid_from_ns = 4;

  int64 valid_until_ns = 5;
}

// A reference to the raw record a row was converted from, in the writing
// plugin's own storage (requirement 7, Q9; decisions/028). Opaque: core and
// every other plugin carry it and never follow it; a person follows it on
// the owning plugin's page. A record in a unit the plugin archived
// resolves to "archived, restorable" (contract v16); one past its window and
// deleted, following it says so, and the row stands.
// A mirror of meridian.v1.RawRecordRef.
message RawRecordRef {
  // The writing plugin's own instance, which its SDK sets from its
  // registration; the sidecar refuses a reference naming another.
  string instance_id = 1;

  // The plugin's own key for the record.
  string key = 2;
}

// Where a value a plugin sent came from, where the plugin closed it rather
// than read it from its vendor (requirements 31 to 34; plans/an-order-reaches-
// a-venue-through-the-book, Q13). A value with none on its message is the
// vendor's, from the message's raw record.
// A mirror of meridian.v1.Provenance.
message Provenance {
  // The value it is for, by its path in the message: `quantity`,
  // `settle_date_quantity`, `pending`, `market_value.currency_code`.
  string field = 1;

  ProvenanceKind kind = 2;

  // The raw record it was read from: on a value reported by the vendor
  // (from a record other than the message's own) or from a second source.
  // Never on a value supplied or derived.
  RawRecordRef raw_record = 3;

  // The second source, by name.
  string source = 4;

  // The person who supplied it, as the plugin's page knew them.
  string person = 5;

  // The rule that derived it, by name, as the plugin documents it.
  string rule = 6;

  // On a value core computed (PROVENANCE_KIND_COMPUTED, contract v22): the
  // rule and each calendar, with their versions, the date read worked it
  // out on (W3.20; the calendars spec's Q10). Never on another kind.
  DateBasis date_basis = 7;
}

// The kinds of provenance (requirement 32), the same meanings as an
// instrument value's source (v10's InstrumentValueSource), and from v22 a
// value core computed.
// A mirror of meridian.v1.ProvenanceKind.
enum ProvenanceKind {
  // Not said; refused.
  PROVENANCE_KIND_UNSPECIFIED = 0;
  // Reported by the vendor.
  PROVENANCE_KIND_REPORTED = 1;
  // From a second source of the plugin's own.
  PROVENANCE_KIND_SECOND_SOURCE = 2;
  // Supplied by a named person, on the plugin's page.
  PROVENANCE_KIND_SUPPLIED = 3;
  // Derived by a named rule in the plugin's code.
  PROVENANCE_KIND_DERIVED = 4;
  // Computed by core, with its basis (contract v22): a date the date read
  // worked out from the settlement calendars, since it is not the plugin's
  // own rule (W3.20; the calendars spec's Q10).
  PROVENANCE_KIND_COMPUTED = 5;
}

// What a date was computed on (W3.20; spec/settlement-calendars-are-core-
// reference-data, requirement 8; contract v22): the rule and its version,
// and each calendar and its version, so anything recording the date can
// record its basis with it, and the same inputs and versions always give
// the same date. Plugin-facing, since a plugin's Provenance and its
// execution's settlement date carry one; the records are core's
// (meridian-core's reference.proto).
// A mirror of meridian.v1.DateBasis.
message DateBasis {
  // Empty for a date worked out on calendars alone: a roll, a
  // business-day check.
  DateRuleRef rule = 1;

  repeated CalendarRef calendars = 2;
}

// A date rule by its kind, subject and version: a rule has no ID of its own
// (the calendars spec's Q11).
// A mirror of meridian.v1.DateRuleRef.
message DateRuleRef {
  DateRuleKind kind = 1;

  // As the platform names it: `US/equity`, a country and an asset class;
  // `EUR/USD`, a pair.
  string subject = 2;

  int64 version = 3;
}

// Which date rule (contract v22).
// A mirror of meridian.v1.DateRuleKind.
enum DateRuleKind {
  DATE_RULE_KIND_UNSPECIFIED = 0;
  // A market's settlement-date rule, for a country and an asset class.
  DATE_RULE_KIND_SETTLEMENT = 1;
  // A currency pair's spot-date rule, its tenor-date rule on it.
  DATE_RULE_KIND_SPOT = 2;
}

// A calendar at one version.
// A mirror of meridian.v1.CalendarRef.
message CalendarRef {
  // "CAL-...", the platform's ID, never reused.
  string calendar_id = 1;

  int64 version = 2;
}

// Which side of an instrument a holding or a custodial position is on.
//
// A side of its own rather than the sign alone, because a venue can report
// both sides of one instrument at once, and two rows keyed by account and
// instrument alone would overwrite each other.
// A mirror of meridian.v1.HoldingSide.
enum HoldingSide {
  // Not said. Refused by the street store: a holding says which side it is on.
  HOLDING_SIDE_UNSPECIFIED = 0;
  HOLDING_SIDE_LONG = 1;
  HOLDING_SIDE_SHORT = 2;
}

// One lot of a holding, as the custodian lists it.
// A mirror of meridian.v1.ReportedLot.
message ReportedLot {
  // Signed as the holding's quantity: negative is short.
  Decimal quantity = 1;

  // The lot's total cost, unset where not reported; its sign as reported,
  // never flipped (Q-D, 2026-10-01).
  optional Money cost = 2;

  // ISO 8601; empty where not reported.
  string acquired_date = 3;
}

// What a source's available figure is net of.
// A mirror of meridian.v1.AvailableBasis.
enum AvailableBasis {
  // The source does not say.
  AVAILABLE_BASIS_UNSPECIFIED = 0;
  AVAILABLE_BASIS_SETTLED = 1;
  AVAILABLE_BASIS_TRADED = 2;
  AVAILABLE_BASIS_CONTRACTUAL = 3;
  // A venue's figure net of its open orders (Alpaca's qty_available,
  // Binance's free): the order reservation is the oms's, never an
  // encumbrance.
  AVAILABLE_BASIS_ORDER_NETTED = 4;
}

// One sub-balance of a holding, as the source reports it.
// A mirror of meridian.v1.ReportedEncumbrance.
message ReportedEncumbrance {
  EncumbranceKind kind = 1;

  // Signed as the holding's quantity. Larger than the holding is recorded
  // as reported: the custodian's data, which the reconciliation flags.
  Decimal quantity = 2;

  // Whether the source reports it available; unset where it does not say,
  // since the kind does not imply it.
  optional bool available = 3;

  // The source's own code or label, verbatim ("PLED"); required for OTHER.
  string source_code = 4;

  // To whom it is pledged, posted or lent, as reported (a name, a BIC or an
  // LEI); empty where not stated.
  string pledgee = 5;

  // The safekeeping place or third party holding it, as reported; empty
  // where not stated.
  string held_at = 6;

  // The margin segment it is under where the source names one, as the venue
  // names it; with the holding's external account, a margin agreement's key.
  // Empty otherwise: a custody statement never names one.
  string segment = 7;

  // The source's narrative; empty where none.
  string detail = 8;
}

// Why some of a holding cannot move (reference/encumbrance-survey, 3.1).
// Pending settlement stays in the settlement buckets: PENDING, like
// REHYPOTHECATED and BORROWED, is the street's, for the statement's own
// consistency, and the book holds none of the three.
// A mirror of meridian.v1.EncumbranceKind.
enum EncumbranceKind {
  // Not said. Refused: a sub-balance says which it is.
  ENCUMBRANCE_KIND_UNSPECIFIED = 0;
  // Pledged in place to a pledgee (PLED).
  ENCUMBRANCE_KIND_PLEDGED = 1;
  // Delivered to a third party as collateral (COLO).
  ENCUMBRANCE_KIND_POSTED = 2;
  // Lent (LOAN).
  ENCUMBRANCE_KIND_ON_LOAN = 3;
  // Blocked for a stated purpose (BLOK, BLCA, BLOT, BLOV).
  ENCUMBRANCE_KIND_BLOCKED = 4;
  // Movable only under conditions or with documents (RSTR, WDOC).
  ENCUMBRANCE_KIND_RESTRICTED = 5;
  // Between depositories, agents or registers (TRAN, REGO, BTRA).
  ENCUMBRANCE_KIND_IN_TRANSIT = 6;
  // A sub-balance the plugin cannot map: its source_code required.
  ENCUMBRANCE_KIND_OTHER = 7;
  // The street's only: as reported, for the consistency check.
  ENCUMBRANCE_KIND_PENDING = 8;
  // The street's only: used by the broker under a right of use; it does not
  // reduce the available quantity.
  ENCUMBRANCE_KIND_REHYPOTHECATED = 9;
  // The street's only: borrowed, title to us, with a return obligation.
  ENCUMBRANCE_KIND_BORROWED = 10;
}

// A quantity not yet settled, and the date it is due to (W2.3, contract
// v11). Signed as its holding's quantity is: a short's pending is negative.
// A mirror of meridian.v1.ReportedPending.
message ReportedPending {
  // ISO 8601.
  string value_date = 1;

  Decimal quantity = 2;
}

// A write marked as a backfill (requirement 27): a field a contract revision
// added, re-converted from the plugin's raw records and sent for a row
// already recorded. The store journals it as an amendment beside the row as
// first recorded, never an overwrite, this its cause.
// A mirror of meridian.v1.Backfill.
message Backfill {
  // The contract version that added the field, as `v<N>`.
  string contract_version = 1;

  // The field, by its path in the message.
  string field = 2;
}

// A point in a store's record: a sequence per partition. What a read
// answers it was read at, and what a read of changes since takes.
// A mirror of meridian.v1.Watermark.
message Watermark {
  repeated PartitionSequence partitions = 1;
}

// One partition's sequence within a watermark.
// A mirror of meridian.v1.PartitionSequence.
message PartitionSequence {
  string partition = 1;

  uint64 sequence = 2;
}

// What the custodian says an account holds of an instrument, on one side,
// right now. Keyed by all three: an account may hold an instrument long and
// short at once, as a venue reporting them apart says.
//
// Custodial, and named so deliberately. This is the custodian's belief, arrived
// at by reading their statements; it is not what the deployment calculates from
// its own activity. Those are different numbers whose disagreement is the
// entire subject of reconciliation, and a message called `Position` would make
// a consumer guess which one it had.
//
// Our own book does not exist yet. When it does it gets its own message and its
// own name, and no reader of this one silently changes meaning.
// A mirror of meridian.v1.CustodialPosition.
message CustodialPosition {
  string account_id = 1;

  // The deployment's record for the instrument, whatever its ID; a record a
  // person merged into another moves onto the one that stays (W3.9).
  string instrument_id = 2;

  // The trade-date quantity, signed to match `side`.
  Decimal quantity = 9;

  // Unset where the custodian reported no value, which is not zero.
  Money market_value = 10;

  // The statement this was last stated by, and when. One not restated recently
  // is not wrong, but it is worth showing differently.
  string last_statement_id = 6;

  string as_of_date = 7;

  int64 updated_at_ns = 8;

  HoldingSide side = 11;

  // The settle-date quantity, where the custodian reported one.
  Decimal settle_date_quantity = 12;

  // Deprecated from contract v11, as on RecordHoldingRequest: the street
  // counts each asset once. Set only from a plugin before v11.
  bool also_counted_in_cash = 13;

  // As the custodian reported them on the row that last stated this, unset
  // or empty where it reported none (W2.3).
  Money cost_basis = 14;

  repeated ReportedLot lots = 15;

  Money margin_requirement = 16;

  // Its last change: a delivery at or below it is already in it.
  JournalRef last_change = 17;

  // A tombstone (W2.6, W3.9): returned only to a read since a watermark,
  // and delivered once.
  bool removed = 18;

  // As on RecordHoldingRequest (Q-A).
  Money average_cost = 19;

  // As on RecordHoldingRequest, from the row that last stated this.
  Decimal available_quantity = 20;

  Decimal not_available_quantity = 21;

  AvailableBasis available_basis = 22;

  repeated ReportedEncumbrance encumbrances = 23;

  // As on RecordHoldingRequest, from the row that last stated this, with
  // what a backfill added to it (contract v11).
  RawRecordRef raw_record = 24;

  repeated Provenance provenance = 25;

  repeated ReportedPending pending = 26;

  // Retired in the domain message, and never reused.
  reserved 3, 4, 5;
  reserved "quantity_scaled_1e8", "market_value_scaled_1e8", "currency";
}

// Where a change sits in its store's record (spec/plugins-hear-and-read, Q1
// as clarified 2026-10-01).
// A mirror of meridian.v1.JournalRef.
message JournalRef {
  // The partition the change was made in: the street store's one, or a
  // book partition.
  string partition = 1;

  // Its number there: the partition's next, taken in the change's own
  // transaction, so the numbers have no holes.
  uint64 sequence = 2;

  // The number of the previous change the same row made for the same
  // account, 0 for its first: what a plugin hearing only some accounts
  // checks for a gap in its own.
  uint64 previous_sequence = 3;
}

// A holding the deployment received but could not name.
// A mirror of meridian.v1.UnresolvedHolding.
message UnresolvedHolding {
  string holding_id = 1;

  string account_id = 2;

  repeated Identifier identifiers = 3;

  // Signed, as the row stated it: negative is a short row.
  Decimal quantity = 10;

  // Unset where the custodian reported no value.
  Money market_value = 11;

  string source = 7;

  string as_of_date = 8;

  // Whether an escalation has already been raised for these identifiers, so the
  // view can separate "nobody has looked at this" from "this is with the
  // administrator".
  bool escalated = 9;

  // The raw record the row was converted from (contract v11).
  RawRecordRef raw_record = 12;

  // Retired in the domain message, and never reused.
  reserved 4, 5, 6;
  reserved "quantity_scaled_1e8", "market_value_scaled_1e8", "currency";
}

// A statement is complete.
//
// The unresolved count is the number an operator actually watches; a statement
// that is complete and fully resolved is the only quiet outcome.
// A mirror of meridian.v1.StatementRecordedEvent.
message StatementRecordedEvent {
  string statement_id = 1;

  string source = 2;

  string as_of_date = 3;

  int32 rows_received = 4;

  int32 rows_resolved = 5;

  int32 rows_unresolved = 6;

  int64 recorded_at_ns = 7;

  // The account the statement is of: its external account's, or, from a
  // plugin before v7, its rows' (W2.2).
  string account_id = 8;

  // The statement's figures as recorded, one set per segment (W2.2).
  repeated StatementFigures figures = 9;

  // Deprecated from contract v11, as on the statement: for `provenance`.
  bool currency_assumed = 10;

  // The completion's number in the street's partition, chained per account
  // with the statements before it, and who caused it: the row whose landing
  // completed it (W2.5, W4.3).
  JournalRef journal = 11;

  ChangeCause cause = 12;

  // The account as the rail knows it, and the institution holding it, as
  // the statement named them: with the source and a segment, what a margin
  // agreement is keyed by and an opening balance names as its source. Empty
  // from a plugin before v7.
  string external_account_id = 13;

  string institution = 14;

  // As the statement reported it (contract v8).
  optional bool security_interest = 15;

  // As the statement carried them (contract v11): its raw record, and the
  // provenance of each value its plugin closed.
  RawRecordRef raw_record = 16;

  repeated Provenance provenance = 17;
}

// Who caused a change, as the store recorded it when it committed (Q3).
// A mirror of meridian.v1.ChangeCause.
message ChangeCause {
  // The instance that sent the command, as its sidecar stamped it.
  string instance_id = 1;

  // The person it was sent for (W4.9); empty when the plugin acted as itself.
  string acting_for_subject = 2;

  string correlation_id = 3;

  // The command's message_id.
  string causation_id = 4;

  int64 committed_at_ns = 5;
}

// One activity on an account, as the custodian states it: a purchase, a
// sale, a reinvested dividend, a dividend or interest, a fee or a tax, a
// split or another corporate action, a transfer, a contribution, a
// withdrawal or a journal (spec/the-custodians-activity-explains-a-break).
//
// Evidence, never a source: the street keeps it as reported and derives no
// position, lot or cash figure from it, and nothing here moves the book. It
// explains a break and proposes an adjustment for a person to confirm
// (W9.4, W9.7). Never netted or deduplicated against holdings: a sweep
// fund's purchases appear as the custodian lists them.
//
// The account it is on is named beside it, by the request that records it
// and the record the street keeps, so the account the sidecar stamped is the
// only one.
// A mirror of meridian.v1.CustodialActivity.
message CustodialActivity {
  // The custodian's own identifier for the activity: what lets the street
  // recognise one sent twice. A custodian restating an activity under a new
  // identifier is a new activity, reported, never merged.
  string external_activity_id = 1;

  // What happened, in the platform's own words, converted by the plugin
  // from the custodian's type.
  ActivityKind kind = 2;

  // The custodian's type as reported, set only when `kind` is not known
  // because the type did not convert. For a person to map; never read.
  AsReported kind_as_reported = 3;

  // The instrument it concerns, resolved at the edge as a holding's is
  // (W3.1): the deployment's record, or the currency's cash instrument.
  // Empty where the activity concerns none, or where the custodian's code
  // did not resolve, and then `instrument_as_reported` carries it.
  string instrument_id = 4;

  // The custodian's code for the instrument as reported, set only when it
  // did not resolve: a plan's own fund code no person has linked yet.
  AsReported instrument_as_reported = 5;

  // ISO 8601: when it was traded or took effect, and when it settles or
  // settled. The settlement date is empty where the custodian does not
  // state it.
  string trade_date = 6;

  string settlement_date = 7;

  // The units of the instrument it moved, signed by what it did to the
  // account: positive added units (a purchase, a reinvestment, the shares a
  // split added, a transfer in), negative removed them (a sale, a fee taken
  // in units, a transfer out). Unset where it moved none, a cash dividend's
  // say, which is not zero.
  optional Decimal units = 8;

  // The price per unit, as stated. Unset where the custodian states none;
  // never worked out from the amount and the units.
  optional Money price = 9;

  // The amount of cash it moved, in its currency, signed by what it did to
  // the account's cash: positive in (a sale, a dividend, a contribution),
  // negative out (a purchase, a fee, a withdrawal). Unset where it moved
  // none, a split's say, which is not zero.
  optional Money amount = 10;

  // The custodian's own description, as reported. Diagnostic and for a
  // person; nothing branches on it.
  string description = 11;

  // The raw record it was converted from, in the plugin's own storage
  // (decisions/028), and the provenance of each value the plugin closed
  // rather than read: an instrument linked once by a named person, a
  // settlement date derived by a named rule.
  RawRecordRef raw_record = 12;

  repeated Provenance provenance = 13;
}

// What an activity was (contract v14): a closed list, the platform's own
// words, never a custodian's.
// A mirror of meridian.v1.ActivityKind.
enum ActivityKind {
  // Not known: the custodian's type converts to none of these, and travels
  // beside it as reported.
  ACTIVITY_KIND_UNSPECIFIED = 0;
  // Units bought.
  ACTIVITY_KIND_PURCHASE = 1;
  // Units sold.
  ACTIVITY_KIND_SALE = 2;
  // Income the custodian reinvested in units, as a money market fund's
  // monthly dividend is.
  ACTIVITY_KIND_REINVESTMENT = 3;
  // A dividend paid in cash.
  ACTIVITY_KIND_DIVIDEND = 4;
  // Interest paid in cash.
  ACTIVITY_KIND_INTEREST = 5;
  // A fee, in cash or in units.
  ACTIVITY_KIND_FEE = 6;
  // A tax withheld or paid.
  ACTIVITY_KIND_TAX = 7;
  // A split, the units it added or removed.
  ACTIVITY_KIND_SPLIT = 8;
  // Another corporate action, as the custodian states it.
  ACTIVITY_KIND_CORPORATE_ACTION = 9;
  // Units or cash moved in from another account.
  ACTIVITY_KIND_TRANSFER_IN = 10;
  // Units or cash moved out to another account.
  ACTIVITY_KIND_TRANSFER_OUT = 11;
  // Cash paid into the account.
  ACTIVITY_KIND_CONTRIBUTION = 12;
  // Cash taken out of the account.
  ACTIVITY_KIND_WITHDRAWAL = 13;
  // A movement between the account's own positions or sub-accounts, as the
  // custodian journals it.
  ACTIVITY_KIND_JOURNAL = 14;
}

// An activity was recorded (W2.12): the whole record, so a reconciliation
// waiting on a cause re-runs its candidates without a second read. Also each
// item of a read (W2.11), as it was announced.
// A mirror of meridian.v1.ActivityRecordedEvent.
message ActivityRecordedEvent {
  string activity_id = 1;

  // The account it is on, and as the rail knows it.
  string account_id = 2;

  string external_account_id = 3;

  string source = 4;

  CustodialActivity activity = 5;

  int64 recorded_at_ns = 6;

  // The record's number in the street's partition, chained per account with
  // the activities before it, and who caused it (W2.12, W4.3).
  JournalRef journal = 7;

  ChangeCause cause = 8;
}

// One re-resolution as the street keeps it, beside the activity it names
// (W2.16): its own record, chained per account with the re-resolutions
// before it and apart from the activities, so activity-recorded keeps what
// it said at v14.
// A mirror of meridian.v1.ActivityReResolution.
message ActivityReResolution {
  // The activity it sits beside, and the account it is recorded against.
  string activity_id = 1;

  string account_id = 7;

  // The instrument the activity now resolves to, empty where unresolved
  // again, and how.
  string instrument_id = 2;

  Provenance provenance = 3;

  // When what resolves it was made, as the plugin sent it; when the street
  // recorded it, never back-dated.
  int64 resolved_at_ns = 4;

  int64 recorded_at_ns = 5;

  // Its own number in the street's partition, chained per account with the
  // re-resolutions before it.
  JournalRef journal = 6;
}

// A sync status was recorded (W2.13): the street heard a custody plugin's
// sync status (W2.1) and kept it, so operations tells a connection that needs
// a person to sign in again apart from data that is merely old. The whole
// record; also each item of a read (W2.14), as it was announced.
// A mirror of meridian.v1.SyncStatusRecordedEvent.
message SyncStatusRecordedEvent {
  // As the custody plugin published it, its account as the sidecar stamped
  // it: empty when the external account is not linked, and then delivered to
  // no plugin.
  SyncStatusEvent status = 1;

  int64 recorded_at_ns = 2;

  // The record's number in the street's partition, chained per account with
  // the sync statuses before it, and who caused it (W2.13, W4.3).
  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// How fresh a connected account's data is, as reported by the rail.
//
// And why, when it is not current. Published so an operator can tell stale
// data from absent data, which look identical on a holdings screen and mean
// completely different things. And "unhealthy" alone cannot say whose fix it
// is: a connection that needs a person to sign in again, one somebody
// disabled, and one that is a day late by design look the same as a flag and
// ask for three different things.
// A mirror of meridian.v1.SyncStatusEvent.
message SyncStatusEvent {
  string source = 1;

  // The account the external account is linked to (W6.4), set by the sidecar.
  // Empty when it is not linked.
  string account_id = 2;

  // When the rail last successfully synced this account from the institution.
  // Not when the data is as of: a venue a day late by design syncs today what
  // was true yesterday, which the two fields below say.
  int64 last_synced_at_ns = 3;

  // Whether the rail currently considers the connection healthy. A false here
  // with a recent last_synced_at_ns means the data is good but the connection
  // has since broken. `state` says why.
  bool connection_healthy = 4;

  // Rail-supplied text, for whatever `state` does not say. Diagnostic only;
  // nothing branches on it.
  string status_detail = 5;

  int64 observed_at_ns = 6;

  // The account as the rail knows it, which the sidecar translates.
  string external_account_id = 7;

  // Whether the data is current, and if not, why: which is also whose fix it
  // is and what the dashboard tells a deployment admin to do.
  SyncState state = 8;

  // When the holdings the rail serves are as of, and when the history
  // (transactions) is. Separately, because venues keep them apart and a
  // connection can have one current and the other not: SnapTrade reports
  // holdings to the minute and transactions by the day. Zero where the rail
  // does not say.
  int64 holdings_as_of_ns = 9;

  int64 history_as_of_ns = 10;

  // The first date the source can read the account's activity from, ISO
  // 8601 (contract v14, W2.10): how far back a backfill reaches, beside how
  // fresh the history is. Empty where the source does not say.
  string history_from = 11;
}

// The kind of claim holding an instrument gives. A closed list, ruled by the
// product owner (sdk-contract/asset-class-is-an-enum, 2026-09-28 and
// 2026-09-30); a class joins it by a ruling, never because a feed sent one.
// Spelled in text as the value's name without its prefix, lower case:
// `equity`, `debt`, `fund`, `derivative`, `crypto_asset`, `event_contract`,
// `cash`.
//
// What kind of instrument within a class is its instrument type
// (InstrumentType, contract v11), which grows one type at a time as a
// workflow needs it.
// A mirror of meridian.v1.AssetClass.
enum AssetClass {
  // No class. Held only by a stub minted from a deployment's miss (W3.4),
  // which may not know one; activating an instrument requires a class (W1.8).
  ASSET_CLASS_UNSPECIFIED = 0;
  // A share of ownership.
  ASSET_CLASS_EQUITY = 1;
  // Somebody owes the holder.
  ASSET_CLASS_DEBT = 2;
  // A share of a pool: ETFs and mutual funds among them.
  ASSET_CLASS_FUND = 3;
  // A contract whose value comes from something else: options and futures
  // among them.
  ASSET_CLASS_DERIVATIVE = 4;
  ASSET_CLASS_CRYPTO_ASSET = 5;
  // Pays on whether an event happens.
  ASSET_CLASS_EVENT_CONTRACT = 6;
  // A holding of a currency's cash instrument (spec/the-account-side-fits-every-venue).
  ASSET_CLASS_CASH = 7;
}

// What kind of instrument within its asset class (contract v11; the product
// owner, 2026-10-02: "Yes to put instrument type into v11 scope"). In the
// contract's own words, ISO 10962 (CFI) a reference and not the vocabulary;
// a type joins when a workflow needs it, each with its dictionary entry, and
// each is under one asset class. Spelled in text as the value's name without
// its prefix, lower case: `money_market_fund`.
// A mirror of meridian.v1.InstrumentType.
enum InstrumentType {
  // No type stated: the asset class says all the record says.
  INSTRUMENT_TYPE_UNSPECIFIED = 0;
  // Under fund: a fund that invests in short-term debt under SEC rule 2a-7
  // and aims to keep its value, with the attributes of MoneyMarketFund.
  // Held as a fund, never as cash, even where a custodian sweeps cash into it.
  INSTRUMENT_TYPE_MONEY_MARKET_FUND = 1;
  // Under event_contract (contract v19): a contract paying a fixed amount if
  // an event happens and nothing if it does not, with the attributes of
  // BinaryEventContract. A venue's YES and NO tokens are two instruments,
  // each one.
  INSTRUMENT_TYPE_BINARY_EVENT_CONTRACT = 2;
}

// Why a resolution did not produce exactly one instrument; on a conflict
// (contract v19), whether a resolve met it.
// A mirror of meridian.v1.MissReason.
enum MissReason {
  MISS_REASON_UNSPECIFIED = 0;
  // No instrument matched.
  MISS_REASON_NOT_FOUND = 1;
  // More than one matched. Reported as a miss rather than resolved by picking,
  // because picking would be wrong about half the time and would be silent.
  MISS_REASON_AMBIGUOUS = 2;
}

// The canonical instrument record.
//
// Three time axes, and conflating any two of them produces a resolution bug
// that only appears when an identifier is reused:
//
//   reference time  the as-of a resolution is FOR. A query parameter, never a
//                   field here.
//   effective time  valid_from_ns -- when this mapping became true in the world.
//   record time     record_time_ns -- when the authority knew it.
//
// Identifiers get reused: a ticker freed by a delisting is later reassigned to
// a different instrument. A consumer resolving a historical date must key on
// effective time, not on when it happened to learn the mapping.
// A mirror of meridian.v1.InstrumentRecord.
message InstrumentRecord {
  // The record's key for life. On the platform's master, "INS-...", minted
  // by it (W1). In a deployment, the deployment's own (decisions/030): "LCL-"
  // for a record its instrument store minted (W3.7), which says who minted it
  // and nothing about whether it is resolved; or the "INS-" ID of a record
  // applied from the platform before contract v10, which it keeps. A global
  // ID the platform answers later joins `identifiers` (scheme
  // `open_meridian`), never replacing this. Never reused (decisions/034): a
  // retired, decommissioned or replaced record keeps its ID, and no other
  // record is ever given it, so a position or an order storing it names one
  // instrument for as long as it survives.
  string instrument_id = 1;

  // The full identifier set. An amend replaces this authoritatively.
  repeated Identifier identifiers = 2;

  AssetClass asset_class = 11;

  // ISO 4217.
  string currency = 4;

  // ISO 10383 market identifier code. Empty where there is no listing venue.
  // Deprecated from contract v18 for `listing_venue_id`, the venue master's
  // ID, of which the MIC is one identifier; read until the platform's and
  // the deployments' records carry venue IDs.
  string exchange_mic = 5;

  string description = 6;

  InstrumentLifecycleState lifecycle_state = 7;

  // Monotonic, assigned by the store, starting at 1. An apply carrying a
  // version at or below the one held is a no-op, which is what makes replica
  // application idempotent and overlapping pulls harmless.
  int64 version = 8;

  // Effective time. When this version's mapping became true.
  int64 valid_from_ns = 9;

  // Record time. Stamped by the store, never accepted from a caller: knowledge
  // cannot be back-dated.
  int64 record_time_ns = 10;

  // In a deployment (contract v10): where each value in force came from --
  // the asset class, the currency, the description and each identifier --
  // with the person who set or accepted it, or the plugin that reported it
  // (W3, requirement 1). Empty on the platform's master, whose changelog
  // says it (W1.7).
  repeated InstrumentValueSource sources = 12;

  // In a deployment (contract v10): values offered by a plugin's source
  // (W3.1) or the platform (W3.3), in force only when a person accepts one
  // (W3.10). A later offer never overwrites a value in force.
  repeated OfferedValue offers = 13;

  // Its type within its asset class (contract v11), in force once a person
  // set or accepted it, as the asset class is. Unspecified where none is.
  InstrumentType instrument_type = 14;

  // A money market fund's attributes (contract v11); set only on a record
  // whose type is money market fund.
  MoneyMarketFund money_market_fund = 15;

  // The venue it is listed on, the venue master's ID (contract v18): a
  // segment's venue where the listing is on one. Empty where it is listed
  // on no venue, or its venue is not yet known.
  string listing_venue_id = 16;

  // A binary event contract's attributes (contract v19); set only on a
  // record whose type is binary event contract.
  BinaryEventContract binary_event_contract = 17;

  // Contract v24 (W3.7; decisions/037, point 2 as amended 2026-10-14; the
  // one-ID model): the deployment's own local record -- the platform
  // unreachable, the request waiting for its staff, or, at the current
  // stage, no open identifier to ask by. It names its template, may be
  // incomplete, is a local line in the book, never priced, and an order on
  // it the escape hatch (W9.1, W11). False on a record named by the
  // platform's INS- ID, or keyed before v10.
  bool provisional = 18;

  // Contract v24 (W3.7, W3.24): the platform's template the record is held
  // to, a class's base template where its type has none; empty on a record
  // kept before v24 and not yet migrated, and on one whose source stated no
  // class ("class needed").
  string template_id = 19;

  // A published version, immutable; empty where template_id is.
  string template_version = 20;

  // Contract v24 (W3.7): each required field of its template the record
  // does not hold, by its path in the template (TemplateField.path); empty
  // on a complete record and on every INS- record the platform minted.
  // Never a gate on asking the platform.
  repeated string missing_fields = 21;

  // Retired in the domain message, and never reused.
  reserved 3;
}

// Lifecycle. The transition verbs are the commands; nothing sets this directly.
// A mirror of meridian.v1.InstrumentLifecycleState.
enum InstrumentLifecycleState {
  INSTRUMENT_LIFECYCLE_STATE_UNSPECIFIED = 0;
  // Identity exists, attributes may be incomplete. A holding can reference it,
  // which is the point: a position may arrive before anyone has decided what
  // the instrument is.
  INSTRUMENT_LIFECYCLE_STATE_DEFINE = 1;
  // Fully defined.
  INSTRUMENT_LIFECYCLE_STATE_ACTIVE = 2;
  // Retired. Existing holdings stay resolvable, because history does not stop
  // being true when an instrument stops trading.
  INSTRUMENT_LIFECYCLE_STATE_DECOMMISSIONED = 3;
}

// Where a value in force on a deployment's record came from (W3,
// requirements 1 and 3).
// A mirror of meridian.v1.InstrumentValueSource.
message InstrumentValueSource {
  InstrumentField field = 1;

  // For INSTRUMENT_FIELD_IDENTIFIER: which identifier.
  Identifier identifier = 2;

  // In words, as the value was set with.
  string source = 3;

  // The person who set or accepted it: the deployment-local subject core
  // stamped from the command's envelope (W4.9), never typed. Empty for an
  // identifier a plugin reported, the platform's global ID, and a value
  // applied from the platform before contract v10.
  string person = 4;

  // The plugin instance whose resolve joined the identifier (W3.1). Empty
  // otherwise.
  string instance_id = 5;

  // When the store recorded it.
  int64 recorded_at_ns = 6;

  // Why a value held was changed, where given.
  string note = 7;

  // The delegation the person acted through, when they set or accepted the
  // value through a client -- an agent on the deployment's MCP surface --
  // rather than at the dashboard in a browser (W3.10, W6.20, contract v12):
  // stamped from the command's envelope (W4.9), never typed. Empty beside a
  // person at the dashboard, and wherever person is.
  string acting_through_delegation = 8;

  // The client's registered name, beside acting_through_delegation, as the
  // envelope carried it; empty whenever it is.
  string client_name = 9;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 10;
}

// Which value of a deployment's instrument record (W3, contract v10).
// A mirror of meridian.v1.InstrumentField.
enum InstrumentField {
  INSTRUMENT_FIELD_UNSPECIFIED = 0;
  INSTRUMENT_FIELD_ASSET_CLASS = 1;
  INSTRUMENT_FIELD_CURRENCY = 2;
  INSTRUMENT_FIELD_DESCRIPTION = 3;
  // One of its identifiers, named beside the field.
  INSTRUMENT_FIELD_IDENTIFIER = 4;
  // Contract v11.
  INSTRUMENT_FIELD_INSTRUMENT_TYPE = 5;
  INSTRUMENT_FIELD_MONEY_MARKET_FUND = 6;
  // Contract v19.
  INSTRUMENT_FIELD_BINARY_EVENT_CONTRACT = 7;
}

// A value offered for a deployment's record (W3.1, W3.3), shown beside its
// field and in force only when a person accepts it (W3.10).
// A mirror of meridian.v1.OfferedValue.
message OfferedValue {
  InstrumentValue value = 1;

  // The plugin instance whose source stated it. Empty for the platform's
  // answer and for an offer the store derives itself (ISO 4217 for an
  // `iso4217` identifier).
  string instance_id = 2;

  int64 offered_at_ns = 3;
}

// One value for a deployment's record, set or offered, with where it came
// from (W3.10, W3.1, W3.3).
// A mirror of meridian.v1.InstrumentValue.
message InstrumentValue {
  oneof value {
    // One of the closed list; never unspecified.
    AssetClass asset_class = 1;
    // An ISO 4217 code, three capital letters; never a pseudo-currency such
    // as BASE.
    string currency = 2;
    string description = 3;
    Identifier identifier = 4;
    // Contract v11: one under the record's asset class; never unspecified.
    InstrumentType instrument_type = 6;
    // Contract v11: on a money market fund only, each attribute stated.
    MoneyMarketFund money_market_fund = 7;
    // Contract v19: on a binary event contract only, its payout stated.
    BinaryEventContract binary_event_contract = 8;
  }

  // Where the value came from, in words: a statement, a prospectus, "ISO
  // 4217", "the platform, record INS-... version 3". Required on a value a
  // person sets.
  string source = 5;
}

// A money market fund's attributes, from SEC rule 2a-7 as amended in 2023
// (the product owner, 2026-10-02, the custody audit's Q4). Its observations
// -- its NAV on a day, its seven-day yield, its liquid assets, a fee imposed
// -- are the lake's, not the record's.
// A mirror of meridian.v1.MoneyMarketFund.
message MoneyMarketFund {
  MoneyMarketFundCategory category = 1;

  MoneyMarketFundInvestors investors = 2;

  MoneyMarketFundNav nav = 3;

  LiquidityFeeRegime liquidity_fee = 4;
}

// What a money market fund invests in.
// A mirror of meridian.v1.MoneyMarketFundCategory.
enum MoneyMarketFundCategory {
  MONEY_MARKET_FUND_CATEGORY_UNSPECIFIED = 0;
  // Cash, government securities and repurchase agreements backed by them.
  MONEY_MARKET_FUND_CATEGORY_GOVERNMENT = 1;
  // Also corporate short-term debt.
  MONEY_MARKET_FUND_CATEGORY_PRIME = 2;
  // Short-term municipal debt.
  MONEY_MARKET_FUND_CATEGORY_TAX_EXEMPT = 3;
}

// Whom a money market fund is offered to.
// A mirror of meridian.v1.MoneyMarketFundInvestors.
enum MoneyMarketFundInvestors {
  MONEY_MARKET_FUND_INVESTORS_UNSPECIFIED = 0;
  // Natural persons only.
  MONEY_MARKET_FUND_INVESTORS_RETAIL = 1;
  MONEY_MARKET_FUND_INVESTORS_INSTITUTIONAL = 2;
}

// How a money market fund prices its shares.
// A mirror of meridian.v1.MoneyMarketFundNav.
enum MoneyMarketFundNav {
  MONEY_MARKET_FUND_NAV_UNSPECIFIED = 0;
  // A stable share price of 1.00: the book takes its position as one lot at
  // stable value (W9.1).
  MONEY_MARKET_FUND_NAV_STABLE = 1;
  // A share price that floats with its holdings: lots like any fund.
  MONEY_MARKET_FUND_NAV_FLOATING = 2;
}

// When a money market fund charges a fee on redemptions.
// A mirror of meridian.v1.LiquidityFeeRegime.
enum LiquidityFeeRegime {
  LIQUIDITY_FEE_REGIME_UNSPECIFIED = 0;
  // Charged when daily net redemptions pass 5% of net assets: an
  // institutional prime or tax-exempt fund.
  LIQUIDITY_FEE_REGIME_MANDATORY = 1;
  // At the board's discretion, where in the fund's interest.
  LIQUIDITY_FEE_REGIME_DISCRETIONARY = 2;
  // No liquidity fee: a government fund that has not chosen one, which
  // neither of the others describes (contract v12).
  LIQUIDITY_FEE_REGIME_NONE = 3;
}

// A binary event contract's attributes (contract v19; plans/the-lake-prices-
// the-book, Q38): what it pays and when trading in it closes. Which outcome
// it pays on stays in its description, the venue's words, until the outcome
// is an observation (vL1c); the outcome and its settlement are not the
// record's.
// A mirror of meridian.v1.BinaryEventContract.
message BinaryEventContract {
  // What one contract pays if the event happens, naming its cash instrument:
  // 1 USD at Kalshi, 1 in the venue's USDC instrument at Polymarket. A
  // contract's price divided by this is its implied probability, a reader's
  // computation, never stored.
  Money payout = 1;

  // When trading in it closes, as the venue states it; 0 when it states none.
  int64 closes_at_ns = 2;
}

// The only thing holdings are recorded against. A plugin creates one only by
// linking an external account to a new one, acting for a deployment admin in
// a session opened by Manage (W6.4).
// A mirror of meridian.v1.AccountRecord.
message AccountRecord {
  string account_id = 1;

  string name = 2;

  AccountState state = 3;

  int64 created_at_ns = 4;

  // Free text, optional, and searchable as the name is (W6.3). Where the
  // account is held, e.g. "Fidelity". At most 200 characters.
  string custodian = 5;

  // What the account is, e.g. "Roth IRA". At most 200 characters.
  string account_type = 6;

  // One ownership or grouping label, e.g. "Fund I". At most 200 characters.
  string owner = 7;

  // Anything else worth knowing about it. At most 2,000 characters.
  string note = 8;
}

// A mirror of meridian.v1.AccountState.
enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  ACCOUNT_STATE_OPEN = 1;
  // Closed, not deleted: an account is the subject of records that outlive it.
  ACCOUNT_STATE_CLOSED = 2;
}

// A mirror of meridian.v1.OpeningSource.
message OpeningSource {
  OpeningSourceKind kind = 1;

  // The custodian or system as it is known in the deployment (the external
  // account's institution, the prior system's name).
  string name = 2;

  // ISO 8601: the date the source's figures are as of.
  string as_of_date = 3;

  PositionBasis basis = 4;

  // The street records it was composed from, by value (decisions/012).
  repeated StreetRecordRef street_records = 5;
}

// A mirror of meridian.v1.OpeningSourceKind.
enum OpeningSourceKind {
  OPENING_SOURCE_KIND_UNSPECIFIED = 0;
  OPENING_SOURCE_KIND_CUSTODIAN = 1;
  OPENING_SOURCE_KIND_PRIOR_SYSTEM = 2;
}

// A mirror of meridian.v1.PositionBasis.
enum PositionBasis {
  POSITION_BASIS_UNSPECIFIED = 0;
  POSITION_BASIS_TRADE_DATE = 1;
  POSITION_BASIS_SETTLE_DATE = 2;
}

// A street record named by value: never a key the book follows.
// A mirror of meridian.v1.StreetRecordRef.
message StreetRecordRef {
  string statement_id = 1;

  // The custodial position's change, where one was compared or used.
  JournalRef change = 2;

  // ISO 8601: the custodian's as-of date.
  string as_of_date = 3;
}

// A mirror of meridian.v1.OpeningPosition.
message OpeningPosition {
  string instrument_id = 1;

  HoldingSide side = 2;

  Decimal trade_date_quantity = 3;

  // Required (v9): where the source states none, a person supplies it.
  // Unset, the opening balance is refused (REFUSAL_REASON_INCOMPLETE).
  optional Decimal settled_quantity = 4;

  // Each with its value date; with the settled quantity they account for
  // the whole trade-date quantity, or the balance is refused.
  repeated PendingSettlement pending = 5;

  // As reported and completed by a person, each with its quantity, cost and
  // acquisition date; required but on cash, which sends none (v9).
  repeated OpeningLot lots = 6;
}

// A mirror of meridian.v1.PendingSettlement.
message PendingSettlement {
  // ISO 8601. Required at an opening balance (v9); empty on a position only
  // for "date not stated", from a v8 opening balance or an adjustment the
  // street gave no date for.
  string value_date = 1;

  Decimal quantity = 2;

  PendingState state = 3;
}

// A mirror of meridian.v1.PendingState.
message PendingState {
  bool failing = 1;

  // As reported.
  string fail_reason = 2;

  // ISO 8601; the date it is now expected; the bucket keeps its intended
  // date ("Three more considerations", 2).
  string expected_date = 3;
}

// A mirror of meridian.v1.OpeningLot.
message OpeningLot {
  Decimal quantity = 1;

  LotTerms terms = 2;
}

// A mirror of meridian.v1.LotTerms.
message LotTerms {
  // Each unset where not known; never derived one from the other. A lot the
  // book opens carries its cost and acquisition date (v9): an opening
  // balance or an adjustment without either is refused
  // (REFUSAL_REASON_INCOMPLETE); a lot a v8 book opened may lack them.
  optional Money unit_cost = 1;

  optional Money cost = 2;

  string acquired_date = 3;

  // Apart from acquisition, for wash-sale tacking; empty is the acquired
  // date.
  string holding_period_start = 4;

  string settlement_date = 5;

  LotSource source = 6;
}

// A mirror of meridian.v1.LotSource.
enum LotSource {
  LOT_SOURCE_UNSPECIFIED = 0;
  // As the opening balance's source reported it (Q2).
  LOT_SOURCE_OPENING_BALANCE = 1;
  // Opened by an adjustment resolving a break (Q28). Step 5 adds the
  // book's own trade, slice D a transfer in.
  LOT_SOURCE_ADJUSTMENT = 2;
  // A lot a reported fill opens (W11.13; contract v22).
  LOT_SOURCE_EXECUTION = 3;
}

// What a journal entry records beside its JournalRef and ChangeCause.
// A mirror of meridian.v1.EntryMeta.
message EntryMeta {
  // Minted by the book.
  string entry_id = 1;

  // An open list a reader takes as data (Q19): in v8 opening-balance,
  // placeholder-moved (instrument-merged from v10), figures-recorded, break-recorded, break-handled,
  // break-resolved, break-closed, adjustment, reversal, attribute-set; from
  // v22 order-proposed, order-recorded, order-released, execution-recorded
  // among the order path's (W11.13).
  string kind = 2;

  Actor actor = 3;

  // The time on the message that caused it, and when the book received it;
  // when it committed is the cause's committed_at_ns.
  int64 event_time_ns = 4;

  int64 received_at_ns = 5;

  // ISO 8601: the business date it stands for.
  string effective_date = 6;

  // The control partition's sequence in force (decisions/024's note).
  uint64 control_sequence = 7;

  // Each instrument it names, with the reference record's version in force
  // when it was recorded; none where the store has no version (Q31).
  repeated ReferenceVersion reference_versions = 8;

  // Required on a justified act: an opening balance, an adjustment, a
  // reversal, a resolution, handling, an attribute.
  string reason = 9;

  // The breaks it records, handles, resolves or closes.
  repeated string break_ids = 10;

  // The key the plugin sent the command with, where it sent one (Q12 of the
  // sample operations plugin, ruled 2026-10-01).
  string idempotency_key = 11;
}

// Who made a change (step 5's requirement 28, landed with v8). Set by the
// book from the envelope the sidecar stamped (W4.9), never by a plugin.
// A mirror of meridian.v1.Actor.
message Actor {
  oneof kind {
    // A person the sidecar vouched for, by the deployment-local subject
    // W6.1 records.
    PersonActor person = 1;
    // A finding reported with no user: the plugin instance that sent it;
    // the book's own act (a merged record followed) leaves it empty.
    SystemActor system = 2;
    // A service account a plugin's autonomous work acted as, whose call the
    // dashboard admitted (W4.15, W9.8; contract v21), from the envelope the
    // sidecar stamped. Never a person, nor the plugin's own finding.
    ServiceAccountActor service_account = 3;
    // The venue, through the connectivity plugin reporting what it did
    // (W11.2, W11.9 to W11.12; step 5's Q24; contract v22): a fact, never a
    // person's act, and never refused for the state it arrives in.
    VenueActor venue = 4;
  }
}

// A mirror of meridian.v1.PersonActor.
message PersonActor {
  string subject = 1;

  // The delegation the person acted through, and the client's registered
  // name, as the sidecar stamped them beside the person (W4.9, decisions/029;
  // contract v10). Empty for a person at the dashboard in a browser, and on
  // every act recorded before v10. The person stays the actor.
  string delegation_id = 2;

  string client_name = 3;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 4;
}

// A mirror of meridian.v1.SystemActor.
message SystemActor {
  string instance_id = 1;
}

// A service account that answered for an act (W9.8, contract v21).
// A mirror of meridian.v1.ServiceAccountActor.
message ServiceAccountActor {
  // Its `SA-` subject, as the sidecar stamped it (W4.9).
  string subject = 1;

  // The deployment-local subject of the person answerable for it when it
  // acted, as the sidecar stamped it; a later change of owner leaves it as
  // it was.
  string owner_subject = 2;

  // The algorithm the service account's call named, one of the
  // identifiers the plugin's version declares (PluginDeclaration.algorithms;
  // W4.9, W4.15; v21's Q16, the order-path plan's refresh, Q24; contract
  // v22): copied by the book from the envelope (MessageMeta.algorithm_id),
  // where the sidecar stamped it from the claims after checking it. Stable
  // across versions, so `reporting` reads it for the decision-maker and
  // executor a regime asks for. Empty where the call named none, and before
  // v22.
  string algorithm_id = 3;
}

// The venue an act is a fact of (W11, contract v22).
// A mirror of meridian.v1.VenueActor.
message VenueActor {
  // The connectivity plugin instance that reported it, as its sidecar
  // stamped it.
  string instance_id = 1;

  // The venue, the venue master's ID, where the plugin names it; empty
  // where it does not.
  string venue_id = 2;
}

// A mirror of meridian.v1.ReferenceVersion.
message ReferenceVersion {
  string instrument_id = 1;

  // The InstrumentRecord's version (W3.6).
  int64 version = 2;
}

// A mirror of meridian.v1.BookPosition.
message BookPosition {
  string account_id = 1;

  string instrument_id = 2;

  HoldingSide side = 3;

  // Settled plus pending, by construction; plus not stated where a v8
  // opening balance opened that bucket.
  Decimal trade_date_quantity = 4;

  // Unset only while some of the quantity is in the not-stated bucket a v8
  // opening balance opened: unknown, never zero.
  optional Decimal settled_quantity = 5;

  // Zero on every position v9 records.
  Decimal not_stated_quantity = 6;

  repeated PendingSettlement pending = 7;

  // Open lots; their open quantities sum to trade_date_quantity, cash
  // excepted.
  repeated Lot lots = 8;

  // The opening balance's sources, with their as-of and basis.
  repeated OpeningSource opened_from = 9;

  // The business date of its last change.
  string effective_date = 10;

  JournalRef last_change = 11;

  // A tombstone, after a merged record's move (W9.9): returned only to a
  // read since a watermark, and delivered once.
  bool removed = 12;

  // What of it cannot move, as the operations plugin last recorded it from
  // a statement (W9.15): an attribute, never a movement.
  repeated Encumbrance encumbrances = 14;

  // Derived, never reported: the quantity on free_basis less its
  // encumbrances. Unset while that quantity is unknown (some not stated).
  optional Decimal free_quantity = 15;

  FreeBasis free_basis = 16;

  // The sleeve within the account (W9's invariants; the order-path plan's
  // refresh, Q33; contract v22): a position is keyed by account,
  // instrument, side and sleeve. Empty for the account's unsleeved part, as
  // every position before v22 is.
  string sleeve = 17;

  // Retired in the domain message, and never reused.
  reserved 13;
  reserved "placeholder";
}

// A mirror of meridian.v1.Lot.
message Lot {
  // Minted by the book.
  string lot_id = 1;

  Decimal open_quantity = 2;

  Decimal original_quantity = 3;

  // As opened, with each basis adjustment applied.
  LotTerms terms = 4;

  JournalRef opened_by = 5;

  repeated JournalRef relieved_by = 6;

  repeated JournalRef adjusted_by = 7;

  // Its position's sleeve (contract v22); empty for the unsleeved part.
  string sleeve = 8;
}

// One encumbrance of a position, as the book holds it.
// A mirror of meridian.v1.Encumbrance.
message Encumbrance {
  // PLEDGED to OTHER only; the street's PENDING, REHYPOTHECATED and
  // BORROWED are refused.
  EncumbranceKind kind = 1;

  // Signed as the position's quantity.
  Decimal quantity = 2;

  string pledgee = 3;

  string held_at = 4;

  // Unset where the source names none.
  MarginAgreementRef agreement = 5;

  // The source's code, verbatim; required for OTHER.
  string source_code = 6;

  string detail = 7;

  // The statement it was recorded from.
  StreetRecordRef source = 8;

  // Set by the book: the business date it was first recorded under its
  // kind, pledgee, location and agreement, and the change that last set it.
  string since_date = 9;

  JournalRef set_by = 10;
}

// A mirror of meridian.v1.MarginAgreementRef.
message MarginAgreementRef {
  oneof agreement {
    // Step 4: the statement's external account and segment (Q12). An
    // agreement the book records under a template arrives as another arm.
    StatementSegmentRef statement_segment = 1;
  }
}

// A mirror of meridian.v1.StatementSegmentRef.
message StatementSegmentRef {
  string external_account_id = 1;

  // As the venue names it; empty for the account as a whole.
  string segment = 2;

  // As reported: the external account's institution.
  string counterparty = 3;
}

// The basis a position's free quantity is computed on.
// A mirror of meridian.v1.FreeBasis.
enum FreeBasis {
  FREE_BASIS_UNSPECIFIED = 0;
  // Settled: a pledged or lent security that has not settled cannot be
  // delivered either (the product owner, 2026-10-01, Q2). The book's
  // default, and in v8 its only basis.
  FREE_BASIS_SETTLED = 1;
  FREE_BASIS_TRADE_DATE = 2;
}

// A mirror of meridian.v1.Break.
message Break {
  string break_id = 1;

  string account_id = 2;

  oneof subject {
    PositionKey position = 3;
    FigureKey figure = 4;
  }

  BreakCategory category = 5;

  repeated BreakDifference differences = 6;

  Watermark book_watermark = 7;

  StreetRecordRef street = 8;

  // ISO 8601 business dates; age is derived from them, never stored.
  string first_seen_date = 9;

  string last_seen_date = 10;

  BreakState state = 11;

  repeated BreakCause candidate_causes = 12;

  BreakCause confirmed_cause = 13;

  BreakHandling handling = 14;

  BreakResolution resolution = 15;

  Actor recorded_by = 16;

  JournalRef last_change = 17;
}

// A mirror of meridian.v1.PositionKey.
message PositionKey {
  string instrument_id = 1;

  HoldingSide side = 2;
}

// A mirror of meridian.v1.FigureKey.
message FigureKey {
  MarginAgreementRef agreement = 1;

  // The figure, by its field's name in the data dictionary.
  string figure = 2;

  // For a collateral balance: its instrument.
  string instrument_id = 3;
}

// A mirror of meridian.v1.BreakCategory.
enum BreakCategory {
  BREAK_CATEGORY_UNSPECIFIED = 0;
  BREAK_CATEGORY_TRADE_DATE_QUANTITY = 1;
  BREAK_CATEGORY_SETTLED_QUANTITY = 2;
  BREAK_CATEGORY_COST_OR_LOTS = 3;
  BREAK_CATEGORY_SETTLED_AGAINST_PENDING = 4;
  BREAK_CATEGORY_BOOK_ONLY = 5;
  BREAK_CATEGORY_STREET_ONLY = 6;
  // A figure the book holds a value of its own for, such as the street's
  // available and not available against the book's position, or an
  // encumbrance against the book's of that kind, location and pledgee.
  BREAK_CATEGORY_FIGURE = 7;
  // Contract v24 (W9.3; the one-ID model, ruled 2026-10-14): a statement row
  // the street kept unresolved because its source is thinner than an
  // instrument record's minimum (W3.7). No instrument and no position: the
  // break names the street record by value. ISO 15022/20022's DSEC.
  BREAK_CATEGORY_UNRECOGNIZED_SECURITY = 8;
}

// A mirror of meridian.v1.BreakDifference.
message BreakDifference {
  // The field, by its name in the data dictionary ("settled_quantity",
  // "lots[2].terms.cost").
  string field = 1;

  BreakValue book = 2;

  BreakValue street = 3;
}

// One side of a difference; unset: absent on that side.
// A mirror of meridian.v1.BreakValue.
message BreakValue {
  oneof value {
    Decimal quantity = 1;
    Money amount = 2;
    string text = 3;
  }
}

// A mirror of meridian.v1.BreakState.
enum BreakState {
  BREAK_STATE_UNSPECIFIED = 0;
  BREAK_STATE_OPEN = 1;
  BREAK_STATE_RESOLVED = 2;
  BREAK_STATE_CLOSED = 3;
}

// The item found to cause a break, linked by value (Q23's target).
// A mirror of meridian.v1.BreakCause.
message BreakCause {
  BreakCauseCategory category = 1;

  oneof item {
    StreetRecordRef street_record = 2;
    JournalRef book_entry = 3;
    PendingSettlementRef pending_settlement = 4;
    // A corporate action's reference, as reported.
    string event_reference = 5;
    bool none_found = 6;
    // The custodian's activity that explains it (contract v14).
    ActivityRef activity = 8;
    // The date read's check of a pending value date (W3.20, W9.4; contract
    // v22): beside BREAK_CAUSE_CATEGORY_VALUE_DATE_NOT_BUSINESS_DAY.
    DateCheck date_check = 9;
  }

  string note = 7;
}

// A mirror of meridian.v1.BreakCauseCategory.
enum BreakCauseCategory {
  BREAK_CAUSE_CATEGORY_UNSPECIFIED = 0;
  BREAK_CAUSE_CATEGORY_UNBOOKED_TRADE = 1;
  BREAK_CAUSE_CATEGORY_SETTLEMENT_TIMING = 2;
  BREAK_CAUSE_CATEGORY_COST_OR_PRICE = 3;
  BREAK_CAUSE_CATEGORY_CORPORATE_ACTION = 4;
  BREAK_CAUSE_CATEGORY_FAIL = 5;
  BREAK_CAUSE_CATEGORY_CUSTODIAN_ERROR = 6;
  BREAK_CAUSE_CATEGORY_UNKNOWN = 7;
  // Income the custodian reinvested in units, which the book has not
  // booked: a money market fund's monthly dividend (contract v14).
  BREAK_CAUSE_CATEGORY_INCOME_REINVESTED = 8;
  // A pending value date that is not a business day on its calendars
  // (W9.4; spec/settlement-calendars-are-core-reference-data, requirement 14
  // and Q9; contract v22): the cause names the date read's check
  // (BreakCause.date_check). The book never moves the date itself.
  BREAK_CAUSE_CATEGORY_VALUE_DATE_NOT_BUSINESS_DAY = 9;
}

// A mirror of meridian.v1.PendingSettlementRef.
message PendingSettlementRef {
  string instrument_id = 1;

  HoldingSide side = 2;

  string value_date = 3;
}

// An activity the street recorded (W2.12), named by value: never a key the
// book follows, and recorded as given (decisions/012).
// A mirror of meridian.v1.ActivityRef.
message ActivityRef {
  // The street's identifier for the activity.
  string activity_id = 1;

  // Its record in the street's partition.
  JournalRef change = 2;

  // ISO 8601: the activity's trade date, as the custodian stated it.
  string trade_date = 3;
}

// What the date read found of one date (W3.20, W9.4; the calendars spec's
// requirement 14; contract v22): the date, the calendars and their versions
// it was checked on, and why the day is closed.
// A mirror of meridian.v1.DateCheck.
message DateCheck {
  // ISO 8601.
  string date = 1;

  // Each calendar it was checked on, with its version.
  repeated CalendarRef calendars = 2;

  // Why the day is closed.
  DateCheckReason reason = 3;

  // On a holiday: its name as the source gives it.
  string holiday_name = 4;
}

// Why a date is not a business day (the calendars spec's requirement 14;
// contract v22).
// A mirror of meridian.v1.DateCheckReason.
enum DateCheckReason {
  DATE_CHECK_REASON_UNSPECIFIED = 0;
  // A weekend day on one of the calendars, not listed open.
  DATE_CHECK_REASON_WEEKEND = 1;
  // A closed day listed on one of the calendars, with its name.
  DATE_CHECK_REASON_HOLIDAY = 2;
  // Outside a calendar's coverage: not known, never a business day.
  DATE_CHECK_REASON_OUTSIDE_COVERAGE = 3;
}

// A mirror of meridian.v1.BreakHandling.
message BreakHandling {
  // A user the deployment knows (W6.1): one granted write on the account
  // through the plugin, or the person taking it (Q11 of the sample
  // operations plugin, ruled 2026-10-01).
  string owner_subject = 1;

  // The operations plugin's own levels; core gives them no meaning.
  uint32 escalation_level = 2;

  // ISO 8601.
  string due_date = 3;
}

// A mirror of meridian.v1.BreakResolution.
message BreakResolution {
  // Resolved: the entries that corrected the book.
  repeated JournalRef entries = 1;

  // Closed: the explanation, no entry.
  string explanation = 2;

  Actor actor = 3;

  string reason = 4;

  // Closed as cleared: the street record where the difference was gone (Q2
  // of the sample operations plugin, ruled 2026-10-01).
  StreetRecordRef cleared_at = 5;
}

// The record: one per account, agreement and business date.
// A mirror of meridian.v1.AccountFigures.
message AccountFigures {
  string account_id = 1;

  string business_date = 2;

  MarginAgreementRef agreement = 3;

  StatementFigures figures = 4;

  repeated ReportedPositionValue position_values = 5;

  StreetRecordRef source = 6;

  JournalRef last_change = 7;
}

// The custodian's, labelled as such (Q8, revised and ruled); never a
// position's own.
// A mirror of meridian.v1.ReportedPositionValue.
message ReportedPositionValue {
  string instrument_id = 1;

  HoldingSide side = 2;

  optional Money market_value = 3;

  optional Money margin_requirement = 4;
}

// A mirror of meridian.v1.AccountAttributes.
message AccountAttributes {
  string account_id = 1;

  // ISO 4217 until the money revision names an asset
  // (sdk-contract/money-names-an-asset-not-only-an-iso-currency).
  string base_currency_code = 2;

  LotReliefMethod lot_relief_default = 3;

  JournalRef last_change = 4;

  // The standing opening balance, set by the book when it journals W9.1;
  // unset while none stands (Q21 of the sample operations plugin, ruled
  // 2026-10-01).
  OpeningBalance opening_balance = 5;

  // Whether a release waits until every compliance plugin covering the
  // account has answered on the order's version (W9.13, W11.6; step 5's Q5;
  // contract v22). True for a new account and for every account the book
  // held at the upgrade, recorded so (decisions/031); the book always
  // states it, so false is a deployment admin's act with its reason.
  bool waits_for_compliance = 6;

  // Contract v24 (W9.13; the order-path plan's v24 item 10): a booking may
  // allocate to it without the instruction naming it, each allocation
  // carrying its reason and ErrorCause and raising an alert (W11.27,
  // W11.34). A deployment admin's mark; unmarking is recorded, and past
  // allocations keep their flag.
  bool error_account = 7;

  // Contract v24 (W9.13; the order-path plan's v24 item 7): a block order's
  // account, with no statement to reconcile against, flat once booked; a
  // balance left after booking holds the booking (W11.28).
  bool allocation_account = 8;
}

// A mirror of meridian.v1.LotReliefMethod.
enum LotReliefMethod {
  LOT_RELIEF_METHOD_UNSPECIFIED = 0;
  LOT_RELIEF_METHOD_FIRST_IN_FIRST_OUT = 1;
  LOT_RELIEF_METHOD_LAST_IN_FIRST_OUT = 2;
  LOT_RELIEF_METHOD_HIGHEST_COST = 3;
  LOT_RELIEF_METHOD_LOWEST_COST = 4;
  LOT_RELIEF_METHOD_AVERAGE_COST = 5;
}

// The account's standing opening balance, set by the book when it journals
// W9.1 and cleared when it is reversed (Q21 of the sample operations plugin,
// ruled 2026-10-01): its entry, D0 and sources, read on the account's
// attributes (W9.14).
// A mirror of meridian.v1.OpeningBalance.
message OpeningBalance {
  string entry_id = 1;

  // ISO 8601: D0.
  string as_of_date = 2;

  // As recorded, the street records it was composed from among them.
  repeated OpeningSource sources = 3;

  Actor recorded_by = 4;

  JournalRef journal = 5;

  // The reason the person gave.
  string reason = 6;
}

// A mirror of meridian.v1.AgreementFigures.
message AgreementFigures {
  MarginAgreementRef agreement = 1;

  // As the street recorded them (W2.2), its segment equal to the
  // agreement's.
  StatementFigures figures = 2;

  // On the set with no segment only.
  repeated ReportedPositionValue position_values = 3;
}

// One position's encumbrances, as a statement states them: the whole set,
// empty when the statement reports none.
// A mirror of meridian.v1.PositionEncumbrances.
message PositionEncumbrances {
  string instrument_id = 1;

  HoldingSide side = 2;

  repeated Encumbrance encumbrances = 3;
}

// Step 5's non-order transaction's first kind (Q28). Slice D adds the
// cash-flow class and the other kinds as fields of their own (Q20).
// A mirror of meridian.v1.Adjustment.
message Adjustment {
  // After the opening balance's date.
  string effective_date = 1;

  repeated MovementLine lines = 2;

  repeated BasisAdjustment basis_adjustments = 3;

  // A corporate action's reference, as reported, where it records one; from
  // contract v14, the activity's identifier (W2.12) where the adjustment was
  // proposed from the custodian's activity.
  string event_reference = 4;
}

// A mirror of meridian.v1.MovementLine.
message MovementLine {
  // The deployment's instrument record, a currency's cash instrument
  // included.
  string instrument_id = 1;

  HoldingSide side = 2;

  SettlementBucket bucket = 3;

  // ISO 8601; on a pending line, empty only on an adjustment the street gave
  // no date for; may be years out.
  string value_date = 4;

  // Signed as the position's quantity is, and added to it.
  Decimal quantity = 5;

  // The lot it adds to or relieves. Empty on a line that opens a lot, whose
  // identifier the book mints, and on cash, which has no lots.
  string lot_id = 6;

  // Set on the line that opens a lot, and only there.
  LotTerms opens_lot = 7;

  // A pending line's fail, where its source reports one.
  PendingState pending_state = 8;

  // The sleeve within the account it moves (W9's invariants, the order-path
  // plan's refresh, Q33; step 5's requirement 59; contract v22): a cash
  // line's too. Empty for the account's unsleeved part, and on every line
  // before v22.
  string sleeve = 9;
}

// A mirror of meridian.v1.SettlementBucket.
enum SettlementBucket {
  // Refused.
  SETTLEMENT_BUCKET_UNSPECIFIED = 0;
  SETTLEMENT_BUCKET_SETTLED = 1;
  // Pending settlement on the line's value date. With no value date on an
  // adjustment the street gave no date for, or on a line a v8 opening
  // balance recorded ("date not stated").
  SETTLEMENT_BUCKET_PENDING = 2;
  // The source did not say whether it is settled or pending: only on a line
  // a v8 opening balance recorded. Refused from v9.
  SETTLEMENT_BUCKET_NOT_STATED = 3;
}

// A mirror of meridian.v1.BasisAdjustment.
message BasisAdjustment {
  string lot_id = 1;

  oneof cost {
    // Added to the lot's cost; signed. Only on a lot whose cost is known.
    Money cost_change = 2;
    // The lot's cost, stated where it was unknown: a lot a v8 book opened
    // with no cost, given its cost once it is known. Only on a lot whose cost
    // is unknown; from v9 the book opens none.
    Money stated_cost = 4;
  }

  // Where it moves; empty is unchanged.
  string holding_period_start = 3;
}

// Names the entry it reverses; the book negates its lines, at that entry's
// effective date.
// A mirror of meridian.v1.Reversal.
message Reversal {
  string entry_id = 1;
}

// A mirror of meridian.v1.ResolvedByEntries.
message ResolvedByEntries {
  repeated string entry_ids = 1;
}

// A mirror of meridian.v1.Side.
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
  // With the locate it names (Order.locate_id, W11.18).
  SIDE_SELL_SHORT = 3;
  SIDE_SELL_SHORT_EXEMPT = 4;
}

// A mirror of meridian.v1.OrderType.
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
  ORDER_TYPE_STOP = 3;
  ORDER_TYPE_STOP_LIMIT = 4;
  // An RFQ order: its quotes and outcomes are slice C's, on its placement.
  ORDER_TYPE_REQUEST_FOR_QUOTE = 5;
}

// One leg of an order (step 5's Q26).
// A mirror of meridian.v1.Leg.
message Leg {
  string instrument_id = 1;

  Side side = 2;

  // FIX's LegRatioQty (623).
  Decimal ratio = 3;
}

// `portfolio`'s allocation instruction (principle 1; FIX's
// AllocationInstruction).
// A mirror of meridian.v1.AllocationInstruction.
message AllocationInstruction {
  repeated AllocationLine lines = 1;
}

// One account's part of an allocation instruction.
// A mirror of meridian.v1.AllocationLine.
message AllocationLine {
  string account_id = 1;

  // The amount, or, where weighted, unset.
  optional Decimal quantity = 2;

  // A weighted line's share, 0 to 1.
  optional Decimal weight = 3;

  // Slice B's, with the allocation; carried empty until then.
  string sleeve = 4;
}

// A mirror of meridian.v1.TimeInForce.
enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_DAY = 1;
  TIME_IN_FORCE_GOOD_TILL_CANCELLED = 2;
  TIME_IN_FORCE_GOOD_TILL_DATE = 3;
  // With a kill time.
  TIME_IN_FORCE_GOOD_TILL_TIME = 4;
  TIME_IN_FORCE_IMMEDIATE_OR_CANCEL = 5;
  TIME_IN_FORCE_FILL_OR_KILL = 6;
  TIME_IN_FORCE_AT_THE_OPEN = 7;
  TIME_IN_FORCE_AT_THE_CLOSE = 8;
}

// For a broker's order, set by the `oms`.
// A mirror of meridian.v1.Capacity.
enum Capacity {
  CAPACITY_UNSPECIFIED = 0;
  CAPACITY_AGENCY = 1;
  CAPACITY_PRINCIPAL = 2;
  CAPACITY_RISKLESS_PRINCIPAL = 3;
  CAPACITY_MIXED = 4;
}

// Whether an order was received from a client (Q23).
// A mirror of meridian.v1.OrderDirection.
enum OrderDirection {
  // The firm's own order, unmarked.
  ORDER_DIRECTION_UNSPECIFIED = 0;
  // A client's order, proposed by the `portfolio` intake standing for the
  // client's portfolio manager.
  ORDER_DIRECTION_RECEIVED = 1;
}

// A party to an order or an execution, as delivered (requirements 30, 55).
// After FIX's Parties (PartyID 448, PartyIDSource 447, PartyRole 452).
// A mirror of meridian.v1.Party.
message Party {
  // Its identifiers as delivered, each with its scheme.
  repeated Identifier identifiers = 1;

  // Its LEI, where given (requirement 55).
  string lei = 2;

  PartyRole party_role = 3;

  // Its contact as delivered (requirement 30).
  string contact = 4;
}

// A party's role on an order or an execution.
// A mirror of meridian.v1.PartyRole.
enum PartyRole {
  PARTY_ROLE_UNSPECIFIED = 0;
  // The client, as delivered.
  PARTY_ROLE_CLIENT = 1;
  // The counterparty, where known.
  PARTY_ROLE_COUNTERPARTY = 2;
}

// A precision a time was stated in (the order-path plan's refresh, Q38).
// A mirror of meridian.v1.TimePrecision.
enum TimePrecision {
  TIME_PRECISION_UNSPECIFIED = 0;
  TIME_PRECISION_SECOND = 1;
  TIME_PRECISION_MILLISECOND = 2;
  TIME_PRECISION_MICROSECOND = 3;
  TIME_PRECISION_NANOSECOND = 4;
}

// The quote at time of receipt, held as stated (requirement 56; the
// refresh's Q35).
// A mirror of meridian.v1.ReceiptQuote.
message ReceiptQuote {
  optional Money bid = 1;

  optional Money ask = 2;

  ReceiptQuoteSourceKind source_kind = 3;

  // With RECEIPT_QUOTE_SOURCE_KIND_VENUE: the venue, its `VEN-` ID.
  string venue_id = 4;

  int64 quoted_at_ns = 5;

  // The sizes (FIX's BidSize, 134, and OfferSize, 135).
  optional Decimal bid_size = 6;

  optional Decimal ask_size = 7;

  // The lake row it was read from, optional: its dataset and row key.
  string dataset = 8;

  string row_key = 9;
}

// Which quote a quote at time of receipt is (the refresh's Q35, as refined
// and ruled 2026-10-12; the values spelled with the enum's prefix, the
// order-path plan's protos, point 9, ruled 2026-10-12).
// A mirror of meridian.v1.ReceiptQuoteSourceKind.
enum ReceiptQuoteSourceKind {
  RECEIPT_QUOTE_SOURCE_KIND_UNSPECIFIED = 0;
  // The consolidated best bid and offer across venues, the quote Rule 605's
  // statistics reference.
  RECEIPT_QUOTE_SOURCE_KIND_CONSOLIDATED = 1;
  // One named venue's, its `VEN-` ID beside it.
  RECEIPT_QUOTE_SOURCE_KIND_VENUE = 2;
}

// The split link on a child order (W11.1; Q41).
// A mirror of meridian.v1.OrderLink.
message OrderLink {
  OrderLinkKind kind = 1;

  string parent_order_id = 2;
}

// The one named link in v22 (W11.1; step 5's link 1, Q6; the refresh's
// Q41). Block, allocation, street order, two-way quote, alternatives and
// basket join with their slices.
// A mirror of meridian.v1.OrderLinkKind.
enum OrderLinkKind {
  ORDER_LINK_KIND_UNSPECIFIED = 0;
  // A child order an `ems` (or the `oms`) worked out of its parent.
  ORDER_LINK_KIND_SPLIT = 1;
}

// The standard execution instructions (step 6's requirement 12; FIX's
// ExecInst, tag 18), set by the `oms`; a venue's own parameters are never
// here.
// A mirror of meridian.v1.ExecutionInstruction.
enum ExecutionInstruction {
  EXECUTION_INSTRUCTION_UNSPECIFIED = 0;
  EXECUTION_INSTRUCTION_NOT_HELD = 1;
  EXECUTION_INSTRUCTION_DO_NOT_REDUCE = 2;
  EXECUTION_INSTRUCTION_DO_NOT_INCREASE = 3;
  EXECUTION_INSTRUCTION_REDUCE_ONLY = 4;
  // Self-match prevention, honoured by the connectivity plugin with the
  // venue's own identifier and instruction (step 5, "Self-match and
  // wash-trade prevention").
  EXECUTION_INSTRUCTION_SELF_MATCH_PREVENTION = 5;
}

// An order (W11.1, W11.2): its identity (account, instrument, side) never
// changes (Q20); each field set by its owner (step 5, "The order's fields").
// A mirror of meridian.v1.Order.
message Order {
  // `ORD-` and a ULID, minted by the book; never reused (decisions/035).
  string order_id = 1;

  string account_id = 2;

  string instrument_id = 3;

  // The sleeve within the account (ruled 2026-10-10); empty for the
  // account's unsleeved part.
  string sleeve = 4;

  Side side = 5;

  // On a short: the prime's locate ID on a locate record in the book
  // (W11.18), which `compliance` checks at release by its own logic.
  string locate_id = 6;

  // The ordered quantity, or, where the order is for an amount, its cash
  // quantity: exactly one is set, as FIX's OrderQty (38) and CashOrderQty
  // (152) are alternatives (ruled 2026-10-12).
  Decimal quantity = 7;

  Money cash_quantity = 8;

  OrderType order_type = 9;

  Money limit_price = 10;

  // A stop or stop-limit order's trigger (FIX's StopPx, tag 99).
  Money stop_price = 40;

  // On a pair: the dealt currency, by its cash instrument's ID.
  string dealt_currency = 11;

  // Contract v23 (W11.1): on an FX order, the pair's quote currency by its
  // cash instrument's ID, so with the order's instrument, the base
  // currency's, it names the pair; a limit or stop is in it.
  string quote_currency = 44;

  // A slot of optional legs (FX swaps, spreads; step 5's Q26).
  repeated Leg legs = 12;

  // `portfolio`'s: accounts with amounts or weights. At release it sums to
  // the ordered quantity, or, unset, the whole is in the order's own account
  // (principle 1; REFUSAL_REASON_ALLOCATION_UNBALANCED). A child order
  // carries none: its parent's governs (Q47).
  AllocationInstruction allocation_instruction = 13;

  // Set by the `oms`, on its proposal or by a change (W11.3).
  TimeInForce time_in_force = 14;

  // ISO 8601: a good-till-date order's date (FIX's ExpireDate, tag 432);
  // and a good-till-time order's kill time (FIX's ExpireTime, tag 126).
  string expire_date = 41;

  int64 expire_time_ns = 42;

  // The standard execution instructions, set by the `oms` (FIX's ExecInst,
  // tag 18).
  repeated ExecutionInstruction execution_instructions = 43;

  // How a sale relieves lots: the method, or the lots it names; unset, the
  // account's lot_relief_default (W9.13, W11.13).
  LotReliefMethod lot_relief_method = 15;

  repeated string relieve_lot_ids = 16;

  Capacity capacity = 17;

  OrderDirection direction = 18;

  // The client, as delivered, with its LEI where given.
  repeated Party parties = 19;

  // Entered by, from the actor; decided by, where it differs (requirement
  // 29).
  PersonRoles person_roles = 20;

  // The reporting fields its decision owns (requirements 55, 56; the
  // refresh's Q36): stored as stated, core reporting nothing.
  string customer_id = 21;

  string firm_designated_id = 22;

  repeated string handling_instructions = 23;

  int64 received_at_ns = 24;

  TimePrecision received_precision = 25;

  ReceiptQuote quote_at_receipt = 26;

  // The orders a firm's order represents, recorded and not checked (Q37).
  repeated string represents_order_ids = 27;

  // Slice C's, carried empty until it lands (the refresh's Q34): the axe an
  // order was made from in the lake, its source and counterparty.
  string axe_source = 28;

  string axe_counterparty_id = 29;

  // On a child order: its parent, released, whose instrument and side it
  // has (Q46).
  OrderLink link = 30;

  // On an order the book did not create (W11.2); unspecified on one it did.
  OrderOrigin origin = 31;

  // The venue's order ID on such an order, an external reference, never a
  // key.
  string venue_order_id = 32;

  // A fold over its journal (decisions/035), never stored.
  OrderStatus status = 33;

  // Each check recorded on it, naming the version it checked (W11.4).
  repeated Check checks = 34;

  // Its change requests, each tracked to its outcome (requirement 16).
  repeated ChangeRequest change_requests = 35;

  // On a read (W11.17): its placements, executions and charges.
  repeated Placement placements = 36;

  repeated Execution executions = 37;

  repeated Charge charges = 38;

  JournalRef last_change = 39;

  // Contract v24 (W11.1; the order-path plan's v24 item 6): on a block
  // order, its members as proposed -- released orders of one instrument and
  // side, each in no other live block. Empty on any other order.
  repeated string block_member_order_ids = 45;

  // Contract v24 (W11.33): each sleeve cross that filled the order; its
  // filled quantity counts each, and no execution is minted for one.
  repeated string sleeve_cross_ids = 46;
}

// The people on an order, a placement or an entered execution (requirement
// 29). Each a person who has signed in (W6.1) or a service account.
// A mirror of meridian.v1.PersonRoles.
message PersonRoles {
  // Stamped from the actor of the proposing or recording command.
  Actor entered_by = 1;

  // The placement's, and an entered execution's: that act's actor.
  Actor executed_by = 2;

  // Named in the command, where it differs from entered by.
  Actor decided_by = 3;
}

// Where an order the book did not create came from (W11.2).
// A mirror of meridian.v1.OrderOrigin.
enum OrderOrigin {
  // An order the book created: proposed (W11.1).
  ORDER_ORIGIN_UNSPECIFIED = 0;
  // A telephoned or outside order, recorded by the `oms` for a person.
  ORDER_ORIGIN_TELEPHONED = 2;
  // An order made from venue-originated fills the `ems` accepted (W11.23;
  // contract v23): entered after the trade, filled, never gated.
  ORDER_ORIGIN_ACCEPTED_EXECUTION = 3;
}

// An order's status: its state, its conditions and its quantities, each
// derived.
// A mirror of meridian.v1.OrderStatus.
message OrderStatus {
  OrderState state = 1;

  repeated StandingOrderCondition conditions = 2;

  OrderQuantities quantities = 3;
}

// An order is in exactly one of seven states (W11's invariants).
// A mirror of meridian.v1.OrderState.
enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  // Proposed, not released: the gate has not passed it (W11.1, W11.6).
  ORDER_STATE_PROPOSED = 1;
  // Ended before release: a check's refuse, or the `oms`'s rejection
  // (W11.4, W11.5). Terminal.
  ORDER_STATE_REFUSED = 2;
  // Released for working, nothing committed or filled yet (W11.6).
  ORDER_STATE_RELEASED = 3;
  // Released with quantity committed at a placement or a child order, or
  // filled in part.
  ORDER_STATE_WORKING = 4;
  // Reported filled reached ordered.
  ORDER_STATE_FILLED = 5;
  // Ended by a cancel, the firm's or the venue's. Terminal.
  ORDER_STATE_CANCELLED = 6;
  // Its time in force ended, by the deployment's clock (W11.13). Terminal.
  ORDER_STATE_EXPIRED = 7;
}

// One condition an order holds, with its reason and who set it.
// A mirror of meridian.v1.StandingOrderCondition.
message StandingOrderCondition {
  OrderCondition condition = 1;

  // In words, for a person; a plugin acts on the condition, never on these.
  string reason = 2;

  // Who set it.
  Actor actor = 3;

  // On claimed: the instance claiming and the user it claims for (W11.7).
  Claimant claimant = 4;

  // On does not tie out: why.
  TieOutReason tie_out_reason = 5;
}

// The nine conditions an order holds beside its state, each with its reason
// and the actor that set it.
// A mirror of meridian.v1.OrderCondition.
enum OrderCondition {
  ORDER_CONDITION_UNSPECIFIED = 0;
  // A change request is outstanding (W11.3; requirement 16).
  ORDER_CONDITION_CHANGE_REQUESTED = 1;
  // `compliance` requires approval by its policy (W11.5).
  ORDER_CONDITION_APPROVAL_REQUIRED = 2;
  // The account waits for compliance and a compliance plugin covering it
  // has not answered on this version (W11.6; step 5's Q5).
  ORDER_CONDITION_AWAITING_CHECK = 3;
  // Claimed to work it, by an instance for a user (W11.7).
  ORDER_CONDITION_CLAIMED = 4;
  ORDER_CONDITION_HELD = 5;
  // Its working paused: not the trading instruction's pause (Q31).
  ORDER_CONDITION_PAUSED = 6;
  // A placement's outcome is not known (W11.10; requirement 20).
  ORDER_CONDITION_OUTCOME_UNKNOWN = 7;
  // Its quantities do not tie out -- an overfill, or a restatement past its
  // intent (Q15, Q16, Q21) -- until an alignment, a booking to an error
  // account (slice B) or a bust clears it. Never acknowledged.
  ORDER_CONDITION_DOES_NOT_TIE_OUT = 8;
  // A fact arrived after the state it would have changed ended (#12):
  // recorded, flagged, acknowledged by a person (W11.14).
  ORDER_CONDITION_LATE_FACT = 9;
}

// The instance holding a claim, and the user it acts for.
// A mirror of meridian.v1.Claimant.
message Claimant {
  string instance_id = 1;

  oneof user {
    PersonActor person = 2;
    ServiceAccountActor service_account = 3;
  }
}

// Why an order does not tie out (W11's invariants; Q15, Q16).
// A mirror of meridian.v1.TieOutReason.
enum TieOutReason {
  TIE_OUT_REASON_UNSPECIFIED = 0;
  TIE_OUT_REASON_OVERFILL = 1;
  // A restatement past the order's intent.
  TIE_OUT_REASON_RESTATEMENT = 2;
}

// The quantities, derived; idle may go negative, shown, never refused (Q3).
// A mirror of meridian.v1.OrderQuantities.
message OrderQuantities {
  Decimal ordered = 1;

  // Executions at matched or later, a child order's included.
  Decimal reported_filled = 2;

  // Executions at final.
  Decimal final_filled = 3;

  Decimal awaiting_acceptance = 4;

  // Open at live placements and live child orders.
  Decimal committed = 5;

  // Ordered less committed and filled.
  Decimal idle = 6;

  Decimal leaves = 7;
}

// A verdict on an order version or a placement (W11.4).
// A mirror of meridian.v1.Check.
message Check {
  CheckVerdict verdict = 1;

  // The order version it checked: the journal sequence of the order's last
  // change when it checked. Unset on a placement's.
  uint64 order_version = 2;

  // On a check of a placement before it is sent.
  string placement_id = 3;

  string rule = 4;

  string note = 5;

  // The compliance plugin instance that recorded it.
  string instance_id = 6;

  Actor recorded_by = 7;
}

// Ruled 2026-09-30 (requirement 44).
// A mirror of meridian.v1.CheckVerdict.
enum CheckVerdict {
  CHECK_VERDICT_UNSPECIFIED = 0;
  CHECK_VERDICT_PASS = 1;
  CHECK_VERDICT_WARN = 2;
  // Stands until overridden (W11.5); a release is refused while it does.
  CHECK_VERDICT_BLOCK = 3;
  // Ends a proposed order refused; nobody may override it.
  CHECK_VERDICT_REFUSE = 4;
}

// A change request, tracked to its outcome (requirement 16).
// A mirror of meridian.v1.ChangeRequest.
message ChangeRequest {
  // `CRQ-` and a ULID, minted by the book.
  string change_request_id = 1;

  string order_id = 2;

  // On a placement's change.
  string placement_id = 3;

  oneof change {
    OrderChange order_change = 4;
    PlacementChange placement_change = 5;
  }

  string reason = 6;

  EntryMeta entry = 7;

  ChangeRequestOutcome outcome = 8;
}

// What an order's change asks (W11.3).
// A mirror of meridian.v1.OrderChange.
message OrderChange {
  OrderChangeKind kind = 1;

  // The new ordered quantity, on ORDER_CHANGE_KIND_QUANTITY.
  optional Decimal quantity = 2;

  optional Money limit_price = 3;

  TimeInForce time_in_force = 4;

  // Amended in the same act as an increase or a reduction.
  AllocationInstruction allocation_instruction = 5;

  // On ORDER_CHANGE_KIND_AMEND: the instructions now, whole.
  repeated ExecutionInstruction execution_instructions = 6;
}

// What an order's change request asks (W11.3; step 5's Q20).
// A mirror of meridian.v1.OrderChangeKind.
enum OrderChangeKind {
  ORDER_CHANGE_KIND_UNSPECIFIED = 0;
  // Each live placement and child order asked to cancel; cancelled when
  // none is live.
  ORDER_CHANGE_KIND_CANCEL = 1;
  // Its limit, time in force or execution instructions.
  ORDER_CHANGE_KIND_AMEND = 2;
  // A released order with nothing committed, back to proposed.
  ORDER_CHANGE_KIND_RECALL = 3;
  // A proposal withdrawn by its proposer.
  ORDER_CHANGE_KIND_WITHDRAW = 4;
  // An increase or a reduction, `portfolio`'s, its allocation amended in the
  // same act; or the `oms`'s justified alignment.
  ORDER_CHANGE_KIND_QUANTITY = 5;
}

// What a placement's change asks (W11.9).
// A mirror of meridian.v1.PlacementChange.
message PlacementChange {
  PlacementChangeKind kind = 1;

  optional Decimal quantity = 2;

  optional Money limit_price = 3;

  TimeInForce time_in_force = 4;
}

// What a placement's change request asks (W11.9).
// A mirror of meridian.v1.PlacementChangeKind.
enum PlacementChangeKind {
  PLACEMENT_CHANGE_KIND_UNSPECIFIED = 0;
  PLACEMENT_CHANGE_KIND_CANCEL = 1;
  PLACEMENT_CHANGE_KIND_REPLACE = 2;
}

// What became of a change request (requirement 16).
// A mirror of meridian.v1.ChangeRequestOutcome.
enum ChangeRequestOutcome {
  CHANGE_REQUEST_OUTCOME_UNSPECIFIED = 0;
  // Outstanding: the order or placement holds change requested.
  CHANGE_REQUEST_OUTCOME_PENDING = 1;
  CHANGE_REQUEST_OUTCOME_APPLIED = 2;
  // Refused by the venue, as FIX's OrderCancelReject (9).
  CHANGE_REQUEST_OUTCOME_REJECTED = 3;
}

// A placement (W11.8): part of a released order at one connectivity plugin
// linked to the placing `ems`, which it reaches alone.
// A mirror of meridian.v1.Placement.
message Placement {
  // `PLC-` and a ULID, minted by the book. The client order identifier the
  // venue sees is this, or one the plugin derives from it.
  string placement_id = 1;

  string order_id = 2;

  string account_id = 3;

  // The placing `ems`, as its sidecar stamped it.
  string ems_instance_id = 4;

  // The connectivity plugin that sends it, linked to that `ems`.
  string connectivity_instance_id = 5;

  // What the `ems` set in the venue's account field, from its map (W11.22).
  string venue_account_code = 6;

  Decimal quantity = 7;

  Money limit_price = 8;

  TimeInForce time_in_force = 9;

  StrategyInstruction strategy = 10;

  // The reporting fields (requirement 56): the destination, a `VEN-` ID,
  // and route type by the `ems`; the routing time as the connectivity
  // plugin sent it, on its acknowledgement.
  string destination = 11;

  RouteType route_type = 12;

  int64 routed_at_ns = 13;

  TimePrecision routed_precision = 14;

  repeated string handling_instructions = 15;

  // Slice C's, carried empty until it lands (the refresh's Q34): the RFQ a
  // placement answers, as FIX's QuoteID (tag 117), and the axe, as FIX's
  // IOIID (tag 23).
  string rfq_id = 16;

  string axe_id = 17;

  // The venue's order ID now; every one it has had, in venue_order_ids.
  string venue_order_id = 18;

  PlacementStatus status = 19;

  // Executed by: the actor of the placing command.
  PersonRoles person_roles = 20;

  repeated Check checks = 21;

  // On a rejection: its reason, and the venue's as reported only beside
  // REJECTION_REASON_VENUE_REJECTED.
  RejectionReason rejection_reason = 22;

  AsReported rejection_as_reported = 23;

  JournalRef last_change = 24;

  // Every venue order ID it has had, in order, the current last
  // (requirement 34): external references, never keys.
  repeated string venue_order_ids = 25;

  // Its own change requests, each with its PlacementChange and tracked to
  // its outcome (W11.9; approved 2026-10-13), so its connectivity plugin
  // hears each on the placement. The order's stay on the order.
  repeated ChangeRequest change_requests = 26;
}

// A strategy for the venue to work (step 6's Q11): the kinds name which of
// a broker's strategies, described in its catalogue on FIXatdl's model
// (W11.20), is its VWAP, TWAP, POV or IS. A connectivity plugin whose
// broker has none rejects it unsupported.
// A mirror of meridian.v1.StrategyInstruction.
message StrategyInstruction {
  StrategyKind kind = 1;

  int64 start_ns = 2;

  int64 end_ns = 3;

  // A participation rate, 0.1 for ten percent.
  optional Decimal participation = 4;

  Urgency urgency = 5;

  // The limits (step 6's Q11): the most participation, and a price beyond
  // which it does not trade, distinct from the order's limit.
  optional Decimal max_participation = 6;

  optional Money price_limit = 7;
}

// A broker's algorithm the placement asks for (step 6's Q11; Q6 as ruled).
// A mirror of meridian.v1.StrategyKind.
enum StrategyKind {
  STRATEGY_KIND_UNSPECIFIED = 0;
  STRATEGY_KIND_VWAP = 1;
  STRATEGY_KIND_TWAP = 2;
  STRATEGY_KIND_POV = 3;
  STRATEGY_KIND_IS = 4;
}

// A strategy's urgency (step 6's Q11): a few levels, as brokers have.
// A mirror of meridian.v1.Urgency.
enum Urgency {
  URGENCY_UNSPECIFIED = 0;
  URGENCY_LOW = 1;
  URGENCY_MEDIUM = 2;
  URGENCY_HIGH = 3;
}

// The route type a placement's destination is reached by (requirement 56).
// A mirror of meridian.v1.RouteType.
enum RouteType {
  ROUTE_TYPE_UNSPECIFIED = 0;
  // To the destination the `ems` chose.
  ROUTE_TYPE_DIRECTED = 1;
  // The broker chooses the destination.
  ROUTE_TYPE_NOT_DIRECTED = 2;
}

// A placement's status, derived.
// A mirror of meridian.v1.PlacementStatus.
message PlacementStatus {
  PlacementState state = 1;

  repeated StandingPlacementCondition conditions = 2;
}

// A placement is in one of eight states.
// A mirror of meridian.v1.PlacementState.
enum PlacementState {
  PLACEMENT_STATE_UNSPECIFIED = 0;
  // Created, not yet sent.
  PLACEMENT_STATE_QUEUED = 1;
  // Sent, not acknowledged.
  PLACEMENT_STATE_SENT = 2;
  // Acknowledged by the venue.
  PLACEMENT_STATE_WORKING = 3;
  // Ended for the day by the venue; not terminal for a good-till-cancelled
  // order, whose quantity stays committed (#20).
  PLACEMENT_STATE_DONE_FOR_DAY = 4;
  PLACEMENT_STATE_FILLED = 5;
  PLACEMENT_STATE_CANCELLED = 6;
  PLACEMENT_STATE_EXPIRED = 7;
  // Refused by the venue, or held back by the connectivity plugin's own
  // pre-trade check, with its RejectionReason.
  PLACEMENT_STATE_REJECTED = 8;
}

// One condition a placement holds; see StandingOrderCondition.
// A mirror of meridian.v1.StandingPlacementCondition.
message StandingPlacementCondition {
  PlacementCondition condition = 1;

  string reason = 2;

  Actor actor = 3;

  // On outcome unknown.
  UnknownReason unknown_reason = 4;

  AsReported status_as_reported = 5;
}

// The conditions a placement holds beside its state.
// A mirror of meridian.v1.PlacementCondition.
enum PlacementCondition {
  PLACEMENT_CONDITION_UNSPECIFIED = 0;
  PLACEMENT_CONDITION_CHANGE_REQUESTED = 1;
  // With its UnknownReason; its quantity stays committed.
  PLACEMENT_CONDITION_OUTCOME_UNKNOWN = 2;
  // Halted by the venue, which may leave its state unchanged.
  PLACEMENT_CONDITION_SUSPENDED = 3;
  // Held at the venue until a stop or a condition triggers.
  PLACEMENT_CONDITION_AWAITING_TRIGGER = 4;
}

// Why a placement's outcome is unknown (requirement 20).
// A mirror of meridian.v1.UnknownReason.
enum UnknownReason {
  UNKNOWN_REASON_UNSPECIFIED = 0;
  UNKNOWN_REASON_CONNECTION_LOST = 1;
  UNKNOWN_REASON_REQUEST_UNANSWERED = 2;
  // The venue's status as reported beside it.
  UNKNOWN_REASON_VENUE_STATUS_NOT_MAPPED = 3;
}

// Why a placement was rejected (step 6, "Refusals and rejections"). A
// rejection, not a refusal: core refuses nothing a venue cannot do.
// A mirror of meridian.v1.RejectionReason.
enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  // Asked for what the plugin or the venue does not offer for this account.
  REJECTION_REASON_UNSUPPORTED = 1;
  // The catch-all, the venue's reason beside it in an AsReported only when
  // no contract reason maps.
  REJECTION_REASON_VENUE_REJECTED = 2;
  // The connectivity plugin's own market-access check (Q18).
  REJECTION_REASON_HELD_BY_PRE_TRADE_CHECK = 3;
}

// An execution, never edited (W11.11): a bust or a correction is another,
// superseding it.
// A mirror of meridian.v1.Execution.
message Execution {
  // `EXE-` and a ULID, minted by the book.
  string execution_id = 1;

  string order_id = 2;

  string placement_id = 3;

  string account_id = 4;

  string instrument_id = 5;

  // Its order's sleeve (the refresh's Q33).
  string sleeve = 6;

  Side side = 7;

  Decimal quantity = 8;

  Money price = 9;

  int64 trade_time_ns = 10;

  // ISO 8601, as the venue reports it.
  string trade_date = 11;

  // The venue's, or one the plugin derived deterministically (requirement
  // 33); an external reference.
  string venue_execution_id = 12;

  ExecutionKind kind = 13;

  ExecutionSource source = 14;

  Finality finality = 15;

  // Each with its kind, a signed amount and its asset; a rebate negative.
  repeated Fee fees = 16;

  // ISO 8601: the date the venue states, kept as stated; and, where it
  // states none or the plugin also asked, the date read's answer with its
  // basis (W3.20; the calendars spec's requirement 13). The pending lines
  // take the stated date, else the computed one.
  string settlement_date = 17;

  string computed_settlement_date = 18;

  DateBasis settlement_date_basis = 19;

  // The execution it busts or corrects: the last correction, not the
  // original.
  string supersedes = 20;

  // The place of execution, a `VEN-` ID.
  string venue_id = 21;

  // The reporting fields (requirements 55, 57, 58), carried where set.
  string uti = 22;

  string prior_uti = 23;

  string upi = 24;

  // A prime broker.
  string given_up_to = 26;

  string trade_chain_reference = 27;

  string settlement_counterparty = 28;

  // Executed by, on an entered execution.
  PersonRoles person_roles = 29;

  RawRecordRef raw_record = 30;

  JournalRef last_change = 31;

  // On a correction: the date it takes effect, beside the journal's own
  // sequence.
  string effective_date = 32;

  // The counterparty where known, its contact as delivered.
  Party counterparty = 33;

  LiquidityIndicator liquidity_indicator = 34;

  // Who generated the UTI.
  string uti_generated_by = 35;

  // Contract v23 (W11.11, W11.23, W11.24). Its state, derived from the
  // journal.
  ExecutionState state = 36;

  // The venue's order ID (FIX 37), as the venue states it: set on a fill
  // reported on no placement, so the plugin can answer its venue.
  string venue_order_id = 37;

  // On a DK: the reason, and the text the `ems` sent.
  DkReason dk_reason = 38;

  string dk_text = 39;

  // The venue's client order ID (FIX 11), copied from the report of a fill
  // on no placement where the venue sent one, which FIX requires back on BN
  // and Q.
  string venue_client_order_id = 40;

  // Contract v24 (W11.32): each prime's answer to a give-up of the
  // execution, in the order recorded; a rejection moves no position.
  repeated GiveUpRecord give_up_answers = 41;

  // Retired in the domain message, and never reused.
  reserved 25;
  reserved "derivative_terms";
}

// A mirror of meridian.v1.ExecutionKind.
enum ExecutionKind {
  EXECUTION_KIND_UNSPECIFIED = 0;
  EXECUTION_KIND_VENUE_REPORTED = 1;
  // Entered by the `ems` or the `oms`, for a person.
  EXECUTION_KIND_MANUAL = 2;
  // Joins with its two-account act.
  EXECUTION_KIND_FROM_INVENTORY = 3;
  EXECUTION_KIND_DONE_AWAY = 4;
  // Joins with its link.
  EXECUTION_KIND_FROM_CHILD_ORDERS = 5;
  // Joins with its two-account act (Q23).
  EXECUTION_KIND_INTERNAL_CROSS = 6;
  // From a status report where the venue sends no fill, its ID derived
  // deterministically (requirement 33).
  EXECUTION_KIND_INFERRED = 7;
}

// A mirror of meridian.v1.ExecutionSource.
enum ExecutionSource {
  EXECUTION_SOURCE_UNSPECIFIED = 0;
  EXECUTION_SOURCE_PRIMARY = 1;
  // Deduplicated against the primary on the venue's identifiers.
  EXECUTION_SOURCE_DROP_COPY = 2;
}

// An execution's finality: a level, and when it reached it.
// A mirror of meridian.v1.Finality.
message Finality {
  FinalityLevel level = 1;

  int64 at_ns = 2;
}

// A level with a time per step; a venue with no steps reports final at once.
// A mirror of meridian.v1.FinalityLevel.
enum FinalityLevel {
  FINALITY_LEVEL_UNSPECIFIED = 0;
  // A hit awaiting the maker's accept (Q13, last look).
  FINALITY_LEVEL_AWAITING_ACCEPTANCE = 1;
  FINALITY_LEVEL_MATCHED = 2;
  // On chain, in a block.
  FINALITY_LEVEL_INCLUDED = 3;
  FINALITY_LEVEL_FINAL = 4;
  // It did not happen after all: a last-look reject, a revert, a re-org.
  FINALITY_LEVEL_FAILED = 5;
}

// A fee (requirement 26), in any asset with a cash instrument (v18).
// A mirror of meridian.v1.Fee.
message Fee {
  FeeKind kind = 1;

  // Signed; a rebate negative.
  Money amount = 2;

  // Contract v24 (W11.27; the order-path plan's v24 item 4): the `oms`'s
  // choice by its policy. A capitalised fee enters the lot's cost on a buy;
  // every fee stays its own cash line either way.
  bool capitalised = 3;
}

// A fee's kind (requirement 26). Grown by revision.
// A mirror of meridian.v1.FeeKind.
enum FeeKind {
  FEE_KIND_UNSPECIFIED = 0;
  FEE_KIND_EXCHANGE = 1;
  // A venue's cancel fee.
  FEE_KIND_CANCEL = 2;
  // Gas, on an on-chain venue.
  FEE_KIND_NETWORK = 3;
  // Contract v23 (the OANDA batch's item 2): a rolling position's financing,
  // charged at each roll (W11.12); and the broker's commission on a fill, as
  // FIX keeps it apart in Commission (12) and CommType (13).
  FEE_KIND_FINANCING = 4;
  FEE_KIND_COMMISSION = 5;
}

// Maker or taker (FIX's LastLiquidityInd, tag 851).
// A mirror of meridian.v1.LiquidityIndicator.
enum LiquidityIndicator {
  LIQUIDITY_INDICATOR_UNSPECIFIED = 0;
  // Added liquidity.
  LIQUIDITY_INDICATOR_MAKER = 1;
  // Removed liquidity.
  LIQUIDITY_INDICATOR_TAKER = 2;
}

// Where an execution stands between the venue and the `ems` (W11.11, W11.23,
// W11.24; decisions/035 as amended at contract v23): derived from the
// journal as an order's status is, never stored; its transitions are the
// transition table's e-rows.
// A mirror of meridian.v1.ExecutionState.
enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  // A fill on no order and no placement, its account mapped, waiting for
  // the `ems` to accept it or answer it DK; one a bust or a correction
  // supersedes stays unmatched, and is answered no more.
  EXECUTION_STATE_UNMATCHED = 1;
  // On a placement: every fill v22 records, and an accepted one.
  EXECUTION_STATE_MATCHED = 2;
  // Answered don't know: recorded and closed, never moving a position.
  EXECUTION_STATE_DONT_KNOW = 3;
}

// Why the `ems` does not know a fill, mirroring FIX's DKReason (127)
// (W11.24; contract v23).
// A mirror of meridian.v1.DkReason.
enum DkReason {
  DK_REASON_UNSPECIFIED = 0;
  DK_REASON_UNKNOWN_INSTRUMENT = 1;
  DK_REASON_WRONG_SIDE = 2;
  DK_REASON_QUANTITY_EXCEEDS_ORDER = 3;
  DK_REASON_NO_MATCHING_ORDER = 4;
  DK_REASON_PRICE_EXCEEDS_LIMIT = 5;
  DK_REASON_CALCULATION_DIFFERENCE = 6;
  // With text, as FIX requires Text (58) when DKReason is Other.
  DK_REASON_OTHER = 7;
}

// A prime's answer to a give-up (W11.32), its own record, as FIX sends each
// AllocationReport (AS) as its own message.
// A mirror of meridian.v1.GiveUpRecord.
message GiveUpRecord {
  GiveUpAnswer answer = 1;

  // As reported, FIX's SecondaryAllocID (793).
  string prime_reference = 2;

  string reason = 3;

  // Its entry in the account's partition.
  EntryMeta entry = 4;
}

// A prime's answer to a give-up (W11.32), as FIX's AllocStatus (87).
// A mirror of meridian.v1.GiveUpAnswer.
enum GiveUpAnswer {
  GIVE_UP_ANSWER_UNSPECIFIED = 0;
  GIVE_UP_ANSWER_ACCEPTED = 1;
  // The trade stays with the executing side; no position moves.
  GIVE_UP_ANSWER_REJECTED = 2;
}

// A fee with no fill, on its placement (W11.12): it moves cash, pending to
// its settlement date, and counts toward no quantity.
// A mirror of meridian.v1.Charge.
message Charge {
  // `CHG-` and a ULID, minted by the book.
  string charge_id = 1;

  string placement_id = 2;

  string order_id = 3;

  string account_id = 4;

  Fee fee = 5;

  string trade_date = 6;

  string settlement_date = 7;

  RawRecordRef raw_record = 8;
}

// A mirror of meridian.v1.ApprovalDecision.
enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  // `compliance` sets approval required, by policy.
  APPROVAL_DECISION_REQUIRE = 1;
  // A person approves.
  APPROVAL_DECISION_APPROVE = 2;
  // A person overrides a block, with a reason.
  APPROVAL_DECISION_OVERRIDE = 3;
  // The `oms` rejects a proposed order it was asked to work (Q23): the
  // order ends refused.
  APPROVAL_DECISION_REJECT = 4;
}

// A mirror of meridian.v1.PlacementEvent.
enum PlacementEvent {
  PLACEMENT_EVENT_UNSPECIFIED = 0;
  PLACEMENT_EVENT_SENT = 1;
  // With the venue's order ID and the routing time.
  PLACEMENT_EVENT_ACKNOWLEDGED = 2;
  PLACEMENT_EVENT_REPLACED = 3;
  PLACEMENT_EVENT_DONE_FOR_DAY = 4;
  // With its RestatementReason.
  PLACEMENT_EVENT_RESTATED = 5;
  PLACEMENT_EVENT_SUSPENDED = 6;
  PLACEMENT_EVENT_TRIGGERED = 7;
  PLACEMENT_EVENT_CANCELLED = 8;
  PLACEMENT_EVENT_EXPIRED = 9;
  // With its RejectionReason.
  PLACEMENT_EVENT_REJECTED = 10;
  // With its UnknownReason; never a rejection.
  PLACEMENT_EVENT_OUTCOME_UNKNOWN = 11;
  // An unknown outcome resolved by asking the venue, never by resending.
  PLACEMENT_EVENT_OUTCOME_RESOLVED = 12;
}

// A restatement's reason, after FIX's; one beyond the order's intent sets
// late fact and does not tie out (Q15).
// A mirror of meridian.v1.RestatementReason.
enum RestatementReason {
  RESTATEMENT_REASON_UNSPECIFIED = 0;
  RESTATEMENT_REASON_CORPORATE_ACTION = 1;
  RESTATEMENT_REASON_RENEWAL = 2;
  RESTATEMENT_REASON_REPRICING = 3;
  RESTATEMENT_REASON_PARTIAL_DECLINE = 4;
  RESTATEMENT_REASON_CANCEL_ON_HALT = 5;
  RESTATEMENT_REASON_CANCEL_ON_SYSTEM_FAILURE = 6;
  // The venue's option: FIX's "Market (Exchange) option".
  RESTATEMENT_REASON_VENUE_OPTION = 7;
  RESTATEMENT_REASON_OTHER = 8;
}

// A well-formed fact naming nothing the book holds, kept with its reason,
// never dropped (requirement 13); placed by its own entry when a later
// record claims it.
// A mirror of meridian.v1.UnplacedFact.
message UnplacedFact {
  // `UNP-` and a ULID, minted by the book.
  string unplaced_id = 1;

  // Empty where its venue account code maps to no account: delivered to no
  // plugin, counted on its connectivity plugin's admin view.
  string account_id = 2;

  // The kind of fact, as data: `execution`, `placement`, `charge`,
  // `locate`, and from contract v23 `value-date-roll`.
  string fact_kind = 3;

  UnplacedReason reason = 4;

  RawRecordRef raw_record = 5;

  string venue_account_code = 6;

  oneof fact {
    ReportExecutionRequest execution = 7;
    ReportPlacementRequest placement = 8;
    ReportChargeRequest charge = 9;
    RecordLocateRequest locate = 11;
    // A value-date roll on a code no ems mapped, or meeting no pending line
    // to move (W11.25, contract v23).
    ReportValueDateRollRequest value_date_roll = 14;
  }

  // The entry that placed it, once a later record claimed it.
  JournalRef placed_by = 12;

  // Its latest entry: the one that kept it, or the one that placed it.
  JournalRef last_change = 13;

  // Retired in the domain message, and never reused.
  reserved 10;
  reserved "order";
}

// Why a fact was kept unplaced (requirement 13; W11.13).
// A mirror of meridian.v1.UnplacedReason.
enum UnplacedReason {
  UNPLACED_REASON_UNSPECIFIED = 0;
  // It names a placement the book does not hold.
  UNPLACED_REASON_UNKNOWN_PLACEMENT = 1;
  // Its venue account code maps to no account on the sending connectivity
  // plugin (W11.22).
  UNPLACED_REASON_UNMAPPED_VENUE_ACCOUNT = 2;
  // A value-date roll meeting no pending line on its from date that the
  // sending connectivity plugin's fills or rolls on the code put there
  // (W11.25, contract v23): kept in the account, so operations sees the
  // venue's position and the book's differ.
  UNPLACED_REASON_NOTHING_PENDING = 4;
}

// W11.11. A fact by a connectivity plugin; or, for a person, a manual or
// done-away execution by the `ems` or the `oms`. A fill with no settlement
// date, stated or computed, is refused INVALID_ARGUMENT naming
// `settlement_date` (the refresh's Q39).
// A mirror of meridian.v1.ReportExecutionRequest.
message ReportExecutionRequest {
  string placement_id = 1;

  // A done-away execution's order.
  string order_id = 2;

  // Stamped from venue_account_code on a connectivity plugin's
  // (`venue-account-map`); empty, never refused, where none is mapped, so
  // the fact is kept unplaced. Named on an entry for a person.
  string account_id = 3;

  string venue_account_code = 4;

  string venue_execution_id = 5;

  ExecutionKind kind = 6;

  ExecutionSource source = 7;

  Decimal quantity = 8;

  Money price = 9;

  int64 trade_time_ns = 10;

  string trade_date = 11;

  Finality finality = 12;

  string settlement_date = 13;

  string computed_settlement_date = 14;

  DateBasis settlement_date_basis = 15;

  repeated Fee fees = 16;

  string supersedes = 17;

  string venue_id = 18;

  string uti = 19;

  string prior_uti = 20;

  string upi = 21;

  string given_up_to = 23;

  string trade_chain_reference = 24;

  string settlement_counterparty = 25;

  RawRecordRef raw_record = 26;

  string idempotency_key = 27;

  string effective_date = 28;

  Party counterparty = 29;

  LiquidityIndicator liquidity_indicator = 30;

  string uti_generated_by = 31;

  // Contract v23 (W11.11): a fill on no order and no placement names its
  // instrument, its side and the venue's order ID (FIX 37), each required
  // when no placement is named; and the venue's client order ID (FIX 11)
  // where the venue sent one, which FIX requires back on BN and Q.
  string instrument_id = 32;

  Side side = 33;

  string venue_order_id = 34;

  string venue_client_order_id = 35;

  // Retired in the domain message, and never reused.
  reserved 22;
  reserved "derivative_terms";
}

// W11.10. A fact, each with the raw record it was converted from.
// A mirror of meridian.v1.ReportPlacementRequest.
message ReportPlacementRequest {
  string placement_id = 1;

  PlacementEvent event = 2;

  string venue_order_id = 3;

  int64 routed_at_ns = 4;

  TimePrecision routed_precision = 5;

  RejectionReason rejection_reason = 6;

  AsReported rejection_as_reported = 7;

  UnknownReason unknown_reason = 8;

  AsReported status_as_reported = 9;

  RestatementReason restatement_reason = 10;

  // On a replace or a restatement: the quantity and limit now.
  optional Decimal quantity = 11;

  optional Money limit_price = 12;

  RawRecordRef raw_record = 13;
}

// W11.12.
// A mirror of meridian.v1.ReportChargeRequest.
message ReportChargeRequest {
  string placement_id = 1;

  Fee fee = 2;

  string trade_date = 3;

  string settlement_date = 4;

  RawRecordRef raw_record = 5;
}

// W11.18. By the fund's connectivity plugin; the answer later on the same
// record as its own entry.
// A mirror of meridian.v1.RecordLocateRequest.
message RecordLocateRequest {
  // Stamped from venue_account_code (`venue-account-map`).
  string account_id = 1;

  string venue_account_code = 2;

  string instrument_id = 3;

  optional Decimal quantity_requested = 4;

  LocateAnswer answer = 5;

  // Names the record an answer arriving later is on; empty for a new one.
  string locate_record_id = 6;

  RawRecordRef raw_record = 7;

  string idempotency_key = 8;
}

// The prime's answer.
// A mirror of meridian.v1.LocateAnswer.
message LocateAnswer {
  Decimal quantity_approved = 1;

  optional Decimal rate = 2;

  int64 expires_at_ns = 3;

  string locate_id = 4;
}

// W11.25 (contract v23). By a connectivity plugin whose venue rolls a spot
// position at its daily cut: the account's pending lines in the pair move
// from one value date to the next by one entry, `value-date-rolled`;
// answered with FactReply.
// A mirror of meridian.v1.ReportValueDateRollRequest.
message ReportValueDateRollRequest {
  // Stamped from venue_account_code (`venue-account-map`); empty, never
  // refused, where none is mapped, so the fact is kept unplaced.
  string account_id = 1;

  string venue_account_code = 2;

  // The pair's two cash instruments, as the date read's spot inputs name it.
  repeated string pair = 3;

  // ISO 8601: the value date left, and the date read's answer moved to,
  // with its basis.
  string from_value_date = 4;

  string to_value_date = 5;

  DateBasis value_date_basis = 6;

  int64 rolled_at_ns = 7;

  // The `CHG-` IDs of the roll's financing charges, each reported first.
  repeated string charge_ids = 8;

  RawRecordRef raw_record = 9;

  string idempotency_key = 10;
}

// A trading instruction (W11.15): recorded with its setter's level, a
// deployment admin's on one account in that account's partition, every
// other in the control partition.
// A mirror of meridian.v1.TradingInstruction.
message TradingInstruction {
  TradingInstructionTarget target = 1;

  TradingInstructionValue value = 2;

  SetterLevel setter_level = 3;

  // On a user group's: the persons it covers, by their deployment-local
  // subjects, resolved by core when set and whenever membership changes.
  repeated string covers = 4;

  string reason = 5;

  EntryMeta entry = 6;

  // Its latest entry, which a catch-up reads it by (W11.16).
  JournalRef last_change = 7;
}

// What an instruction names: a deployment admin's an account, All accounts,
// a plugin, a person, a service account or a user group; a plugin admin's
// their plugin, or a person, service account or account within it, naming
// the plugin beside it.
// A mirror of meridian.v1.TradingInstructionTarget.
message TradingInstructionTarget {
  bool all_accounts = 1;

  string account_id = 2;

  // A plugin, by its instance.
  string instance_id = 3;

  // A person, by the deployment-local subject.
  string subject = 4;

  string service_account_id = 5;

  string user_group_id = 6;
}

// Conventions each plugin honours; the book refuses and cancels nothing for
// any (Q1, Q18). The most restrictive in force governs.
// A mirror of meridian.v1.TradingInstructionValue.
enum TradingInstructionValue {
  TRADING_INSTRUCTION_VALUE_UNSPECIFIED = 0;
  TRADING_INSTRUCTION_VALUE_ACTIVE = 1;
  // No new orders.
  TRADING_INSTRUCTION_VALUE_PAUSE = 2;
  // No new orders, and working orders cancelled; a connectivity plugin
  // cancels at its venue at once (W11.9).
  TRADING_INSTRUCTION_VALUE_STOP = 3;
}

// The level an instruction was set at, from the claims; an entry is lifted
// only at the level that set it.
// A mirror of meridian.v1.SetterLevel.
enum SetterLevel {
  SETTER_LEVEL_UNSPECIFIED = 0;
  SETTER_LEVEL_DEPLOYMENT_ADMIN = 1;
  SETTER_LEVEL_PLUGIN_ADMIN = 2;
}

// A locate the fund requested of its prime, the prime's answer on it
// (W11.18; requirement 50a). Each change its own entry; the street never
// holds one.
// A mirror of meridian.v1.Locate.
message Locate {
  // `LOC-` and a ULID, minted by the book.
  string locate_record_id = 1;

  string account_id = 2;

  string instrument_id = 3;

  Decimal quantity_requested = 4;

  // Unset until the prime answers.
  LocateAnswer answer = 5;

  // The prime's locate ID, from its answer, which a short order names.
  string locate_id = 6;

  // Derived from its uses.
  Decimal remaining = 7;

  repeated LocateUse uses = 8;

  RawRecordRef raw_record = 9;

  JournalRef last_change = 10;
}

// One use of a locate, its own entry (W11.19): when a locate is used up is
// `compliance`'s or the `oms`'s logic (principle 3).
// A mirror of meridian.v1.LocateUse.
message LocateUse {
  LocateUseKind kind = 1;

  Decimal quantity = 2;

  string order_id = 3;
}

// A mirror of meridian.v1.LocateUseKind.
enum LocateUseKind {
  LOCATE_USE_KIND_UNSPECIFIED = 0;
  // Reserved against the locate for an order (at release, recommended).
  LOCATE_USE_KIND_RESERVE = 1;
  // Given back: a cancel, or the day's end.
  LOCATE_USE_KIND_GIVE_BACK = 2;
  // Consumed by fills.
  LOCATE_USE_KIND_CONSUME = 3;
}

// A venue's offering per venue account code (W11.20), converted at the edge
// from the venue's own definitions: not a capability, and nothing declared
// about the role. What is not listed is rejected unsupported if sent.
// A mirror of meridian.v1.VenueCatalogue.
message VenueCatalogue {
  // The connectivity plugin it came from: the stamped publisher's.
  string connectivity_instance_id = 1;

  string venue_account_code = 2;

  repeated VenueOrderType order_types = 3;

  repeated VenueStrategy strategies = 4;

  repeated VenueEligibility eligibility = 5;

  // Contract v23 (W11.20, W11.23, W11.24): what the connectivity plugin
  // sends its venue when the `ems` accepts a venue-originated fill or
  // answers it DK. Unspecified, as a v22 catalogue is, reads as none.
  ExecutionAcknowledgement execution_acknowledgement = 6;
}

// An order type the venue offers, with the times in force it takes.
// A mirror of meridian.v1.VenueOrderType.
message VenueOrderType {
  OrderType order_type = 1;

  repeated TimeInForce times_in_force = 2;

  int64 stated_at_ns = 3;
}

// A broker's strategy (the order-path plan's refresh, Q31, as refined and
// ruled 2026-10-12): the strategy and its parameters on the model of FIXatdl,
// the FIX Trading Community's standard for describing algorithmic strategies,
// or mapping one to one onto it, so a broker's published definitions are
// imported at the edge rather than keyed again.
// A mirror of meridian.v1.VenueStrategy.
message VenueStrategy {
  // Which of the contract's kinds it is the broker's, where it is one.
  StrategyKind kind = 1;

  // The broker's name for it.
  string name = 2;

  int64 stated_at_ns = 3;

  // Its parameters, as FIXatdl's Parameter elements describe them.
  repeated StrategyParameter parameters = 4;
}

// One parameter of a broker's strategy, on FIXatdl's Parameter: its name,
// type, whether required (use="required"), its range (minValue, maxValue),
// its allowed values (EnumPair) and its default (initValue). FIXatdl's
// fixTag and the strategy's wireValue stay at the edge: an `ems` never
// meets a FIX tag (W11.20).
// A mirror of meridian.v1.StrategyParameter.
message StrategyParameter {
  string name = 1;

  StrategyParameterType type = 2;

  bool required = 3;

  // In the type's text form; empty where unbounded.
  string min_value = 4;

  string max_value = 5;

  // Empty where any value of the type is allowed.
  repeated string allowed_values = 6;

  string default_value = 7;
}

// FIXatdl's parameter types (Int_t, Float_t, Qty_t, Price_t, PriceOffset_t,
// Amt_t, Percentage_t, Boolean_t, Char_t, String_t, UTCTimestamp_t,
// LocalMktDate_t), in the contract's spelling.
// A mirror of meridian.v1.StrategyParameterType.
enum StrategyParameterType {
  STRATEGY_PARAMETER_TYPE_UNSPECIFIED = 0;
  STRATEGY_PARAMETER_TYPE_INT = 1;
  STRATEGY_PARAMETER_TYPE_FLOAT = 2;
  STRATEGY_PARAMETER_TYPE_QTY = 3;
  STRATEGY_PARAMETER_TYPE_PRICE = 4;
  STRATEGY_PARAMETER_TYPE_PRICE_OFFSET = 5;
  STRATEGY_PARAMETER_TYPE_AMOUNT = 6;
  STRATEGY_PARAMETER_TYPE_PERCENTAGE = 7;
  STRATEGY_PARAMETER_TYPE_BOOLEAN = 8;
  STRATEGY_PARAMETER_TYPE_CHAR = 9;
  STRATEGY_PARAMETER_TYPE_STRING = 10;
  STRATEGY_PARAMETER_TYPE_UTC_TIMESTAMP = 11;
  STRATEGY_PARAMETER_TYPE_LOCAL_MARKET_DATE = 12;
}

// The venue's eligibility for one instrument.
// A mirror of meridian.v1.VenueEligibility.
message VenueEligibility {
  string instrument_id = 1;

  bool fractionable = 2;

  bool shortable = 3;

  int64 stated_at_ns = 4;

  BorrowStatus borrow_status = 5;

  // The options level the venue states for the account; 0 where none.
  uint32 options_level = 6;
}

// A venue's borrow status for an instrument (W11.18's easy- and
// hard-to-borrow).
// A mirror of meridian.v1.BorrowStatus.
enum BorrowStatus {
  BORROW_STATUS_UNSPECIFIED = 0;
  BORROW_STATUS_EASY_TO_BORROW = 1;
  BORROW_STATUS_HARD_TO_BORROW = 2;
}

// The acknowledgement a venue takes of an execution it originated (W11.20;
// contract v23). Never a record of one sent: FIX answers BN with nothing.
// A mirror of meridian.v1.ExecutionAcknowledgement.
enum ExecutionAcknowledgement {
  // Not said: read as EXECUTION_ACKNOWLEDGEMENT_NONE, the venue not told.
  EXECUTION_ACKNOWLEDGEMENT_UNSPECIFIED = 0;
  // The venue takes neither message: nothing is sent at an accept or a DK.
  EXECUTION_ACKNOWLEDGEMENT_NONE = 1;
  // FIX's ExecutionAcknowledgement (35=BN): ExecAckStatus (1036) Accepted
  // at an accept, Don't know / Rejected with DKReason (127) at a DK.
  EXECUTION_ACKNOWLEDGEMENT_BN = 2;
  // FIX's DontKnowTrade (35=Q) at a DK, and nothing at an accept.
  EXECUTION_ACKNOWLEDGEMENT_DONT_KNOW_TRADE = 3;
}

// One account's code at one connectivity plugin: a code once per plugin.
// A mirror of meridian.v1.VenueAccountMapping.
message VenueAccountMapping {
  string connectivity_instance_id = 1;

  string venue_account_code = 2;

  // An account the deployment admin granted the `ems`'s instance (W6.30).
  string account_id = 3;
}

// What the accept adds to the order the fills make (W11.23): the rest is
// the fills'.
// A mirror of meridian.v1.NewOrderFromExecutions.
message NewOrderFromExecutions {
  string sleeve = 1;

  string note = 2;
}

// One account's part of a booking (W11.27).
// A mirror of meridian.v1.Allocation.
message Allocation {
  // `ALC-` and a ULID, minted by the book even for one account, never
  // reused (FIX IndividualAllocID, 467); empty on a command.
  string allocation_id = 1;

  // An account the allocation instruction names, or one marked an error
  // account (W9.13).
  string account_id = 2;

  // The instruction line's sleeve, the order's own the default; empty for
  // the account's unsleeved part.
  string sleeve = 3;

  Decimal quantity = 4;

  // The price the account's confirmation states.
  Money average_price = 5;

  // Quantity times average price, as the `oms` rounds it; the residual on a
  // named allocation.
  Money gross_amount = 6;

  // Each kind summing exactly to the executions' fees of that kind.
  repeated Fee fees = 7;

  // Derived from gross and fees, not checked by the book.
  Money net_amount = 8;

  // The date `operations` reconciles the allocation by, superseding the
  // fill's.
  string intended_settlement_date = 9;

  // Priced at the average, as the SEC's average-price notation marks a
  // confirmation.
  bool average_priced = 10;

  // The receiving account's own lots to relieve; empty, by the method.
  repeated string relieve_lot_ids = 11;

  // A person's words, required on an error-account allocation
  // (REFUSAL_REASON_REASON_REQUIRED).
  string reason = 12;

  // Unspecified unless the allocation is to an error account.
  ErrorCause error_cause = 13;

  // Required with ERROR_CAUSE_OTHER (INVALID_ARGUMENT naming it), as FIX's
  // Text (58).
  string error_text = 14;

  // Each prime's answer to a give-up of the allocation, in the order
  // recorded (W11.32).
  repeated GiveUpRecord give_up_answers = 15;
}

// Why an allocation is to an error account (W11.27; the order-path plan's
// v24 item 10). FIX has no standard list.
// A mirror of meridian.v1.ErrorCause.
enum ErrorCause {
  // Not an error-account allocation.
  ERROR_CAUSE_UNSPECIFIED = 0;
  // The venue filled more than ordered; the excess booked to the error
  // account.
  ERROR_CAUSE_OVERFILL = 1;
  ERROR_CAUSE_CLIENT_RENEGED = 2;
  // A venue-originated fill accepted to the wrong order (W11.23).
  ERROR_CAUSE_WRONG_ACCEPT = 3;
  // The firm's own booking error.
  ERROR_CAUSE_BOOKING_ERROR = 4;
  // Another cause, which error_text says.
  ERROR_CAUSE_OTHER = 5;
}

// A booking of an order's executions to their accounts (W11.27 to W11.30).
// A mirror of meridian.v1.Booking.
message Booking {
  // `BKG-` and a ULID, minted by the book, never reused (decisions/035,
  // point 7); the reference the street echoes back.
  string booking_id = 1;

  // The order's `ORD-` ID; a child's executions are booked as its parent's.
  string order_id = 2;

  // The order's account, whose partition the booking is in; the allocation
  // account for a block.
  string account_id = 3;

  // An explicit list on one order, sharing instrument, side, trade date and
  // settlement date, as FIX's AllocationInstruction (J) requires of NoExecs.
  repeated string execution_ids = 4;

  // One per account, summing exactly to the executions booked in quantity,
  // gross and each fee kind.
  repeated Allocation allocations = 5;

  // Derived from its journal, never stored.
  BookingState state = 6;

  // The book's words for what moved executed away from allocated, as FIX
  // keeps a rejection's reason in AllocRejCode (88); empty unless held.
  string held_reason = 7;

  // Its latest entry, which a catch-up reads it by (W4.3).
  JournalRef last_change = 8;
}

// A booking's state (W11.30), derived from its journal, never stored.
// A mirror of meridian.v1.BookingState.
enum BookingState {
  BOOKING_STATE_UNSPECIFIED = 0;
  // Booked, its allocations tying out, not yet handed off or closed.
  BOOKING_STATE_BOOKED = 1;
  // Executed no longer equals allocated -- a bust, a correction, a late
  // fill or a later fee since booking -- or a hand-off's check failed; its
  // reason in held_reason, and a held-booking alert raised.
  BOOKING_STATE_HELD = 2;
  // Handed off to `operations`, which owns each allocation's post-trade
  // life.
  BOOKING_STATE_HANDED_OFF = 3;
  // A client's booking the firm does not settle, closed, its error-account
  // allocations handed off.
  BOOKING_STATE_CLOSED = 4;
  // Cancelled by the `oms` before the hand-off, so its executions may be
  // booked again.
  BOOKING_STATE_CANCELLED = 5;
}

// A booking's correction (W11.29), as FIX's AllocTransType (71).
// A mirror of meridian.v1.BookingCorrectionKind.
enum BookingCorrectionKind {
  BOOKING_CORRECTION_KIND_UNSPECIFIED = 0;
  // The `oms`'s, before the hand-off or closing.
  BOOKING_CORRECTION_KIND_CANCEL = 1;
  // `operations`', after it, with the full new allocation set: a new
  // version, the state kept.
  BOOKING_CORRECTION_KIND_REPLACE = 2;
}

// A cross between two sleeves of one account (W11.33), its tax and
// performance layers; no execution is minted for it.
// A mirror of meridian.v1.SleeveCross.
message SleeveCross {
  // `SXC-` and a ULID, minted by the book, never reused.
  string sleeve_cross_id = 1;

  // One account; a cross between accounts is an internal cross, a real
  // trade.
  string account_id = 2;

  string instrument_id = 3;

  // Empty for the account's unsleeved part.
  string giving_sleeve = 4;

  string receiving_sleeve = 5;

  Decimal quantity = 6;

  // The plugin's choice (mid, last or close): each moved lot's performance
  // cost, never its tax basis.
  Money cross_price = 7;

  // Which price and when, the plugin's words.
  string price_source = 8;

  // Each order's filled quantity counts the cross.
  repeated string order_ids = 9;

  string reason = 10;
}

// What an alert is about (W11.34); v26 adds rule results to the same record.
// A mirror of meridian.v1.AlertKind.
enum AlertKind {
  ALERT_KIND_UNSPECIFIED = 0;
  // An allocation to an error account, raised by the book on each.
  ALERT_KIND_ERROR_ACCOUNT_BOOKING = 1;
  // A booking held, raised by the book and cleared by it at the hand-off
  // or closing.
  ALERT_KIND_BOOKING_HELD = 2;
  // `compliance`'s own, through RaiseAlert.
  ALERT_KIND_COMPLIANCE = 3;
}

// What an alert is about: a booking and its allocation, or for
// `compliance`'s own an order or a position.
// A mirror of meridian.v1.AlertSubject.
message AlertSubject {
  string order_id = 1;

  string booking_id = 2;

  string allocation_id = 3;

  // An instrument and a side in the account, as a break names one (W9.4).
  PositionKey position = 4;
}

// A post-trade alert in an account's partition (W11.34), raised,
// acknowledged or cleared, never deleted; landed in the compliance spec's
// shape.
// A mirror of meridian.v1.Alert.
message Alert {
  // `ALR-` and a ULID, minted by the book, never reused.
  string alert_id = 1;

  string account_id = 2;

  AlertKind kind = 3;

  AlertState state = 4;

  // The book's words or `compliance`'s.
  string reason = 5;

  // What it is about.
  AlertSubject subject = 6;

  // A held booking's: the moment the `operations` plugin's
  // affirmation_deadline falls on the trade date, in the deployment's time
  // zone; zero otherwise.
  int64 due_by = 7;

  // Its latest entry, which a catch-up reads it by (W4.3).
  JournalRef last_change = 8;
}

// An alert's state (W11.34); nothing is deleted.
// A mirror of meridian.v1.AlertState.
enum AlertState {
  ALERT_STATE_UNSPECIFIED = 0;
  // Raised, by the book or by `compliance`.
  ALERT_STATE_RAISED = 1;
  // Acknowledged by `compliance` for a person, with a reason; never
  // clearing it.
  ALERT_STATE_ACKNOWLEDGED = 2;
  // Cleared by the book: a held booking handed off or closed.
  ALERT_STATE_CLEARED = 3;
}

// The venue master's record of one venue (W1.16). The platform mints its ID;
// a deployment keeps what it pulled (W3.5) and answers it (W3.14).
// A mirror of meridian.v1.VenueRecord.
message VenueRecord {
  // The venue's ID for life, "VEN-...", minted by the platform.
  string venue_id = 1;

  string name = 2;

  // ISO 3166-1 alpha-2: where the venue operates.
  string country_code = 3;

  VenueKind kind = 4;

  // Its identifiers: an ISO 10383 MIC under the scheme `iso10383`, operating
  // or segment, where it has one; a vendor's code as a `symbol` with its
  // source. In force from `valid_from_ns`. An amend replaces them.
  repeated Identifier identifiers = 5;

  // A segment's operating venue, the venue master's ID; empty for a venue
  // that is its own operating venue.
  string operating_venue_id = 6;

  // An IANA time zone: the venue's local time, which its sessions and a
  // business date at it are in.
  string time_zone = 7;

  // Monotonic, assigned by the platform, starting at 1.
  int64 version = 8;

  // When this version became true.
  int64 valid_from_ns = 9;

  // When the platform recorded it. Stamped by the platform, never accepted
  // from a caller.
  int64 record_time_ns = 10;

  // Active, or decommissioned: an expired MIC is a decommissioned venue,
  // which still resolves for a date it was in force. The security master's
  // lifecycle; a venue is never in its define state.
  InstrumentLifecycleState lifecycle_state = 11;
}

// What kind of venue it is. A closed list, grown by revision.
// A mirror of meridian.v1.VenueKind.
enum VenueKind {
  VENUE_KIND_UNSPECIFIED = 0;
  // A regulated exchange.
  VENUE_KIND_EXCHANGE = 1;
  // An alternative trading system, or a multilateral trading facility.
  VENUE_KIND_ALTERNATIVE_TRADING_SYSTEM = 2;
  // An exchange of crypto assets.
  VENUE_KIND_CRYPTO_EXCHANGE = 3;
  // A network of dealers quoting on request, over the counter or by
  // indication: RFQ, OTC and, for now, IOI networks.
  VENUE_KIND_DEALER_NETWORK = 4;
  // A facility trades are reported to, not traded on: a trade reporting
  // facility, an alternative display facility, an approved publication
  // arrangement.
  VENUE_KIND_REPORTING_FACILITY = 5;
}

// One listed day, naming the source it came from: never listed without one.
// A mirror of meridian.v1.CalendarDay.
message CalendarDay {
  // ISO 8601, a plain date.
  string date = 1;

  CalendarDayKind kind = 2;

  // The holiday's name as the source gives it.
  string name = 3;

  // A source_id among the version's sources.
  string source = 4;
}

// What a listed day is.
// A mirror of meridian.v1.CalendarDayKind.
enum CalendarDayKind {
  CALENDAR_DAY_KIND_UNSPECIFIED = 0;
  // A weekday that is not a business day: a holiday, an ad hoc closure.
  CALENDAR_DAY_KIND_CLOSED = 1;
  // A weekend day that is nevertheless a business day.
  CALENDAR_DAY_KIND_OPEN = 2;
}

// A calendar's weekend, dated, so a change of weekend takes effect on its
// day.
// A mirror of meridian.v1.CalendarWeekend.
message CalendarWeekend {
  // A set: each weekday once.
  repeated Weekday weekdays = 1;

  // ISO 8601.
  string valid_from_date = 2;
}

// A mirror of meridian.v1.Weekday.
enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_MONDAY = 1;
  WEEKDAY_TUESDAY = 2;
  WEEKDAY_WEDNESDAY = 3;
  WEEKDAY_THURSDAY = 4;
  WEEKDAY_FRIDAY = 5;
  WEEKDAY_SATURDAY = 6;
  WEEKDAY_SUNDAY = 7;
}

// The first and last dates a calendar vouches for (requirement 4): outside
// them a date's status is not known, never a business day by default.
// A mirror of meridian.v1.CalendarCoverage.
message CalendarCoverage {
  // ISO 8601, inclusive.
  string from_date = 1;

  string to_date = 2;
}

// A source a calendar or a rule version cites, with the moment the platform
// read it (requirement 3).
// A mirror of meridian.v1.CalendarSource.
message CalendarSource {
  // Unique within the version, which its days name.
  string source_id = 1;

  string name = 2;

  // Where it is read: a public primary source's address.
  string address = 3;

  int64 read_at_ns = 4;
}

// W3.20: an instrument's settlement date by its market's rule.
// A mirror of meridian.v1.SettlementDateInputs.
message SettlementDateInputs {
  string instrument_id = 1;

  string trade_date = 2;
}

// W3.20: a pair's spot date, from a trade date or from an execution's moment
// through the pair's cut.
// A mirror of meridian.v1.SpotDateInputs.
message SpotDateInputs {
  repeated string pair = 1;

  string trade_date = 2;

  // In place of trade_date: the moment, its trade date taken through the
  // cut.
  int64 at_ns = 3;
}

// W3.20: a tenor date from a trade date.
// A mirror of meridian.v1.TenorDateInputs.
message TenorDateInputs {
  repeated string pair = 1;

  Tenor tenor = 2;

  string trade_date = 3;
}

// A mirror of meridian.v1.Tenor.
message Tenor {
  // Of the unit; 1 for the short dates.
  int32 count = 1;

  TenorUnit unit = 2;
}

// A mirror of meridian.v1.TenorUnit.
enum TenorUnit {
  TENOR_UNIT_UNSPECIFIED = 0;
  TENOR_UNIT_DAY = 1;
  TENOR_UNIT_WEEK = 2;
  TENOR_UNIT_MONTH = 3;
  TENOR_UNIT_YEAR = 4;
  // The short dates, counted in single business days from the trade date,
  // the next day and spot.
  TENOR_UNIT_OVERNIGHT = 5;
  TENOR_UNIT_TOM_NEXT = 6;
  TENOR_UNIT_SPOT_NEXT = 7;
}

// W3.20: a date rolled by a convention on a set of calendars.
// A mirror of meridian.v1.RollInputs.
message RollInputs {
  string date = 1;

  BusinessDayConvention convention = 2;

  // By their `CAL-` IDs; a day is good only if good in every one.
  repeated string calendars = 3;
}

// How a date rolls on its calendars.
// A mirror of meridian.v1.BusinessDayConvention.
enum BusinessDayConvention {
  BUSINESS_DAY_CONVENTION_UNSPECIFIED = 0;
  BUSINESS_DAY_CONVENTION_FOLLOWING = 1;
  BUSINESS_DAY_CONVENTION_MODIFIED_FOLLOWING = 2;
  BUSINESS_DAY_CONVENTION_PRECEDING = 3;
  BUSINESS_DAY_CONVENTION_NONE = 4;
}

// W3.20: whether a date is a business day on a set of calendars.
// A mirror of meridian.v1.BusinessDayInputs.
message BusinessDayInputs {
  string date = 1;

  repeated string calendars = 2;
}

// Why a date was or was not computed (requirement 9).
// A mirror of meridian.v1.DateOutcome.
enum DateOutcome {
  DATE_OUTCOME_UNSPECIFIED = 0;
  DATE_OUTCOME_COMPUTED = 1;
  // Transient: reported missing, the conductor pulls it, the asker retries.
  DATE_OUTCOME_CALENDAR_NOT_HELD = 2;
  // Never a business day by default.
  DATE_OUTCOME_OUTSIDE_COVERAGE = 3;
  DATE_OUTCOME_RULE_NOT_HELD = 4;
}

// A deployment's record was replaced by another (W3.8): from contract v10, a
// record a person merged into the one that stays (W3.13); before it, a
// placeholder by its INS- ID. Stores keyed by instrument move what they hold
// under it onto the one that stays (W3.9, W9.9); records of what was
// reported keep it.
//
// From contract v24 also a provisional record resolved and a platform merge,
// each with its cause, heard by every role (W3.8) and caught up by
// ListReplacements (W3.22).
// A mirror of meridian.v1.InstrumentReplacedEvent.
message InstrumentReplacedEvent {
  // The record replaced.
  string replaced_instrument_id = 1;

  // What replaces it.
  InstrumentRecord instrument = 2;

  int64 replaced_at_ns = 3;

  // Contract v24 (W3.8): why it was replaced; unspecified only on a
  // replacement recorded before v24 and not yet backfilled.
  ReplacementCause cause = 4;

  // Contract v24 (W3.22): monotonic per deployment; ListReplacements reads
  // after it. Zero only on a replacement recorded before v24.
  int64 sequence = 5;
}

// Why a record was replaced (W3.8, contract v24).
// A mirror of meridian.v1.ReplacementCause.
enum ReplacementCause {
  // A replacement before v24 whose facts are missing, recorded as a gap.
  REPLACEMENT_CAUSE_UNSPECIFIED = 0;
  // A person merged the record into the one that stays (W3.13).
  REPLACEMENT_CAUSE_MERGED = 1;
  // A provisional record resolved to the platform's INS- record.
  REPLACEMENT_CAUSE_RESOLVED = 2;
  // The platform merged two INS- records, followed from the replacement
  // feed (W3.27).
  REPLACEMENT_CAUSE_PLATFORM_MERGED = 3;
}

// A value at a template field's path, with its provenance (W3.4, W3.23).
// A mirror of meridian.v1.TemplateFieldValue.
message TemplateFieldValue {
  // The field's path in the template; one the template lacks is refused
  // naming it.
  string path = 1;

  // As the template's field type writes it.
  string value = 2;

  // The source it was reconciled from; unset, the plugin's own source.
  Provenance provenance = 3;
}

// A security template (W1.24, W3.24; the intent's "security template"): the
// platform authors, versions and publishes it, and a deployment's store
// holds every version and never changes one.
// A mirror of meridian.v1.SecurityTemplate.
message SecurityTemplate {
  // `TPL-`, the platform's, never a deployment's.
  string template_id = 1;

  // Published and immutable; a change is a new version.
  string template_version = 2;

  // The platform's words for it.
  string name = 3;

  AssetClass asset_class = 4;

  // Unspecified for a class's base template.
  InstrumentType instrument_type = 5;

  // True for the one template per asset class carrying identifiers, a
  // description and a currency; the platform mints no INS- record under it.
  bool base = 6;

  // Its calculation package: the slot defined and empty until the template
  // calculations (row 6i').
  string calculation = 7;

  // Each by its path, its type and whether it is required.
  repeated TemplateField fields = 8;

  // The identifier schemes it matches on, each by its scheme's spelling,
  // share_class_figi first.
  repeated string match_rule = 9;
}

// One field of a template (W3.24).
// A mirror of meridian.v1.TemplateField.
message TemplateField {
  // As an offer (TemplateFieldValue.path) and a missing field name it.
  string path = 1;

  // One of the contract's types, as a dictionary entry's type is written.
  string type = 2;

  // A record without it is incomplete, its missing fields listed (W3.7).
  bool required = 3;
}

// A price of one kind for one subject. An FX rate is the price of one
// currency's cash instrument in another (spec/the-lake, Q3); the lake never
// inverts or crosses a rate.
// A mirror of meridian.v1.Price.
message Price {
  ObservationMeta meta = 1;

  PriceKind kind = 2;

  // The price of one unit of the subject, in the asset it was quoted in.
  Money price = 3;

  PriceBasis basis = 4;
}

// The envelope every row of every data type carries, as its first field
// (spec/the-lake, requirement 4).
// A mirror of meridian.v1.ObservationMeta.
message ObservationMeta {
  // The data plugin's identity for this observation, made from its raw record, so
  // the same observation recorded again changes nothing and a changed value
  // under it is a restatement. 1 to 128 characters.
  string row_key = 1;

  // The entities the row is about, each resolved through W3.1: 1 to 8.
  repeated SubjectRef subjects = 2;

  // Where the row came from.
  Source source = 3;

  // When the value became true, the event happened, or the period began.
  int64 valid_from_ns = 4;

  // The period's end, exclusive; 0 for an instant, or a value in force until
  // the next.
  int64 valid_until_ns = 5;

  // The business date a daily value is for, an ISO 8601 date (2026-10-09),
  // in the calendar its dataset declares (DatasetDeclaration.day_time_zone);
  // empty for a value that is not daily. A plain date, never a moment.
  string business_date = 6;

  // The source's own timestamps, at most one of each kind: 0 to 6.
  repeated SourceTime source_times = 7;

  // When the data plugin's sidecar published it: the envelope's publication time,
  // which the sidecar stamps. A plugin's value is never read.
  int64 sent_at_ns = 8;

  // When the lake committed this version: the time a point-in-time read
  // cuts at. Decided by the lake.
  int64 recorded_at_ns = 9;

  // 1 for the first record of the row key, one more for each restatement.
  // Decided by the lake.
  uint64 version = 10;

  // Its place in its dataset's partition, from 1, with no holes. Decided by
  // the lake.
  uint64 sequence = 11;

  // The sequence of the previous row of the same subject, data type and
  // dataset; 0 for the first. Decided by the lake.
  uint64 previous_sequence = 12;

  // The raw record it was converted from, in the writing plugin's storage.
  RawRecordRef raw = 13;

  // Each vendor value that failed conversion, beside a field left not
  // known: 0 to 16.
  repeated AsReported unconverted = 14;

  // Contract v23 (W10.4): set only when a daily value's business date is a
  // closed day of its dataset's calendar, or outside its coverage -- the
  // date, each calendar with its version, the reason and the holiday's
  // name. Recorded as reported, never refused. Decided by the lake.
  DateCheck closed_day = 15;
}

// One entity a row is about.
// A mirror of meridian.v1.SubjectRef.
message SubjectRef {
  // The deployment's own ID for the entity: an instrument's in the lake's
  // 1a and 1b. 1 to 64 characters.
  string entity_id = 1;
}

// Where a row came from.
// A mirror of meridian.v1.Source.
message Source {
  // The instance that recorded it, stamped by its sidecar.
  string instance = 1;

  // That plugin's version when it recorded it: decided by the lake from the
  // version the deployment launched the instance at, never the plugin's word.
  string plugin_version = 2;

  // A dataset the instance's catalogue declares: the instance, a colon, and
  // the dataset's key (coinbase-1:daily). 1 to 96 characters.
  string dataset = 3;

  // The venue the observation originated on, the venue master's ID; empty
  // when it is not venue-specific, which is the consolidated view. A trade's
  // is the venue it printed on (contract v19): the market centre a
  // consolidated dataset's trade names, a FINRA print's reporting facility.
  string venue_id = 4;
}

// One of the source's own timestamps.
// A mirror of meridian.v1.SourceTime.
message SourceTime {
  SourceTimeKind kind = 1;

  // That clock's reading, in UTC, as the source gave it.
  int64 at_ns = 2;
}

// Which of the source's clocks a timestamp is.
// A mirror of meridian.v1.SourceTimeKind.
enum SourceTimeKind {
  // Refused.
  SOURCE_TIME_KIND_UNSPECIFIED = 0;
  // When it happened at its origin.
  SOURCE_TIME_KIND_EVENT = 1;
  // When a consolidator published it.
  SOURCE_TIME_KIND_CONSOLIDATED = 2;
  // When a reporting facility received it.
  SOURCE_TIME_KIND_REPORTED = 3;
  // When the vendor received it.
  SOURCE_TIME_KIND_VENDOR_RECEIVED = 4;
  // When the source released it: a close, a panel, a model.
  SOURCE_TIME_KIND_PUBLISHED = 5;
}

// Which price.
// A mirror of meridian.v1.PriceKind.
enum PriceKind {
  // Refused.
  PRICE_KIND_UNSPECIFIED = 0;
  // The dataset's declared close for the business date: the official close
  // where the venue has one, otherwise the last price of the day the
  // dataset declares.
  PRICE_KIND_CLOSE = 1;
  // The last eligible trade's price at the valid time.
  PRICE_KIND_LAST = 2;
  // A fund's net asset value per share, for the business date.
  PRICE_KIND_NAV = 3;
  // A contract's settlement price, for the business date.
  PRICE_KIND_SETTLEMENT = 4;
  // The best bid at the valid time, or the business date's closing bid.
  PRICE_KIND_BID = 5;
  // The best ask at the valid time, or the business date's closing ask.
  PRICE_KIND_ASK = 6;
  // The mid at the valid time, or the business date's closing mid.
  PRICE_KIND_MID = 7;
}

// What one unit of a price is.
// A mirror of meridian.v1.PriceBasis.
enum PriceBasis {
  // Refused.
  PRICE_BASIS_UNSPECIFIED = 0;
  // Per unit of the subject.
  PRICE_BASIS_PER_UNIT = 1;
}

// Open, high, low and close over an interval, the envelope's valid time: a
// daily bar names its business date. Empty `source.venue_id` is the
// consolidated view across venues.
// A mirror of meridian.v1.Bar.
message Bar {
  ObservationMeta meta = 1;

  // One asset for all four, and for the vwap, or the bar is refused.
  Money open = 2;

  Money high = 3;

  Money low = 4;

  Money close = 5;

  // Eligible quantity over the interval, in units of the instrument, never
  // negative.
  Decimal volume = 6;

  // Volume-weighted average price over the interval; unset when the source
  // gives none.
  optional Money vwap = 7;

  // Trades counted in the bar; unset when the source gives none.
  optional uint64 trade_count = 8;
}

// One trade as its source reported it. Valid from its event time at its venue,
// `valid_until_ns` 0, and no business date: real-time data is keyed by UTC
// instants. The consolidator's, the reporting facility's and the vendor's
// times are `source_times`. A correction or a withdrawal is a new version
// under the same row key.
// A mirror of meridian.v1.Trade.
message Trade {
  ObservationMeta meta = 1;

  // The trade's price per unit of the subject, naming its cash instrument.
  Money price = 2;

  // The quantity traded, in units of the instrument: more than zero.
  Decimal quantity = 3;

  // What the trade may count for, and its characteristics, in the platform's
  // words: converted from the source's condition codes at the edge, never a
  // vendor's code.
  TradeAttributes attributes = 4;

  // The side that took liquidity; unspecified when the source does not say,
  // never guessed from the price's movement.
  Aggressor aggressor = 5;

  // The source's own sequence number; 0 when it gives none. Not the lake's.
  uint64 source_sequence = 6;

  // True in a version saying the source withdrew the trade.
  bool cancelled = 7;
}

// What a trade may count for (spec/the-lake, "Trade attributes"): written on
// each trade, so no reader needs a table to compute a bar.
// A mirror of meridian.v1.TradeAttributes.
message TradeAttributes {
  // For the consolidated bar across venues.
  Eligibility consolidated = 1;

  // For its own venue's bar.
  Eligibility market_centre = 2;

  // Its characteristics: 0 to 16. None is a regular trade, unless
  // `meta.unconverted` names a code that did not convert.
  repeated TradeCharacteristic characteristics = 3;
}

// Whether a trade may set each statistic of a bar; not whether it did.
// A mirror of meridian.v1.Eligibility.
message Eligibility {
  Eligible high_low = 1;

  Eligible open = 2;

  Eligible close = 3;

  Eligible volume = 4;
}

// Whether a trade may set a statistic.
// A mirror of meridian.v1.Eligible.
enum Eligible {
  // Not known: a code the data plugin could not convert. A reader computing a bar
  // reads it as not eligible, and says so.
  ELIGIBLE_UNSPECIFIED = 0;
  ELIGIBLE_ELIGIBLE = 1;
  ELIGIBLE_NOT_ELIGIBLE = 2;
}

// A trade's characteristics in the platform's words: a closed list grown by
// revision, none a vendor's code.
// A mirror of meridian.v1.TradeCharacteristic.
enum TradeCharacteristic {
  // Refused.
  TRADE_CHARACTERISTIC_UNSPECIFIED = 0;
  // Printed by the venue's opening auction.
  TRADE_CHARACTERISTIC_OPENING_AUCTION = 1;
  // Printed by the venue's closing auction.
  TRADE_CHARACTERISTIC_CLOSING_AUCTION = 2;
  // Printed by another auction: a reopening after a halt, an intraday auction.
  TRADE_CHARACTERISTIC_OTHER_AUCTION = 3;
  // Smaller than the instrument's round lot.
  TRADE_CHARACTERISTIC_ODD_LOT = 4;
  // Outside the venue's regular session.
  TRADE_CHARACTERISTIC_EXTENDED_HOURS = 5;
  // Reported out of its time order.
  TRADE_CHARACTERISTIC_OUT_OF_SEQUENCE = 6;
  // Reported later than its venue's rules require.
  TRADE_CHARACTERISTIC_LATE_REPORT = 7;
  // Priced as an average over several executions.
  TRADE_CHARACTERISTIC_AVERAGE_PRICE = 8;
  // Settling other than on the regular cycle: cash, next day, seller's option.
  TRADE_CHARACTERISTIC_NON_REGULAR_SETTLEMENT = 9;
  // Part of an order sweeping several venues at once.
  TRADE_CHARACTERISTIC_INTERMARKET_SWEEP = 10;
  // Priced from another instrument or a benchmark, not by the market at the
  // time.
  TRADE_CHARACTERISTIC_DERIVATIVELY_PRICED = 11;
  // Priced at a reference price from earlier in the day.
  TRADE_CHARACTERISTIC_PRIOR_REFERENCE_PRICE = 12;
  // Executed contingent on another trade.
  TRADE_CHARACTERISTIC_CONTINGENT = 13;
  // A cross of two orders by one participant.
  TRADE_CHARACTERISTIC_CROSS = 14;
}

// The side that took liquidity.
// A mirror of meridian.v1.Aggressor.
enum Aggressor {
  // Not known.
  AGGRESSOR_UNSPECIFIED = 0;
  // The buyer took the offer.
  AGGRESSOR_BUY = 1;
  // The seller hit the bid.
  AGGRESSOR_SELL = 2;
}

// The best bid and offer, on a venue or consolidated: in force from its valid
// time until the next quote for the same subject, dataset, venue and asset. Keyed by
// UTC instants, with no business date. Book depth is not in slice 1.
// A mirror of meridian.v1.Quote.
message Quote {
  ObservationMeta meta = 1;

  // The best price on each side, naming its cash instrument, one asset for
  // both; unset when that side is empty.
  optional Money bid = 2;

  optional Money ask = 3;

  // The quantity at each price, in units of the instrument, more than zero;
  // unset when the source gives none.
  optional Decimal bid_quantity = 4;

  optional Decimal ask_quantity = 5;

  // The quote's state: 0 to 4. None is firm and trading.
  repeated QuoteCharacteristic characteristics = 6;
}

// A quote's state in the platform's words.
// A mirror of meridian.v1.QuoteCharacteristic.
enum QuoteCharacteristic {
  // Refused.
  QUOTE_CHARACTERISTIC_UNSPECIFIED = 0;
  // Not firm: a price a participant need not trade at.
  QUOTE_CHARACTERISTIC_INDICATIVE = 1;
  // Trading in the subject is halted.
  QUOTE_CHARACTERISTIC_HALTED = 2;
}

// An event contract's outcome, as its venue determined it, at one stage
// (W10.4; the lake plan's "vL1c"). One row key per contract: each change of
// stage is a new version under it. Valid from the determination's time, an
// event SourceTime, with no business date: an outcome is not a daily value.
// A mirror of meridian.v1.Outcome.
message Outcome {
  ObservationMeta meta = 1;

  // What the instrument pays, in the platform's words.
  OutcomeDetermination determination = 2;

  // The venue's stage of the determination.
  OutcomeStage stage = 3;

  // What one contract settles at, in the payout asset: always set.
  Money settlement_value = 4;

  // When the venue paid out; 0 until then.
  int64 settled_at_ns = 5;

  // The venue's own word for the determination, as reported.
  AsReported determination_as_reported = 6;
}

// What an event contract's instrument pays (the lake plan's "vL1c", item 1).
// A mirror of meridian.v1.OutcomeDetermination.
enum OutcomeDetermination {
  // Refused.
  OUTCOME_DETERMINATION_UNSPECIFIED = 0;
  // Its full payout.
  OUTCOME_DETERMINATION_PAYS = 1;
  OUTCOME_DETERMINATION_PAYS_NOTHING = 2;
  // Part of its payout: a scalar result, or a resolution at half.
  OUTCOME_DETERMINATION_PAYS_PART = 3;
}

// The venue's stage of a determination (item 2).
// A mirror of meridian.v1.OutcomeStage.
enum OutcomeStage {
  // Refused.
  OUTCOME_STAGE_UNSPECIFIED = 0;
  // Proposed and open to challenge.
  OUTCOME_STAGE_PROPOSED = 1;
  // Determined; an amended determination is a new version here.
  OUTCOME_STAGE_DETERMINED = 2;
  OUTCOME_STAGE_DISPUTED = 3;
  OUTCOME_STAGE_FINAL = 4;
}

// Which datasets a read is answered from (the intent's Q4): exactly one of
// the deployment's default, named datasets, or every entitled dataset side by
// side. None set is the default.
// A mirror of meridian.v1.SourceChoice.
message SourceChoice {
  // The deployment's priority for the data type and kind, with failover.
  bool default = 1;

  // These datasets, in this order: 0 to 16.
  repeated string named = 2;

  // Every dataset the reader is entitled to, each row naming its own.
  bool side_by_side = 3;
}

// A subject, dataset or field a read could not serve, and why; the rest still
// answer.
// A mirror of meridian.v1.Unanswered.
message Unanswered {
  SubjectRef subject = 1;

  string dataset = 2;

  // The field by its dictionary entry; empty for the whole row.
  string field = 3;

  UnansweredReason reason = 4;
}

// Why a part of a read was not answered.
// A mirror of meridian.v1.UnansweredReason.
enum UnansweredReason {
  // Refused.
  UNANSWERED_REASON_UNSPECIFIED = 0;
  // The reader is not entitled to the dataset, or the field.
  UNANSWERED_REASON_NOT_ENTITLED = 1;
  // No dataset covers the subject.
  UNANSWERED_REASON_NOT_COVERED = 2;
  // The lake asked the dataset's source for it (W10.7); the reader hears the
  // rows once recorded.
  UNANSWERED_REASON_ASKED_SOURCE = 3;
  // The dataset recorded nothing for the subject within its cadence.
  UNANSWERED_REASON_SOURCE_SILENT = 4;
  // The subject is not one the deployment's entities resolve.
  UNANSWERED_REASON_UNRESOLVED = 5;
  // Older than the history the dataset reaches, or the lake keeps.
  UNANSWERED_REASON_BEYOND_HISTORY = 6;
  // The dataset's licence forbids keeping it, and it was served, not kept.
  UNANSWERED_REASON_NOT_KEPT = 7;
}

// What a dataset in an answer is, once per answer rather than on every row
// (spec/the-lake, requirement 6).
// A mirror of meridian.v1.DatasetRef.
message DatasetRef {
  string dataset = 1;

  // The instance that serves it.
  string instance = 2;

  // Who originated the data, and who carried it when an aggregator did, as
  // the catalogue declares them.
  string vendor = 3;

  string aggregator = 4;

  // The dataset's catalogue entry, as its instance declared it: set in a
  // listing of datasets (W10.9) and on an entitlements change (W10.1),
  // unset in a read's answer.
  DatasetDeclaration declaration = 5;

  // For the Data sources page, in a listing of datasets (W10.9; approved
  // 2026-10-10): the rows the lake keeps of the dataset carrying a value as
  // reported beside a field left not known; and the identifiers and venues
  // its instance reported missing (W3.2, W3.15), as the lake heard them. 0
  // in a read's answer and on an entitlements change.
  uint64 unconverted_count = 6;

  uint64 miss_count = 7;

  // Contract v23 (W10.9): the rows the lake keeps of the dataset flagged on
  // a closed day of its calendar, a weekend or a holiday; and those flagged
  // outside its coverage, counted apart. 0 in a read's answer and on an
  // entitlements change.
  uint64 closed_day_count = 8;

  uint64 outside_coverage_count = 9;
}

// One dataset a data plugin serves. Its identity in a deployment is the instance
// and its key (spec/the-lake, Q19).
// A mirror of meridian.v1.DatasetDeclaration.
message DatasetDeclaration {
  // The dataset's name within the plugin: 1 to 40 characters, lowercase
  // letters, digits and underscores, beginning with a letter. The dataset's
  // ID in a deployment is the instance, a colon, and this.
  string key = 1;

  // Who originated the data, and who carries it when an aggregator does:
  // data, not vocabulary. The vendor 1 to 64 characters; the aggregator 0 to
  // 64, empty when reached directly.
  string vendor = 2;

  string aggregator = 3;

  // The lake's data types it serves and the optional fields it fills, each
  // by its dictionary entry: a type by its message (meridian.v1.Price), a
  // field by its entry (meridian.v1.Bar.vwap). 1 to 32.
  repeated string data_types = 4;

  // How its rows can arrive, among which the deployment chooses: 1 to 3,
  // each once.
  repeated ObservationMode modes = 5;

  // How often it updates, in seconds: what says it is silent. 0 for a
  // dataset that updates only when asked.
  uint32 cadence = 6;

  // How far back it reaches, in days; 0 when it states none.
  uint32 history = 7;

  // The terms its vendor's standard terms impose, which the deployment's
  // licence confirms or replaces (spec/the-lake, Q8). Its dataset and who
  // set it are empty here.
  DatasetLicence licence_default = 8;

  // The day a daily value's business date is in (plans/the-lake-prices-the-
  // book, Q5 and Q28): an IANA time zone, and the minute after local midnight
  // the day ends, 0 for midnight. What says which candle or session counts
  // as a business date, and when it is final; never a holiday calendar.
  string day_time_zone = 9;

  uint32 day_end_minute = 10;

  // The venue the dataset is, the venue master's ID; empty for a dataset
  // that is not one venue's, which is the consolidated view. A row naming
  // no venue is the dataset's view.
  string venue_id = 11;

  // The settlement calendar its business dates follow, its `CAL-` ID
  // (W10.1; spec/settlement-calendars-are-core-reference-data, requirement
  // 15; the lake's Q28; contract v22), beside day_time_zone and
  // day_end_minute. In v22 the lake keeps it and applies nothing by it; a
  // daily value dated on a day it says is closed is flagged from v23 (W10.4,
  // ruled 2026-10-12), recorded as reported and never refused. Empty names
  // none, as before.
  string calendar_id = 12;
}

// How a dataset's rows arrive (the lake intent's Q9 and Q10).
// A mirror of meridian.v1.ObservationMode.
enum ObservationMode {
  // Refused.
  OBSERVATION_MODE_UNSPECIFIED = 0;
  // Fetched when a reader's read is wanted (W10.7).
  OBSERVATION_MODE_PULL = 1;
  // Recorded on the source's own timetable, unasked.
  OBSERVATION_MODE_PUSH = 2;
  // Kept current from the source's stream while a standing want stands.
  OBSERVATION_MODE_STREAM = 3;
}

// A dataset's licence: its catalogue's default terms (unset dataset and
// author), or the deployment's licence a deployment admin set, which is what
// is enforced (W10.1, spec/the-lake, Q8). Records what the admin entered;
// it says nothing about whether a deployment meets a vendor's terms.
// A mirror of meridian.v1.DatasetLicence.
message DatasetLicence {
  // The dataset; empty in a catalogue's default.
  string dataset = 1;

  // Whether the lake may keep its rows; false serves them, not kept.
  bool kept = 2;

  // How long the lake keeps a row, in days from when it was recorded; 0
  // keeps it as long as the licence allows, with no limit set. At most
  // 36,500.
  uint32 retention_days = 3;

  // Whether data derived from it may be made, and shown.
  bool derived_use = 4;

  bool display = 5;

  // The fields readable by default, by their dictionary entries; empty for
  // every field. At most 64.
  repeated string default_fields = 6;

  // Whether its terms are one person's (Q16): the Data sources page warns
  // when more than one person holds read on a plugin entitled to it.
  bool personal_use = 7;

  // Who set it and when, the delegation and client a person acted through,
  // and why, as the dashboard stamped and kept them: empty in a catalogue's
  // default.
  string updated_by = 8;

  int64 updated_at_ns = 9;

  string acting_through_delegation = 10;

  string client_name = 11;

  string note = 12;

  // The prepared change it was set from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 13;
}

// A plugin instance's entitlement to a dataset, as the conductor keeps it
// (W10.1). Set by a deployment admin; never sent to the platform.
// A mirror of meridian.v1.DatasetEntitlement.
message DatasetEntitlement {
  string dataset = 1;

  // The plugin instance entitled.
  string instance = 2;

  // Whether it may read the dataset; false withdraws it.
  bool allowed = 3;

  // The fields it may read, by their dictionary entries; empty for every
  // field. At most 64.
  repeated string fields = 4;

  // Who set it and when, the deployment-local subject the dashboard
  // stamped; the delegation and client a person acted through, empty in a
  // browser; and why. Each change is its own record (decisions/031).
  string updated_by = 5;

  int64 updated_at_ns = 6;

  string acting_through_delegation = 7;

  string client_name = 8;

  string note = 9;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 10;
}

// A custodial position that changed, and the statement that changed it.
// A mirror of meridian.v1.CustodialPositionUpdatedEvent.
message CustodialPositionUpdatedEvent {
  CustodialPosition position = 1;

  // The statement that caused this. Lets a reader explain any position by
  // pointing at what produced it.
  string statement_id = 2;

  // The previous quantity, so a subscriber can render a delta without holding
  // its own history.
  Decimal previous_quantity = 4;

  // The change's number in the street's partition, chained per account with
  // the positions changed before it, and who caused it (W2.4, W4.3).
  JournalRef journal = 5;

  ChangeCause cause = 6;

  // Retired in the domain message, and never reused.
  reserved 3;
  reserved "previous_quantity_scaled_1e8";
}

// A mirror of meridian.v1.PositionChangedEvent.
message PositionChangedEvent {
  BookPosition position = 1;

  Decimal previous_trade_date_quantity = 2;

  EntryMeta entry = 3;

  JournalRef journal = 4;

  ChangeCause cause = 5;
}

// A mirror of meridian.v1.BreakChangedEvent.
message BreakChangedEvent {
  // Not `break`, a keyword in the SDKs' languages.
  Break break_record = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// A mirror of meridian.v1.AccountFiguresRecordedEvent.
message AccountFiguresRecordedEvent {
  AccountFigures figures = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// A mirror of meridian.v1.AccountAttributeChangedEvent.
message AccountAttributeChangedEvent {
  AccountAttributes attributes = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// An activity was re-resolved (W2.16): the re-resolution whole, so a
// reconciliation whose break waited on an unresolved code re-runs its
// candidate causes without a second read.
// A mirror of meridian.v1.ActivityReResolvedEvent.
message ActivityReResolvedEvent {
  // The account it is on, as its re-resolution names it.
  string account_id = 1;

  ActivityReResolution re_resolution = 2;

  // Who caused it, and its number: the re-resolution's journal, at the top
  // as every delivered record carries it (W4.3).
  ChangeCause cause = 3;

  JournalRef journal = 4;
}

// A price the lake recorded, on its dataset's subject: one row, with its
// version and sequence. Delivered latest value first per subject, dataset,
// kind, venue and, from contract v19, the price's asset (conflated).
// A mirror of meridian.v1.PricesRecordedEvent.
message PricesRecordedEvent {
  Price price = 1;
}

// A bar the lake recorded, on its dataset's subject. Delivered latest value
// first per subject, dataset, venue and interval start (conflated).
// A mirror of meridian.v1.BarsRecordedEvent.
message BarsRecordedEvent {
  Bar bar = 1;
}

// What the lake asks of the instance serving a dataset. Coalesced: readers'
// identical wants are one.
// A mirror of meridian.v1.ObservationsWantedEvent.
message ObservationsWantedEvent {
  // The want's identifier, which the rows recorded for it name.
  string want_id = 1;

  string dataset = 2;

  // The data type, by its message's full name: meridian.v1.Price,
  // meridian.v1.Bar, and from contract v19 meridian.v1.Trade or
  // meridian.v1.Quote.
  string data_type = 3;

  // 1 to 500.
  repeated SubjectRef subjects = 4;

  // For prices, which kinds; empty for every kind.
  repeated PriceKind kinds = 5;

  // For bars, the bars' length.
  int64 interval_ns = 6;

  // The business date wanted, or the valid-time range; neither for the
  // latest.
  string business_date = 7;

  int64 valid_from_ns = 8;

  int64 valid_until_ns = 9;

  // Keep the subjects current until the want is withdrawn (W10.7): by the
  // vendor's stream where the dataset is streamed, by its schedule otherwise.
  bool standing = 10;
}

// A standing want no reader has asked within the dataset's cadence.
// A mirror of meridian.v1.WantWithdrawnEvent.
message WantWithdrawnEvent {
  string want_id = 1;

  string dataset = 2;
}

// A trade the lake recorded, on its dataset's subject (contract v19). Never
// conflated: every trade is delivered, at most once, and a reader that lost
// some catches up from the lake by the watermark it last saw (ListTrades).
// A mirror of meridian.v1.TradesRecordedEvent.
message TradesRecordedEvent {
  Trade trade = 1;
}

// A quote the lake recorded, on its dataset's subject (contract v19).
// Delivered latest value first per subject, dataset, venue and the quote's
// asset (conflated).
// A mirror of meridian.v1.QuotesRecordedEvent.
message QuotesRecordedEvent {
  Quote quote = 1;
}

// A mirror of meridian.v1.OrderUpdatedEvent.
message OrderUpdatedEvent {
  Order order = 1;

  // What changed, by field.
  repeated string changed = 2;

  EntryMeta entry = 3;

  JournalRef journal = 4;

  ChangeCause cause = 5;
}

// To the `ems`, `oms` and `compliance` within scope, and to the
// connectivity plugin it names, alone of its role (matrix/directed.tsv).
// A mirror of meridian.v1.PlacementUpdatedEvent.
message PlacementUpdatedEvent {
  Placement placement = 1;

  repeated string changed = 2;

  EntryMeta entry = 3;

  JournalRef journal = 4;

  ChangeCause cause = 5;
}

// W9's PositionChanged follows for each position it moved.
// A mirror of meridian.v1.ExecutionRecordedEvent.
message ExecutionRecordedEvent {
  Execution execution = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// A mirror of meridian.v1.UnplacedFactRecordedEvent.
message UnplacedFactRecordedEvent {
  UnplacedFact unplaced = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// To every subscriber, without an account scope.
// A mirror of meridian.v1.TradingInstructionChangedEvent.
message TradingInstructionChangedEvent {
  TradingInstruction instruction = 1;

  JournalRef journal = 2;

  ChangeCause cause = 3;
}

// A mirror of meridian.v1.LocateUpdatedEvent.
message LocateUpdatedEvent {
  Locate locate = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// W11.20. Published by a connectivity plugin, per venue account code its
// `ems` mapped; kept by the conductor, latest per code, each change its own
// record; heard by the `ems` and the `oms`.
// A mirror of meridian.v1.VenueCatalogueEvent.
message VenueCatalogueEvent {
  VenueCatalogue catalogue = 1;

  // Stamped by the sidecar, whatever the plugin sent.
  string publisher_instance_id = 2;
}

// An outcome the lake recorded, on its dataset's subject (contract v23).
// Never conflated: every version is delivered, and a reader that lost some
// catches up from the lake by the watermark it last saw (ListOutcomes).
// A mirror of meridian.v1.OutcomesRecordedEvent.
message OutcomesRecordedEvent {
  Outcome outcome = 1;
}

// W11.30: to `operations`, `oms`, `compliance`, `portfolio` and `reporting`
// within scope, by the account the booking is in.
// A mirror of meridian.v1.BookingUpdatedEvent.
message BookingUpdatedEvent {
  // Its whole new state, safe to apply twice.
  Booking booking = 1;

  EntryMeta entry = 2;

  JournalRef journal = 3;

  ChangeCause cause = 4;
}

// W11.35: to `compliance`, `reporting`, `oms` and `operations` within scope.
// A mirror of meridian.v1.AlertChangedEvent.
message AlertChangedEvent {
  Alert alert = 1;

  JournalRef journal = 2;

  ChangeCause cause = 3;
}
