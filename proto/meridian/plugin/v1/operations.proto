// Generated by meridian-design's tools/generate_typed_operations.py from the matrix and
// the domain protos (spec/typed-sidecar-operations). Do not edit.
//
// The operations a plugin performs: one per bus row of the matrix a plugin
// role publishes, named for the row. A plugin calls these and nothing on the
// bus; the sidecar builds each domain message, stamps it, checks the grant
// and sends it (decisions/008, decisions/013).

syntax = "proto3";

package meridian.plugin.v1;

import "meridian/v1/sidecar.proto";

service PluginOperations {
  // W2.8: platform.custody.{instance}.event.external-accounts (event).
  rpc ReportExternalAccounts(ReportExternalAccountsParams) returns (Published);
  // W2.1: platform.custody.{instance}.event.sync-status (event).
  rpc ReportSyncStatus(ReportSyncStatusParams) returns (Published);
  // W2.2: platform.street.command.record-statement (command).
  rpc RecordHoldingsStatement(RecordHoldingsStatementParams) returns (RecordHoldingsStatementResult);
  // W2.3: platform.street.command.record-holding (command).
  rpc RecordHolding(RecordHoldingParams) returns (RecordHoldingResult);
  // W3.1: platform.reference.query.resolve-identifier (query).
  rpc ResolveIdentifier(ResolveIdentifierParams) returns (ResolveIdentifierResult);
  // W3.2: platform.reference.event.instrument-missing (event).
  rpc ReportMissingInstrument(ReportMissingInstrumentParams) returns (Published);
  // W6.4: platform.config.command.link-external-account (command).
  rpc LinkExternalAccount(LinkExternalAccountParams) returns (LinkExternalAccountResult);
  // W6.4: platform.config.query.accounts (query).
  rpc ReadAccountsForLinking(ReadAccountsForLinkingParams) returns (ReadAccountsForLinkingResult);
}

// What an event answers: the message's identifier on the bus. A refusal is
// the call's error status, naming what was refused and why.
message Published {
  string message_id = 1;
}

// Every external account a connection reaches, as the connector sees it now.
//
// Published before anything is recorded against any of them, so linking one
// (W6.4) is a choice among the accounts on offer rather than a guess made
// after a statement was refused for want of a link: one SnapTrade connection
// can reach several brokerage accounts, and an administrator links the ones
// they mean. The whole list each time, so an account missing from it is one
// the connection no longer reaches.
// The params of ReportExternalAccounts: meridian.v1.ExternalAccountsEvent, less what the sidecar sets.
message ReportExternalAccountsParams {
  repeated ExternalAccount accounts = 1;
}

// How fresh a connected account's data is, as reported by the rail.
//
// And why, when it is not current. Published so an operator can tell stale
// data from absent data, which look identical on a holdings screen and mean
// completely different things. And "unhealthy" alone cannot say whose fix it
// is: a connection that needs a person to sign in again, one somebody
// disabled, and one that is a day late by design look the same as a flag and
// ask for three different things.
// The params of ReportSyncStatus: meridian.v1.SyncStatusEvent, less what the sidecar sets.
message ReportSyncStatusParams {
  string source = 1;

  // When the rail last successfully synced this account from the institution.
  // Not when the data is as of: a venue a day late by design syncs today what
  // was true yesterday, which the two fields below say.
  int64 last_synced_at_ns = 3;

  // Whether the rail currently considers the connection healthy. A false here
  // with a recent last_synced_at_ns means the data is good but the connection
  // has since broken. `state` says why.
  bool connection_healthy = 4;

  // Rail-supplied text, for whatever `state` does not say. Diagnostic only;
  // nothing branches on it.
  string status_detail = 5;

  int64 observed_at_ns = 6;

  // The account as the rail knows it, which the sidecar translates.
  string external_account_id = 7;

  // Whether the data is current, and if not, why: which is also whose fix it
  // is and what the dashboard tells a deployment admin to do.
  SyncState state = 8;

  // When the holdings the rail serves are as of, and when the history
  // (transactions) is. Separately, because venues keep them apart and a
  // connection can have one current and the other not: SnapTrade reports
  // holdings to the minute and transactions by the day. Zero where the rail
  // does not say.
  int64 holdings_as_of_ns = 9;

  int64 history_as_of_ns = 10;

  // Set by the sidecar, never by a plugin (stamped.tsv).
  reserved 2;
  reserved "account_id";
}

// Open one statement: the connector's snapshot of one account, at one moment.
//
// A statement is the connector's, not the venue's: none of the eight venues
// surveyed has a statement of its own, and every one gives a live snapshot.
// So the connector reads an account, and what it read is a statement.
//
// Two dates, and they are not the same thing. `as_of_date` is the date the
// positions reflect. `read_at_ns` is when the connector fetched them. A
// statement read this morning may be as of yesterday's close, and conflating
// the two is how stale data passes for current.
// The params of RecordHoldingsStatement: meridian.v1.RecordHoldingsStatementRequest, less what the sidecar sets.
message RecordHoldingsStatementParams {
  // The rail namespace, e.g. "snaptrade".
  string source = 1;

  // The connector's identifier for this snapshot, made from the account it
  // read and the time it read it, so the same read sent twice has the same
  // one. Used to recognise a redelivery of the same statement.
  string external_statement_id = 2;

  // ISO 8601 date the positions are as of.
  string as_of_date = 3;

  int64 read_at_ns = 4;

  // How many holding rows will follow, per W2.2.
  //
  // The only thing that marks the end of a statement. Nothing else in the
  // sequence does: rows arrive as separate messages and none of them is
  // distinguishable as the last. The kernel closes the statement when this many
  // have landed, and a statement whose rows never all arrive stays open rather
  // than publishing counts that are wrong.
  //
  // The connector holds the whole list before it publishes any of it, so it
  // knows this without reading anything twice.
  int32 expected_rows = 5;

  // The account's buying power and margin figures, as the venue reported
  // them, and unset where it reported none. Never derived: a figure computed
  // here from the holdings would be ours presented as the custodian's, and
  // margin is where that difference costs money.
  optional Money buying_power = 6;

  optional Money margin_requirement = 7;

  optional Money maintenance_excess = 8;

  // True when the venue stated no currency for these figures and the
  // connector's is its own stated assumption (E*TRADE's balances carry none),
  // rather than something the venue said.
  bool currency_assumed = 9;

  // W4.9: the person this is sent for, as the assertion the plugin was
  // handed for them (the Meridian-Caller header, decoded). Unset, the plugin
  // acts as itself. Set, the sidecar admits a command on an account only
  // in a session at ACCESS_LEVEL_WRITE, when the person may write the
  // account it names, and stamps them on it; one to the deployment's
  // configuration (platform.config) only in a session at
  // ACCESS_LEVEL_ADMIN, and never without.
  meridian.v1.CallerAssertion acting_for = 1000;
}

// The result of RecordHoldingsStatement: meridian.v1.RecordHoldingsStatementReply.
message RecordHoldingsStatementResult {
  // Kernel-assigned. Every row references it.
  string statement_id = 1;

  // True when this statement had already been recorded and the existing one is
  // being returned. Makes redelivery a no-op rather than a duplicate.
  bool already_recorded = 2;
}

// One holding, for one account, at one instrument, on one side.
//
// Either `instrument_id` is set, meaning the connector resolved it (to an
// instrument, or to the deployment's LCL- placeholder when nothing matched),
// or `unresolved_identifiers` is set, meaning the resolve was ambiguous. Never
// both, and never neither. A row that could not be resolved is still recorded, because a
// dropped holding is invisible and an operator comparing against their
// brokerage would find a silent discrepancy with nothing to investigate.
//
// Cash is a holding like any other: of the currency's cash instrument, which
// the identifier scheme `iso4217` names ({scheme: iso4217, value: USD}), its
// quantity the cash the venue reports in that currency. A crypto asset held as
// cash, such as USDC at Coinbase, is a holding of that asset's instrument.
// The params of RecordHolding: meridian.v1.RecordHoldingRequest, less what the sidecar sets.
message RecordHoldingParams {
  string statement_id = 1;

  // Set when resolution succeeded.
  string instrument_id = 3;

  // Set when it did not: everything the connector held, so an operator can see
  // exactly what could not be accounted for.
  repeated Identifier unresolved_identifiers = 4;

  // The trade-date quantity: what is held counting every trade executed,
  // settled or not. Required. Signed to match `side`: negative is short.
  Decimal quantity = 9;

  // The rail's valuation of the holding, in its currency. Recorded as
  // reported, not recomputed: this is the custodian's belief, and rederiving it
  // would discard the thing that makes a later comparison meaningful. Unset
  // where the venue reported none (SnapTrade and Kalshi do not), which is not
  // a value of zero.
  optional Money market_value = 10;

  // The account as the rail knows it. The connector sets this and leaves
  // `account_id` empty; the sidecar sets `account_id` from the link in the
  // connector's settings (W6.4), and refuses the row, with that reason, when
  // there is none. Refused is not dropped: the external account is reported
  // unlinked, and the next statement after it is linked records it (W2).
  string external_account_id = 8;

  // Long or short, stated rather than read off the sign, and the quantity's
  // sign matches it. A venue that reports an account's long and short of one
  // instrument apart (Schwab) sends two rows, one on each side; one that
  // reports a signed number (E*TRADE, Kalshi) sends the side its sign means.
  // A Kalshi NO position is a short row of the market's one contract.
  HoldingSide side = 11;

  // The settle-date quantity: what is held counting only settled trades,
  // where the venue reports it, and unset where it does not. For cash, the
  // settled cash.
  optional Decimal settle_date_quantity = 12;

  // True when the venue stated no currency and the one here is the
  // connector's stated assumption (E*TRADE, Schwab and Public state none),
  // rather than something the venue said: the market value's currency, and
  // for cash the currency whose cash instrument the row names. A
  // pseudo-currency such as Interactive Brokers' BASE is never one.
  bool currency_assumed = 13;

  // This position's value is also included in the account's cash holding as
  // the venue reports it: SnapTrade counts a money-market fund in cash and
  // lists it as a position too. The street store keeps both as reported; a
  // reader counting the account once counts the fund as a position and
  // deducts it from cash.
  bool also_counted_in_cash = 14;

  // Set by the sidecar, never by a plugin (stamped.tsv).
  reserved 2;
  reserved "account_id";

  // Retired in the domain message, and never reused.
  reserved 5, 6, 7;
  reserved "quantity_scaled_1e8", "market_value_scaled_1e8", "currency";

  // W4.9: the person this is sent for, as the assertion the plugin was
  // handed for them (the Meridian-Caller header, decoded). Unset, the plugin
  // acts as itself. Set, the sidecar admits a command on an account only
  // in a session at ACCESS_LEVEL_WRITE, when the person may write the
  // account it names, and stamps them on it; one to the deployment's
  // configuration (platform.config) only in a session at
  // ACCESS_LEVEL_ADMIN, and never without.
  meridian.v1.CallerAssertion acting_for = 1000;
}

// The result of RecordHolding: meridian.v1.RecordHoldingReply.
message RecordHoldingResult {
  string holding_id = 1;

  // True when the row carried an instrument and updated a position. False for
  // an unresolved row, which updates nothing, because there is no position to
  // update until the deployment knows what it holds.
  bool resolved = 2;
}

// Reverse resolution: identifiers to an instrument, as of a date.
// The params of ResolveIdentifier: meridian.v1.ResolveIdentifierRequest, less what the sidecar sets.
message ResolveIdentifierParams {
  // At least one. Matched strongest-first: a global scheme before a
  // source-scoped symbol.
  repeated Identifier identifiers = 1;

  // Reference time. The date the mapping is being asked about.
  int64 as_of_ns = 2;

  // Narrows a symbol match. Empty means unconstrained.
  string exchange_mic = 3;

  string currency = 4;
}

// The result of ResolveIdentifier: meridian.v1.ResolveIdentifierReply.
message ResolveIdentifierResult {
  bool found = 1;

  string instrument_id = 2;

  // Set only when found is false.
  MissReason miss_reason = 3;

  // True when nothing matched and instrument_id is the deployment's LCL-
  // placeholder for the set (W3.7), which a holding may be recorded against
  // until its INS- ID replaces it. found is true alongside it. An ambiguous
  // resolve never answers a placeholder.
  bool placeholder = 4;
}

// A resolution missed. A fact, not a request.
//
// The publisher reports what it held and continues. It does not ask for a mint,
// does not wait for one, and has no authority to perform one. Keeping the
// authority to create identity on the far side of an event boundary is what
// stops a misbehaving feed from filling the master with junk.
// The params of ReportMissingInstrument: meridian.v1.MissingInstrumentDetectedEvent, less what the sidecar sets.
message ReportMissingInstrumentParams {
  // The namespace the miss occurred in, e.g. "snaptrade".
  string source = 1;

  // Unspecified when the publisher does not know it.
  AssetClass asset_class = 9;

  // Everything the publisher held at the miss. Enough for a reader to attempt a
  // pull against a global scheme, or to mint a stub carrying them.
  repeated Identifier identifiers = 3;

  // Reference time of the missed resolve. The reaction must target the mapping
  // effective then, not the mapping effective now.
  int64 as_of_ns = 4;

  MissReason reason = 6;

  int64 observed_at_ns = 7;

  // Set by the sidecar, never by a plugin (stamped.tsv).
  reserved 5, 8;
  reserved "publisher_instance_id", "placeholder_instrument_id";

  // Retired in the domain message, and never reused.
  reserved 2;
}

// Links an external account a plugin reported, or removes its link.
// Names an existing account, or a new account's name for the conductor to
// create and link in one step, or neither to remove the link; never both. Held
// as one of that plugin's settings. Sent by the plugin from one of its pages at
// admin, acting for the admin of the plugin viewing it in a session opened by
// Manage (W6.4, W6.9): any of them names an existing account, and only a
// deployment admin a new one. The plugin's sidecar stamps plugin_instance_id.
// The params of LinkExternalAccount: meridian.v1.LinkExternalAccountRequest, less what the sidecar sets.
message LinkExternalAccountParams {
  string external_account_id = 2;

  string account_id = 3;

  // A new account's name, for the conductor to create and link in one step.
  string new_account_name = 4;

  // The new account's custodian, type, owner and note (W6.3), which the
  // plugin may pre-fill from what the venue reported. Ignored unless
  // new_account_name is given: an existing account is edited only by W6.3.
  string new_account_custodian = 5;

  string new_account_type = 6;

  string new_account_owner = 7;

  string new_account_note = 8;

  // Set by the sidecar, never by a plugin (stamped.tsv).
  reserved 1;
  reserved "plugin_instance_id";

  // W4.9: the person this is sent for, as the assertion the plugin was
  // handed for them (the Meridian-Caller header, decoded). Unset, the plugin
  // acts as itself. Set, the sidecar admits a command on an account only
  // in a session at ACCESS_LEVEL_WRITE, when the person may write the
  // account it names, and stamps them on it; one to the deployment's
  // configuration (platform.config) only in a session at
  // ACCESS_LEVEL_ADMIN, and never without.
  meridian.v1.CallerAssertion acting_for = 1000;
}

// The result of LinkExternalAccount: meridian.v1.ExternalAccountLink.
message LinkExternalAccountResult {
  string plugin_instance_id = 1;

  string external_account_id = 2;

  string account_id = 3;
}

// The deployment's accounts, read by a plugin acting for its admin
// in a session opened by Manage, to offer the accounts an external account
// can be linked to (W4.9, W6.4): every account, since a plugin admin is
// account agnostic, and its identity alone.
// The params of ReadAccountsForLinking: meridian.v1.AccountsRequest, less what the sidecar sets.
message ReadAccountsForLinkingParams {

  // W4.9: the person this is sent for, as the assertion the plugin was
  // handed for them (the Meridian-Caller header, decoded). Unset, the plugin
  // reads as itself, which the sidecar refuses here: a read of the
  // deployment's configuration (platform.config) is answered only in a
  // session at ACCESS_LEVEL_ADMIN, and stamped with the person.
  meridian.v1.CallerAssertion acting_for = 1000;
}

// The result of ReadAccountsForLinking: meridian.v1.Accounts.
message ReadAccountsForLinkingResult {
  // Each account's identifier, name, state, custodian, type, owner and note;
  // no holdings.
  repeated AccountRecord accounts = 1;
}

// One account a connection reaches, as the custodian presents it.
// A mirror of meridian.v1.ExternalAccount.
message ExternalAccount {
  // Stable: the connector makes it so where the venue does not, and it is the
  // `external_account_id` the account's rows name. SnapTrade's changes on
  // reconnect unless its `institution_account_id` is used; Kalshi's is a
  // subaccount and a matching engine joined. A handle the venue wants on each
  // call (E*TRADE's accountIdKey, Schwab's hash) stays inside the plugin.
  string external_account_id = 1;

  // The custodian's own name for it, as a person there would recognise it.
  string name = 2;

  // The venue's own word for the kind of account, verbatim and for display
  // only. Nothing reads meaning into it: what an account may do is the
  // platform's restriction set, in the platform's words, which each plugin
  // maps its venue's types onto when that set is ruled.
  string venue_account_type = 3;
}

// Why a connection's data is, or is not, current.
//
// The venues surveyed fail in exactly these ways (reference/broker-apis.md),
// and each asks something different of a person, which is the point of
// naming them rather than leaving them to a flag and free text.
// A mirror of meridian.v1.SyncState.
enum SyncState {
  // Not said: a connector written before this was. Shown as what
  // connection_healthy says.
  SYNC_STATE_UNSPECIFIED = 0;
  // Current. Nothing to do.
  SYNC_STATE_CURRENT = 1;
  // Still serving, but older than it should be: holdings_as_of_ns says since
  // when. Usually the rail's to recover; nothing to do but wait.
  SYNC_STATE_STALE = 2;
  // A person must sign in again at the venue before it serves anything new:
  // E*TRADE and Interactive Brokers daily, Schwab weekly, Interactive Brokers
  // also when connected but signed out.
  SYNC_STATE_NEEDS_SIGN_IN = 3;
  // The connection is disabled and serves only what it last read, as
  // SnapTrade does. Somebody re-enables it.
  SYNC_STATE_DISABLED = 4;
  // Late on purpose, as Interactive Brokers through SnapTrade is by a business
  // day. Expected; nothing to do.
  SYNC_STATE_DELAYED_BY_DESIGN = 5;
  // The venue does not provide holdings through this connection, as some
  // brokerages hide them from SnapTrade (its `holdings_unavailable`). Waiting
  // changes nothing: holdings will not arrive this way, so the account is
  // connected another way or through another venue.
  SYNC_STATE_HOLDINGS_UNAVAILABLE = 6;
}

// An amount of currency: a Decimal and the currency it is in.
//
// One message rather than an amount with its currency beside it, so a message
// holding amounts in several currencies -- a USD price, a EUR commission --
// cannot pair the wrong ones. An amount is never separated from its currency.
//
// In the currency's major unit, whatever the venue counted in: a plugin that
// read cents converts before anything reaches the bus (decisions/023).
// A mirror of meridian.v1.Money.
message Money {
  Decimal amount = 1;

  // ISO 4217, e.g. "USD".
  string currency_code = 2;
}

// A number: a 128-bit two's-complement integer and its scale. The value is the
// integer times 10^-scale, so 1.50 is 150 at scale 2 and stays 1.50.
//
// The scale travels with the value rather than being fixed for the contract,
// because the venues disagree: Alpaca takes nine decimal places, a crypto
// asset eighteen, and a cheap token's holding runs past what 64 bits hold at
// any fixed scale that serves them both. The scale is the one the value was
// stated with; nothing normalises it.
//
// The integer's magnitude is below 10^38, which is at most 38 significant
// digits, and the scale is 0 to 18. The widest value the broker survey found,
// 100 billion units at 18 decimals, is well inside it.
// A mirror of meridian.v1.Decimal.
message Decimal {
  // The integer's upper 64 bits, signed: negative for a negative value.
  sfixed64 high = 1;

  // Its lower 64 bits, unsigned. The integer is high * 2^64 + low.
  fixed64 low = 2;

  // How many decimal places the integer carries, 0 to 18.
  uint32 scale = 3;
}

// One typed identifier for an instrument.
//
// `scheme` says what kind of identifier this is: a global scheme ("figi",
// "isin", "cusip", "sedol") or a source-scoped one ("symbol"). A source-scoped
// identifier is only meaningful alongside its source, which is why `source` is
// present and why a bare symbol can never drive a global resolve.
// A mirror of meridian.v1.Identifier.
message Identifier {
  string scheme = 1;

  string value = 2;

  // The namespace a source-scoped identifier belongs to, e.g. "snaptrade".
  // Empty for a global scheme.
  string source = 3;
}

// Which side of an instrument a holding or a custodial position is on.
//
// A side of its own rather than the sign alone, because a venue can report
// both sides of one instrument at once, and two rows keyed by account and
// instrument alone would overwrite each other.
// A mirror of meridian.v1.HoldingSide.
enum HoldingSide {
  // Not said. Refused by the street store: a holding says which side it is on.
  HOLDING_SIDE_UNSPECIFIED = 0;
  HOLDING_SIDE_LONG = 1;
  HOLDING_SIDE_SHORT = 2;
}

// Why a resolution did not produce exactly one instrument.
// A mirror of meridian.v1.MissReason.
enum MissReason {
  MISS_REASON_UNSPECIFIED = 0;
  // No instrument matched.
  MISS_REASON_NOT_FOUND = 1;
  // More than one matched. Reported as a miss rather than resolved by picking,
  // because picking would be wrong about half the time and would be silent.
  MISS_REASON_AMBIGUOUS = 2;
}

// The kind of claim holding an instrument gives. A closed list, ruled by the
// product owner (sdk-contract/asset-class-is-an-enum, 2026-09-28 and
// 2026-09-30); a class joins it by a ruling, never because a feed sent one.
// Spelled in text as the value's name without its prefix, lower case:
// `equity`, `debt`, `fund`, `derivative`, `crypto_asset`, `event_contract`,
// `cash`.
//
// What kind of instrument within a class (an ETF is a fund, an option a
// derivative) is its instrument type, which this does not carry: the list of
// types is still open.
// A mirror of meridian.v1.AssetClass.
enum AssetClass {
  // No class. Held only by a stub minted from a deployment's miss (W3.4),
  // which may not know one; activating an instrument requires a class (W1.8).
  ASSET_CLASS_UNSPECIFIED = 0;
  // A share of ownership.
  ASSET_CLASS_EQUITY = 1;
  // Somebody owes the holder.
  ASSET_CLASS_DEBT = 2;
  // A share of a pool: ETFs and mutual funds among them.
  ASSET_CLASS_FUND = 3;
  // A contract whose value comes from something else: options and futures
  // among them.
  ASSET_CLASS_DERIVATIVE = 4;
  ASSET_CLASS_CRYPTO_ASSET = 5;
  // Pays on whether an event happens.
  ASSET_CLASS_EVENT_CONTRACT = 6;
  // A holding of a currency's cash instrument (spec/the-account-side-fits-every-venue).
  ASSET_CLASS_CASH = 7;
}

// The only thing holdings are recorded against. A plugin creates one only by
// linking an external account to a new one, acting for a deployment admin in
// a session opened by Manage (W6.4).
// A mirror of meridian.v1.AccountRecord.
message AccountRecord {
  string account_id = 1;

  string name = 2;

  AccountState state = 3;

  int64 created_at_ns = 4;

  // Free text, optional, and searchable as the name is (W6.3). Where the
  // account is held, e.g. "Fidelity". At most 200 characters.
  string custodian = 5;

  // What the account is, e.g. "Roth IRA". At most 200 characters.
  string account_type = 6;

  // One ownership or grouping label, e.g. "Fund I". At most 200 characters.
  string owner = 7;

  // Anything else worth knowing about it. At most 2,000 characters.
  string note = 8;
}

// A mirror of meridian.v1.AccountState.
enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  ACCOUNT_STATE_OPEN = 1;
  // Closed, not deleted: an account is the subject of records that outlive it.
  ACCOUNT_STATE_CLOSED = 2;
}
